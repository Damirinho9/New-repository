name: KOMPAS Linux professional native test

on:
  pull_request:
    branches: [main]
    paths:
      - 'kompas-linux-trigger.txt'

jobs:
  kompas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install KOMPAS professional + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb openbox net-tools iproute2
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          dpkg -l 'ascon-kompas*' | tee installed.txt

      - name: Probe ksinvisible and Python API
        shell: bash
        run: |
          set -uxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          KSI=$BIN/ksinvisible
          file "$KSI" | tee ksi-file.txt
          ldd "$KSI" | tee ksi-ldd.txt || true
          strings -a "$KSI" | grep -Ei 'usage|help|automation|enable|license|licen|key|signature|rtw|plugin|command' | head -300 | tee ksi-strings.txt || true

          export PYTHONPATH="$BIN"
          python3 - <<'PY' | tee ksapi-probe.txt
          import inspect, ksapi
          print('ksapi=', ksapi.__file__)
          for n in ['GetKompas','OpenKompas','IApplication','KompasObject']:
              o=getattr(ksapi,n,None)
              print('\n###',n,o)
              try: print(inspect.getsource(o))
              except Exception as e: print('source unavailable',repr(e))
          PY

          for args in "--help" "-h" "-automation" ""; do
            echo "===== RUN: ksinvisible $args =====" | tee -a ksi-runs.txt
            timeout 8s "$KSI" $args >>ksi-runs.txt 2>&1
            echo "exit=$?" >>ksi-runs.txt
          done

          # Start one instance and see whether ksapi can discover a port.
          "$KSI" -automation >ksi-live.out 2>ksi-live.err &
          echo $! > ksi.pid
          sleep 3
          ps -fp $(cat ksi.pid) | tee ksi-ps.txt || true
          ss -ltnp | tee ksi-sockets.txt || true
          python3 - <<'PY' | tee ksi-api-live.txt
          import ksapi
          try:
              print('GetKompas=', ksapi.GetKompas())
          except Exception as e:
              print('GetKompas ERROR',repr(e))
          try:
              print('OpenKompas=', ksapi.OpenKompas())
          except Exception as e:
              print('OpenKompas ERROR',repr(e))
          PY
          kill $(cat ksi.pid) 2>/dev/null || true
          cat ksi-live.out || true
          cat ksi-live.err || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kompas-linux-professional-diagnostics
          path: |
            installed.txt
            ksi-file.txt
            ksi-ldd.txt
            ksi-strings.txt
            ksapi-probe.txt
            ksi-runs.txt
            ksi.pid
            ksi-ps.txt
            ksi-sockets.txt
            ksi-api-live.txt
            ksi-live.out
            ksi-live.err
          if-no-files-found: ignore
