name: KOMPAS Linux professional native test

on:
  pull_request:
    branches: [main]
    paths:
      - 'kompas-linux-trigger.txt'

jobs:
  kompas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install KOMPAS professional + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb openbox net-tools iproute2             libxcb-res0 libxcb-dri2-0 libxcb-xkb1
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          dpkg -l 'ascon-kompas*' | tee installed.txt

      - name: Start ksinvisible under Xvfb and create native smoke FRW
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          KSI=$BIN/ksinvisible
          export PYTHONPATH="$BIN"

          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac"             "$KSI" -automation >ksi-live.out 2>ksi-live.err &
          WRAPPER_PID=$!
          echo "$WRAPPER_PID" > ksi-wrapper.pid

          PORT=""
          for i in $(seq 1 30); do
            sleep 1
            ss -ltnp > ksi-sockets.txt || true
            PORT=$(python3 - <<'PY'
          import re
          txt=open('ksi-sockets.txt',errors='ignore').read()
          for line in txt.splitlines():
              if 'ksinvisible' in line.lower():
                  m=re.search(r':(\d+)\s+', line)
                  if m:
                      print(m.group(1)); break
          PY
            )
            if [ -n "$PORT" ]; then break; fi
            if ! kill -0 "$WRAPPER_PID" 2>/dev/null; then break; fi
          done

          echo "PORT=$PORT" | tee ksi-port.txt
          cat ksi-sockets.txt || true
          cat ksi-live.err || true
          cat ksi-live.out || true

          if [ -z "$PORT" ]; then
            echo "No ksinvisible API port found" >&2
            exit 3
          fi

          KOMPAS_PORT="$PORT" python3 - <<'PY'
          import os, pathlib, hashlib
          import ksapi
          from constants import constants as c

          port=int(os.environ['KOMPAS_PORT'])
          app=ksapi.IApplication(port)
          print('APP=', app.GetApplicationName(True))
          print('BUILD=', app.GetBuildNumber())

          doc=app.GetDocuments().Add(c.ksDocumentFragment, True)
          d2=ksapi.IKompasDocument2D(doc)
          view=d2.GetViewsAndLayersManager().GetViews().GetActiveView()
          dc=ksapi.IDrawingContainer(view)

          s=dc.GetLineSegments().Add()
          s.SetX1(0.0); s.SetY1(0.0); s.SetX2(15.0); s.SetY2(0.0)
          s.SetStyle(c.ksCSNormal); s.Update()

          out=str(pathlib.Path('smoke_native.frw').resolve())
          ok=doc.SaveAs(out)
          print('SAVE=',ok,out)
          p=pathlib.Path(out)
          if not p.exists() or p.stat().st_size < 1000:
              raise SystemExit('native FRW not created')
          print('SIZE=',p.stat().st_size)
          print('SHA256=',hashlib.sha256(p.read_bytes()).hexdigest())
          print('HEAD=',p.read_bytes()[:4])
          PY

          kill "$WRAPPER_PID" 2>/dev/null || true

      - name: Upload native smoke test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kompas-native-smoke
          path: |
            smoke_native.frw
            installed.txt
            ksi-live.out
            ksi-live.err
            ksi-sockets.txt
            ksi-port.txt
          if-no-files-found: ignore
