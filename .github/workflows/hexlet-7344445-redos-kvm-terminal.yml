name: Hexlet 7344445 RED OS KVM Terminal Proof

on:
  push:
    branches:
      - hexlet-7344445-native-recovery
    paths:
      - ".github/workflows/hexlet-7344445-redos-kvm-terminal.yml"
  workflow_dispatch:

jobs:
  terminal-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install VM and VNC tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 aria2 curl python3-pip imagemagick acl
          python3 -m pip install --break-system-packages vncdotool pillow
          mkdir -p hexlet_7344445/native_recovery/redos_terminal
          sudo setfacl -m "u:$USER:rw" /dev/kvm

      - name: Parallel download official RED OS and verify
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://files.red-soft.ru/redos/8.0/x86_64/live/Redos-GNOME-Live-x86_64-8.0.3-20260716.iso'
          aria2c --check-certificate=false -x16 -s16 -k4M --retry-wait=2 --max-tries=10 -d /tmp -o redos.iso "$URL"
          curl -fkL --retry 5 -o /tmp/redos.md5 "${URL}.MD5SUM"
          ACTUAL=$(md5sum /tmp/redos.iso | awk '{print $1}')
          EXPECTED=$(grep -Eio '[0-9a-f]{32}' /tmp/redos.md5 | head -1)
          echo "EXPECTED_MD5=$EXPECTED" | tee hexlet_7344445/native_recovery/redos_terminal/checksum.txt
          echo "ACTUAL_MD5=$ACTUAL" | tee -a hexlet_7344445/native_recovery/redos_terminal/checksum.txt
          test "$ACTUAL" = "$EXPECTED"

      - name: Boot RED OS with KVM
        shell: bash
        run: |
          set -euxo pipefail
          qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 4096             -cdrom /tmp/redos.iso -boot d -device virtio-vga             -netdev user,id=n1 -device e1000,netdev=n1             -vnc 127.0.0.1:1 -daemonize -pidfile /tmp/redos.pid
          ps -fp "$(cat /tmp/redos.pid)" | tee hexlet_7344445/native_recovery/redos_terminal/qemu-process.txt

      - name: Open real GNOME Terminal and capture proof
        shell: bash
        run: |
          set -euxo pipefail
          VNC='127.0.0.1::5901'
          sleep 12
          vncdotool -s "$VNC" capture hexlet_7344445/native_recovery/redos_terminal/01_boot_menu.png
          vncdotool -s "$VNC" key enter
          sleep 85
          vncdotool -s "$VNC" capture hexlet_7344445/native_recovery/redos_terminal/02_desktop.png

          # Close RED OS Welcome window so GNOME shell receives keyboard input.
          vncdotool -s "$VNC" move 925 113 click 1
          sleep 3

          # Open GNOME overview and launch the real Terminal app by search.
          vncdotool -s "$VNC" key super
          sleep 2
          vncdotool -s "$VNC" type "terminal"
          sleep 3
          vncdotool -s "$VNC" key enter
          sleep 7
          vncdotool -s "$VNC" capture hexlet_7344445/native_recovery/redos_terminal/03_terminal_open.png

          vncdotool -s "$VNC" type "printf '\\n=== RED OS NATIVE KVM VM ===\\n'; cat /etc/os-release; printf '\\n=== KERNEL ===\\n'; uname -a; printf '\\n=== NETWORK ===\\n'; ip -brief addr; printf '\\n=== NMCLI ===\\n'; nmcli -t -f DEVICE,TYPE,STATE,CONNECTION device status; printf '\\nEND_NATIVE_PROOF\\n'"
          vncdotool -s "$VNC" key enter
          sleep 8
          vncdotool -s "$VNC" capture hexlet_7344445/native_recovery/redos_terminal/04_terminal_output.png
          identify hexlet_7344445/native_recovery/redos_terminal/*.png | tee hexlet_7344445/native_recovery/redos_terminal/images.txt
          echo RESULT=NATIVE_REDOS_TERMINAL_CAPTURE_READY > hexlet_7344445/native_recovery/redos_terminal/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7344445-native-redos-terminal
          path: hexlet_7344445/native_recovery/redos_terminal/
          if-no-files-found: warn
