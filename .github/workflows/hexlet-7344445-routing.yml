name: Hexlet 7344445 Build Routing Labs

on:
  push:
    branches:
      - hexlet-7344445-routing
    paths:
      - "hexlet_7344445/routing/**"
      - ".github/workflows/hexlet-7344445-routing.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native Packet Tracer tooling
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/fn-cafeina/lab-pkt.git /tmp/lab-pkt
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/lab-pkt

      - name: Build routing labs
        shell: bash
        run: |
          set -euxo pipefail
          python hexlet_7344445/routing/build_routing.py
          find hexlet_7344445/routing/out -type f -printf '%P %s bytes\n' | sort
          sha256sum hexlet_7344445/routing/out/*.pkt
          test -f hexlet_7344445/routing/7344445_Cisco_PacketTracer_Маршрутизация.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 7344445-Cisco-PacketTracer-Routing
          path: |
            hexlet_7344445/routing/out/
            hexlet_7344445/routing/7344445_Cisco_PacketTracer_Маршрутизация.zip
          if-no-files-found: error
