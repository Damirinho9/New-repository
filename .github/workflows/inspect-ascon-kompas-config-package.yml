name: Inspect official KOMPAS v25 configuration package

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/inspect-ascon-kompas-config-package.yml'

jobs:
  inspect:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect config package payload and maintainer scripts
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ca-certificates gnupg
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh >/tmp/ascon-script.out 2>/tmp/ascon-script.err || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          cd "$RUNNER_TEMP"
          apt-get download ascon-kompas-v25=25.0.5.2780
          DEB=$(find . -maxdepth 1 -name 'ascon-kompas-v25*.deb' -print -quit)
          mkdir root ctrl result
          dpkg-deb -x "$DEB" root
          dpkg-deb -e "$DEB" ctrl
          {
            echo '=== CONTROL ==='
            cat ctrl/control
            for f in ctrl/*; do
              [ -f "$f" ] || continue
              echo "=== $(basename "$f") ==="
              cat "$f" || true
            done
            echo '=== TREE ==='
            find root -printf '%y %p -> %l\n' | sort
          } | tee result/package-inspection.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ascon-kompas-v25-config-package-inspection
          path: ${{ runner.temp }}/result/package-inspection.txt
