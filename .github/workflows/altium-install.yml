name: Install Altium 26.11.1 offline media

on:
  push:
    branches: [altium-7330744-install]
    paths:
      - ".github/workflows/altium-install.yml"
      - "altium/**"
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Altium from offline media
        shell: powershell
        continue-on-error: true
        run: .\altium\install-offline.ps1
      - name: Upload install diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altium-26.11.1-install-diagnostics
          path: altium-install-artifacts/
          if-no-files-found: warn
          retention-days: 3
