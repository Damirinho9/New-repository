name: onec-7342510-stage6-secret-probe

on:
  push:
    branches:
      - onec-7342510-stage6-native
    paths:
      - 'onec-7342510/stage6/trigger-secret-probe.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_ONEC_TRAINING_URL: ${{ secrets.ONEC_TRAINING_URL != '' }}
    steps:
      - name: Secret present
        if: env.HAS_ONEC_TRAINING_URL == 'true'
        run: echo "ONEC_TRAINING_URL_READY=true"
      - name: Secret missing
        if: env.HAS_ONEC_TRAINING_URL != 'true'
        run: echo "ONEC_TRAINING_URL_READY=false"
