name: Build native KOMPAS Work1 Variant06 fast

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/build-native-v06-fast.yml'

jobs:
  native:
    runs-on: ubuntu-24.04
    container:
      image: alt:p11
    timeout-minutes: 20
    steps:
      - name: Install KOMPAS runtime only
        shell: bash
        run: |
          set -u
          apt-get update
          apt-get install -y wget ca-certificates fontconfig dbus procps file python3 curl
          bash -c "$(wget -O - https://repo.ascon.ru/scripts/ascon-stable-alt.sh)"
          apt-get update
          apt-get install -y libxcbutil-icccm libxcbutil-keysyms libxcbutil-image libxcb-render-util libXv libXScrnSaver libxkbfile libfontenc || true
          apt-get install -y ascon-kompas-graphic-v25 || true
          test -x /opt/ascon/kompas3d-v25/Bin/kKompas
          test -f /opt/ascon/kompas3d-v25/Bin/libksAPI.so
          echo "KOMPAS-Graphic runtime ready"

      - name: Download precompiled injector
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o /tmp/inject_variant06.so             'https://raw.githubusercontent.com/Damirinho9/New-repository/kompas-7335493-native-work1/kompas-linux/bin/inject_variant06.so'
          file /tmp/inject_variant06.so
          ls -lh /tmp/inject_variant06.so
          ldd /tmp/inject_variant06.so || true

      - name: Run KOMPAS and create native FRW
        shell: bash
        run: |
          set +e
          rm -f /tmp/work1_v6_inject.log /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw /tmp/kompas_v6.log
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          export QT_QPA_PLATFORM=offscreen
          unset DISPLAY HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          export LD_LIBRARY_PATH=/opt/ascon/kompas3d-v25/Bin
          export LD_PRELOAD=/tmp/inject_variant06.so
          cd /opt/ascon/kompas3d-v25/Bin
          dbus-run-session -- ./kKompas >/tmp/kompas_v6.log 2>&1 &
          KP=$!
          echo "KOMPAS_PID=$KP"
          for i in $(seq 1 75); do
            echo "--- poll $i ---"
            cat /tmp/work1_v6_inject.log 2>/dev/null || true
            if grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log 2>/dev/null; then
              echo "PASS marker found"
              break
            fi
            if grep -q 'THREAD_DONE_FAIL' /tmp/work1_v6_inject.log 2>/dev/null; then
              echo "FAIL marker found"
              break
            fi
            if ! kill -0 "$KP" 2>/dev/null; then
              echo "KOMPAS exited"
              break
            fi
            sleep 2
          done
          unset LD_PRELOAD
          kill "$KP" 2>/dev/null || true
          sleep 2
          echo "=== INJECT LOG ==="
          cat /tmp/work1_v6_inject.log 2>/dev/null || true
          echo "=== KOMPAS LOG TAIL ==="
          tail -150 /tmp/kompas_v6.log 2>/dev/null || true
          if [ ! -s /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw ]; then
            echo "NO_NATIVE_FRW"
            exit 20
          fi
          file /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
          sha256sum /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
          python3 - <<'PY'
          import pathlib,zipfile
          p=pathlib.Path('/tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw')
          print('size',p.stat().st_size)
          print('zip',zipfile.is_zipfile(p))
          assert zipfile.is_zipfile(p)
          with zipfile.ZipFile(p) as z:
              print('members',[(i.filename,i.file_size) for i in z.infolist()])
              assert 'Contents' in z.namelist()
          PY
          grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log
          cp /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw /tmp/final.frw
          cp /tmp/work1_v6_inject.log /tmp/verification.txt
          exit 0

      - name: Upload verified native FRW
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7335493-work1-variant06-native
          if-no-files-found: ignore
          path: |
            /tmp/final.frw
            /tmp/verification.txt
            /tmp/kompas_v6.log
