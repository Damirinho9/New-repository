name: Hexlet KOMPAS Official Invisible Drawing Text

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - "hexlet_7344445/official_sample_drawing_text.py"
      - ".github/workflows/hexlet-kompas-official-pattern.yml"
  workflow_dispatch:

jobs:
  official-pattern:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg desktop-file-utils xvfb \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p official_pattern

      - name: Run official ASCON Invisible launch pattern
        shell: bash
        run: |
          set -euxo pipefail
          export PYTHONPATH=/opt/ascon/kompas3d-v25/Bin
          timeout 180 xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" \
            python3 hexlet_7344445/official_sample_drawing_text.py \
            | tee official_pattern/run.log

      - name: Strict native CDW text gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^RESULT=PASS_NATIVE_OFFICIAL_PATTERN_CDW_TEXT_REOPEN$' official_pattern/run.log
          grep -q '^REOPEN_TEXT_COUNT=[[:space:]]*[1-9]' official_pattern/run.log
          test -s official_pattern/Hexlet_KOMPAS3D_Privet_Hexlet.cdw
          test -s official_pattern/Hexlet_KOMPAS3D_Privet_Hexlet_REOPENED.cdw
          file official_pattern/*.cdw | tee official_pattern/file-types.txt
          sha256sum official_pattern/*.cdw | tee official_pattern/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-official-pattern-native-cdw-text
          path: official_pattern/
          if-no-files-found: error
