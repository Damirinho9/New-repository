name: Stage 23 licensed native candidate (manual only)
on:
  workflow_dispatch:
    inputs:
      entitlement:
        description: 'Confirm authorized commercial use and interactive licensed workstation'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    if: inputs.entitlement == true
    runs-on: [self-hosted, Windows, X64, kompas]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate on licensed workstation
        shell: powershell
        env:
          KOMPAS_LICENSE_CONFIRMED: 'YES'
        run: |
          python -m pip install -r stage23/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python stage23/native_build.py --mode native --candidate --out "$env:RUNNER_TEMP\kompas-${{ github.run_id }}-${{ github.run_attempt }}"
          exit $LASTEXITCODE
      - name: Upload non-final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-candidate-evidence
          path: ${{ runner.temp }}/kompas-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
