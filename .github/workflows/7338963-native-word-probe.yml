name: Native Word UI form test 7338963
on:
  push:
    branches: [word-native-test-7338963]
jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Word LTSC 2024 with official GVLK
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/6c1eeb25-cf8b-41d9-8d0d-cc1dbc032140/officedeploymenttool_20430-20146.exe" -OutFile "$env:RUNNER_TEMP\odt.exe"
          Start-Process "$env:RUNNER_TEMP\odt.exe" -ArgumentList "/quiet /extract:$env:RUNNER_TEMP\odt" -Wait
          @'
          <Configuration>
            <Add OfficeClientEdition="64" Channel="PerpetualVL2024">
              <Product ID="ProPlus2024Volume" PIDKEY="XJ2XN-FW8RK-P4HMP-DKDBV-GCVGB">
                <Language ID="en-us" />
                <ExcludeApp ID="Access" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Groove" />
                <ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" />
                <ExcludeApp ID="Outlook" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Publisher" />
                <ExcludeApp ID="Teams" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
            <Updates Enabled="FALSE" />
          </Configuration>
          '@ | Set-Content "$env:RUNNER_TEMP\odt\config.xml" -Encoding UTF8
          & "$env:RUNNER_TEMP\odt\setup.exe" /configure "$env:RUNNER_TEMP\odt\config.xml"
          $word = Get-ChildItem "C:\Program Files\Microsoft Office" -Filter WINWORD.EXE -Recurse | Select-Object -First 1
          if(!$word){ throw "WINWORD missing" }
          "WORD_EXE=$($word.FullName)" | Out-File $env:GITHUB_ENV -Append
          $ospp=Get-ChildItem "C:\Program Files\Microsoft Office" -Filter OSPP.VBS -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if($ospp){ cscript.exe //nologo $ospp.FullName /dstatus }
          New-Item -Path "HKCU:\Software\Microsoft\Office\16.0\Common\General" -Force | Out-Null
          New-ItemProperty -Path "HKCU:\Software\Microsoft\Office\16.0\Common\General" -Name ShownFirstRunOptin -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "HKCU:\Software\Microsoft\Office\16.0\Common\General" -Name DisableFirstRunMovie -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Confirm interactive console
        shell: powershell
        run: |
          whoami
          cmd /c "query session || exit /b 0"
          Get-Process explorer -ErrorAction SilentlyContinue | Format-Table Id,SessionId,ProcessName
          Get-CimInstance Win32_ComputerSystem | Select-Object UserName

      - name: Extract sanitized forms and install UI tooling
        shell: powershell
        run: |
          Expand-Archive "$env:GITHUB_WORKSPACE\word-native-test\native_forms.zip" "$env:RUNNER_TEMP\forms" -Force
          Get-ChildItem "$env:RUNNER_TEMP\forms" | Format-Table Name,Length
          python -m pip install --disable-pip-version-check pywinauto pillow pywin32

      - name: Native Word remaining legacy and certificate controls
        timeout-minutes: 8
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import os,time,subprocess,json,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          from pywinauto import Desktop, keyboard, mouse
          from PIL import ImageGrab, Image, ImageDraw

          exe=os.environ["WORD_EXE"]
          forms=Path(os.environ["RUNNER_TEMP"])/"forms"
          ev=Path(os.environ["RUNNER_TEMP"])/"evidence"; ev.mkdir(exist_ok=True)

          def word_window(pid):
              for _ in range(60):
                  for w in Desktop(backend="uia").windows():
                      try:
                          if w.process_id()==pid and w.class_name()=="OpusApp" and w.is_visible(): return w
                      except: pass
                  time.sleep(.5)
              raise RuntimeError("Word window missing")

          def dismiss(w):
              for _ in range(12):
                  acted=False
                  wins=[]
                  try:wins=[x for x in w.descendants() if x.element_info.control_type=="Window"]
                  except:pass
                  for d in wins:
                      title=d.window_text()
                      choices=[]
                      if "Privacy Settings" in title: choices=["Cancel","OK"]
                      elif "Your privacy matters" in title: choices=["Close"]
                      elif "new look" in title.lower() or "theme" in title.lower(): choices=["OK","Close"]
                      elif title=="Microsoft Word": choices=["OK","No","Cancel"]
                      for name in choices:
                          for b in d.descendants(control_type="Button"):
                              if b.window_text()==name:
                                  try:b.click_input()
                                  except:
                                      try:b.invoke()
                                      except:pass
                                  time.sleep(1); acted=True; break
                          if acted:break
                      if acted:break
                  if not acted:break
              w.set_focus()

          def open_word(path):
              p=subprocess.Popen([exe,"/q",str(path)])
              w=word_window(p.pid)
              dismiss(w)
              time.sleep(4)
              dismiss(w)
              return p,w
          def document(w):
              ds=w.descendants(control_type="Document")
              if not ds: raise RuntimeError("No document UIA")
              return ds[0]
          def save(w):
              try:w.child_window(auto_id="FileSave",control_type="Button").wrapper_object().click_input()
              except:keyboard.send_keys("^s")
              time.sleep(4)
          def close(w,p):
              try:w.close()
              except:keyboard.send_keys("%{F4}")
              time.sleep(2)
              if p.poll() is None:p.terminate()
          def cv(c):
              try:return c.selected_text()
              except:return c.window_text()

          W="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          W14="http://schemas.microsoft.com/office/word/2010/wordml"
          q=lambda n:"{"+W+"}"+n

          # Final legacy questionnaire UI tests.
          ank=next(forms.glob("*TEST-000.docx"))
          p,w=open_word(ank); d=document(w)

          # General form protection: typing on a static title area must not replace document content.
          before_text=d.window_text()
          rr=d.rectangle()
          mouse.click(coords=(rr.left+rr.width()//2, rr.top+35))
          keyboard.send_keys("PROTECTION_STATIC_TEST")
          time.sleep(.7)
          protection_blocked="PROTECTION_STATIC_TEST" not in document(w).window_text()
          print("ANK_PROTECTION_BLOCKED_STATIC="+str(protection_blocked),flush=True)

          # Use the actual drop-down arrow area and choose visible list items.
          def choose_legacy_combo(index, wanted):
              combos=document(w).descendants(control_type="ComboBox")
              c=combos[index]
              r=c.rectangle()
              mouse.click(coords=(r.right-4, r.top+r.height()//2))
              time.sleep(.8)
              found=[]
              for top in Desktop(backend="uia").windows():
                  try:
                      for li in top.descendants(control_type="ListItem"):
                          nm=li.window_text()
                          if nm: found.append((nm,li))
                  except: pass
              print("LEGACY_LIST_ITEMS_"+str(index)+"="+json.dumps([x[0] for x in found],ensure_ascii=False),flush=True)
              for nm,li in found:
                  if nm==wanted:
                      try:li.click_input()
                      except:pass
                      time.sleep(.8)
                      return True
              # Keyboard fallback while the drop-down is active.
              keyboard.send_keys("{HOME}")
              if wanted=="\u043c\u0443\u0436": keyboard.send_keys("{DOWN}{ENTER}")
              elif wanted=="\u0432\u044b\u0441\u0448\u0435\u0435": keyboard.send_keys("{DOWN}{DOWN}{DOWN}{ENTER}")
              time.sleep(.8)
              return False

          choose_legacy_combo(0,"\u043c\u0443\u0436")
          choose_legacy_combo(1,"\u0432\u044b\u0441\u0448\u0435\u0435")

          # Change Picture must be available even while form protection is active.
          buttons=document(w).descendants(control_type="Button")
          cp=next((x for x in buttons if x.window_text()=="Change Picture"),None)
          photo_dialog=False
          photo_replaced=False
          media_before={}
          with zipfile.ZipFile(ank) as zin:
              for n in zin.namelist():
                  if n.startswith("word/media/"):
                      import hashlib
                      media_before[n]=hashlib.sha256(zin.read(n)).hexdigest()
          repl=ev/"replacement.png"
          img=Image.new("RGB",(180,220),"white")
          dr=ImageDraw.Draw(img); dr.ellipse((45,20,135,110),outline="black",width=5); dr.rectangle((40,120,140,210),outline="black",width=5)
          img.save(repl)
          if cp:
              cp.click_input(); time.sleep(2)
              titles=[]
              for tw in Desktop(backend="uia").windows():
                  try:
                      if tw.window_text(): titles.append((tw.window_text(),tw.class_name()))
                  except: pass
              print("PHOTO_WINDOWS="+json.dumps(titles,ensure_ascii=False),flush=True)
              ImageGrab.grab(all_screens=True).save(ev/"70-change-picture-open.png")
              photo_dialog=any(("Picture" in t[0] or t[1]=="#32770") for t in titles)
              # Office chooser: choose local file if available.
              for tw in Desktop(backend="uia").windows():
                  try:
                      for btn in tw.descendants(control_type="Button"):
                          if btn.window_text() in ("From a File","From File"):
                              btn.click_input(); time.sleep(2); raise StopIteration
                  except StopIteration: break
                  except: pass
              dlg=None
              for _ in range(20):
                  for tw in Desktop(backend="uia").windows():
                      try:
                          if tw.class_name()=="#32770" and ("Insert" in tw.window_text() or "Picture" in tw.window_text() or "Open" in tw.window_text()):
                              dlg=tw; break
                      except: pass
                  if dlg: break
                  time.sleep(.25)
              if dlg:
                  edits=dlg.descendants(control_type="Edit")
                  fe=next((x for x in edits if x.element_info.automation_id=="1148"), edits[-1] if edits else None)
                  if fe:
                      try:fe.set_edit_text(str(repl))
                      except:
                          fe.click_input(); keyboard.send_keys("^a"); keyboard.send_keys(str(repl),with_spaces=True)
                      ib=next((x for x in dlg.descendants(control_type="Button") if x.window_text() in ("Insert","Open")),None)
                      if ib:
                          ib.click_input(); time.sleep(3); photo_replaced=True
              if not photo_replaced:
                  keyboard.send_keys("{ESC}"); time.sleep(.5)

          ImageGrab.grab(all_screens=True).save(ev/"71-anketa-final-ui.png")
          save(w); close(w,p)

          # Inspect what native Word persisted.
          with zipfile.ZipFile(ank) as z: root=ET.fromstring(z.read("word/document.xml"))
          legacy={}
          for ff in root.iter(q("ffData")):
              nm=ff.find(q("name")); dd=ff.find(q("ddList")); cb=ff.find(q("checkBox"))
              if nm is None: continue
              name=nm.get(q("val"))
              if dd is not None:
                  entries=[x.get(q("val")) for x in dd.findall(q("listEntry"))]
                  res=dd.find(q("result")); idx=int(res.get(q("val"),"0")) if res is not None else 0
                  legacy[name]={"index":idx,"value":entries[idx] if idx<len(entries) else None}
              if cb is not None:
                  ck=cb.find(q("checked")); legacy[name]={"checked":None if ck is None else ck.get(q("val"),"1")}
          print("ANK_FINAL_XML="+json.dumps(legacy,ensure_ascii=False),flush=True)
          media_after={}
          with zipfile.ZipFile(ank) as zin:
              import hashlib
              for n in zin.namelist():
                  if n.startswith("word/media/"): media_after[n]=hashlib.sha256(zin.read(n)).hexdigest()
          print("ANK_PHOTO_DIALOG="+str(photo_dialog)+" REPLACED="+str(photo_replaced)+" MEDIA_CHANGED="+str(media_after!=media_before),flush=True)

          # Native creation from both DOTX templates.
          def test_template(path):
              p=subprocess.Popen([exe,"/q","/t"+str(path)])
              w=word_window(p.pid); dismiss(w); time.sleep(4); dismiss(w)
              d=document(w)
              info={"title":w.window_text(),
                    "edits":len([x for x in d.descendants(control_type="Edit") if x.element_info.automation_id!="Body"]),
                    "combos":len(d.descendants(control_type="ComboBox")),
                    "checks":len(d.descendants(control_type="CheckBox"))}
              print("TEMPLATE_NATIVE_"+path.name+"="+json.dumps(info,ensure_ascii=False),flush=True)
              try:w.close()
              except:pass
              time.sleep(1)
              if p.poll() is None:p.terminate()
              return info

          for tp in sorted(forms.glob("*.dotx")):
              test_template(tp)

          # Certificate in untouched sanitized DOCX.
          spr=next(x for x in forms.glob("*.docx") if "TEST-000" not in x.name)
          with zipfile.ZipFile(spr) as z: before=ET.fromstring(z.read("word/document.xml"))
          fld=next(before.iter(q("fldSimple")))
          print("DATE_BEFORE_DIRTY="+str(fld.get(q("dirty")))+" TEXT="+''.join((x.text or '') for x in fld.iter(q("t"))),flush=True)

          p,w=open_word(spr); d=document(w)
          edits=[x for x in d.descendants(control_type="Edit") if x.element_info.automation_id!="Body"]
          combos=d.descendants(control_type="ComboBox")
          checks=d.descendants(control_type="CheckBox")
          print("SPR_NATIVE_COUNTS="+str((len(edits),len(combos),len(checks))),flush=True)
          print("SPR_NATIVE_EDITS="+json.dumps([x.window_text() for x in edits],ensure_ascii=False),flush=True)

          # Update all fields through Word UI.
          body=[x for x in d.descendants(control_type="Edit") if x.element_info.automation_id=="Body"]
          if body:
              body[0].click_input()
              time.sleep(.5)

          org=next((x for x in document(w).descendants(control_type="Edit")
                    if x.window_text()=="\u0412\u0432\u0435\u0434\u0438\u0442\u0435 \u043e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u044e"),None)
          if org:
              org.click_input()
              keyboard.send_keys("NATIVE ORGANIZATION",with_spaces=True,pause=.03)
              time.sleep(.7)

          # Word exposes dropdown content controls as Edit surfaces in UIA.
          edits=[x for x in document(w).descendants(control_type="Edit") if x.element_info.automation_id!="Body"]
          edits[4].click_input(); keyboard.send_keys("%{DOWN}{HOME}{DOWN}{DOWN}{ENTER}"); time.sleep(.7)
          edits=[x for x in document(w).descendants(control_type="Edit") if x.element_info.automation_id!="Body"]
          edits[5].click_input(); keyboard.send_keys("%{DOWN}{HOME}{DOWN}{DOWN}{ENTER}"); time.sleep(.7)
          edits=[x for x in document(w).descendants(control_type="Edit") if x.element_info.automation_id!="Body"]
          edits[8].click_input(); keyboard.send_keys("%{DOWN}{HOME}{DOWN}{ENTER}"); time.sleep(.7)

          checks=document(w).descendants(control_type="CheckBox")
          if checks:
              before=checks[0].get_toggle_state()
              checks[0].click_input(); time.sleep(.3)
              checks=document(w).descendants(control_type="CheckBox")
              if checks[0].get_toggle_state()==before:
                  checks[0].click_input(); keyboard.send_keys(" "); time.sleep(.5)
          print("SPR_UI_EDITS_AFTER="+json.dumps([x.window_text() for x in document(w).descendants(control_type="Edit") if x.element_info.automation_id!="Body"],ensure_ascii=False),flush=True)
          print("SPR_UI_CHECKS_AFTER="+json.dumps([x.get_toggle_state() for x in document(w).descendants(control_type="CheckBox")]),flush=True)
          ImageGrab.grab(all_screens=True).save(ev/"51-spravka-edited.png")
          save(w); close(w,p)

          # Read persistence directly from the DOCX that native Word saved.
          with zipfile.ZipFile(spr) as z: root=ET.fromstring(z.read("word/document.xml"))
          fld=next(root.iter(q("fldSimple")),None)
          if fld is not None:
              print("DATE_AFTER_KIND=fldSimple DIRTY="+str(fld.get(q("dirty")))+" TEXT="+''.join((x.text or '') for x in fld.iter(q("t"))),flush=True)
          else:
              instr=''.join((x.text or '') for x in root.iter(q("instrText")))
              alltext=''.join((x.text or '') for x in root.iter(q("t")))
              print("DATE_AFTER_KIND=complex INSTR="+instr+" HAS_CURRENT="+str("13.11.2026" in alltext),flush=True)

          sdt_data=[]
          for sdt in root.iter(q("sdt")):
              pr=sdt.find(q("sdtPr")); content=sdt.find(q("sdtContent"))
              if pr is None or content is None: continue
              tag=pr.find(q("tag")); tagv=tag.get(q("val")) if tag is not None else None
              text=''.join((x.text or '') for x in content.iter(q("t")))
              kind="text"; checked=None
              if pr.find(q("dropDownList")) is not None: kind="dropdown"
              cb=pr.find("{"+W14+"}checkbox")
              if cb is not None:
                  kind="checkbox"; ch=cb.find("{"+W14+"}checked")
                  checked=None if ch is None else ch.get("{"+W14+"}val")
              sdt_data.append({"tag":tagv,"kind":kind,"text":text,"checked":checked})
          print("SPR_XML_AFTER_WORD="+json.dumps(sdt_data,ensure_ascii=False),flush=True)

          p,w=open_word(spr); d=document(w)
          print("SPR_REOPEN_TEXT="+d.window_text(),flush=True)
          print("SPR_REOPEN_EDITS="+json.dumps([x.window_text() for x in d.descendants(control_type="Edit") if x.element_info.automation_id!="Body"],ensure_ascii=False),flush=True)
          print("SPR_REOPEN_CHECKS="+json.dumps([x.get_toggle_state() for x in d.descendants(control_type="CheckBox")]),flush=True)
          ImageGrab.grab(all_screens=True).save(ev/"52-spravka-reopen.png")
          body=[x for x in d.descendants(control_type="Edit") if x.element_info.automation_id=="Body"]
          if body:
              body[0].click_input()
              keyboard.send_keys("%{F9}"); time.sleep(1)
              ImageGrab.grab(all_screens=True).save(ev/"53-date-field-code.png")
              keyboard.send_keys("%{F9}"); time.sleep(.5)
              keyboard.send_keys("^a{F9}"); time.sleep(1)
              print("SPR_DATE_AFTER_NATIVE_F9="+str("13.11.2026" in document(w).window_text()),flush=True)
          close(w,p)
          print("NATIVE_WORD_CERTIFICATE_PASS",flush=True)
          '@ | Set-Content "$env:RUNNER_TEMP\remaining.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\remaining.py"

      - name: Upload native Word evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7338963-native-word-ui-evidence
          path: ${{ runner.temp }}\evidence\*.png
