name: Native Word UI form test 7338963
on:
  push:
    branches: [word-native-test-7338963]
jobs:
  ui:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Word LTSC 2024 with official GVLK
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/6c1eeb25-cf8b-41d9-8d0d-cc1dbc032140/officedeploymenttool_20430-20146.exe" -OutFile "$env:RUNNER_TEMP\odt.exe"
          Start-Process "$env:RUNNER_TEMP\odt.exe" -ArgumentList "/quiet /extract:$env:RUNNER_TEMP\odt" -Wait
          @'
          <Configuration>
            <Add OfficeClientEdition="64" Channel="PerpetualVL2024">
              <Product ID="ProPlus2024Volume" PIDKEY="XJ2XN-FW8RK-P4HMP-DKDBV-GCVGB">
                <Language ID="en-us" />
                <ExcludeApp ID="Access" /><ExcludeApp ID="Excel" /><ExcludeApp ID="Groove" />
                <ExcludeApp ID="Lync" /><ExcludeApp ID="OneDrive" /><ExcludeApp ID="OneNote" />
                <ExcludeApp ID="Outlook" /><ExcludeApp ID="PowerPoint" /><ExcludeApp ID="Publisher" />
                <ExcludeApp ID="Teams" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
            <Updates Enabled="FALSE" />
          </Configuration>
          '@ | Set-Content "$env:RUNNER_TEMP\odt\config.xml" -Encoding UTF8
          & "$env:RUNNER_TEMP\odt\setup.exe" /configure "$env:RUNNER_TEMP\odt\config.xml"
          $word = Get-ChildItem "C:\Program Files\Microsoft Office" -Filter WINWORD.EXE -Recurse | Select-Object -First 1
          if(!$word){ throw "WINWORD missing" }
          "WORD_EXE=$($word.FullName)" | Out-File $env:GITHUB_ENV -Append
          $ospp=Get-ChildItem "C:\Program Files\Microsoft Office" -Filter OSPP.VBS -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if($ospp){ cscript.exe //nologo $ospp.FullName /dstatus }
          New-Item -Path "HKCU:\Software\Microsoft\Office\16.0\Common\General" -Force | Out-Null
          New-ItemProperty -Path "HKCU:\Software\Microsoft\Office\16.0\Common\General" -Name ShownFirstRunOptin -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path "HKCU:\Software\Microsoft\Office\16.0\Common\General" -Name DisableFirstRunMovie -Value 1 -PropertyType DWord -Force | Out-Null

      - name: Confirm interactive console
        shell: powershell
        run: |
          whoami
          cmd /c "query session || exit /b 0"
          Get-Process explorer -ErrorAction SilentlyContinue | Format-Table Id,SessionId,ProcessName
          Get-CimInstance Win32_ComputerSystem | Select-Object UserName

      - name: Extract sanitized forms and install UI tooling
        shell: powershell
        run: |
          Expand-Archive "$env:GITHUB_WORKSPACE\word-native-test\native_forms.zip" "$env:RUNNER_TEMP\forms" -Force
          Get-ChildItem "$env:RUNNER_TEMP\forms" | Format-Table Name,Length
          python -m pip install --disable-pip-version-check pywinauto pillow pywin32

      - name: Native Word UIA and keyboard test
        timeout-minutes: 5
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: |
          @'
          import os,time,subprocess,json,zipfile,traceback
          from pathlib import Path
          from pywinauto import Desktop, keyboard
          from PIL import ImageGrab
          import xml.etree.ElementTree as ET

          exe=os.environ["WORD_EXE"]
          forms=Path(os.environ["RUNNER_TEMP"])/"forms"
          out=Path(os.environ["RUNNER_TEMP"])/"evidence"
          out.mkdir(exist_ok=True)
          doc=next(forms.glob("*TEST-000.docx"))
          print("OPENING",doc,flush=True)
          p=subprocess.Popen([exe,"/q",str(doc)])
          print("WORD_PID",p.pid,flush=True)
          time.sleep(12)

          desktop=Desktop(backend="uia")
          wins=[]
          target=None
          for w in desktop.windows():
              try:
                  d={"title":w.window_text(),"class":w.class_name(),"pid":w.process_id(),"type":w.element_info.control_type}
                  if d["pid"]==p.pid or "Word" in d["title"] or "Анкета" in d["title"]:
                      wins.append(d)
                  if d["pid"]==p.pid and w.is_visible() and d["class"]=="OpusApp":
                      target=w
              except Exception:
                  pass
          print("WORD_WINDOWS="+json.dumps(wins,ensure_ascii=False),flush=True)
          ImageGrab.grab(all_screens=True).save(out/"01-open.png")
          if target is None:
              raise RuntimeError("No visible OpusApp Word window")

          print("TARGET="+target.window_text(),flush=True)
          items=[]
          for x in target.descendants():
              try:
                  typ=x.element_info.control_type
                  name=x.window_text()
                  aid=x.element_info.automation_id
                  if name or typ in ("Document","Edit","ComboBox","CheckBox","Button"):
                      items.append({"type":typ,"name":name[:120],"id":aid})
                      if len(items)>=250: break
              except Exception: pass
          print("UIA_TREE="+json.dumps(items,ensure_ascii=False),flush=True)

          target.set_focus()
          time.sleep(1)
          # Direct keyboard interaction with the protected legacy form.
          keyboard.send_keys("^{HOME}")
          time.sleep(.5)
          keyboard.send_keys("ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890",pause=.03)
          time.sleep(.5)
          # Exit first field so Lowercase/maxLength formatting can apply.
          keyboard.send_keys("{TAB}")
          time.sleep(.5)
          # From the second field, 12 more TABs reach criminal_no.
          for _ in range(12):
              keyboard.send_keys("{TAB}")
              time.sleep(.08)
          keyboard.send_keys(" ")
          time.sleep(.5)
          keyboard.send_keys("^s")
          time.sleep(6)
          ImageGrab.grab(all_screens=True).save(out/"02-after-edit-save.png")
          keyboard.send_keys("%{F4}")
          time.sleep(6)
          if p.poll() is None:
              p.terminate()
              try:p.wait(5)
              except: p.kill()

          # Read back the file bytes written by native Word.
          W="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          ns={"w":W}
          with zipfile.ZipFile(doc) as z:
              root=ET.fromstring(z.read("word/document.xml"))
          vals={}
          q=lambda name: "{"+W+"}"+name
          for fld in root.iter(q("ffData")):
              n=fld.find(q("name"))
              if n is None: continue
              name=n.get(q("val"))
              cb=fld.find(q("checkBox"))
              checked=None
              if cb is not None:
                  c=cb.find(q("checked"))
                  checked = None if c is None else c.get(q("val"),"1")
              vals[name]={
                  "textInput": fld.find(q("textInput")) is not None,
                  "checkBox": cb is not None,
                  "checked": checked,
                  "ddList": fld.find(q("ddList")) is not None
              }
          body_text="".join((t.text or "") for t in root.iter(q("t")))
          print("POSTSAVE_BODY_TEXT="+body_text,flush=True)
          print("FORM_FIELDS="+json.dumps(vals,ensure_ascii=False),flush=True)
          expected="abcdefghijklmnopqrstuvwxy"
          print("MAX25_LOWERCASE_PRESENT="+str(expected in body_text),flush=True)
          print("NATIVE_WORD_UI_KEYBOARD_SAVE_PASS",flush=True)
          '@ | Set-Content "$env:RUNNER_TEMP\native_ui_test.py" -Encoding UTF8
          python "$env:RUNNER_TEMP\native_ui_test.py"

      - name: Upload native Word evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7338963-native-word-ui-evidence
          path: ${{ runner.temp }}\evidence\*.png
