name: Build 7zz tool artifact

on:
  push:
    branches:
      - tooling-7zip-rar-inspect
    paths:
      - ".github/workflows/build-7zz.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official 7-Zip Linux x64
        run: |
          set -eux
          curl -L --fail -o 7z-linux.tar.xz https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz
          tar -xJf 7z-linux.tar.xz
          chmod +x 7zz
          ./7zz | head -5
          mkdir artifact
          cp 7zz artifact/
      - name: Upload 7zz
        uses: actions/upload-artifact@v4
        with:
          name: 7zz-linux-x64
          path: artifact/7zz
          retention-days: 1
