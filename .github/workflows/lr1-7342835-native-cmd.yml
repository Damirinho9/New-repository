name: LR1 7342835 Native Windows CMD

on:
  push:
    branches:
      - lr1-7342835-native-cmd
  workflow_dispatch:

jobs:
  native-cmd:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute LR1 in real Windows CMD
        shell: cmd
        run: call lr1_7342835.cmd
      - name: Show evidence summary
        shell: powershell
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" | Format-Table Name,Length,LastWriteTime
          Get-Content "$env:GITHUB_WORKSPACE\artifacts\TASK09_TREE_C_HEAD.txt" -First 30
          Get-Content "$env:GITHUB_WORKSPACE\artifacts\FINAL_TREE.txt"
          Get-Content "$env:GITHUB_WORKSPACE\artifacts\LR1_NETWORK_TRANSCRIPT.txt" -Tail 40
      - name: Upload native evidence
        uses: actions/upload-artifact@v4
        with:
          name: LR1_7342835_NATIVE_CMD_EVIDENCE
          path: artifacts
          if-no-files-found: error
          retention-days: 7
