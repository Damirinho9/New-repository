name: Native Hadoop stage 8 WordCount
on:
  push:
    branches: [bigdata-7341730-native]
    paths:
      - '.github/workflows/bigdata-hadoop-wordcount.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Prepare evidence display
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/screenshots evidence/logs evidence/status
          sudo apt-get update
          sudo apt-get install -y xvfb xterm openbox imagemagick x11-utils
          Xvfb :99 -screen 0 1600x1000x24 -nolisten tcp >evidence/logs/xvfb.log 2>&1 &
          export DISPLAY=:99
          for i in {1..30}; do xdpyinfo >/dev/null 2>&1 && break; sleep 1; done
          openbox >evidence/logs/openbox.log 2>&1 &
          echo DISPLAY=:99 >> "$GITHUB_ENV"
          echo "EVIDENCE=$PWD/evidence" >> "$GITHUB_ENV"
          cat > /tmp/capture-stage <<'CAPTURE'
          #!/usr/bin/env bash
          set -euo pipefail
          name="$1"
          script="$2"
          log="$EVIDENCE/logs/$name.log"
          status="$EVIDENCE/status/$name.code"
          xterm -geometry 130x43+15+15 -fa 'DejaVu Sans Mono' -fs 13 -T "$name" -hold -e bash -c 'stty sane; stty onlcr; set -o pipefail; bash -x "$1" 2>&1 | tee "$2"; rc=${PIPESTATUS[0]}; printf "\nExit status: %s\n" "$rc"; echo "$rc" > "$3"; exit "$rc"' _ "$script" "$log" "$status" &
          pid=$!
          for i in {1..1200}; do test -f "$status" && break; kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          sleep 2
          import -window root "$EVIDENCE/screenshots/$name.png"
          kill "$pid" 2>/dev/null || true
          cat "$log" || true
          test -f "$status"
          test "$(cat "$status")" = 0
          CAPTURE
          chmod +x /tmp/capture-stage
      - name: Verify actual Ubuntu environment
        shell: bash
        run: |
          cat > /tmp/environment.sh <<'SCRIPT'
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 22.04
          hostnamectl || hostname
          uname -m
          nproc
          free -h
          df -h /
          systemd-detect-virt || true
          ls -l /dev/kvm || true
          command -v VBoxManage || true
          SCRIPT
          /tmp/capture-stage 01_ubuntu /tmp/environment.sh
      - name: Install dependencies
        shell: bash
        run: |
          cat > /tmp/install.sh <<'SCRIPT'
          set -euo pipefail
          sudo apt update
          sudo DEBIAN_FRONTEND=noninteractive apt install -y openjdk-8-jdk openssh-server python3 nano wget
          sudo update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac
          sudo systemctl enable --now ssh
          SCRIPT
          /tmp/capture-stage 02_install /tmp/install.sh
          cat > /tmp/versions.sh <<'SCRIPT'
          set -euo pipefail
          java -version
          java -version 2>&1 | grep 'version "1.8'
          javac -version
          python3 --version
          systemctl status ssh --no-pager --full
          systemctl is-active --quiet ssh
          dpkg-query -W openjdk-8-jdk openssh-server python3 nano wget
          SCRIPT
          /tmp/capture-stage 03_versions /tmp/versions.sh
      - name: Create isolated Hadoop user and workspace
        shell: bash
        run: |
          cat > /tmp/user.sh <<'SCRIPT'
          set -euo pipefail
          getent group hadoop >/dev/null || sudo addgroup hadoop
          id hduser >/dev/null 2>&1 || sudo adduser --disabled-password --gecos '' --ingroup hadoop hduser
          id hduser
          getent passwd hduser
          sudo -iu hduser pwd
          sudo install -d -m 2770 -o hduser -g hadoop /srv/hadoop-lab-share
          sudo -u hduser sh -c 'printf "shared workspace test\n" > /srv/hadoop-lab-share/transfer.txt'
          sudo cat /srv/hadoop-lab-share/transfer.txt
          sudo -u hduser test -r /srv/hadoop-lab-share/transfer.txt
          ls -ld /srv/hadoop-lab-share
          echo 'Shared runner workspace only; not a VirtualBox shared folder.'
          SCRIPT
          /tmp/capture-stage 04_user_workspace /tmp/user.sh
      - name: Configure and verify SSH localhost
        shell: bash
        run: |
          cat > /tmp/ssh-hduser.sh <<'SCRIPT'
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ ! -f ~/.ssh/id_rsa ]; then ssh-keygen -t rsa -b 3072 -P "" -f ~/.ssh/id_rsa; fi
          chmod 600 ~/.ssh/id_rsa
          chmod 644 ~/.ssh/id_rsa.pub
          touch ~/.ssh/authorized_keys
          grep -qxF "$(cat ~/.ssh/id_rsa.pub)" ~/.ssh/authorized_keys || cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          stat -c '%a %U %n' ~/.ssh ~/.ssh/id_rsa ~/.ssh/authorized_keys
          test "$(stat -c '%a' ~/.ssh/id_rsa)" = 600
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10 localhost 'whoami; hostname; id'
          test "$(ssh -o BatchMode=yes localhost whoami)" = hduser
          SCRIPT
          chmod 755 /tmp/ssh-hduser.sh
          cat > /tmp/ssh-test.sh <<'SCRIPT'
          set -euo pipefail
          sudo -iu hduser bash /tmp/ssh-hduser.sh
          SCRIPT
          /tmp/capture-stage 05_ssh /tmp/ssh-test.sh
      - name: Record network configuration
        shell: bash
        run: |
          cat > /tmp/network.sh <<'SCRIPT'
          set -euo pipefail
          hostname
          ip -brief address
          ip route
          getent hosts localhost
          sysctl net.ipv6.conf.all.disable_ipv6 net.ipv6.conf.default.disable_ipv6
          echo 'IPv6 settings recorded, not changed on hosted runner.'
          SCRIPT
          /tmp/capture-stage 06_network /tmp/network.sh
      - name: Acceptance for hosted Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          for name in 01_ubuntu 02_install 03_versions 04_user_workspace 05_ssh 06_network; do
            test "$(cat evidence/status/$name.code)" = 0
            test -s evidence/screenshots/$name.png
            test -s evidence/logs/$name.log
          done
          printf '%s\n' 'UBUNTU_RUNNER_PREP_PASS' 'VIRTUALBOX_GUEST_ADDITIONS_NOT_TESTED' 'VIRTUALBOX_SHARED_FOLDER_NOT_TESTED' 'IPV6_UNCHANGED' | tee evidence/acceptance.txt
      - name: Restore verified Hadoop archive cache
        id: hadoop_cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/hadoop-dist/hadoop-3.3.1.tar.gz
          key: hadoop-3.3.1-linux-x86_64-sha512-2fd0bf74852c797d-v1
      - name: Download and verify official Hadoop 3.3.1 distribution
        shell: bash
        run: |
          cat > /tmp/hadoop-download.sh <<'SCRIPT'
          set -euo pipefail
          mkdir -p /tmp/hadoop-dist
          cd /tmp/hadoop-dist
          file=hadoop-3.3.1.tar.gz
          # Digest retrieved independently from the official Apache archive.
          printf '%s  %s\n' '2fd0bf74852c797dc864f373ec82ffaa1e98706b309b30d1effa91ac399b477e1accc1ee74d4ccbb1db7da1c5c541b72e4a834f131a99f2814b030fbd043df66' "$file" > "$file.sha512"
          downloaded=0
          if test -f "$file" && sha512sum -c "$file.sha512"; then
            downloaded=1
            echo 'Using SHA-512 verified cached distribution'
          else
            rm -f "$file"
            # Independent providers are raced, not trusted until the official digest matches.
            bases=(
              https://apache.root.lu/hadoop/core/hadoop-3.3.1
              https://repo.huaweicloud.com/apache/hadoop/common/hadoop-3.3.1
              https://archive.apache.org/dist/hadoop/common/hadoop-3.3.1
              https://mirrors.huaweicloud.com/apache/hadoop/common/hadoop-3.3.1
            )
            pids=()
            download_one() {
              local i="$1" base="$2" p="$file.mirror-$1"
              printf 'Trying %s/%s\n' "$base" "$file"
              if timeout --kill-after=5s 180s curl -4 -fL --connect-timeout 15 --max-time 175 --speed-limit 10240 --speed-time 30 --retry 0 --output "$p.partial" "$base/$file"; then
                if printf '%s  %s\n' "$(cut -d' ' -f1 "$file.sha512")" "$p.partial" | sha512sum -c -; then
                  mv "$p.partial" "$p.verified"
                  printf '%s\n' "$base/$file" >"$p.source"
                  return 0
                fi
              fi
              rm -f "$p.partial"
              return 1
            }
            for i in "${!bases[@]}"; do
              download_one "$i" "${bases[$i]}" >"mirror-$i.log" 2>&1 &
              pids+=("$!")
            done
            for attempt in {1..190}; do
              for i in "${!bases[@]}"; do
                p="$file.mirror-$i"
                if test -f "$p.verified" && test -s "$p.source"; then
                  mv "$p.verified" "$file"
                  echo "Verified download source: $(cat "$p.source")"
                  downloaded=1
                  break 2
                fi
              done
              live=0
              for pid in "${pids[@]}"; do kill -0 "$pid" 2>/dev/null && live=1 || true; done
              test "$live" = 1 || break
              sleep 1
            done
            for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; done
            for pid in "${pids[@]}"; do wait "$pid" 2>/dev/null || true; done
            for log in mirror-*.log; do echo "=== $log ==="; tail -c 1800 "$log"; echo; done
            test "$downloaded" = 1
            sha512sum -c "$file.sha512"
            rm -f "$file".mirror-*
          fi
          test "$downloaded" = 1
          python3 - "$file" <<'PY'
          import hashlib, pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          raw = p.with_name(p.name + ".sha512").read_text()
          hashes = re.findall(r"(?i)\b[0-9a-f]{128}\b", raw)
          if not hashes:
              value = raw.split(":", 1)[-1]
              hashes = ["".join(re.findall(r"(?i)\b[0-9a-f]{8,64}\b", value))]
          assert len(hashes) == 1 and len(hashes[0]) == 128, raw
          h = hashlib.sha512()
          with p.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  h.update(chunk)
          actual = h.hexdigest()
          print("Official SHA-512:", hashes[0].lower())
          print("Computed SHA-512:", actual)
          assert actual == hashes[0].lower(), "Checksum mismatch"
          print("HADOOP_DISTRIBUTION_SHA512_PASS")
          PY
          ls -lh "$file" "$file.sha512"
          SCRIPT
          /tmp/capture-stage 07_hadoop_download /tmp/hadoop-download.sh
          mkdir -p evidence/config
          cp /tmp/hadoop-dist/hadoop-3.3.1.tar.gz.sha512 evidence/config/
      - name: Save verified Hadoop archive cache
        if: steps.hadoop_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: /tmp/hadoop-dist/hadoop-3.3.1.tar.gz
          key: hadoop-3.3.1-linux-x86_64-sha512-2fd0bf74852c797d-v1
      - name: Extract Hadoop and set ownership
        shell: bash
        run: |
          cat > /tmp/hadoop-extract.sh <<'SCRIPT'
          set -euo pipefail
          test ! -e /usr/local/hadoop
          sudo tar -xzf /tmp/hadoop-dist/hadoop-3.3.1.tar.gz -C /usr/local
          sudo mv /usr/local/hadoop-3.3.1 /usr/local/hadoop
          sudo chown -R hduser:hadoop /usr/local/hadoop
          stat -c '%U:%G %a %n' /usr/local/hadoop /usr/local/hadoop/bin/hadoop /usr/local/hadoop/etc/hadoop
          test "$(stat -c '%U:%G' /usr/local/hadoop)" = hduser:hadoop
          ls -l /usr/local/hadoop
          sudo -u hduser test -x /usr/local/hadoop/bin/hadoop
          test -f /usr/local/hadoop/share/hadoop/mapreduce/hadoop-mapreduce-examples-3.3.1.jar
          SCRIPT
          /tmp/capture-stage 08_hadoop_extract /tmp/hadoop-extract.sh
      - name: Configure Java and Hadoop environment for hduser
        shell: bash
        run: |
          cat > /tmp/hadoop-env-setup.sh <<'SCRIPT'
          set -euo pipefail
          java_bin=$(readlink -f "$(command -v javac)")
          java_home=$(dirname "$(dirname "$java_bin")")
          printf 'Resolved JAVA_HOME: %s\n' "$java_home"
          test "$java_home" = /usr/lib/jvm/java-8-openjdk-amd64
          "$java_home/bin/java" -version
          test -x "$java_home/bin/java"
          cat > /tmp/hadoop-user-exports <<'EXPORTS'
          # Hadoop environment
          export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
          export HADOOP_HOME=/usr/local/hadoop
          export HADOOP_INSTALL=$HADOOP_HOME
          export PATH=$PATH:$HADOOP_HOME/bin:$HADOOP_HOME/sbin
          EXPORTS
          sudo -u hduser tee -a /home/hduser/.bashrc </tmp/hadoop-user-exports
          printf '\nexport JAVA_HOME=%s\n' "$java_home" | sudo -u hduser tee -a /usr/local/hadoop/etc/hadoop/hadoop-env.sh
          sudo -u hduser tail -n 7 /home/hduser/.bashrc
          sudo -u hduser tail -n 3 /usr/local/hadoop/etc/hadoop/hadoop-env.sh
          SCRIPT
          /tmp/capture-stage 09_hadoop_environment /tmp/hadoop-env-setup.sh
          cp /tmp/hadoop-user-exports evidence/config/bashrc-hadoop.sh
          cp /usr/local/hadoop/etc/hadoop/hadoop-env.sh evidence/config/hadoop-env.sh
      - name: Verify Hadoop version as hduser
        shell: bash
        run: |
          cat > /tmp/hadoop-check-user.sh <<'SCRIPT'
          set -e
          source ~/.bashrc
          set -euo pipefail
          whoami
          test "$(whoami)" = hduser
          printenv JAVA_HOME HADOOP_HOME HADOOP_INSTALL
          test "$JAVA_HOME" = /usr/lib/jvm/java-8-openjdk-amd64
          test "$HADOOP_HOME" = /usr/local/hadoop
          test "$HADOOP_INSTALL" = "$HADOOP_HOME"
          command -v hadoop
          test "$(command -v hadoop)" = /usr/local/hadoop/bin/hadoop
          java -version
          hadoop version | tee /tmp/hadoop-version-hduser.txt
          grep -qx 'Hadoop 3.3.1' /tmp/hadoop-version-hduser.txt
          SCRIPT
          chmod 755 /tmp/hadoop-check-user.sh
          cat > /tmp/hadoop-check.sh <<'SCRIPT'
          set -euo pipefail
          sudo -H -u hduser bash -ic 'source /tmp/hadoop-check-user.sh'
          SCRIPT
          /tmp/capture-stage 10_hadoop_version /tmp/hadoop-check.sh
          cp /tmp/hadoop-version-hduser.txt evidence/config/hadoop-version.txt
      - name: Accept native Hadoop installation
        shell: bash
        run: |
          set -euo pipefail
          for name in 07_hadoop_download 08_hadoop_extract 09_hadoop_environment 10_hadoop_version; do
            test "$(cat evidence/status/$name.code)" = 0
            test -s evidence/screenshots/$name.png
            test -s evidence/logs/$name.log
            identify evidence/screenshots/$name.png
          done
          grep -Fxq HADOOP_DISTRIBUTION_SHA512_PASS evidence/logs/07_hadoop_download.log
          grep -qx 'Hadoop 3.3.1' evidence/config/hadoop-version.txt
          echo HADOOP_INSTALL_PASS | tee -a evidence/acceptance.txt
      - name: Prepare HDFS storage directories and environment
        shell: bash
        run: |
          cat > /tmp/hadoop-storage.sh <<'SCRIPT'
          set -euo pipefail
          sudo install -d -m 750 -o hduser -g hadoop /home/hduser/hadoop-data
          for d in tmp namenode datanode; do
            sudo install -d -m 750 -o hduser -g hadoop "/home/hduser/hadoop-data/$d"
            sudo -u hduser test -w "/home/hduser/hadoop-data/$d"
            stat -c '%U:%G %a %n' "/home/hduser/hadoop-data/$d"
          done
          cat > /tmp/hadoop-cluster-exports <<'EXPORTS'
          export HADOOP_CONF_DIR=$HADOOP_HOME/etc/hadoop
          export HADOOP_MAPRED_HOME=$HADOOP_HOME
          EXPORTS
          sudo -u hduser tee -a /home/hduser/.bashrc </tmp/hadoop-cluster-exports
          sudo -u hduser tee -a /usr/local/hadoop/etc/hadoop/hadoop-env.sh <<'EXPORTS'
          export HADOOP_MAPRED_HOME=/usr/local/hadoop
          EXPORTS
          sudo -u hduser tail -n 8 /home/hduser/.bashrc
          sudo -u hduser tail -n 4 /usr/local/hadoop/etc/hadoop/hadoop-env.sh
          SCRIPT
          /tmp/capture-stage 11_hadoop_storage /tmp/hadoop-storage.sh
          cat /tmp/hadoop-cluster-exports >> evidence/config/bashrc-hadoop.sh
          cp /usr/local/hadoop/etc/hadoop/hadoop-env.sh evidence/config/hadoop-env.sh
      - name: Write core-site.xml
        shell: bash
        run: |
          cat > /tmp/configure-core-site.xml.sh <<'SCRIPT'
          set -euo pipefail
          sudo -u hduser tee /usr/local/hadoop/etc/hadoop/core-site.xml >/dev/null <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <configuration>
            <property>
              <name>fs.defaultFS</name>
              <value>hdfs://localhost:9000</value>
            </property>
            <property>
              <name>hadoop.tmp.dir</name>
              <value>/home/hduser/hadoop-data/tmp</value>
            </property>
          </configuration>
          XML
          cat /usr/local/hadoop/etc/hadoop/core-site.xml
          stat -c '%U:%G %a %n' /usr/local/hadoop/etc/hadoop/core-site.xml
          SCRIPT
          /tmp/capture-stage 12_core_site /tmp/configure-core-site.xml.sh
          cp /usr/local/hadoop/etc/hadoop/core-site.xml evidence/config/
      - name: Write hdfs-site.xml
        shell: bash
        run: |
          cat > /tmp/configure-hdfs-site.xml.sh <<'SCRIPT'
          set -euo pipefail
          sudo -u hduser tee /usr/local/hadoop/etc/hadoop/hdfs-site.xml >/dev/null <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <configuration>
            <property>
              <name>dfs.replication</name>
              <value>1</value>
            </property>
            <property>
              <name>dfs.namenode.name.dir</name>
              <value>file:///home/hduser/hadoop-data/namenode</value>
            </property>
            <property>
              <name>dfs.datanode.data.dir</name>
              <value>file:///home/hduser/hadoop-data/datanode</value>
            </property>
          </configuration>
          XML
          cat /usr/local/hadoop/etc/hadoop/hdfs-site.xml
          stat -c '%U:%G %a %n' /usr/local/hadoop/etc/hadoop/hdfs-site.xml
          SCRIPT
          /tmp/capture-stage 13_hdfs_site /tmp/configure-hdfs-site.xml.sh
          cp /usr/local/hadoop/etc/hadoop/hdfs-site.xml evidence/config/
      - name: Write mapred-site.xml
        shell: bash
        run: |
          cat > /tmp/configure-mapred-site.xml.sh <<'SCRIPT'
          set -euo pipefail
          sudo -u hduser tee /usr/local/hadoop/etc/hadoop/mapred-site.xml >/dev/null <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <configuration>
            <property>
              <name>mapreduce.framework.name</name>
              <value>yarn</value>
            </property>
            <property>
              <name>mapreduce.application.classpath</name>
              <value>/usr/local/hadoop/share/hadoop/mapreduce/*:/usr/local/hadoop/share/hadoop/mapreduce/lib/*</value>
            </property>
            <property>
              <name>mapreduce.map.memory.mb</name>
              <value>1024</value>
            </property>
            <property>
              <name>mapreduce.reduce.memory.mb</name>
              <value>1024</value>
            </property>
            <property>
              <name>mapreduce.map.java.opts</name>
              <value>-Xmx768m</value>
            </property>
            <property>
              <name>mapreduce.reduce.java.opts</name>
              <value>-Xmx768m</value>
            </property>
            <property>
              <name>yarn.app.mapreduce.am.resource.mb</name>
              <value>1024</value>
            </property>
          </configuration>
          XML
          cat /usr/local/hadoop/etc/hadoop/mapred-site.xml
          stat -c '%U:%G %a %n' /usr/local/hadoop/etc/hadoop/mapred-site.xml
          SCRIPT
          /tmp/capture-stage 14_mapred_site /tmp/configure-mapred-site.xml.sh
          cp /usr/local/hadoop/etc/hadoop/mapred-site.xml evidence/config/
      - name: Write yarn-site.xml
        shell: bash
        run: |
          cat > /tmp/configure-yarn-site.xml.sh <<'SCRIPT'
          set -euo pipefail
          sudo -u hduser tee /usr/local/hadoop/etc/hadoop/yarn-site.xml >/dev/null <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <configuration>
            <property>
              <name>yarn.resourcemanager.hostname</name>
              <value>localhost</value>
            </property>
            <property>
              <name>yarn.nodemanager.aux-services</name>
              <value>mapreduce_shuffle</value>
            </property>
            <property>
              <name>yarn.nodemanager.env-whitelist</name>
              <value>JAVA_HOME,HADOOP_COMMON_HOME,HADOOP_HDFS_HOME,HADOOP_CONF_DIR,CLASSPATH_PREPEND_DISTCACHE,HADOOP_YARN_HOME,HADOOP_MAPRED_HOME</value>
            </property>
            <property>
              <name>yarn.nodemanager.resource.memory-mb</name>
              <value>4096</value>
            </property>
            <property>
              <name>yarn.nodemanager.resource.cpu-vcores</name>
              <value>2</value>
            </property>
            <property>
              <name>yarn.scheduler.minimum-allocation-mb</name>
              <value>512</value>
            </property>
            <property>
              <name>yarn.scheduler.maximum-allocation-mb</name>
              <value>4096</value>
            </property>
          </configuration>
          XML
          cat /usr/local/hadoop/etc/hadoop/yarn-site.xml
          stat -c '%U:%G %a %n' /usr/local/hadoop/etc/hadoop/yarn-site.xml
          SCRIPT
          /tmp/capture-stage 15_yarn_site /tmp/configure-yarn-site.xml.sh
          cp /usr/local/hadoop/etc/hadoop/yarn-site.xml evidence/config/
      - name: Configure single localhost worker
        shell: bash
        run: |
          cat > /tmp/configure-workers.sh <<'SCRIPT'
          set -euo pipefail
          printf '%s\n' localhost | sudo -u hduser tee /usr/local/hadoop/etc/hadoop/workers
          test "$(cat /usr/local/hadoop/etc/hadoop/workers)" = localhost
          ls -l /usr/local/hadoop/etc/hadoop/workers
          sudo -iu hduser ssh -o BatchMode=yes localhost 'whoami; hostname'
          SCRIPT
          /tmp/capture-stage 16_workers /tmp/configure-workers.sh
          cp /usr/local/hadoop/etc/hadoop/workers evidence/config/
      - name: Verify loaded HDFS MapReduce and YARN settings natively
        shell: bash
        run: |
          cat > /tmp/ConfigCheck.java <<'JAVA'
          import org.apache.hadoop.conf.Configuration;
          import org.apache.hadoop.hdfs.HdfsConfiguration;
          import org.apache.hadoop.mapred.JobConf;
          import org.apache.hadoop.yarn.conf.YarnConfiguration;
          public class ConfigCheck {
              static void check(Configuration c, String key, String expected) {
                  String actual = c.getTrimmed(key);
                  System.out.println(key + " = " + actual);
                  if (!expected.equals(actual)) throw new IllegalStateException(key + " expected " + expected);
              }
              public static void main(String[] args) {
                  HdfsConfiguration h = new HdfsConfiguration();
                  JobConf m = new JobConf();
                  YarnConfiguration y = new YarnConfiguration();
                  check(h, "fs.defaultFS", "hdfs://localhost:9000");
                  check(h, "hadoop.tmp.dir", "/home/hduser/hadoop-data/tmp");
                  check(h, "dfs.replication", "1");
                  check(h, "dfs.namenode.name.dir", "file:///home/hduser/hadoop-data/namenode");
                  check(h, "dfs.datanode.data.dir", "file:///home/hduser/hadoop-data/datanode");
                  check(m, "mapreduce.framework.name", "yarn");
                  check(m, "mapreduce.application.classpath", "/usr/local/hadoop/share/hadoop/mapreduce/*:/usr/local/hadoop/share/hadoop/mapreduce/lib/*");
