name: Native Work1 V06 direct RPM extract

on:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/build-native-v06-direct.yml'
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install small host dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm2cpio cpio curl dbus-x11 file python3             libxcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0 libxcb-keysyms1             libxcb-image0 libxcb-icccm4 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0             libx11-6 libxext6 libxrender1 libxi6 libxrandr2 libxfixes3 libxkbfile1             libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3             libc++1-18 libc++abi1-18 libunwind-18 libglu1-mesa libopengl0             libxcb-res0 libxcb-ewmh2 libxcb-composite0 libxcb-dri2-0             libxcb-cursor0 libxcb-xinerama0 libxcb-render-util0 libxv1 libxres1 || true

      - name: Download and extract official KOMPAS-Graphic RPM
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 -o /tmp/graphic.rpm             'https://repo.ascon.ru/stable/rpm/redos/8.0/ascon-kompas-graphic-v25-25.0.5.2780-0.x86_64.rpm'
          curl -fL --retry 5 --retry-delay 2 -o /tmp/core.rpm             'https://repo.ascon.ru/stable/rpm/redos/8.0/ascon-kompas-v25-25.0.5.2780-0.x86_64.rpm'
          mkdir -p /tmp/kroot
          (cd /tmp/kroot && rpm2cpio /tmp/graphic.rpm | cpio -idm --quiet)
          (cd /tmp/kroot && rpm2cpio /tmp/core.rpm | cpio -idm --quiet)
          KOMPAS_BIN="$(find /tmp/kroot -type f -name kKompas -print -quit)"
          KSAPI_LIB="$(find /tmp/kroot -type f -name libksAPI.so -print -quit)"
          echo "KOMPAS_BIN=$KOMPAS_BIN"
          echo "KSAPI_LIB=$KSAPI_LIB"
          test -n "$KOMPAS_BIN"
          test -n "$KSAPI_LIB"
          chmod +x "$KOMPAS_BIN"
          dirname "$KOMPAS_BIN" > /tmp/kompas_bin_dir.txt
          echo "=== RPM ==="; ls -lh /tmp/graphic.rpm /tmp/core.rpm
          echo "=== KOMPAS ==="; file "$KOMPAS_BIN"; ls -lh "$KOMPAS_BIN"
          echo "=== unresolved ==="
          LD_LIBRARY_PATH="$(dirname "$KOMPAS_BIN"):/usr/lib/llvm-18/lib:/usr/lib/x86_64-linux-gnu" ldd "$KOMPAS_BIN" | grep 'not found' || true

      - name: Download precompiled injector
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 5 -o /tmp/inject_variant06.so             'https://raw.githubusercontent.com/Damirinho9/New-repository/kompas-7335493-native-work1/kompas-linux/bin/inject_variant06.so'
          file /tmp/inject_variant06.so
          BIN="$(cat /tmp/kompas_bin_dir.txt)"
          LD_LIBRARY_PATH="$BIN:/usr/lib/llvm-18/lib:/usr/lib/x86_64-linux-gnu" ldd /tmp/inject_variant06.so | grep 'not found' || true

      - name: Run extracted KOMPAS with native injector
        shell: bash
        run: |
          set +e
          BIN="$(cat /tmp/kompas_bin_dir.txt)"
          rm -f /tmp/work1_v6_inject.log /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw /tmp/kompas_v6.log
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          export QT_QPA_PLATFORM=offscreen
          export LD_LIBRARY_PATH="$BIN:/usr/lib/llvm-18/lib:/usr/lib/x86_64-linux-gnu"
          unset LD_PRELOAD
          unset DISPLAY HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          cd "$BIN"
          dbus-run-session -- env LD_PRELOAD=/tmp/inject_variant06.so ./kKompas >/tmp/kompas_v6.log 2>&1 &
          KP=$!
          echo "KOMPAS_PID=$KP"
          for i in $(seq 1 75); do
            cat /tmp/work1_v6_inject.log 2>/dev/null || true
            grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log 2>/dev/null && break
            grep -q 'THREAD_DONE_FAIL' /tmp/work1_v6_inject.log 2>/dev/null && break
            kill -0 "$KP" 2>/dev/null || break
            sleep 2
          done
          kill "$KP" 2>/dev/null || true
          sleep 1

          echo "=== INJECT ==="; cat /tmp/work1_v6_inject.log 2>/dev/null || true
          echo "=== KOMPAS ==="; tail -200 /tmp/kompas_v6.log 2>/dev/null || true

          test -s /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw || exit 20
          file /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
          sha256sum /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
          python3 -c "import zipfile,pathlib; p=pathlib.Path('/tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw'); assert zipfile.is_zipfile(p); z=zipfile.ZipFile(p); print([(i.filename,i.file_size) for i in z.infolist()]); assert 'Contents' in z.namelist(); z.close()"
          grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log || exit 21

      - name: Emit result as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7335493-v06-direct-native
          if-no-files-found: ignore
          path: |
            /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
            /tmp/work1_v6_inject.log
            /tmp/kompas_v6.log
