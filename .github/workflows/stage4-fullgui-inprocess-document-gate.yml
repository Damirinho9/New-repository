name: KOMPAS Stage 4 full GUI in-process document gate

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-fullgui-inprocess-document-gate.yml'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install full official KOMPAS GUI and SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            wget ca-certificates gnupg xvfb xauth dbus procps desktop-file-utils \
            clang-18 libc++-18-dev libc++abi-18-dev \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxcb-cursor0 libxres1 \
            libxcb-ewmh2 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-util1 libxcb-xinerama0 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh >/tmp/ascon-script.out 2>/tmp/ascon-script.err || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25=25.0.5.2780 \
            ascon-kompas-graphic-v25=25.0.5.2780 \
            ascon-kompas3d-v25=25.0.5.2780 \
            ascon-kompas-sdk-v25=25.0.5.2780
          dpkg -l 'ascon-kompas*' | tee installed-kompas.txt

      - name: Compile in-process API7 gate
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          cat >/tmp/stage4_gate.cpp <<'CPP'
          #include <KsAPI.h>
          #include <ksConstants.h>
          #include <fstream>
          #include <string>
          using namespace ksapi;
          static std::ofstream lg("/tmp/stage4_gate.log",std::ios::out|std::ios::app);
          static void log(const std::string&s){lg<<s<<std::endl;lg.flush();}
          static int tries=0;
          extern "C" int run_variant06_writer(){
            try{
              IApplication& app=GetKompasApplication();
              int a=0,b=0,c=0,d=0;app.GetSystemVersion(a,b,c,d);
              if(tries==0)log("KOMPAS_VERSION="+std::to_string(a)+"."+std::to_string(b)+"."+std::to_string(c));
              auto lm=app.GetApplicationLicenseManager();
              if(!lm){log("FAIL_LICENSE_MANAGER");return 1;}
              bool l2=lm->IsKompasModuleActive(ksKompasModule2D);
              bool l3=lm->IsKompasModuleActive(ksKompasModule3D);
              if(tries==0){
                log(std::string("LICENSE_2D_BEFORE=")+(l2?"1":"0"));
                log(std::string("LICENSE_3D_BEFORE=")+(l3?"1":"0"));
              }
              if(!l2)lm->SetKompasModuleActive(ksKompasModule2D,true);
              if(!l3)lm->SetKompasModuleActive(ksKompasModule3D,true);
              l2=lm->IsKompasModuleActive(ksKompasModule2D);
              l3=lm->IsKompasModuleActive(ksKompasModule3D);
              log(std::string("LICENSE_2D_AFTER=")+(l2?"1":"0"));
              log(std::string("LICENSE_3D_AFTER=")+(l3?"1":"0"));
              if(!l2||!l3){log("RESULT=FAIL_FULL_GUI_LICENSE");return 1;}
              auto docs=app.GetDocuments();
              if(!docs){log("FAIL_DOCUMENTS");return 1;}
              static IKompasDocumentPtr fdoc{};
              static IKompasDocumentPtr pdoc{};
              if(!fdoc){
                fdoc=docs->AddWithDefaultSettings(ksDocumentFragment,true);
                log(std::string("FRAGMENT_CREATED=")+(fdoc?"1":"0"));
              }
              if(!pdoc){
                pdoc=docs->AddWithDefaultSettings(ksDocumentPart,true);
                log(std::string("PART_CREATED=")+(pdoc?"1":"0"));
              }
              if(!fdoc||!pdoc){
                if(++tries<10)return 3;
                log("RESULT=FAIL_ADD_WITH_DEFAULT_SETTINGS");
                return 1;
              }
              IKompasDocument2DPtr d2=fdoc;
              IKompasDocument3DPtr d3=pdoc;
              auto vm=d2?d2->GetViewsAndLayersManager():IViewsAndLayersManagerPtr{};
              auto views=vm?vm->GetViews():IViewsPtr{};
              auto view=views?views->GetActiveView():IViewPtr{};
              auto top=d3?d3->GetTopPart():IPartPtr{};
              log(std::string("ACTIVE_VIEW=")+(view?"1":"0"));
              log(std::string("TOP_PART=")+(top?"1":"0"));
              if(view&&top){
                log("RESULT=PASS_FULL_GUI_INITIALIZED_2D_3D_DOCUMENTS");
                return 0;
              }
              if(++tries<20)return 3;
              log("RESULT=FAIL_FULL_GUI_DOCUMENT_INITIALIZATION");
              return 1;
            }catch(const std::exception&e){log(std::string("EXCEPTION=")+e.what());}
             catch(...){log("EXCEPTION=unknown");}
            return 1;
          }
          CPP
          /usr/bin/clang++-18 -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread -I"$INC" \
            /tmp/stage4_gate.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/writer_variant06.so
          g++ -std=c++20 -O2 -fPIC -shared -pthread kompas-linux/bootstrap_variant06_poll.cpp -ldl -o /tmp/stage4_bootstrap.so
          ldd /tmp/writer_variant06.so | tee writer-ldd.txt
          ! grep -q 'not found' writer-ldd.txt

      - name: Launch real kKompas and prove initialized document models
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export HOME="$RUNNER_TEMP/fullgui-inprocess-home" XDG_CONFIG_HOME="$HOME/.config"
          export LD_LIBRARY_PATH="$BIN${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LC_ALL=C.UTF-8
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D/25" result/stage4-fullgui-inprocess-gate
          RES=$(find "$BIN" -type f -name QtResources.bin -print -quit)
          test -s "$RES"
          cp -f "$RES" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D/25/QtResources.bin"
          rm -f /tmp/stage4_gate.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            dbus-run-session -- env LD_PRELOAD=/tmp/stage4_bootstrap.so "$BIN/kKompas" -automation \
            >result/stage4-fullgui-inprocess-gate/kompas.out 2>result/stage4-fullgui-inprocess-gate/kompas.err &
          KP=$!
          ok=0
          for i in $(seq 1 150); do
            sleep 1
            if grep -q '^RESULT=PASS_FULL_GUI_INITIALIZED_2D_3D_DOCUMENTS$' /tmp/stage4_gate.log 2>/dev/null; then ok=1;break;fi
            if grep -q '^RESULT=FAIL_' /tmp/stage4_gate.log 2>/dev/null; then break;fi
            if grep -q 'POLL_BOOTSTRAP_RETRY_LIMIT' /tmp/work1_bootstrap.log 2>/dev/null; then break;fi
            kill -0 "$KP" 2>/dev/null || break
          done
          cp /tmp/stage4_gate.log result/stage4-fullgui-inprocess-gate/gate.log 2>/dev/null || true
          cp /tmp/work1_bootstrap.log result/stage4-fullgui-inprocess-gate/bootstrap.log 2>/dev/null || true
          cat result/stage4-fullgui-inprocess-gate/gate.log 2>/dev/null || true
          cat result/stage4-fullgui-inprocess-gate/bootstrap.log 2>/dev/null || true
          kill "$KP" 2>/dev/null || true
          pkill -TERM -x kKompas 2>/dev/null || true
          test "$ok" = 1
          grep -qx 'RESULT=PASS_FULL_GUI_INITIALIZED_2D_3D_DOCUMENTS' result/stage4-fullgui-inprocess-gate/gate.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-fullgui-inprocess-document-gate
          retention-days: 90
          if-no-files-found: ignore
          path: |
            installed-kompas.txt
            writer-ldd.txt
            result/stage4-fullgui-inprocess-gate/**
