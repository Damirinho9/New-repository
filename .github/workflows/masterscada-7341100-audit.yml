name: MasterSCADA 3.x installer identify 7341100
on:
  push:
    branches: [tmp-masterscada-7341100]
jobs:
  identify:
    runs-on: windows-2025
    steps:
      - name: Download and inspect
        shell: pwsh
        run: |
          $base="https://download.mps-soft.ru/demo/MasterSCADA_3.X_Free/MasterSCADA_Demo"
          curl.exe -k -L --fail "$base/version.txt" -o version.txt
          curl.exe -k -L --fail "$base/checksum.md5" -o checksum.md5
          curl.exe -k -L --fail "$base/MasterSCADASetup.exe" -o MasterSCADASetup.exe
          Get-Content version.txt | Tee-Object version_out.txt
          Get-Content checksum.md5 | Tee-Object checksum_out.txt
          Get-FileHash -Algorithm MD5 MasterSCADASetup.exe | Format-List | Out-File md5_actual.txt
          Get-AuthenticodeSignature MasterSCADASetup.exe | Format-List * | Out-File signature.txt
          (Get-Item MasterSCADASetup.exe).VersionInfo | Format-List * | Out-File versioninfo.txt
          7z.exe l MasterSCADASetup.exe *> sevenzip.txt
          & .\MasterSCADASetup.exe /? *> setup_help.txt
          Start-Sleep 5
          Get-Process | Where-Object {$_.ProcessName -match 'MasterSCADA|setup|install'} | Select-Object ProcessName,Id,MainWindowTitle,Path | Format-List | Out-File setup_processes.txt
          Get-Process | Where-Object {$_.ProcessName -match 'MasterSCADA|setup|install'} | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: masterscada3-installer-identify
          path: |
            version_out.txt
            checksum_out.txt
            md5_actual.txt
            signature.txt
            versioninfo.txt
            sevenzip.txt
            setup_help.txt
            setup_processes.txt
          if-no-files-found: warn
