name: KOMPAS native Work1 minimal

on:
  push:
    branches:
      - kompas-7335493-native-work1
    paths:
      - '.github/workflows/kompas-linux-native.yml'
      - 'kompas-linux/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    container: alt:p11
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run
        shell: bash
        run: bash kompas-linux/run_pro.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas-native-work1
          if-no-files-found: ignore
          path: |
            kompas-linux/Работа_1_параметрическая.frw
            kompas-linux/verification.txt
            kompas-linux/logs/**
