name: KOMPAS Stage 3 full Linux GUI backend proof

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage3-kompas-full-gui.yml'

permissions:
  actions: read
  contents: read

jobs:
  gui:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Restore frozen portable runtime
        uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime

      - name: Verify and mount portable runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          test "$(cat kompas-runtime.part-00 kompas-runtime.part-01 kompas-runtime.part-02 kompas-runtime.part-03 | sha256sum | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          cat kompas-runtime.part-* > "$RUNNER_TEMP/kompas-v25-portable-runtime.tar.zst"
          mkdir -p "$RUNNER_TEMP/kompas-runtime"
          tar --zstd -xf "$RUNNER_TEMP/kompas-v25-portable-runtime.tar.zst" -C "$RUNNER_TEMP/kompas-runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/kompas-runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          if [ -d "$RUNNER_TEMP/kompas-runtime/opt/ascon/common" ]; then
            sudo ln -s "$RUNNER_TEMP/kompas-runtime/opt/ascon/common" /opt/ascon/common
          fi
          SYSROOT="$RUNNER_TEMP/kompas-runtime/system-libs"
          SYS_LD=$(find "$SYSROOT" -type f -printf '%h\n' | sort -u | paste -sd: -)
          echo "KOMPAS_SYS_LD=$SYS_LD" >> "$GITHUB_ENV"

      - name: Fetch only missing official GUI package without reinstalling KOMPAS
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             wget ca-certificates gnupg xvfb xauth dbus iproute2 procps file             libxcb-res0 libxcb-dri2-0 libxcb-cursor0 libxres1 libxcb-ewmh2             libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0             libunwind8 libxcb-xkb1 libxkbcommon-x11-0 libxcb-util1             libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render0             libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0             libxcb-present0 libxcb-dri3-0

          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh >/tmp/ascon-script.out 2>/tmp/ascon-script.err || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update

          mkdir -p "$RUNNER_TEMP/gui-pkg" "$RUNNER_TEMP/gui-overlay"
          cd "$RUNNER_TEMP/gui-pkg"
          apt-get download ascon-kompas-v25=25.0.5.2780
          DEB=$(find . -maxdepth 1 -type f -name 'ascon-kompas-v25*.deb' -print -quit)
          test -s "$DEB"
          sha256sum "$DEB" | tee "$GITHUB_WORKSPACE/gui-package-SHA256.txt"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/gui-overlay"

          find "$RUNNER_TEMP/gui-overlay" -type f \( -name 'kKompas' -o -name 'kHome' -o -name 'kStudy' \) -perm -111 -print | tee "$GITHUB_WORKSPACE/gui-executables.txt"
          GUI=$(find "$RUNNER_TEMP/gui-overlay" -type f -name 'kKompas' -perm -111 -print -quit)
          if [ -z "$GUI" ]; then
            GUI=$(find "$RUNNER_TEMP/gui-overlay" -type f \( -name 'kHome' -o -name 'kStudy' \) -perm -111 -print -quit)
          fi
          test -n "$GUI"
          echo "GUI_FROM_PACKAGE=$GUI" | tee "$GITHUB_WORKSPACE/gui-selected.txt"

          if [ -d "$RUNNER_TEMP/gui-overlay/opt/ascon/kompas3d-v25" ]; then
            cp -a "$RUNNER_TEMP/gui-overlay/opt/ascon/kompas3d-v25/." "$RUNNER_TEMP/kompas-runtime/opt/ascon/kompas3d-v25/"
          fi
          GUI_REL="${GUI#$RUNNER_TEMP/gui-overlay}"
          GUI_MERGED="$RUNNER_TEMP/kompas-runtime$GUI_REL"
          test -x "$GUI_MERGED"
          echo "GUI_MERGED=$GUI_MERGED" | tee -a "$GITHUB_WORKSPACE/gui-selected.txt"
          sha256sum "$GUI_MERGED" | tee "$GITHUB_WORKSPACE/gui-binary-SHA256.txt"
          file "$GUI_MERGED" | tee "$GITHUB_WORKSPACE/gui-file.txt"
          echo "KOMPAS_GUI_EXE=$GUI_MERGED" >> "$GITHUB_ENV"

      - name: Verify GUI loader and launch full KOMPAS
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export PYTHONPATH="$BIN"
          export LD_LIBRARY_PATH="$BIN:$KOMPAS_SYS_LD"
          export HOME="$RUNNER_TEMP/kompas-gui-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D/25"
          unset LD_PRELOAD HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy

          ldd "$KOMPAS_GUI_EXE" | tee gui-ldd.txt
          if grep -q 'not found' gui-ldd.txt; then
            grep 'not found' gui-ldd.txt
            exit 42
          fi

          ln -sf "$KOMPAS_GUI_EXE" /tmp/kKompas
          test -x /tmp/kKompas
          echo "GUI_SYMLINK=$(readlink /tmp/kKompas)" | tee gui-process.txt

          export QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset"             dbus-run-session -- /tmp/kKompas -automation >kompas-gui.out 2>kompas-gui.err &
          WRAPPER_PID=$!
          echo "WRAPPER_PID=$WRAPPER_PID" | tee -a gui-process.txt

          KP=""
          for i in $(seq 1 60); do
            sleep 1
            KP=$(pgrep -x kKompas | head -1 || true)
            [ -n "$KP" ] && break
            if ! kill -0 "$WRAPPER_PID" 2>/dev/null; then break; fi
          done
          echo "KOMPAS_GUI_PID=$KP" | tee -a gui-process.txt
          if [ -z "$KP" ]; then
            cat kompas-gui.err
            ps -ef | grep -E 'kKompas|kHome|kStudy|Xvfb|dbus' || true
            exit 50
          fi

          {
            ps -o pid,ppid,comm,lstart,args -p "$KP"
            echo "EXE=$(readlink -f /proc/$KP/exe)"
            printf 'CMDLINE='
            tr '\0' ' ' <"/proc/$KP/cmdline"
            echo
          } | tee -a gui-process.txt

          : > gui-sockets-history.txt
          for i in $(seq 1 60); do
            ss -ltnpH > gui-sockets.txt || true
            {
              echo "SNAPSHOT=$i"
              grep -E "pid=$KP[,)]|\(\(\"kKompas\"" gui-sockets.txt || true
            } >> gui-sockets-history.txt
            if grep -E "pid=$KP[,)]|\(\(\"kKompas\"" gui-sockets.txt >/dev/null; then break; fi
            sleep 1
          done

          export KOMPAS_GUI_PID="$KP"
          python3 - <<'PY' | tee gui-sdk.txt
          import os,time,traceback
          import ksapi
          from constants import constants as c

          app=None
          for i in range(30):
              try:
                  app=ksapi.GetKompas()
              except Exception as e:
                  print('GETKOMPAS_RETRY_EXCEPTION',i,repr(e),flush=True)
                  app=None
              if app is not None:
                  break
              time.sleep(1)

          print('GUI_PID='+os.environ['KOMPAS_GUI_PID'],flush=True)
          print('APP_OBJECT='+repr(app),flush=True)
          if app is None:
              print('RESULT=FAIL_FULL_GUI_GETKOMPAS',flush=True)
              raise SystemExit(60)

          name=app.GetApplicationName(True)
          docs=app.GetDocuments()
          print('APP_NAME='+str(name),flush=True)
          print('DOCS_OBJECT='+repr(docs),flush=True)
          if docs is None:
              print('RESULT=FAIL_FULL_GUI_DOCUMENTS',flush=True)
              raise SystemExit(61)

          count=docs.GetCount()
          lm=app.GetApplicationLicenseManager()
          print('DOCUMENT_COUNT='+str(count),flush=True)
          if lm:
              print('KOMPAS_VARIANT='+str(lm.GetKompasVariant()),flush=True)
              print('LICENSE_2D_ACTIVE='+str(lm.IsKompasModuleActive(c.ksKompasModule2D)),flush=True)
              print('LICENSE_3D_ACTIVE='+str(lm.IsKompasModuleActive(c.ksKompasModule3D)),flush=True)

          if 'Invisible' in str(name):
              print('RESULT=FAIL_NOT_FULL_GUI_BACKEND',flush=True)
              raise SystemExit(62)

          print('RESULT=PASS_FULL_LINUX_GUI_BACKEND_AND_SDK',flush=True)
          PY

          grep -q '^RESULT=PASS_FULL_LINUX_GUI_BACKEND_AND_SDK$' gui-sdk.txt
          kill "$WRAPPER_PID" 2>/dev/null || true
          pkill -TERM -x kKompas 2>/dev/null || true

      - name: Upload Stage 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7335493-stage3-full-linux-gui
          retention-days: 90
          if-no-files-found: ignore
          path: |
            gui-package-SHA256.txt
            gui-executables.txt
            gui-selected.txt
            gui-binary-SHA256.txt
            gui-file.txt
            gui-ldd.txt
            gui-process.txt
            gui-sockets.txt
            gui-sockets-history.txt
            gui-sdk.txt
            kompas-gui.out
            kompas-gui.err
