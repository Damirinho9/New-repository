name: KOMPAS hosted Debian Work 4 variant 16 native parametric

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - 'work4-variant16/build_work4_deb.py'
      - 'work4-variant16/verify_work4_deb.py'
      - 'work4-variant16/parameters.csv'
      - 'work4-variant16/source_basis.md'
      - '.github/workflows/work4-variant16-deb-native.yml'

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kompas-7335493-native-work1

      - name: Source and Python syntax gate
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m py_compile work4-variant16/build_work4_deb.py work4-variant16/verify_work4_deb.py
          grep -Fq 'Подшипник роликовый радиально-упорный с коническими роликами двухрядный с двойным внутренним кольцом' work4-variant16/source_basis.md
          grep -Fq 'c8cf9bc3b26df5b86e97d0341a248e176c9296aebe8fa553299ebde24eace612' work4-variant16/source_basis.md
          echo SOURCE_AND_SYNTAX_GATE_PASS

      - name: Install official KOMPAS-3D v25 professional runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb openbox net-tools iproute2 libxcb-res0 libxcb-dri2-0 libxcb-xkb1
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          dpkg -l 'ascon-kompas*' | tee work4-variant16/installed.txt

      - name: Launch full KOMPAS automation
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$BIN" >> "$GITHUB_ENV"
          CFG="$HOME/.config/ascon/KOMPAS-3D/25"
          mkdir -p "$CFG"
          RES=$(find /opt/ascon/kompas3d-v25 -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$CFG/QtResources.bin"
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" "$BIN/kKompas" -automation >work4-variant16/kompas-live.out 2>work4-variant16/kompas-live.err &
          echo $! > work4-variant16/kompas-wrapper.pid
          KP=""
          for i in $(seq 1 90); do
            sleep 1
            KP=$(pgrep -x kKompas | head -1 || true)
            [ -n "$KP" ] && break
          done
          test -n "$KP"
          for i in $(seq 1 90); do
            sleep 1
            ss -ltnp > work4-variant16/kompas-sockets.txt || true
            grep -q kKompas work4-variant16/kompas-sockets.txt && break
          done
          grep -q kKompas work4-variant16/kompas-sockets.txt
          echo "KOMPAS_PID=$KP" >> "$GITHUB_ENV"
          echo KOMPAS_FULL_AUTOMATION_READY

      - name: Build native Work 4
        shell: bash
        env:
          PYTHONPATH: /opt/ascon/kompas3d-v25/Bin
        run: |
          set -euxo pipefail
          python3 work4-variant16/build_work4_deb.py | tee work4-variant16/build-console.txt
          grep -q '^RESULT=BUILD_NATIVE_WORK4_VARIANT16_PASS$' work4-variant16/native-deb/build-report.txt

      - name: Strict parametric reopen rebuild acceptance
        shell: bash
        env:
          PYTHONPATH: /opt/ascon/kompas3d-v25/Bin
        run: |
          set -euxo pipefail
          python3 work4-variant16/verify_work4_deb.py | tee work4-variant16/verify-console.txt
          grep -q '^RESULT=PASS_NATIVE_WORK4_VARIANT16_REOPEN_REBUILD_PARAMETRIC$' work4-variant16/native-deb/verification.txt

      - name: Final SHA and acceptance
        shell: bash
        run: |
          set -euxo pipefail
          cd work4-variant16/native-deb
          sha256sum             Work4_V16_InnerDoubleRing.m3d             Work4_V16_OuterCup_L.m3d             Work4_V16_OuterCup_R.m3d             Work4_V16_TaperRoller.m3d             Work4_V16_CageHalf.m3d             Work4_V16_Rivet.m3d             Work4_V16_Bearing.a3d | tee SHA256.txt
          cat > ACCEPTANCE.txt <<'EOF'
          SOURCE_VARIANT16_EXACT_TOPOLOGY_PASS
          MASTER_GEOMETRY_V16_PASS
          NATIVE_M3D_A3D_PASS
          PARAMETRIC_T_40_44_40_PASS
          FINAL_NOMINAL_REOPEN_PASS
          RESULT=PASS_NATIVE_WORK4_VARIANT16
          EOF
          grep -q '^RESULT=PASS_NATIVE_WORK4_VARIANT16$' ACCEPTANCE.txt

      - name: Stop KOMPAS
        if: always()
        shell: bash
        run: |
          kill "$(cat work4-variant16/kompas-wrapper.pid 2>/dev/null)" 2>/dev/null || true
          pkill -x kKompas 2>/dev/null || true

      - name: Upload accepted native Work 4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 7335493-work4-variant16-native-parametric-bearing
          if-no-files-found: error
          path: |
            work4-variant16/native-deb/Work4_V16_InnerDoubleRing.m3d
            work4-variant16/native-deb/Work4_V16_OuterCup_L.m3d
            work4-variant16/native-deb/Work4_V16_OuterCup_R.m3d
            work4-variant16/native-deb/Work4_V16_TaperRoller.m3d
            work4-variant16/native-deb/Work4_V16_CageHalf.m3d
            work4-variant16/native-deb/Work4_V16_Rivet.m3d
            work4-variant16/native-deb/Work4_V16_Bearing.a3d
            work4-variant16/native-deb/native-manifest.json
            work4-variant16/native-deb/build-report.txt
            work4-variant16/native-deb/verification.txt
            work4-variant16/native-deb/SHA256.txt
            work4-variant16/native-deb/ACCEPTANCE.txt
            work4-variant16/source_basis.md
            work4-variant16/parameters.csv

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 7335493-work4-variant16-hosted-diagnostics
          if-no-files-found: ignore
          path: |
            work4-variant16/native-deb/**
            work4-variant16/build-console.txt
            work4-variant16/verify-console.txt
            work4-variant16/kompas-live.out
            work4-variant16/kompas-live.err
            work4-variant16/kompas-sockets.txt
            work4-variant16/installed.txt
            work4-variant16/source_basis.md
            work4-variant16/parameters.csv
