name: Studwork 7334625 Case 4 Unity credential check

on:
  push:
    branches:
      - studwork-7334625-blender-case4
    paths:
      - ".github/workflows/studwork-7334625-case4-unity-secret-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check configured Unity CI inputs without exposing values
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          set -eu
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD UNITY_SERIAL; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=CONFIGURED"
            else
              echo "${name}=NOT_CONFIGURED"
            fi
          done
