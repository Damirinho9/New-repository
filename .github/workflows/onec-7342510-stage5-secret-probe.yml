name: onec-7342510-stage5-secret-probe
on:
  push:
    branches: [onec-7342510-stage5]
    paths:
      - 'onec-7342510/stage5-secret-probe.txt'
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_URL: ${{ secrets.ONEC_TRAINING_URL != '' }}
    steps:
      - run: |
          if [ "$HAS_URL" = "true" ]; then echo "ONEC_TRAINING_URL_READY=true"; else echo "ONEC_TRAINING_URL_READY=false"; fi
