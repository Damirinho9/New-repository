name: KOMPAS Stage 4 CLI-open 2D native mutation and reopen

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-cliopen-2d-native-pass.yml'

permissions:
  actions: read
  contents: read

jobs:
  native2d:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime

      - name: Restore exact frozen licensed runtime and fetch real FRW seed
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          if [ -d "$RUNNER_TEMP/runtime/opt/ascon/common" ]; then sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common; fi
          SYSROOT="$RUNNER_TEMP/runtime/system-libs"
          SYS_LD=$(find "$SYSROOT" -type f -printf '%h\n' | sort -u | paste -sd: -)
          echo "KOMPAS_SYS_LD=$SYS_LD" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import urllib.request,hashlib,pathlib
          u='https://raw.githubusercontent.com/SergeySklyarov/Kompas3D-MCP/523b6bc7162fddb1290d00a2dfd52f03110dd6a2/tests/Unit/KompasMcp.Unit/Data/g2-reference-contour.frw'
          p=pathlib.Path('Stage4_KnownNative_Seed.frw')
          urllib.request.urlretrieve(u,p)
          print('seed',p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          test -s Stage4_KnownNative_Seed.frw

      - name: Install minimal prerequisites and compile mutate/reopen plugins
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb dbus g++ clang libxcb-res0 libxcb-dri2-0 libxcb-xkb1
          CXXV1=$(find /usr/include /usr/lib/llvm-* -path '*/c++/v1/memory' -print -quit 2>/dev/null || true)
          if [ -z "$CXXV1" ]; then
            for v in 22 21 20 19 18; do
              if apt-cache show "libc++-$v-dev" >/dev/null 2>&1 && apt-cache show "libc++abi-$v-dev" >/dev/null 2>&1; then
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "libc++-$v-dev" "libc++abi-$v-dev"; break
              fi
            done
          fi
          BIN=/opt/ascon/kompas3d-v25/Bin
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          CXXV1=$(find /usr/include /usr/lib/llvm-* -path '*/c++/v1/memory' -print -quit 2>/dev/null); CXXV1=$(dirname "$CXXV1")

          cat >/tmp/cli2d_mutate.cpp <<'CPP'
          #include <KsAPI.h>
          #include <ksConstants.h>
          #include <filesystem>
          #include <fstream>
          #include <string>
          using namespace ksapi; namespace fs=std::filesystem;
          static std::ofstream lg("/tmp/cli2d_mutate.log",std::ios::out|std::ios::app);
          static void log(const std::string&s){lg<<s<<std::endl;lg.flush();}
          static bool done=false;
          extern "C" int run_variant06_writer(){
            if(done)return 0;
            try{
              IApplication& app=GetKompasApplication(); app.SetHideMessage(ksHideMessageYes);
              auto lm=app.GetApplicationLicenseManager(); bool l2=lm&&lm->IsKompasModuleActive(ksKompasModule2D);
              log(std::string("LICENSE_2D_ACTIVE=")+(l2?"1":"0")); if(!l2)return 2;
              auto base=app.GetActiveDocument(); log(std::string("ACTIVE_DOCUMENT=")+(base?"1":"0")); if(!base)return 3;
              IKompasDocument2DPtr d2=base; if(!d2){log("FAIL_CAST_2D");return 2;}
              d2->SetParametricMode(true);
              auto vm=d2->GetViewsAndLayersManager(); auto views=vm?vm->GetViews():IViewsPtr{};
              auto view=views?views->GetActiveView():IViewPtr{}; IDrawingContainerPtr dc=view;
              auto lines=dc?dc->GetLineSegments():ILineSegmentsPtr{};
              log("STATE views="+std::string(views?"1":"0")+" count="+std::to_string(views?views->GetCount():-1)+
                  " view="+(view?"1":"0")+" lines="+(lines?"1":"0"));
              if(!lines)return 3;
              int before=lines->GetCount(); log("LINES_BEFORE="+std::to_string(before));
              auto s=lines->Add(); if(!s){log("FAIL_LINE_ADD");return 2;}
              s->SetX1(777.0);s->SetY1(888.0);s->SetX2(817.0);s->SetY2(888.0);s->SetStyle(ksCSConstruction);
              if(!s->Update()){log("FAIL_LINE_UPDATE");return 2;}
              int after=lines->GetCount(); log("LINES_AFTER="+std::to_string(after));
              if(after<=before){log("FAIL_LINE_COUNT");return 2;}
              fs::path out="/tmp/Stage4_CLI2D_Mutated.frw"; fs::remove(out);
              if(!base->SaveAs(out.wstring())){log("FAIL_SAVEAS");return 2;}
              log("SAVEAS_PASS bytes="+std::to_string(fs::file_size(out)));
              if(!base->Close(kdDoNotSaveChanges)){log("FAIL_CLOSE");return 2;}
              log("CLOSE_PASS");
              log("RESULT=PASS_CLI2D_LICENSED_MUTATION_SAVE_CLOSE");
              done=true;return 0;
            }catch(const std::exception&e){log(std::string("EXCEPTION=")+e.what());}
             catch(...){log("EXCEPTION=unknown");}
            return 2;
          }
          CPP

          cat >/tmp/cli2d_verify.cpp <<'CPP'
          #include <KsAPI.h>
          #include <ksConstants.h>
          #include <fstream>
          #include <string>
          using namespace ksapi;
          static std::ofstream lg("/tmp/cli2d_reopen.log",std::ios::out|std::ios::app);
          static void log(const std::string&s){lg<<s<<std::endl;lg.flush();}
          static bool done=false;
          extern "C" int run_variant06_writer(){
            if(done)return 0;
            try{
              IApplication& app=GetKompasApplication(); app.SetHideMessage(ksHideMessageYes);
              auto lm=app.GetApplicationLicenseManager(); bool l2=lm&&lm->IsKompasModuleActive(ksKompasModule2D);
              log(std::string("LICENSE_2D_ACTIVE=")+(l2?"1":"0")); if(!l2)return 2;
              auto base=app.GetActiveDocument(); if(!base)return 3;
              IKompasDocument2DPtr d2=base; if(!d2){log("FAIL_REOPEN_CAST");return 2;}
              auto vm=d2->GetViewsAndLayersManager(); auto views=vm?vm->GetViews():IViewsPtr{};
              auto view=views?views->GetActiveView():IViewPtr{}; IDrawingContainerPtr dc=view;
              auto lines=dc?dc->GetLineSegments():ILineSegmentsPtr{};
              int count=lines?lines->GetCount():-1;
              log("REOPEN_STATE views="+std::string(views?"1":"0")+" view="+(view?"1":"0")+" lines="+(lines?"1":"0")+" count="+std::to_string(count));
              if(!view||!lines||count<1){log("FAIL_REOPEN_EDITABLE");return 2;}
              bool found=false;
              for(int i=0;i<count;i++){
                auto s=lines->GetByIndex(i); if(!s)continue;
                if(std::abs(s->GetX1()-777.0)<1e-6 && std::abs(s->GetY1()-888.0)<1e-6 &&
                   std::abs(s->GetX2()-817.0)<1e-6 && std::abs(s->GetY2()-888.0)<1e-6){found=true;break;}
              }
              log(std::string("MARKER_LINE_FOUND=")+(found?"1":"0")); if(!found){log("FAIL_MARKER_LINE");return 2;}
              if(!base->Save()){log("FAIL_REOPEN_SAVE");return 2;}
              if(!base->Close(kdDoNotSaveChanges)){log("FAIL_REOPEN_CLOSE");return 2;}
              log("RESULT=PASS_CLI2D_LICENSED_REOPEN_VERIFY");
              done=true;return 0;
            }catch(const std::exception&e){log(std::string("EXCEPTION=")+e.what());}
             catch(...){log("EXCEPTION=unknown");}
            return 2;
          }
          CPP

          /usr/bin/clang++ -std=c++20 -stdlib=libc++ -nostdinc++ -I"$CXXV1" -O2 -fPIC -shared -pthread -I"$INC" /tmp/cli2d_mutate.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/cli2d_mutate.so
          /usr/bin/clang++ -std=c++20 -stdlib=libc++ -nostdinc++ -I"$CXXV1" -O2 -fPIC -shared -pthread -I"$INC" /tmp/cli2d_verify.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/cli2d_verify.so
          g++ -std=c++20 -O2 -fPIC -shared -pthread kompas-linux/bootstrap_variant06_poll.cpp -ldl -o /tmp/stage4_bootstrap.so

      - name: Prepare X11 and KOMPAS profile
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export HOME="$RUNNER_TEMP/cli2d-home" XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25" result/cli2d
          RES=$(find "$BIN" -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25/QtResources.bin"
          echo "HOME=$HOME" >> "$GITHUB_ENV"; echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BIN:$KOMPAS_SYS_LD" >> "$GITHUB_ENV"
          echo "DISPLAY=:122" >> "$GITHUB_ENV"; echo "QT_QPA_PLATFORM=xcb" >> "$GITHUB_ENV"; echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          sudo mkdir -p /tmp/.X11-unix; sudo chmod 1777 /tmp/.X11-unix
          Xvfb :122 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb122.out 2>/tmp/xvfb122.err &
          echo $! > /tmp/xvfb122.pid
          sleep 2

      - name: CLI-open native seed, mutate, save and close
        shell: bash
        run: |
          set -uxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          cp /tmp/cli2d_mutate.so /tmp/writer_variant06.so
          rm -f /tmp/cli2d_mutate.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock /tmp/Stage4_CLI2D_Mutated.frw
          setsid dbus-run-session -- env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" DISPLAY="$DISPLAY" QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 \
            LD_LIBRARY_PATH="$LD_LIBRARY_PATH" LD_PRELOAD=/tmp/stage4_bootstrap.so \
            "$BIN/ksinvisible" -automation "$GITHUB_WORKSPACE/Stage4_KnownNative_Seed.frw" >result/cli2d/mutate.out 2>result/cli2d/mutate.err &
          KP=$!; ok=0
          for i in $(seq 1 120); do sleep 1
            if grep -q '^RESULT=PASS_CLI2D_LICENSED_MUTATION_SAVE_CLOSE$' /tmp/cli2d_mutate.log 2>/dev/null; then ok=1;break;fi
            if grep -q '^FAIL_' /tmp/cli2d_mutate.log 2>/dev/null; then break;fi
            kill -0 "$KP" 2>/dev/null || break
          done
          cp /tmp/cli2d_mutate.log result/cli2d/mutate.log 2>/dev/null || true
          cp /tmp/work1_bootstrap.log result/cli2d/bootstrap-mutate.log 2>/dev/null || true
          cat result/cli2d/mutate.log 2>/dev/null || true
          kill -TERM -- "-$KP" 2>/dev/null || true; wait "$KP" 2>/dev/null || true
          test "$ok" = 1
          test -s /tmp/Stage4_CLI2D_Mutated.frw

      - name: Reopen saved FRW in second licensed process and verify persisted geometry
        shell: bash
        run: |
          set -uxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          cp /tmp/cli2d_verify.so /tmp/writer_variant06.so
          rm -f /tmp/cli2d_reopen.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
          setsid dbus-run-session -- env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" DISPLAY="$DISPLAY" QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 \
            LD_LIBRARY_PATH="$LD_LIBRARY_PATH" LD_PRELOAD=/tmp/stage4_bootstrap.so \
            "$BIN/ksinvisible" -automation /tmp/Stage4_CLI2D_Mutated.frw >result/cli2d/reopen.out 2>result/cli2d/reopen.err &
          KP=$!; ok=0
          for i in $(seq 1 120); do sleep 1
            if grep -q '^RESULT=PASS_CLI2D_LICENSED_REOPEN_VERIFY$' /tmp/cli2d_reopen.log 2>/dev/null; then ok=1;break;fi
            if grep -q '^FAIL_' /tmp/cli2d_reopen.log 2>/dev/null; then break;fi
            kill -0 "$KP" 2>/dev/null || break
          done
          cp /tmp/cli2d_reopen.log result/cli2d/reopen.log 2>/dev/null || true
          cp /tmp/Stage4_CLI2D_Mutated.frw result/cli2d/
          cat result/cli2d/reopen.log 2>/dev/null || true
          kill -TERM -- "-$KP" 2>/dev/null || true; wait "$KP" 2>/dev/null || true
          kill "$(cat /tmp/xvfb122.pid)" 2>/dev/null || true
          test "$ok" = 1
          sha256sum result/cli2d/Stage4_CLI2D_Mutated.frw | tee result/cli2d/SHA256.txt
          printf '%s\n' 'LICENSED_CLI_OPEN_SEED_PASS' 'NATIVE_LINE_MUTATION_PASS' 'SAVE_CLOSE_PASS' 'SECOND_PROCESS_REOPEN_VERIFY_PASS' 'RESULT=PASS_NATIVE_2D_CLI_OPEN_PIPELINE' > result/cli2d/ACCEPTANCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-cliopen-2d-native-pass
          retention-days: 90
          if-no-files-found: ignore
          path: result/cli2d/**
