name: Hexlet 7344445 Full GUI KOMPAS Drawing Recovery

on:
  push:
    branches:
      - hexlet-7344445-native-recovery
    paths:
      - ".github/workflows/hexlet-7344445-kompas-gui.yml"
  workflow_dispatch:

jobs:
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 GUI + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb desktop-file-utils xdotool imagemagick libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          command -v kompas-v25
          mkdir -p hexlet_7344445/native_recovery/kompas_gui
          command -v kompas-v25 | tee hexlet_7344445/native_recovery/kompas_gui/launcher.txt
          dpkg -l 'ascon-kompas*' | tee hexlet_7344445/native_recovery/kompas_gui/installed.txt

      - name: Launch full GUI KOMPAS under Xvfb
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac >hexlet_7344445/native_recovery/kompas_gui/xvfb.out 2>&1 &
          echo $! >/tmp/xvfb.pid
          sleep 2
          kompas-v25 >hexlet_7344445/native_recovery/kompas_gui/gui.out 2>hexlet_7344445/native_recovery/kompas_gui/gui.err &
          echo $! >/tmp/kompas-launcher.pid
          for i in $(seq 1 90); do
            sleep 1
            xdotool search --name 'КОМПАС' >/tmp/kompas-windows.txt 2>/dev/null && break || true
          done
          ps aux | grep -Ei 'kompas|kKompas' | grep -v grep | tee hexlet_7344445/native_recovery/kompas_gui/processes.txt
          cat /tmp/kompas-windows.txt 2>/dev/null | tee hexlet_7344445/native_recovery/kompas_gui/window-ids.txt || true
          import -display :99 -window root hexlet_7344445/native_recovery/kompas_gui/00_gui_before_api.png || true

      - name: Create native drawing through API attached to full GUI
        shell: bash
        env:
          DISPLAY: :99
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export PYTHONPATH="$BIN"
          python3 hexlet_7344445/native_recovery/recover_kompas.py | tee hexlet_7344445/native_recovery/kompas_gui/api.log
          import -display :99 -window root hexlet_7344445/native_recovery/kompas_gui/01_gui_after_api.png || true

      - name: Strict checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'RESULT=PASS_NATIVE_KOMPAS3D_DRAWING_REOPEN' hexlet_7344445/native_recovery/kompas_gui/api.log
          test -s "hexlet_7344445/native_recovery/kompas/Hexlet_KOMPAS3D_Привет_Хекслет.cdw"
          test -s "hexlet_7344445/native_recovery/kompas/Hexlet_KOMPAS3D_Привет_Хекслет_REOPENED.cdw"
          sha256sum hexlet_7344445/native_recovery/kompas/*.cdw | tee hexlet_7344445/native_recovery/kompas_gui/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7344445-native-kompas3d-gui
          path: |
            hexlet_7344445/native_recovery/kompas/
            hexlet_7344445/native_recovery/kompas_gui/
          if-no-files-found: warn
