name: MasterSCADA 3.5 native Level runtime inspect 7341100

on:
  push:
    branches: [tmp-masterscada-7341100]

jobs:
  inspect:
    runs-on: windows-2025
    timeout-minutes: 16
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: C:\Temp\MasterSCADA35
          key: masterscada-demo-3.5.0-msi-v2

      - name: Install MasterSCADA 3.5
        shell: pwsh
        run: |
          Copy-Item C:\Temp\MasterSCADA35\data.msi . -Force
          Copy-Item C:\Temp\MasterSCADA35\Data1.cab . -Force
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress') -PassThru -Wait
          if($p.ExitCode -ne 0){throw "MSI failed $($p.ExitCode)"}

      - name: Restore native checkpoint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/Damirinho9/New-repository/actions/artifacts/15227142597/zip" -OutFile known.zip
          Expand-Archive known.zip -DestinationPath known -Force
          $v=Get-ChildItem known -Recurse -Filter "7341100_MasterSCADA_Lab7.vav"|Select-Object -First 1
          $d="C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7"
          New-Item -ItemType Directory $d -Force|Out-Null
          Copy-Item $v.FullName "$d\7341100_MasterSCADA_Lab7.vav" -Force

      - name: Start native Simulation and inspect Level current data
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto pillow psutil pyautogui
          @'
          from pathlib import Path
          from pywinauto import Desktop,Application
          import pyautogui,time,json,traceback,psutil,re,shutil

          EXE=r"C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          VAV=r"C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7\7341100_MasterSCADA_Lab7.vav"
          log=[]

          def dec(s):
              try:return s.encode("cp1252").decode("cp1251")
              except:return s
          def kill():
              for p in psutil.process_iter(["name"]):
                  try:
                      if p.info["name"] and "masterscada" in p.info["name"].lower():p.kill()
                  except:pass
          def wins(pid=None):
              return Desktop(backend="win32").windows(process=pid) if pid else Desktop(backend="win32").windows()
          def main(pid):
              for w in wins(pid):
                  try:
                      if w.is_visible() and w.window_text().startswith("MasterSCADA"):return w
                  except:pass
          def dialogs(pid):
              return [w for w in wins(pid) if w.class_name()=="#32770" and w.is_visible()]
          def snap(w,p):
              try:w.capture_as_image().save(p);log.append("SHOT "+p)
              except Exception as e:log.append("SHOTERR "+repr(e))
          def dump(w,p):
              rows=[]
              for i,x in enumerate(w.descendants()):
                  try:rows.append({"i":i,"type":x.element_info.control_type,"raw":x.window_text(),"dec":dec(x.window_text()),"autoid":x.element_info.automation_id,"class":x.element_info.class_name,"rect":str(x.rectangle()),"enabled":x.is_enabled(),"visible":x.is_visible()})
                  except:pass
              Path(p).write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
              return rows
          def open_editor():
              app=Application(backend="win32").start(EXE);pid=app.process;time.sleep(8)
              ds=dialogs(pid)
              if not ds:raise RuntimeError("startup dialog missing")
              d=ds[0];r=d.rectangle()
              pyautogui.click(r.left+200,r.top+48);time.sleep(1.5)
              d=dialogs(pid)[0];pyautogui.click(r.left+180,r.top+90);time.sleep(.5)
              ok=None
              for b in d.descendants():
                  try:
                      if b.class_name()=="Button" and b.window_text().strip().upper()=="OK" and b.is_enabled():ok=b;break
                  except:pass
              if not ok:raise RuntimeError("startup OK missing")
              ok.click_input()
              end=time.time()+45
              while time.time()<end:
                  time.sleep(1)
                  for dd in dialogs(pid):
                      try:dd.type_keys("{ENTER}")
                      except:pass
                  m=main(pid)
                  if m and "7341100_MasterSCADA_Lab7" in m.window_text():return pid,m
              raise RuntimeError("open timeout")
          def ui(m):return Desktop(backend="uia").window(handle=m.handle)
          def expand(m):
              for nm in ["Объект","Объект 1"]:
                  for x in ui(m).descendants(control_type="TreeItem"):
                      try:
                          if dec(x.window_text()).strip()==nm:
                              try:x.expand()
                              except:
                                  try:x.double_click_input()
                                  except:pass
                              time.sleep(.5);break
                      except:pass
          def item(m,nm):
              for x in ui(m).descendants(control_type="TreeItem"):
                  try:
                      if dec(x.window_text()).strip()==nm:return x
                  except:pass
          def byid(m,cid):
              out=[]
              for x in m.descendants():
                  try:
                      if x.is_visible() and x.control_id()==cid:out.append(x)
                  except:pass
              return out
          def login_all():
              count=0
              stable=0
              end=time.time()+25
              while time.time()<end:
                  found=None
                  for w in Desktop(backend="uia").windows():
                      try:
                          if w.is_visible() and w.window_text()=="Идентификация оператора":found=w;break
                      except:pass
                  if not found:
                      stable+=1
                      if stable>=5:return count
                      time.sleep(.5);continue
                  stable=0;count+=1
                  if count>6:raise RuntimeError("too many auth dialogs")
                  dump(found,f"auth_{count}_uia.json");snap(found,f"auth_{count}.png")
                  ds=found.descendants();name=None;pwd=None;ok=None
                  for x in ds:
                      try:
                          aid=x.element_info.automation_id;typ=x.element_info.control_type
                          if aid=="1001" and typ=="Edit":name=x
                          elif aid=="textBoxPassword" and typ=="Edit":pwd=x
                          elif aid=="buttonOK" and typ=="Button":ok=x
                      except:pass
                  if not(name and pwd and ok):raise RuntimeError("auth controls missing")
                  name.set_edit_text("sa");pwd.set_edit_text("");ok.click_input();time.sleep(2)
              return count
          def start_simulation(m):
              try:
                  m.menu_select("Режим->Имитация");log.append("MENU_SELECT_OK")
              except Exception as e:
                  log.append("MENU_SELECT_FAIL="+repr(e))
                  r=m.rectangle();pyautogui.click(r.left+208,r.top+40);time.sleep(.5)
                  pyautogui.press("down", presses=3, interval=.15);pyautogui.press("enter")
              time.sleep(4)
          def top_tabs(m):
              tabs=[]
              for x in ui(m).descendants(control_type="TabItem"):
                  try:
                      r=x.rectangle()
                      if 70<=r.top<=110:
                          tabs.append(x)
                  except:pass
              tabs.sort(key=lambda x:x.rectangle().left)
              return tabs
          try:
              pid,m=open_editor();expand(m)
              lv=item(m,"Level")
              if not lv:raise RuntimeError("Level missing")
              lv.click_input();time.sleep(1)
              sim,law,mn,mx=byid(m,215),byid(m,264),byid(m,265),byid(m,266)
              if not(sim and law and mn and mx):raise RuntimeError("simulation controls missing")
              sim[0].click()
              try:law[0].select(1)
              except:
                  law[0].set_focus();law[0].type_keys("{HOME}{DOWN}{ENTER}")
              mn[0].set_edit_text("20");mx[0].set_edit_text("80")
              m.set_focus();m.type_keys("^s");time.sleep(3)
              snap(m,"01_configured.png")

              start_simulation(m)
              n_auth=login_all()
              Path("auth_count.txt").write_text(str(n_auth),encoding="utf-8")
              m=main(pid)
              if not m:raise RuntimeError("main host disappeared")
              snap(m,"02_simulation_clean.png")
              dump(ui(m),"02_simulation_clean_uia.json")
              expand(m);lv=item(m,"Level")
              if lv:lv.click_input();time.sleep(.7)

              # Capture every top property page while simulation is running.
              tabs=top_tabs(m)
              meta=[]
              for i,t in enumerate(tabs):
                  try:
                      rect=str(t.rectangle());raw=t.window_text();decoded=dec(raw)
                      t.click_input();time.sleep(.7)
                      rows=dump(ui(m),f"tab_{i}_uia.json")
                      snap(m,f"tab_{i}.png")
                      vis=[]
                      for z in rows:
                          if z["type"] in ("Text","Edit","ComboBox","Button"):
                              s=(z.get("dec") or z.get("raw") or "").strip()
                              if s:vis.append({"type":z["type"],"text":s,"autoid":z["autoid"],"rect":z["rect"]})
                      meta.append({"i":i,"raw":raw,"dec":decoded,"rect":rect,"visible":vis[:120]})
                  except Exception as e:
                      meta.append({"i":i,"error":repr(e)})
              Path("tabs_runtime.json").write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")

              # Also take whole-window T1/T2 screenshots to expose the value column in the tree.
              snap(m,"03_runtime_t1.png");time.sleep(8);snap(m,"04_runtime_t2.png")
              dump(ui(m),"04_runtime_t2_uia.json")

              src=Path(VAV).parent;dst=Path("native_project_snapshot")/src.name
              if dst.exists():shutil.rmtree(dst)
              shutil.copytree(src,dst)
              Path("inspect_result.txt").write_text("SIMULATION_MODE=PASS\nAUTH_DIALOGS_HANDLED="+str(n_auth)+"\nTABS="+str(len(tabs))+"\n",encoding="utf-8")
          except Exception:
              log.append("FATAL\n"+traceback.format_exc());raise
          finally:
              Path("run_log.txt").write_text("\n".join(log),encoding="utf-8");kill()
          '@ | Set-Content inspect.py -Encoding UTF8
          python inspect.py

      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada35-level-runtime-inspect-7341100
          path: |
            inspect_result.txt
            auth_count.txt
            tabs_runtime.json
            01_configured.png
            02_simulation_clean.png
            02_simulation_clean_uia.json
            03_runtime_t1.png
            04_runtime_t2.png
            04_runtime_t2_uia.json
            auth_*.png
            auth_*_uia.json
            tab_*.png
            tab_*_uia.json
            run_log.txt
            native_project_snapshot/**
          if-no-files-found: warn
