name: MasterSCADA 3.5 native recursive calculation proof 7341100

on:
  push:
    branches: [tmp-masterscada-7341100]

jobs:
  calc-proof:
    runs-on: windows-2025
    timeout-minutes: 18
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/cache/restore@v4
        with:
          path: C:\Temp\MasterSCADA35
          key: masterscada-demo-3.5.0-msi-v2

      - name: Install MasterSCADA 3.5
        shell: pwsh
        run: |
          Copy-Item C:\Temp\MasterSCADA35\data.msi . -Force
          Copy-Item C:\Temp\MasterSCADA35\Data1.cab . -Force
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress') -PassThru -Wait
          if($p.ExitCode -ne 0){throw "MSI failed $($p.ExitCode)"}

      - name: Restore stable native checkpoint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $h -Uri "https://api.github.com/repos/Damirinho9/New-repository/actions/artifacts/15227142597/zip" -OutFile known.zip
          Expand-Archive known.zip -DestinationPath known -Force
          $v=Get-ChildItem known -Recurse -Filter "7341100_MasterSCADA_Lab7.vav"|Select-Object -First 1
          if(!$v){throw "VAV missing"}
          $d="C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7"
          New-Item -ItemType Directory $d -Force|Out-Null
          Copy-Item $v.FullName "$d\7341100_MasterSCADA_Lab7.vav" -Force

      - name: Configure recursive native Calculation and observe it in Debug
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto pillow psutil pyautogui
          @'
          from pathlib import Path
          from pywinauto import Desktop,Application
          import pyautogui,time,json,traceback,psutil,shutil

          EXE=r"C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          VAV=r"C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7\7341100_MasterSCADA_Lab7.vav"
          log=[]

          def dec(s):
              try:return s.encode("cp1252").decode("cp1251")
              except:return s
          def kill():
              for p in psutil.process_iter(["name"]):
                  try:
                      if p.info["name"] and "masterscada" in p.info["name"].lower():p.kill()
                  except:pass
          def w32(pid=None):return Desktop(backend="win32").windows(process=pid) if pid else Desktop(backend="win32").windows()
          def main(pid):
              for w in w32(pid):
                  try:
                      if w.is_visible() and w.window_text().startswith("MasterSCADA"):return w
                  except:pass
          def dialogs(pid):return [w for w in w32(pid) if w.class_name()=="#32770" and w.is_visible()]
          def ui(m):return Desktop(backend="uia").window(handle=m.handle)
          def snap(w,p):
              try:w.capture_as_image().save(p);log.append("SHOT "+p)
              except Exception as e:log.append("SHOTERR "+p+" "+repr(e))
          def dump(w,p):
              rows=[]
              for i,x in enumerate(w.descendants()):
                  try:rows.append({"i":i,"type":x.element_info.control_type,"raw":x.window_text(),"dec":dec(x.window_text()),"autoid":x.element_info.automation_id,"class":x.element_info.class_name,"rect":str(x.rectangle()),"enabled":x.is_enabled(),"visible":x.is_visible()})
                  except:pass
              Path(p).write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
              return rows
          def open_editor():
              app=Application(backend="win32").start(EXE);pid=app.process;time.sleep(8)
              ds=dialogs(pid)
              if not ds:raise RuntimeError("startup dialog missing")
              d=ds[0];r=d.rectangle()
              pyautogui.click(r.left+200,r.top+48);time.sleep(1.5)
              d=dialogs(pid)[0];pyautogui.click(r.left+180,r.top+90);time.sleep(.5)
              ok=None
              for b in d.descendants():
                  try:
                      if b.class_name()=="Button" and b.window_text().strip().upper()=="OK" and b.is_enabled():ok=b;break
                  except:pass
              if not ok:raise RuntimeError("startup OK missing")
              ok.click_input()
              end=time.time()+45
              while time.time()<end:
                  time.sleep(1)
                  for dd in dialogs(pid):
                      try:dd.type_keys("{ENTER}")
                      except:pass
                  m=main(pid)
                  if m and "7341100_MasterSCADA_Lab7" in m.window_text():return pid,m
              raise RuntimeError("open timeout")
          def expand(m):
              for nm in ["Объект","Объект 1"]:
                  for x in ui(m).descendants(control_type="TreeItem"):
                      try:
                          if dec(x.window_text()).strip()==nm:
                              try:x.expand()
                              except:
                                  try:x.double_click_input()
                                  except:pass
                              time.sleep(.5);break
                      except:pass
          def item(m,nm):
              for x in ui(m).descendants(control_type="TreeItem"):
                  try:
                      if dec(x.window_text()).strip()==nm:return x
                  except:pass
          def rename(m,it,newname):
              it.click_input();time.sleep(.3);m.type_keys("{F2}");time.sleep(.4)
              edits=[]
              for c in m.descendants():
                  try:
                      if c.class_name()=="Edit" and c.is_visible(): edits.append(c)
                  except:pass
              if not edits:raise RuntimeError("rename edit missing for "+newname)
              ed=edits[-1];ed.set_edit_text(newname);ed.type_keys("{ENTER}");time.sleep(.8)
          def formula_tab(m):
              # Known formula tab position from prior native probe.
              r=m.rectangle(); pyautogui.click(r.left+590,r.top+88);time.sleep(1.5)
          def find_auth():
              for w in Desktop(backend="uia").windows():
                  try:
                      if not w.is_visible():continue
                      aids={x.element_info.automation_id for x in w.descendants()}
                      if "textBoxPassword" in aids and "buttonOK" in aids:return w
                  except:pass
          def clear_auth():
              n=0
              for _ in range(8):
                  a=find_auth()
                  if not a:time.sleep(.7);a=find_auth()
                  if not a:return n
                  n+=1;name=pwd=ok=None
                  for x in a.descendants():
                      try:
                          aid=x.element_info.automation_id;typ=x.element_info.control_type
                          if aid=="1001" and typ=="Edit":name=x
                          elif aid=="textBoxPassword" and typ=="Edit":pwd=x
                          elif aid=="buttonOK" and typ=="Button":ok=x
                      except:pass
                  if not(name and pwd and ok):raise RuntimeError("auth controls missing")
                  name.set_edit_text("sa");pwd.set_edit_text("");ok.click_input();time.sleep(2)
              return n
          def close_messages(pid):
              for _ in range(5):
                  changed=False
                  for d in dialogs(pid):
                      try:
                          btn=None
                          for c in d.descendants():
                              if c.class_name()=="Button" and c.control_id()==1:btn=c;break
                          if btn:btn.click_input();time.sleep(1);changed=True;break
                      except:pass
                  if not changed:break
          def mode(m,label):
              try:m.menu_select("Режим->"+label)
              except:
                  r=m.rectangle();pyautogui.click(r.left+208,r.top+40);time.sleep(.5)
                  n={"Стоп":1,"Пуск":2,"Имитация":3,"Отладка":4}[label]
                  pyautogui.press("down",presses=n,interval=.15);pyautogui.press("enter")
              time.sleep(4)
          try:
              pid,m=open_editor();expand(m)
              src=item(m,"Level");calc=item(m,"Расчет 1")
              if not(src and calc):raise RuntimeError("Level or Calculation 1 missing")
              rename(m,src,"LevelSource");expand(m)
              calc=item(m,"Расчет 1")
              rename(m,calc,"Level");expand(m)
              calc=item(m,"Level")
              if not calc:raise RuntimeError("renamed Level calculation missing")
              calc.click_input();time.sleep(.6);formula_tab(m)
              snap(m,"01_formula_empty.png")
              # Drag calculation itself into formula variable table for recursive previous-value access.
              calc=item(m,"Level")
              rr=calc.rectangle();sx=(rr.left+rr.right)//2;sy=(rr.top+rr.bottom)//2
              pyautogui.moveTo(sx,sy);pyautogui.dragTo(650,320,duration=1.0,button="left");time.sleep(2)
              snap(m,"02_formula_self_variable.png")
              # Set native formula.
              edits=[c for c in m.descendants() if c.class_name()=="Edit" and c.is_visible() and c.control_id()==206]
              if not edits:raise RuntimeError("formula edit control id 206 missing")
              edits[0].set_edit_text("Level + 1")
              time.sleep(1)
              snap(m,"03_formula_level_plus_one.png")
              # Inspect formula variable list and save.
              lists=[c for c in m.descendants() if c.class_name()=="SysListView32" and c.control_id()==202]
              listrows=[]
              if lists:
                  try:
                      for i in range(lists[0].item_count()):
                          it=lists[0].get_item(i);listrows.append(it.texts())
                  except Exception as e:listrows.append(["ERR",repr(e)])
              Path("formula_variables.json").write_text(json.dumps(listrows,ensure_ascii=False,indent=2),encoding="utf-8")
              m.set_focus();m.type_keys("^s");time.sleep(4)
              # Reopen formula after save to prove persistence.
              calc=item(m,"Level");calc.click_input();formula_tab(m);time.sleep(1)
              edits=[c for c in m.descendants() if c.class_name()=="Edit" and c.is_visible() and c.control_id()==206]
              formula=edits[0].window_text() if edits else ""
              Path("formula_persistence.txt").write_text("FORMULA="+formula+"\n",encoding="utf-8")
              if "Level" not in formula or "+ 1" not in formula.replace("  "," "):
                  raise RuntimeError("formula did not persist: "+repr(formula))

              mode(m,"Отладка")
              na=clear_auth();time.sleep(2);m=main(pid)
              if not m:raise RuntimeError("debug main missing")
              close_messages(pid);time.sleep(1);m=main(pid);expand(m)
              lv=item(m,"Level")
              if lv:lv.click_input()
              snap(m,"04_calc_debug_t1.png");dump(ui(m),"04_calc_debug_t1_uia.json")
              t1=time.time();time.sleep(8)
              m=main(pid);expand(m);lv=item(m,"Level")
              if lv:lv.click_input()
              snap(m,"05_calc_debug_t2.png");dump(ui(m),"05_calc_debug_t2_uia.json")
              t2=time.time()
              Path("calc_debug_result.txt").write_text("CALC_DEBUG=PASS\nAUTH_DIALOGS_HANDLED="+str(na)+"\nT1="+str(t1)+"\nT2="+str(t2)+"\n",encoding="utf-8")
              srcdir=Path(VAV).parent;dst=Path("native_project_snapshot")/srcdir.name
              if dst.exists():shutil.rmtree(dst)
              shutil.copytree(srcdir,dst)
          except Exception:
              log.append("FATAL\n"+traceback.format_exc());raise
          finally:
              Path("run_log.txt").write_text("\n".join(log),encoding="utf-8");kill()
          '@ | Set-Content calc_probe.py -Encoding UTF8
          python calc_probe.py

      - name: Upload native calculation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada35-native-calc-proof-7341100
          path: |
            formula_variables.json
            formula_persistence.txt
            calc_debug_result.txt
            01_formula_empty.png
            02_formula_self_variable.png
            03_formula_level_plus_one.png
            04_calc_debug_t1.png
            04_calc_debug_t1_uia.json
            05_calc_debug_t2.png
            05_calc_debug_t2_uia.json
            run_log.txt
            native_project_snapshot/**
          if-no-files-found: warn
