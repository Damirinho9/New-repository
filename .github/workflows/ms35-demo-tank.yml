name: MasterSCADA 3.5 native Demo tank
on:
  push:
    branches: [tmp-ms35-demo]
jobs:
  demo:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Install MasterSCADA 3.5 Demo
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $b="https://download.mps-soft.ru/demo/Old%20Demo/3.5"
          curl.exe -k -L --fail "$b/data.msi" -o data.msi
          curl.exe -k -L --fail "$b/Data1.cab" -o Data1.cab
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress','/L*V',('"' + (Join-Path $PWD 'install.log') + '"')) -PassThru -Wait
          if($p.ExitCode -ne 0){throw "MSI failed $($p.ExitCode)"}
          python -m pip install --disable-pip-version-check pywinauto pillow pyautogui
      - name: Copy and open official Demo tank
        shell: pwsh
        run: |
          $src="C:\MasterSCADA Projects\Projects\Tutorials\Demo_Бак"
          if(!(Test-Path $src)){ throw "Demo_Бак missing" }
          Copy-Item -LiteralPath $src -Destination (Join-Path $PWD "Demo_Бак") -Recurse -Force
          Compress-Archive -Path (Join-Path $PWD "Demo_Бак\*") -DestinationPath Demo_Bak_native.zip -Force
          Get-ChildItem -LiteralPath $src -Recurse -File | Select FullName,Length,LastWriteTime | Format-Table -AutoSize | Out-File demo_files.txt -Width 600

          @'
          from pywinauto import Application, Desktop, keyboard
          from pathlib import Path
          import time, traceback, pyautogui, os
          log=[]
          exe=r"C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          proj=r"C:\MasterSCADA Projects\Projects\Tutorials\Demo_Бак\Demo_Бак.vav"
          try:
              app=Application(backend="win32").start(f'"{exe}" "{proj}"')
              time.sleep(25)
              pyautogui.screenshot("demo_editor_desktop.png")
              for w in Desktop(backend="win32").windows():
                  try:
                      t=w.window_text()
                      log.append(f"EDITOR {w.handle} {w.class_name()} {t!r}")
                      if "MasterSCADA" in t:
                          try: w.capture_as_image().save("demo_editor_window.png")
                          except Exception as e: log.append("EDCAP "+repr(e))
                  except: pass
              # Try standard F5 execution command.
              keyboard.send_keys("{F5}")
              time.sleep(25)
              pyautogui.screenshot("demo_after_f5_desktop.png")
              for w in Desktop(backend="win32").windows():
                  try:
                      t=w.window_text()
                      log.append(f"F5 {w.handle} {w.class_name()} {t!r}")
                      if t and ("Master" in t or "Demo" in t or "Бак" in t):
                          try: w.capture_as_image().save("runtime_candidate_"+str(w.handle)+".png")
                          except: pass
                  except: pass
          except Exception:
              log.append(traceback.format_exc())
          Path("demo_gui_log.txt").write_text("\n".join(log),encoding="utf-8")
          '@ | Set-Content demo_probe.py -Encoding UTF8
          python demo_probe.py
          Get-CimInstance Win32_Process | Where-Object {$_.Name -match 'MasterSCADA|MasterRT|RT'} | Select ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Format-List | Out-File demo_processes.txt
          Get-Process | Where-Object {$_.ProcessName -match 'MasterSCADA|MasterRT'} | Stop-Process -Force -ErrorAction SilentlyContinue

          $api="C:\Program Files (x86)\InSAT\MasterSCADA\API\MasterSCADA"
          if(Test-Path $api){
            Compress-Archive -Path ($api+"\*") -DestinationPath MasterSCADA_API.zip -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ms35-native-demo-tank
          path: |
            Demo_Bak_native.zip
            demo_files.txt
            demo_editor_desktop.png
            demo_editor_window.png
            demo_after_f5_desktop.png
            runtime_candidate_*.png
            demo_gui_log.txt
            demo_processes.txt
            MasterSCADA_API.zip
          if-no-files-found: warn
