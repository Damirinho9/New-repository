name: DipTrace direct XML FINAL 7313294
on:
  push:
    branches: [diptrace-native-7313294]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore direct DipTrace PCB XML
        shell: pwsh
        run: |
          $raw=[Convert]::FromBase64String('')
          $ms=[IO.MemoryStream]::new($raw)
          $gz=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
          $fs=[IO.File]::Create("$PWD\7313294_variant12_DIRECT.dipxml")
          $gz.CopyTo($fs); $fs.Dispose(); $gz.Dispose(); $ms.Dispose()
          $sha=(Get-FileHash "$PWD\7313294_variant12_DIRECT.dipxml" -Algorithm SHA256).Hash.ToLowerInvariant()
          $len=(Get-Item "$PWD\7313294_variant12_DIRECT.dipxml").Length
          Write-Host "dipxml size=$len sha=$sha"
          if ($len -ne 190002 -or $sha -ne "00ff2ec22e00e9d81501dadbc11ebaaba23762fbbc42de906e9da5df6b23bf83") { throw "DIPXML payload mismatch" }
      - name: Install official DipTrace Freeware 5.3.5.1
        shell: pwsh
        run: |
          $installer="$env:RUNNER_TEMP\dipfree.exe"
          curl.exe --fail --location --retry 3 --max-time 180 https://diptrace.com/downloads/dipfree_en64.exe --output $installer
          if ($LASTEXITCODE -ne 0) { throw "DipTrace download failed" }
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "8845d6e6e72f9671ea270ac462bd25c0c7794f68a7f4015b88aece980bfb848c") { throw "installer hash mismatch $hash" }
          $p=Start-Process $installer -ArgumentList "/silent","/hide" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "install timeout" }
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
      - name: Install UI automation
        shell: pwsh
        run: py -m pip install pywinauto pillow
      - name: Open direct XML and save native DIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$PWD\direct-native" | Out-Null
          py "$PWD\.github\scripts\direct_xml_to_dip.py" "$PWD\7313294_variant12_DIRECT.dipxml" "$PWD\direct-native\7313294_PhotoGas_MQ4_V12.dip" "$PWD\direct-native"
          Get-Content "$PWD\direct-native\native_conversion.json"
      - name: Native DRC and Net Connectivity after reopen
        shell: pwsh
        run: |
          py "$PWD\.github\scripts\verify_direct_native.py" "$PWD\direct-native\7313294_PhotoGas_MQ4_V12.dip" "$PWD\direct-native"
          Get-Content "$PWD\direct-native\native_checks.json"
      - name: Final native inventory
        if: always()
        shell: pwsh
        run: |
          $dip="$PWD\direct-native\7313294_PhotoGas_MQ4_V12.dip"
          if (Test-Path $dip) {
            $b=[IO.File]::ReadAllBytes($dip)
            $sig=[Text.Encoding]::ASCII.GetString($b,0,[Math]::Min(16,$b.Length))
            $sha=(Get-FileHash $dip -Algorithm SHA256).Hash.ToLowerInvariant()
            "size=$($b.Length)" | Tee-Object "$PWD\direct-native\FINAL_SIGNATURE.txt"
            "signature=$sig" | Tee-Object -Append "$PWD\direct-native\FINAL_SIGNATURE.txt"
            "sha256=$sha" | Tee-Object -Append "$PWD\direct-native\FINAL_SIGNATURE.txt"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7313294-DipTrace-DIRECT-NATIVE-FINAL
          path: |
            7313294_variant12_DIRECT.dipxml
            direct-native
          if-no-files-found: error
          retention-days: 10
