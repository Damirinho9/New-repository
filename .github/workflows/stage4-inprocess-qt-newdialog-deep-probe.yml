name: KOMPAS Stage 4 deep native NewDocumentDialog probe

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-inprocess-qt-newdialog-deep-probe.yml'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime

      - name: Restore exact frozen runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          [ ! -d "$RUNNER_TEMP/runtime/opt/ascon/common" ] || sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common

      - name: Install compiler Qt headers and host libraries
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-18 libc++-18-dev libc++abi-18-dev libunwind-18-dev qt6-base-dev pkg-config \
            xvfb xauth dbus procps python3 \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxcb-cursor0 libxres1 \
            libxcb-ewmh2 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-util1 libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-composite0 libxcb-shape0 libxv1 libopengl0 libglu1-mesa

      - name: Compile deep Qt probe and preload bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          QTCFLAGS="$(pkg-config --cflags Qt6Widgets)"

          cat >/tmp/deep_probe_writer.cpp <<'CPP'
          #include <KsAPI.h>
          #include <ksConstants.h>
          #include <QtWidgets/QApplication>
          #include <QtWidgets/QWidget>
          #include <QtWidgets/QAbstractButton>
          #include <QtWidgets/QLabel>
          #include <QtWidgets/QAbstractItemView>
          #include <QtWidgets/QComboBox>
          #include <QtWidgets/QLineEdit>
          #include <QtGui/QAction>
          #include <QtCore/QAbstractItemModel>
          #include <QtCore/QMetaMethod>
          #include <QtCore/QMetaProperty>
          #include <QtCore/QVariant>
          #include <QtCore/QByteArray>
          #include <fstream>
          #include <string>
          #include <set>
          using namespace ksapi;

          static std::ofstream lg("/tmp/qt_newdialog_deep.log",std::ios::out|std::ios::app);
          static int phase=0;
          static void log(const std::string&s){ lg<<s<<std::endl; lg.flush(); }
          static std::string u8(const QString&s){ auto b=s.toUtf8(); return std::string(b.constData(),(size_t)b.size()); }
          static std::string b8(const QByteArray&b){ return std::string(b.constData(),(size_t)b.size()); }
          static std::string vstr(const QVariant&v){
            if(!v.isValid()) return "<invalid>";
            QString s=v.toString();
            return std::string(v.typeName()?v.typeName():"?")+":"+u8(s);
          }
          static std::string cls(QObject*o){ return (o&&o->metaObject())?o->metaObject()->className():""; }

          static void dump_props(QObject*o,const std::string&prefix){
            if(!o) return;
            for(const QByteArray&n:o->dynamicPropertyNames()){
              QVariant v=o->property(n.constData());
              log(prefix+"|DYNPROP|"+b8(n)+"="+vstr(v));
            }
            const QMetaObject*mo=o->metaObject();
            if(!mo) return;
            for(int i=mo->propertyOffset();i<mo->propertyCount();++i){
              QMetaProperty p=mo->property(i);
              if(!p.isReadable()) continue;
              QVariant v=p.read(o);
              log(prefix+"|METAPROP|"+std::string(p.name())+"="+vstr(v));
            }
          }

          static void dump_methods(QObject*o,const std::string&prefix){
            if(!o||!o->metaObject()) return;
            const QMetaObject*mo=o->metaObject();
            log(prefix+"|META|class="+std::string(mo->className())+"|offset="+std::to_string(mo->methodOffset())+"|count="+std::to_string(mo->methodCount()));
            for(int i=mo->methodOffset();i<mo->methodCount();++i){
              QMetaMethod m=mo->method(i);
              log(prefix+"|METHOD|type="+std::to_string((int)m.methodType())+
                  "|access="+std::to_string((int)m.access())+"|sig="+b8(m.methodSignature()));
            }
          }

          static void dump_model(QAbstractItemView*view,const std::string&prefix){
            if(!view) return;
            QAbstractItemModel*m=view->model();
            if(!m){ log(prefix+"|MODEL=null"); return; }
            log(prefix+"|MODEL|class="+cls(m)+"|rows="+std::to_string(m->rowCount())+"|cols="+std::to_string(m->columnCount()));
            int rows=std::min(m->rowCount(),100);
            int cols=std::min(m->columnCount(),8);
            for(int r=0;r<rows;++r){
              for(int c=0;c<cols;++c){
                QModelIndex ix=m->index(r,c);
                if(!ix.isValid()) continue;
                std::string line=prefix+"|ITEM|r="+std::to_string(r)+"|c="+std::to_string(c);
                const int roles[]={Qt::DisplayRole,Qt::DecorationRole,Qt::EditRole,Qt::ToolTipRole,Qt::StatusTipRole,Qt::WhatsThisRole,Qt::UserRole,
                                   Qt::UserRole+1,Qt::UserRole+2,Qt::UserRole+3,Qt::UserRole+4,Qt::UserRole+5,Qt::UserRole+6,Qt::UserRole+7,Qt::UserRole+8,
                                   Qt::UserRole+9,Qt::UserRole+10,Qt::UserRole+11,Qt::UserRole+12,Qt::UserRole+13,Qt::UserRole+14,Qt::UserRole+15};
                for(int role:roles){
                  QVariant v=m->data(ix,role);
                  if(v.isValid() && (!v.toString().isEmpty() || role==Qt::UserRole || role>Qt::UserRole))
                    line+="|role"+std::to_string(role)+"="+vstr(v);
                }
                line+="|flags="+std::to_string((int)m->flags(ix));
                log(line);
              }
            }
            QModelIndex cur=view->currentIndex();
            if(cur.isValid()) log(prefix+"|CURRENT|r="+std::to_string(cur.row())+"|c="+std::to_string(cur.column())+"|display="+vstr(m->data(cur,Qt::DisplayRole)));
          }

          static void dump_dialog(){
            QWidget*dlg=nullptr;
            for(QWidget*w:QApplication::allWidgets()){
              if(w && (w->objectName()=="NewDocumentDialog" || cls(w)=="NewDocumentDialog")) { dlg=w; break; }
            }
            log(std::string("DIALOG_FOUND=")+(dlg?"1":"0"));
            if(!dlg) return;
            log("DIALOG|class="+cls(dlg)+"|obj="+u8(dlg->objectName())+"|title="+u8(dlg->windowTitle())+
                "|visible="+std::to_string(dlg->isVisible())+"|enabled="+std::to_string(dlg->isEnabled())+
                "|geom="+std::to_string(dlg->x())+","+std::to_string(dlg->y())+","+std::to_string(dlg->width())+"x"+std::to_string(dlg->height()));
            dump_props(dlg,"DIALOG");
            dump_methods(dlg,"DIALOG");

            auto children=dlg->findChildren<QWidget*>(QString(),Qt::FindChildrenRecursively);
            log("DIALOG_CHILDREN="+std::to_string(children.size()));
            int n=0;
            for(QWidget*w:children){
              if(!w) continue;
              std::string p="CHILD"+std::to_string(n++);
              std::string extra;
              if(auto*b=qobject_cast<QAbstractButton*>(w))
                extra+="|buttonText="+u8(b->text())+"|checked="+std::to_string(b->isChecked());
              if(auto*l=qobject_cast<QLabel*>(w)) extra+="|labelText="+u8(l->text());
              if(auto*e=qobject_cast<QLineEdit*>(w)) extra+="|lineText="+u8(e->text())+"|placeholder="+u8(e->placeholderText());
              if(auto*cb=qobject_cast<QComboBox*>(w)){
                extra+="|comboCount="+std::to_string(cb->count());
                for(int i=0;i<cb->count()&&i<30;++i) extra+="|combo"+std::to_string(i)+"="+u8(cb->itemText(i));
              }
              log(p+"|class="+cls(w)+"|obj="+u8(w->objectName())+"|title="+u8(w->windowTitle())+
                  "|tooltip="+u8(w->toolTip())+"|status="+u8(w->statusTip())+"|what="+u8(w->whatsThis())+
                  "|acc="+u8(w->accessibleName())+"|visible="+std::to_string(w->isVisible())+
                  "|enabled="+std::to_string(w->isEnabled())+"|geom="+std::to_string(w->x())+","+std::to_string(w->y())+","+
                  std::to_string(w->width())+"x"+std::to_string(w->height())+extra);

              if(auto*view=qobject_cast<QAbstractItemView*>(w)) dump_model(view,p);
              std::string c=cls(w),o=u8(w->objectName());
              if(c=="TemplatesWidget"||c=="TemplatesListWidget"||c=="NewDocumentDialog"||o=="createGroupButton"||o=="listTemplates"){
                dump_props(w,p); dump_methods(w,p);
              }
              for(QAction*a:w->actions()){
                if(!a) continue;
                log(p+"|ACTION|text="+u8(a->text())+"|obj="+u8(a->objectName())+"|tip="+u8(a->toolTip())+
                    "|enabled="+std::to_string(a->isEnabled())+"|visible="+std::to_string(a->isVisible())+
                    "|data="+vstr(a->data()));
              }
            }
          }

          extern "C" int run_variant06_writer(){
            try{
              IApplication& app=GetKompasApplication();
              if(phase==0){
                auto lm=app.GetApplicationLicenseManager();
                log("IN_PROCESS=1");
                log(std::string("LICENSE_2D=")+(lm&&lm->IsKompasModuleActive(ksKompasModule2D)?"1":"0"));
                log(std::string("LICENSE_3D=")+(lm&&lm->IsKompasModuleActive(ksKompasModule3D)?"1":"0"));
                log(std::string("FILE_NEW_ENABLED=")+(app.IsKompasCommandEnable(ksCMFileNew)?"1":"0"));
                log(std::string("FILE_NEW_POSTED=")+(app.ExecuteKompasCommand(ksCMFileNew,true)?"1":"0"));
                phase=1; return 3;
              }
              if(phase==1){
                dump_dialog();
                auto docs=app.GetDocuments();
                log("DOC_COUNT="+std::to_string(docs?docs->GetCount():-1));
                log("RESULT=PASS_QT_NEWDIALOG_DEEP_PROBE");
                phase=2; return 0;
              }
              return 0;
            }catch(const std::exception&e){
              log(std::string("EXCEPTION=")+e.what());
              log("RESULT=FAIL_QT_NEWDIALOG_DEEP_PROBE");
              return 1;
            }catch(...){
              log("EXCEPTION=unknown");
              log("RESULT=FAIL_QT_NEWDIALOG_DEEP_PROBE");
              return 1;
            }
          }
          CPP

          /usr/bin/clang++-18 -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread \
            $QTCFLAGS -I"$INC" /tmp/deep_probe_writer.cpp \
            -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lQt6Widgets -lQt6Gui -lQt6Core -lc++abi \
            -o /tmp/writer_variant06.so

          sed 's/ms(now)-ms(g_start)<30000/ms(now)-ms(g_start)<8000/' \
            kompas-linux/bootstrap_variant06_poll.cpp >/tmp/deep_probe_bootstrap.cpp
          /usr/bin/clang++-18 -std=c++20 -O2 -fPIC -shared -pthread \
            /tmp/deep_probe_bootstrap.cpp -ldl -o /tmp/deep_probe_bootstrap.so

          LD_LIBRARY_PATH="$BIN" ldd /tmp/writer_variant06.so | tee /tmp/deep-writer.ldd
          ! grep -q 'not found' /tmp/deep-writer.ldd

      - name: Probe hidden native NewDocumentDialog deeply
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p result/newdialog-deep
          cat >/tmp/deep_controller.py <<'PY'
          import os,pathlib,time,ksapi
          from constants import constants as c
          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"result/newdialog-deep"
          def save(name,text):(out/name).write_text(text,encoding="utf-8")
          ksapi.SetKompasPath("/opt/ascon/kompas3d-v25/Bin")
          os.environ["LD_PRELOAD"]="/tmp/deep_probe_bootstrap.so"
          app=ksapi.OpenKompasInvisible()
          if not app: raise SystemExit("OpenKompasInvisible null")
          lm=app.GetApplicationLicenseManager()
          save("controller.txt","APP=1\nLICENSE_2D="+str(int(bool(lm and lm.IsKompasModuleActive(c.ksKompasModule2D))))+
               "\nLICENSE_3D="+str(int(bool(lm and lm.IsKompasModuleActive(c.ksKompasModule3D))))+"\n")
          p=pathlib.Path("/tmp/qt_newdialog_deep.log")
          for _ in range(140):
              try: app.PumpWaitingMessages()
              except BaseException: pass
              if p.exists() and "RESULT=" in p.read_text(errors="replace"): break
              time.sleep(.5)
          if p.exists(): save("deep.log",p.read_text(errors="replace"))
          b=pathlib.Path("/tmp/work1_bootstrap.log")
          if b.exists(): save("bootstrap.log",b.read_text(errors="replace"))
          try: app.Quit()
          except BaseException: pass
          PY

          BIN=/opt/ascon/kompas3d-v25/Bin
          HOST_HOME="$RUNNER_TEMP/newdialog-deep-home"
          HOST_XDG="$HOST_HOME/.config"
          mkdir -p "$HOST_XDG/ascon/KOMPAS-3D Invisible/25"
          RES=$(find "$BIN" -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$HOST_XDG/ascon/KOMPAS-3D Invisible/25/QtResources.bin"
          rm -f /tmp/qt_newdialog_deep.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
          unset LD_PRELOAD HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy

          timeout 120s xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            dbus-run-session -- env PYTHONPATH="$BIN" LD_LIBRARY_PATH="$BIN" \
              HOME="$HOST_HOME" XDG_CONFIG_HOME="$HOST_XDG" QT_QPA_PLATFORM=xcb \
              LIBGL_ALWAYS_SOFTWARE=1 LC_ALL=C.UTF-8 \
              python3 -u /tmp/deep_controller.py \
            >result/newdialog-deep/stdout.txt 2>result/newdialog-deep/stderr.txt || true

          cp /tmp/qt_newdialog_deep.log result/newdialog-deep/deep.log 2>/dev/null || true
          cp /tmp/work1_bootstrap.log result/newdialog-deep/bootstrap.log 2>/dev/null || true
          cat result/newdialog-deep/controller.txt || true
          grep -E '^(IN_PROCESS|LICENSE_|FILE_NEW_|DIALOG|CHILD|DOC_COUNT|RESULT=)' result/newdialog-deep/deep.log || true
          cat result/newdialog-deep/stderr.txt || true
          grep -qx 'RESULT=PASS_QT_NEWDIALOG_DEEP_PROBE' result/newdialog-deep/deep.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-newdialog-deep-probe
          retention-days: 90
          if-no-files-found: ignore
          path: result/newdialog-deep/**
