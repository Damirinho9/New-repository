name: MasterSCADA 7341268 Windows prep

on:
  push:
    branches:
      - masterscada-7341268-windows
    paths:
      - ".github/workflows/masterscada-7341268.yml"
      - "masterscada-7341268/**"
  workflow_dispatch:

jobs:
  inspect-download:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare folders
        shell: pwsh
        run: |
          $root = "C:\MasterSCADA_7341268"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\masterscada-7341268" | Out-Null
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\installer" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\project\Variant7" | Out-Null
          "root=$root" | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\environment.txt"
          "project=$root\project\Variant7" | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\environment.txt"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture | Format-List | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\windows-info.txt"

      - name: Inspect DropMeFiles share page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://dropmefiles.com/vTTWo"
          $out = "$env:GITHUB_WORKSPACE\masterscada-7341268\dropmefiles-page.html"
          $headers = @{
            "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/141.0 Safari/537.36"
            "Accept-Language" = "ru-RU,ru;q=0.9,en;q=0.8"
          }
          try {
            $r = Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing -MaximumRedirection 10
            $r.Content | Out-File -Encoding utf8 $out
            "HTTP=$($r.StatusCode)" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\masterscada-7341268\download-diagnostics.txt"
            "Length=$($r.Content.Length)" | Tee-Object -Append -FilePath "$env:GITHUB_WORKSPACE\masterscada-7341268\download-diagnostics.txt"
            "FinalUri=$($r.BaseResponse.RequestMessage.RequestUri.AbsoluteUri)" | Tee-Object -Append -FilePath "$env:GITHUB_WORKSPACE\masterscada-7341268\download-diagnostics.txt"
            $patterns = @(
              'UPLOADID.{0,120}',
              'UFILES.{0,120}',
              'fileDownload.{0,200}',
              'DSERVERURL.{0,160}',
              'SERVERURL.{0,160}',
              'vTTWo.{0,160}',
              '\.(rar|zip|7z|exe|msi).{0,160}'
            )
            foreach ($p in $patterns) {
              "=== PATTERN: $p ===" | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\download-diagnostics.txt"
              [regex]::Matches($r.Content, $p, [Text.RegularExpressions.RegexOptions]::IgnoreCase) |
                Select-Object -First 30 |
                ForEach-Object { $_.Value } |
                Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\download-diagnostics.txt"
            }
          } catch {
            "ERROR=$($_.Exception.ToString())" | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\download-diagnostics.txt"
            throw
          }

      - name: Inspect official MasterSCADA 3.11 archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.mps-soft.ru/demo/Old%20Demo/3.11/"
          $html = "$env:GITHUB_WORKSPACE\masterscada-7341268\official-311.html"
          & curl.exe -k -L --fail --silent --show-error $url -o $html
          $content = Get-Content -Raw $html
          "OFFICIAL_LENGTH=$($content.Length)" | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\official-311.txt"
          [regex]::Matches($content, 'href="([^"]+)"') | ForEach-Object {
            $_.Groups[1].Value
          } | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\official-311.txt"

      - name: Download exact MasterSCADA 3.11 installer set
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://download.mps-soft.ru/demo/Old%20Demo/3.11/"
          $dest = "C:\MasterSCADA_7341268\installer"
          foreach ($name in @("Data1.cab","checksum.md5","data.msi","setup.bmp","setup.exe")) {
            Write-Host "Downloading $name"
            & curl.exe -k -L --fail --silent --show-error ($base + $name) -o (Join-Path $dest $name)
            if ($LASTEXITCODE -ne 0) { throw "curl failed for $name" }
          }
          Get-ChildItem $dest | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize |
            Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\installer-files.txt"
          Get-Content (Join-Path $dest "checksum.md5") |
            Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\official-checksum.md5"
          Get-FileHash (Join-Path $dest "Data1.cab") -Algorithm MD5 |
            Format-List | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\hash-data1.txt"
          Get-FileHash (Join-Path $dest "data.msi") -Algorithm MD5 |
            Format-List | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\hash-msi.txt"
          Get-FileHash (Join-Path $dest "setup.exe") -Algorithm MD5 |
            Format-List | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\hash-setup.txt"

      - name: Install MasterSCADA 3.11 from MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "C:\MasterSCADA_7341268\installer"
          $log = "$env:GITHUB_WORKSPACE\masterscada-7341268\msi-install.log"
          $args = @("/i", (Join-Path $dest "data.msi"), "/qn", "/norestart", "/L*v", $log)
          $p = Start-Process -FilePath "msiexec.exe" -ArgumentList $args -Wait -PassThru
          "MSI_EXIT_CODE=$($p.ExitCode)" | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\install-status.txt"
          if ($p.ExitCode -notin @(0,3010,1641)) {
            throw "MasterSCADA MSI install failed with exit code $($p.ExitCode)"
          }

      - name: Inventory installed MasterSCADA files and create project folder
        if: always()
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\masterscada-7341268\installed-files.txt"
          $roots = @("C:\Program Files (x86)\InSAT\MasterSCADA","C:\Program Files\InSAT\MasterSCADA","C:\MasterSCADA Projects")
          foreach ($r in $roots) {
            "=== $r ===" | Add-Content -Encoding utf8 $out
            if (Test-Path $r) {
              Get-ChildItem $r -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Extension -in @(".exe",".dll",".vav",".xml",".ini",".config") } |
                ForEach-Object {
                  $v = $_.VersionInfo.FileVersion
                  "$($_.FullName)`t$v`t$($_.Length)"
                } | Add-Content -Encoding utf8 $out
            } else {
              "MISSING" | Add-Content -Encoding utf8 $out
            }
          }
          $project = "C:\MasterSCADA Projects\7341268_Variant7"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          "PROJECT_FOLDER=$project" | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268\install-status.txt"

      - name: Resolve MasterSCADA executables shortcuts and VAV association
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $baseOut = "$env:GITHUB_WORKSPACE\masterscada-7341268"
          $install = "C:\Program Files (x86)\InSAT\MasterSCADA"
          $exeOut = Join-Path $baseOut "master-exes.txt"
          if (Test-Path $install) {
            Get-ChildItem $install -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              ForEach-Object {
                $vi = $_.VersionInfo
                "$($_.FullName)`tFileVersion=$($vi.FileVersion)`tProductVersion=$($vi.ProductVersion)`tProduct=$($vi.ProductName)"
              } | Out-File -Encoding utf8 $exeOut
          } else {
            "INSTALL_PATH_MISSING=$install" | Out-File -Encoding utf8 $exeOut
          }

          $shortcutOut = Join-Path $baseOut "shortcuts.txt"
          $shell = New-Object -ComObject WScript.Shell
          $shortcutRoots = @(
            "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\MasterSCADA",
            "C:\ProgramData\Microsoft\Windows\Start Menu\Programs",
            "$env:APPDATA\Microsoft\Windows\Start Menu\Programs"
          )
          foreach ($sr in $shortcutRoots) {
            if (Test-Path $sr) {
              Get-ChildItem $sr -Recurse -Filter *.lnk -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "MasterSCADA|InSAT|Мастер" } |
                ForEach-Object {
                  $s = $shell.CreateShortcut($_.FullName)
                  "LINK=$($_.FullName)`nTARGET=$($s.TargetPath)`nARGS=$($s.Arguments)`nWORKDIR=$($s.WorkingDirectory)`n---"
                } | Add-Content -Encoding utf8 $shortcutOut
            }
          }

          $assocOut = Join-Path $baseOut "vav-association.txt"
          cmd /c "assoc .vav" 2>&1 | Out-File -Encoding utf8 $assocOut
          $assoc = (cmd /c "assoc .vav" 2>$null)
          if ($assoc -match "=(.+)$") {
            $ft = $Matches[1].Trim()
            cmd /c "ftype $ft" 2>&1 | Add-Content -Encoding utf8 $assocOut
          }
          Get-ChildItem "Registry::HKEY_CLASSES_ROOT" -ErrorAction SilentlyContinue |
            Where-Object { $_.PSChildName -match "vav|MasterSCADA" } |
            ForEach-Object {
              "REG=$($_.Name)" | Add-Content -Encoding utf8 $assocOut
              try { Get-ItemProperty $_.PSPath | Format-List * | Out-String | Add-Content -Encoding utf8 $assocOut } catch {}
            }

          $vavOut = Join-Path $baseOut "installed-vav-projects.txt"
          Get-ChildItem "C:\MasterSCADA Projects" -Recurse -Filter *.vav -File -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName |
            Out-File -Encoding utf8 $vavOut

      - name: Launch MasterSCADA development environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:GITHUB_WORKSPACE\masterscada-7341268\launch-editor.txt"
          $exe = "C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          if (!(Test-Path $exe)) { throw "MasterSCADA.exe not found at $exe" }
          $vi = (Get-Item $exe).VersionInfo
          "EXE=$exe" | Out-File -Encoding utf8 $out
          "FILE_VERSION=$($vi.FileVersion)" | Add-Content -Encoding utf8 $out
          "PRODUCT_VERSION=$($vi.ProductVersion)" | Add-Content -Encoding utf8 $out
          $before = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "*\InSAT\MasterSCADA\*" } | Select-Object -ExpandProperty ProcessId)
          $p = Start-Process -FilePath $exe -PassThru
          "START_PID=$($p.Id)" | Add-Content -Encoding utf8 $out
          Start-Sleep -Seconds 12
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "*\InSAT\MasterSCADA\*" })
          foreach ($rp in $running) {
            "RUNNING_PID=$($rp.ProcessId)`tNAME=$($rp.Name)`tPATH=$($rp.ExecutablePath)`tCMD=$($rp.CommandLine)" |
              Add-Content -Encoding utf8 $out
          }
          if ($running.Count -eq 0) {
            "EDITOR_RUNNING=false" | Add-Content -Encoding utf8 $out
            throw "No MasterSCADA process remained running after launch"
          }
          "EDITOR_RUNNING=true" | Add-Content -Encoding utf8 $out
          foreach ($rp in $running) {
            try { Stop-Process -Id $rp.ProcessId -Force -ErrorAction SilentlyContinue } catch {}
          }

      - name: Open an installed native VAV project in MasterSCADA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:GITHUB_WORKSPACE\masterscada-7341268\launch-vav.txt"
          $exe = "C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          $demo = Get-ChildItem "C:\MasterSCADA Projects" -Recurse -Filter *.vav -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $demo) { throw "No installed tutorial .vav project found" }
          "VAV=$($demo.FullName)" | Out-File -Encoding utf8 $out
          "VAV_SIZE=$($demo.Length)" | Add-Content -Encoding utf8 $out
          $p = Start-Process -FilePath $exe -ArgumentList @($demo.FullName) -PassThru
          "START_PID=$($p.Id)" | Add-Content -Encoding utf8 $out
          Start-Sleep -Seconds 15
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like "*\InSAT\MasterSCADA\*" })
          foreach ($rp in $running) {
            "RUNNING_PID=$($rp.ProcessId)`tNAME=$($rp.Name)`tPATH=$($rp.ExecutablePath)`tCMD=$($rp.CommandLine)" |
              Add-Content -Encoding utf8 $out
          }
          if ($running.Count -eq 0) {
            "VAV_OPEN_RUNNING=false" | Add-Content -Encoding utf8 $out
            throw "MasterSCADA did not remain running with native VAV project"
          }
          "VAV_OPEN_RUNNING=true" | Add-Content -Encoding utf8 $out
          foreach ($rp in $running) {
            try { Stop-Process -Id $rp.ProcessId -Force -ErrorAction SilentlyContinue } catch {}
          }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada-7341268-download-diagnostics
          path: |
            masterscada-7341268/environment.txt
            masterscada-7341268/windows-info.txt
            masterscada-7341268/download-diagnostics.txt
            masterscada-7341268/dropmefiles-page.html
            masterscada-7341268/official-311.txt
            masterscada-7341268/official-311.html
            masterscada-7341268/installer-files.txt
            masterscada-7341268/official-checksum.md5
            masterscada-7341268/hash-data1.txt
            masterscada-7341268/hash-msi.txt
            masterscada-7341268/hash-setup.txt
            masterscada-7341268/msi-install.log
            masterscada-7341268/install-status.txt
            masterscada-7341268/installed-files.txt
            masterscada-7341268/master-exes.txt
            masterscada-7341268/shortcuts.txt
            masterscada-7341268/vav-association.txt
            masterscada-7341268/installed-vav-projects.txt
            masterscada-7341268/launch-editor.txt
            masterscada-7341268/launch-vav.txt
          if-no-files-found: warn
