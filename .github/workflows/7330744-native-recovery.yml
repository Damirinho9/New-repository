name: Capture real Multisim screenshots for PhotoRelay 7330744
on:
  push:
    branches: [multisim-7330744-native-gui-v2]
    paths: ['.github/workflows/7330744-native-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture-real-multisim:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Open existing native MS14 once and capture real Multisim screenshots
        shell: powershell
        run: ./native-recovery-setup.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7330744-real-multisim-screenshots
          path: native7330744-artifacts/
          retention-days: 7
