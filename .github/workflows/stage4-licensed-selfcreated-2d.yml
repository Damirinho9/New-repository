name: KOMPAS Stage 4 licensed native 2D self-created fragment

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-licensed-selfcreated-2d.yml'

permissions:
  actions: read
  contents: read

jobs:
  native-2d:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime
      - name: Restore exact frozen licensed runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          if [ -d "$RUNNER_TEMP/runtime/opt/ascon/common" ]; then sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common; fi
          SYSROOT="$RUNNER_TEMP/runtime/system-libs"
          SYS_LD=$(find "$SYSROOT" -type f -printf '%h\n' | sort -u | paste -sd: -)
          echo "KOMPAS_SYS_LD=$SYS_LD" >> "$GITHUB_ENV"
      - name: Install compiler and host libraries only
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb dbus g++ clang libxcb-res0 libxcb-dri2-0 libxcb-xkb1
          CXXV1=$(find /usr/include /usr/lib/llvm-* -path '*/c++/v1/memory' -print -quit 2>/dev/null || true)
          if [ -z "$CXXV1" ]; then
            for v in 22 21 20 19 18; do
              if apt-cache show "libc++-$v-dev" >/dev/null 2>&1 && apt-cache show "libc++abi-$v-dev" >/dev/null 2>&1; then
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "libc++-$v-dev" "libc++abi-$v-dev"
                break
              fi
            done
          fi
      - name: Compile current variant-06 native writer and main-loop bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          CXXV1=$(find /usr/include /usr/lib/llvm-* -path '*/c++/v1/memory' -print -quit 2>/dev/null)
          CXXV1=$(dirname "$CXXV1")
          /usr/bin/clang++ -std=c++20 -stdlib=libc++ -nostdinc++ -I"$CXXV1" -O2 -fPIC -shared -pthread -I"$INC" \
            kompas-linux/writer_variant06.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/writer_variant06.so
          g++ -std=c++20 -O2 -fPIC -shared -pthread kompas-linux/bootstrap_variant06_poll.cpp -ldl -o /tmp/bootstrap_variant06_qt.so
      - name: Let licensed KOMPAS create its own editable FRW
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export HOME="$RUNNER_TEMP/selfcreated-2d-home" XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25" result/stage4-selfcreated-2d
          RES=$(find "$BIN" -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25/QtResources.bin"
          export DISPLAY=:119 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN:$KOMPAS_SYS_LD"
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          sudo mkdir -p /tmp/.X11-unix; sudo chmod 1777 /tmp/.X11-unix
          Xvfb :119 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb119.out 2>/tmp/xvfb119.err &
          XV=$!; trap 'kill "$XV" 2>/dev/null || true' EXIT
          sleep 2
          test -S /tmp/.X11-unix/X119
          rm -f /tmp/01_Mekhanizm_Variant_06_BASE.frw /tmp/work1_v6_inject.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
          setsid dbus-run-session -- env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" DISPLAY=:119 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$LD_LIBRARY_PATH" LD_PRELOAD=/tmp/bootstrap_variant06_qt.so \
            "$BIN/ksinvisible" -automation >result/stage4-selfcreated-2d/kompas.out 2>result/stage4-selfcreated-2d/kompas.err &
          KP=$!
          ok=0
          for i in $(seq 1 150); do
            sleep 1
            if grep -q '^RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06$' /tmp/work1_v6_inject.log 2>/dev/null; then ok=1; break; fi
            if grep -q '^FAIL 2D license inactive' /tmp/work1_v6_inject.log 2>/dev/null; then break; fi
            if grep -q 'POLL_BOOTSTRAP_RETRY_LIMIT' /tmp/work1_bootstrap.log 2>/dev/null; then break; fi
            kill -0 "$KP" 2>/dev/null || break
          done
          cat /tmp/work1_v6_inject.log 2>/dev/null || true
          cat /tmp/work1_bootstrap.log 2>/dev/null || true
          cp /tmp/work1_v6_inject.log result/stage4-selfcreated-2d/ 2>/dev/null || true
          cp /tmp/work1_bootstrap.log result/stage4-selfcreated-2d/ 2>/dev/null || true
          cp /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw result/stage4-selfcreated-2d/Work1_V06_ParametricMechanism.frw 2>/dev/null || true
          kill -TERM -- "-$KP" 2>/dev/null || true
          wait "$KP" 2>/dev/null || true
          test "$ok" = 1
          test -s result/stage4-selfcreated-2d/Work1_V06_ParametricMechanism.frw
          sha256sum result/stage4-selfcreated-2d/Work1_V06_ParametricMechanism.frw | tee result/stage4-selfcreated-2d/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-selfcreated-native-2d
          retention-days: 90
          if-no-files-found: ignore
          path: result/stage4-selfcreated-2d/**
