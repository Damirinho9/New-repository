name: Inspect KOMPAS Debian package executables

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/inspect-kompas-deb-executables.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kompas-7335493-native-work1
      - name: Install official packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg file
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-v25 ascon-kompas-sdk-v25
      - name: Inspect installed files and executables
        shell: bash
        run: |
          set -euxo pipefail
          for pkg in ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-v25 ascon-kompas-sdk-v25; do
            echo "=== PACKAGE $pkg ==="
            dpkg -L "$pkg" | sort
          done
          echo "=== EXECUTABLE FILES ==="
          find /opt/ascon -type f -perm -111 -print0 | while IFS= read -r -d '' p; do
            printf '%s: ' "$p"
            file -b "$p" || true
          done
          echo "=== BIN ==="
          find /opt/ascon/kompas3d-v25/Bin -maxdepth 1 -type f -printf '%f\n' | sort
          echo RESULT=DEBIAN_EXECUTABLE_INSPECT_PASS
