name: Hexlet KOMPAS-3D API5 Introspection

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas-api5-introspect.yml"
  workflow_dispatch:

jobs:
  api5-introspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg desktop-file-utils xvfb \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p api5_evidence

      - name: Inspect Python bindings and installed SDK for API5
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export PYTHONPATH="$BIN"

          python3 - <<'PY' | tee api5_evidence/ksapi-dir.txt
          import ksapi
          names=[n for n in dir(ksapi) if any(k.lower() in n.lower() for k in [
              'kompas','document2d','document','create','text','paragraph','api5','object'
          ])]
          print("\n".join(sorted(names)))
          for n in sorted(names):
              try:
                  obj=getattr(ksapi,n)
                  print("ATTR",n,repr(obj))
              except Exception as exc:
                  print("ERR",n,type(exc).__name__,str(exc))
          PY

          find /opt/ascon -type f \( -iname '*.py' -o -iname '*.h' -o -iname '*.hpp' -o -iname '*.cpp' -o -iname '*.cxx' \) \
            -print | sort > api5_evidence/sdk-source-files.txt

          grep -RInE 'ksCreateDocument|CreateDocumentW|CreateDocument\(|ksText\(|ksParagraph|ActiveDocument2D|KompasObject|GetKompasObject|Document2D' \
            /opt/ascon 2>/dev/null | head -n 1000 | tee api5_evidence/api5-grep.txt || true

          find /opt/ascon -type f -iname '*sample*' -o -iname '*example*' 2>/dev/null \
            | sort | head -n 500 | tee api5_evidence/examples.txt || true

      - name: Probe live Invisible object interfaces
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export PYTHONPATH="$BIN"
          ln -sf "$BIN/ksinvisible" /tmp/kKompas
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" \
            /tmp/kKompas -automation >api5_evidence/ksinvisible.out 2>api5_evidence/ksinvisible.err &
          WRAP=$!

          for i in $(seq 1 60); do
            sleep 1
            if ss -ltnp 2>/dev/null | grep -q kKompas; then break; fi
          done
          ss -ltnp | grep kKompas | tee api5_evidence/ksinvisible-socket.txt

          python3 - <<'PY' | tee api5_evidence/live-introspection.txt
          import ksapi
          app=ksapi.GetKompas()
          print("APP",app)
          if app is None:
              raise SystemExit("GetKompas=None")
          print("APP_TYPE",type(app))
          print("APP_DIR")
          for n in dir(app):
              if any(k.lower() in n.lower() for k in ['document','active','api','create','object','kompas']):
                  print(n)
          for call in ['ActiveDocument2D','GetActiveDocument','GetDocuments','GetKompasObject','Document2D']:
              try:
                  attr=getattr(app,call)
                  print("ATTR",call,repr(attr))
                  if callable(attr) and call in ['ActiveDocument2D','GetActiveDocument','GetKompasObject']:
                      try: print("CALL",call,repr(attr()))
                      except Exception as exc: print("CALLERR",call,type(exc).__name__,str(exc))
              except Exception as exc:
                  print("NOATTR",call,type(exc).__name__,str(exc))
          PY

          kill "$WRAP" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas-api5-introspection
          path: api5_evidence/
          if-no-files-found: error
