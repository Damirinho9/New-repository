name: Hexlet 7344445 KOMPAS GUI EULA API Recovery

on:
  push:
    branches:
      - hexlet-7344445-native-recovery
    paths:
      - ".github/workflows/hexlet-7344445-kompas-gui-api-after-eula.yml"
      - "hexlet_7344445/native_recovery/recover_kompas.py"
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 GUI + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb desktop-file-utils xdotool imagemagick libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p hexlet_7344445/native_recovery/kompas_gui_api

      - name: Launch full GUI and accept real first-run EULA
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -ac >hexlet_7344445/native_recovery/kompas_gui_api/xvfb.log 2>&1 &
          sleep 2
          kompas-v25 >hexlet_7344445/native_recovery/kompas_gui_api/gui.out 2>hexlet_7344445/native_recovery/kompas_gui_api/gui.err &
          echo $! >hexlet_7344445/native_recovery/kompas_gui_api/pid.txt
          sleep 25
          import -display :99 -window root hexlet_7344445/native_recovery/kompas_gui_api/01_before_eula_accept.png
          # Actual "Принимаю" button observed in native GUI first-run window.
          xdotool mousemove 406 540 click 1
          sleep 8
          import -display :99 -window root hexlet_7344445/native_recovery/kompas_gui_api/02_after_eula_accept.png
          xdotool search --onlyvisible --name 'КОМПАС' getwindowname %@ 2>/dev/null | tee hexlet_7344445/native_recovery/kompas_gui_api/windows.txt || true

      - name: Attach official KsAPI after EULA and create/reopen drawing
        shell: bash
        env:
          DISPLAY: :99
        run: |
          set -euxo pipefail
          export PYTHONPATH=/opt/ascon/kompas3d-v25/Bin
          python3 hexlet_7344445/native_recovery/recover_kompas.py | tee hexlet_7344445/native_recovery/kompas_gui_api/api.log
          import -display :99 -window root hexlet_7344445/native_recovery/kompas_gui_api/03_after_native_drawing.png || true

      - name: Strict native checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'RESULT=PASS_NATIVE_KOMPAS3D_DRAWING_REOPEN' hexlet_7344445/native_recovery/kompas_gui_api/api.log
          test -s 'hexlet_7344445/native_recovery/kompas/Hexlet_KOMPAS3D_Привет_Хекслет.cdw'
          test -s 'hexlet_7344445/native_recovery/kompas/Hexlet_KOMPAS3D_Привет_Хекслет_REOPENED.cdw'
          sha256sum hexlet_7344445/native_recovery/kompas/*.cdw | tee hexlet_7344445/native_recovery/kompas_gui_api/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7344445-kompas-gui-api-after-eula
          path: |
            hexlet_7344445/native_recovery/kompas/
            hexlet_7344445/native_recovery/kompas_gui_api/
          if-no-files-found: warn
