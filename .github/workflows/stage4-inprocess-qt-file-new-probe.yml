name: KOMPAS Stage 4 in-process Qt File New widget probe

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-inprocess-qt-file-new-probe.yml'
      - 'kompas-linux/bootstrap_variant06_poll.cpp'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime

      - name: Restore exact frozen runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          [ ! -d "$RUNNER_TEMP/runtime/opt/ascon/common" ] || sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common

      - name: Install compiler Qt headers and host libraries
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang-18 libc++-18-dev libc++abi-18-dev libunwind-18-dev qt6-base-dev pkg-config \
            xvfb xauth dbus procps python3 \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxcb-cursor0 libxres1 \
            libxcb-ewmh2 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-util1 libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-composite0 libxcb-shape0 libxv1 libopengl0 libglu1-mesa

      - name: Compile Qt introspection writer and preload bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          QTCFLAGS="$(pkg-config --cflags Qt6Widgets)"

          cat >/tmp/qt_probe_writer.cpp <<'CPP'
          #include <KsAPI.h>
          #include <ksConstants.h>
          #include <QtWidgets/QApplication>
          #include <QtWidgets/QWidget>
          #include <QtWidgets/QAbstractButton>
          #include <QtWidgets/QLineEdit>
          #include <QtGui/QAction>
          #include <QtCore/QObject>
          #include <QtCore/QString>
          #include <QtCore/QByteArray>
          #include <fstream>
          #include <string>
          #include <algorithm>
          #include <cctype>
          using namespace ksapi;

          static std::ofstream lg("/tmp/qt_file_new_probe.log",std::ios::out|std::ios::app);
          static void log(const std::string&s){ lg<<s<<std::endl; lg.flush(); }
          static int phase=0;

          static std::string u8(const QString&s){
            QByteArray b=s.toUtf8();
            return std::string(b.constData(),(size_t)b.size());
          }
          static std::string lowascii(std::string s){
            for(char&c:s) if((unsigned char)c<128) c=(char)std::tolower((unsigned char)c);
            return s;
          }
          static bool interesting(const std::string&s){
            auto q=lowascii(s);
            static const char* words[]={"new","create","fragment","drawing","part","assembly","template",
              "фраг","черт","детал","сбор","созд","шаблон"};
            for(auto*w:words) if(q.find(w)!=std::string::npos) return true;
            return false;
          }
          static void dump_widgets(const char*tag){
            auto *qa=qobject_cast<QApplication*>(QCoreApplication::instance());
            log(std::string("QT_APP_")+tag+"="+(qa?"1":"0"));
            if(!qa) return;
            const auto widgets=QApplication::allWidgets();
            log(std::string("QT_WIDGET_COUNT_")+tag+"="+std::to_string(widgets.size()));
            int n=0,buttons=0,actions=0;
            for(QWidget*w:widgets){
              if(!w) continue;
              std::string cls=w->metaObject()?w->metaObject()->className():"";
              std::string obj=u8(w->objectName());
              std::string title=u8(w->windowTitle());
              std::string acc=u8(w->accessibleName());
              std::string text;
              if(auto*b=qobject_cast<QAbstractButton*>(w)){ text=u8(b->text()); ++buttons; }
              std::string joined=cls+"|"+obj+"|"+title+"|"+acc+"|"+text;
              if(interesting(joined) || cls=="TemplatesWidget" || cls=="SearchLine"){
                log("WIDGET|"+std::to_string(n)+"|class="+cls+"|obj="+obj+"|title="+title+
                    "|acc="+acc+"|text="+text+"|visible="+std::to_string(w->isVisible())+
                    "|enabled="+std::to_string(w->isEnabled()));
              }
              const auto aa=w->actions();
              for(QAction*a:aa){
                if(!a) continue;
                ++actions;
                std::string at=u8(a->text()), ao=u8(a->objectName()), ad=u8(a->toolTip());
                std::string all=at+"|"+ao+"|"+ad;
                if(interesting(all))
                  log("ACTION|widget="+cls+"|text="+at+"|obj="+ao+"|tip="+ad+
                      "|enabled="+std::to_string(a->isEnabled())+"|visible="+std::to_string(a->isVisible()));
              }
              ++n;
            }
            log(std::string("QT_BUTTON_COUNT_")+tag+"="+std::to_string(buttons));
            log(std::string("QT_ACTION_REF_COUNT_")+tag+"="+std::to_string(actions));
            const auto tops=QApplication::topLevelWidgets();
            for(QWidget*w:tops){
              if(!w) continue;
              log("TOP|class="+std::string(w->metaObject()?w->metaObject()->className():"")+
                  "|obj="+u8(w->objectName())+"|title="+u8(w->windowTitle())+
                  "|visible="+std::to_string(w->isVisible())+
                  "|size="+std::to_string(w->width())+"x"+std::to_string(w->height()));
            }
          }

          extern "C" int run_variant06_writer(){
            try{
              IApplication& app=GetKompasApplication();
              if(phase==0){
                log("IN_PROCESS=1");
                auto lm=app.GetApplicationLicenseManager();
                log(std::string("LICENSE_2D=")+(lm&&lm->IsKompasModuleActive(ksKompasModule2D)?"1":"0"));
                log(std::string("LICENSE_3D=")+(lm&&lm->IsKompasModuleActive(ksKompasModule3D)?"1":"0"));
                dump_widgets("BEFORE");
                bool en=app.IsKompasCommandEnable(ksCMFileNew);
                log(std::string("FILE_NEW_ENABLED=")+(en?"1":"0"));
                bool ok=en?app.ExecuteKompasCommand(ksCMFileNew,true):false;
                log(std::string("FILE_NEW_POSTED=")+(ok?"1":"0"));
                phase=1;
                return 3;
              }
              if(phase==1){
                dump_widgets("AFTER");
                auto docs=app.GetDocuments();
                log("DOC_COUNT_AFTER="+std::to_string(docs?docs->GetCount():-1));
                log("RESULT=QT_FILE_NEW_WIDGET_PROBE_COMPLETE");
                phase=2;
                return 0;
              }
              return 0;
            }catch(...){
              log("RESULT=FAIL_QT_FILE_NEW_WIDGET_PROBE");
              return 1;
            }
          }
          CPP

          /usr/bin/clang++-18 -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread \
            $QTCFLAGS -I"$INC" /tmp/qt_probe_writer.cpp \
            -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lQt6Widgets -lQt6Gui -lQt6Core -lc++abi \
            -o /tmp/writer_variant06.so

          sed 's/ms(now)-ms(g_start)<30000/ms(now)-ms(g_start)<8000/' \
            kompas-linux/bootstrap_variant06_poll.cpp >/tmp/qt_probe_bootstrap.cpp
          /usr/bin/clang++-18 -std=c++20 -O2 -fPIC -shared -pthread \
            /tmp/qt_probe_bootstrap.cpp -ldl -o /tmp/qt_probe_bootstrap.so

          LD_LIBRARY_PATH="$BIN" ldd /tmp/writer_variant06.so | tee /tmp/qt-writer.ldd
          ! grep -q 'not found' /tmp/qt-writer.ldd

      - name: Start licensed ksinvisible and inspect File New Qt widgets in process
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p result/qt-file-new
          cat >/tmp/qt_controller.py <<'PY'
          import os,pathlib,time,ksapi
          from constants import constants as c
          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"result/qt-file-new"
          def save(name,text):(out/name).write_text(text,encoding="utf-8")
          ksapi.SetKompasPath("/opt/ascon/kompas3d-v25/Bin")
          os.environ["LD_PRELOAD"]="/tmp/qt_probe_bootstrap.so"
          app=ksapi.OpenKompasInvisible()
          if not app: raise SystemExit("OpenKompasInvisible null")
          lm=app.GetApplicationLicenseManager()
          save("controller.txt","APP=1\nLICENSE_2D="+str(int(bool(lm and lm.IsKompasModuleActive(c.ksKompasModule2D))))+
               "\nLICENSE_3D="+str(int(bool(lm and lm.IsKompasModuleActive(c.ksKompasModule3D))))+"\n")
          p=pathlib.Path("/tmp/qt_file_new_probe.log")
          for _ in range(120):
              try: app.PumpWaitingMessages()
              except BaseException: pass
              if p.exists():
                  t=p.read_text(errors="replace")
                  if "RESULT=" in t: break
              time.sleep(.5)
          if p.exists(): save("qt-probe.log",p.read_text(errors="replace"))
          b=pathlib.Path("/tmp/work1_bootstrap.log")
          if b.exists(): save("bootstrap.log",b.read_text(errors="replace"))
          try: app.Quit()
          except BaseException: pass
          PY

          BIN=/opt/ascon/kompas3d-v25/Bin
          HOST_HOME="$RUNNER_TEMP/qt-probe-home"
          HOST_XDG="$HOST_HOME/.config"
          mkdir -p "$HOST_XDG/ascon/KOMPAS-3D Invisible/25"
          RES=$(find "$BIN" -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$HOST_XDG/ascon/KOMPAS-3D Invisible/25/QtResources.bin"
          rm -f /tmp/qt_file_new_probe.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
          unset LD_PRELOAD HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy

          timeout 110s xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render -noreset" \
            dbus-run-session -- env PYTHONPATH="$BIN" LD_LIBRARY_PATH="$BIN" \
              HOME="$HOST_HOME" XDG_CONFIG_HOME="$HOST_XDG" QT_QPA_PLATFORM=xcb \
              LIBGL_ALWAYS_SOFTWARE=1 LC_ALL=C.UTF-8 \
              python3 -u /tmp/qt_controller.py \
            >result/qt-file-new/stdout.txt 2>result/qt-file-new/stderr.txt || true

          cp /tmp/qt_file_new_probe.log result/qt-file-new/qt-probe.log 2>/dev/null || true
          cp /tmp/work1_bootstrap.log result/qt-file-new/bootstrap.log 2>/dev/null || true
          cat result/qt-file-new/controller.txt || true
          cat result/qt-file-new/qt-probe.log || true
          cat result/qt-file-new/bootstrap.log || true
          cat result/qt-file-new/stderr.txt || true
          grep -qx 'RESULT=QT_FILE_NEW_WIDGET_PROBE_COMPLETE' result/qt-file-new/qt-probe.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-inprocess-qt-file-new-probe
          retention-days: 90
          if-no-files-found: ignore
          path: result/qt-file-new/**
