name: MasterSCADA 7341268 Stage 2 Temp Project Probe

on:
  push:
    branches:
      - masterscada-7341268-windows
    paths:
      - ".github/workflows/masterscada-7341268-stage2-temp.yml"
  workflow_dispatch:

jobs:
  temp-project:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare and install MasterSCADA 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\mstemp" | Out-Null
          New-Item -ItemType Directory -Force "C:\MasterSCADA_7341268\installer" | Out-Null
          $base="https://download.mps-soft.ru/demo/Old%20Demo/3.11/"
          $dest="C:\MasterSCADA_7341268\installer"
          foreach($n in @("Data1.cab","data.msi","setup.bmp","setup.exe")){
            & curl.exe -k -L --fail --silent --show-error ($base+$n) -o (Join-Path $dest $n)
            if($LASTEXITCODE -ne 0){throw "download $n failed"}
          }
          $p=Start-Process msiexec.exe -ArgumentList @("/i",(Join-Path $dest "data.msi"),"/qn","/norestart") -Wait -PassThru
          if($p.ExitCode -notin @(0,3010,1641)){throw "MSI $($p.ExitCode)"}

      - name: CreateProjectTemp, recover project object and inspect palette
        shell: pwsh
        run: |
          $ErrorActionPreference="Continue"
          $log="$env:GITHUB_WORKSPACE\mstemp\temp-project.txt"
          $baseProjects="C:\MasterSCADA Projects\Projects"
          $id="7341268_Variant7"
          $folder=Join-Path $baseProjects $id
          if(Test-Path $folder){Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue}
          New-Item -ItemType Directory -Force $folder | Out-Null
          $target=Join-Path $folder "$id.vav"
          $app=$null
          try {
            $app=New-Object -ComObject MasterSCADA.Application
            "COM=true" | Out-File -Encoding utf8 $log
            try {
              $tmp=$app.CreateProjectTemp(1,$baseProjects,$id,"Система водяного отопления - вариант 7","")
              "CREATE_TEMP_RETURN=$tmp" | Add-Content -Encoding utf8 $log
            } catch {
              "CREATE_TEMP_EXCEPTION=$($_.Exception.Message)" | Add-Content -Encoding utf8 $log
            }
            Start-Sleep -Seconds 2
            "TARGET_EXISTS_AFTER_CREATE=$(Test-Path $target)" | Add-Content -Encoding utf8 $log
            if(Test-Path $target){
              $fi=Get-Item $target
              "TARGET_SIZE_AFTER_CREATE=$($fi.Length)" | Add-Content -Encoding utf8 $log
            }

            "PROJECTS_COUNT=$($app.Projects.Count)" | Add-Content -Encoding utf8 $log
            $p=$null
            try {$p=$app.CurrentProject} catch {"CURRENT_PROJECT_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
            if($null -eq $p){
              foreach($key in @($id,"Система водяного отопления - вариант 7",$target,$folder)){
                try {
                  $cand=$app.Projects.Item($key)
                  "PROJECT_ITEM[$key]=$cand" | Add-Content -Encoding utf8 $log
                  if($cand -and $null -eq $p){$p=$cand}
                } catch {"PROJECT_ITEM[$key] ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
              }
            }
            "=== ENUM PROJECTS ===" | Add-Content -Encoding utf8 $log
            try {
              foreach($proj in $app.Projects){
                "ENUM_PROJECT=$proj" | Add-Content -Encoding utf8 $log
                try {"ENUM_NAME=$($proj.Name) ENUM_PATH=$($proj.Path)" | Add-Content -Encoding utf8 $log}catch{}
                if($null -eq $p){$p=$proj}
              }
            } catch {"ENUM_PROJECTS_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
            "PROJECT_RECOVERED=$($null -ne $p)" | Add-Content -Encoding utf8 $log
            if($p){
              "PROJECT_NAME=$($p.Name)" | Add-Content -Encoding utf8 $log
              "PROJECT_PATH=$($p.Path)" | Add-Content -Encoding utf8 $log
              "PROJECT_GUID=$($p.ProjectGUID)" | Add-Content -Encoding utf8 $log
              "COMPUTER_COUNT=$($p.ComputerCount)" | Add-Content -Encoding utf8 $log
              "=== PROJECT MEMBERS ===" | Add-Content -Encoding utf8 $log
              $p | Get-Member -Force | Out-String -Width 320 | Add-Content -Encoding utf8 $log
              foreach($name in @("SystemRoot","SysTree","ObjTree")){
                try{
                  $v=$p.$name
                  "=== $name ===" | Add-Content -Encoding utf8 $log
                  "NAME=$($v.Name) COUNT=$($v.Count) ITEMTYPE=$($v.ItemType) OBJECTTYPE=$($v.ObjectType) FULL=$($v.FullName)" | Add-Content -Encoding utf8 $log
                  $v | Get-Member -Force | Out-String -Width 320 | Add-Content -Encoding utf8 $log
                }catch{"$name ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
              }
              try {$p.Save(); "SAVE_RETURNED=true"|Add-Content -Encoding utf8 $log} catch {"SAVE_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
            }

            "=== OBJPALETTE MEMBERS ===" | Add-Content -Encoding utf8 $log
            try {
              $pal=$app.ObjPalette
              $pal | Get-Member -Force | Out-String -Width 320 | Add-Content -Encoding utf8 $log
              foreach($prop in @("CurrentCategory","SelectedObject","LibraryCount")){
                try{"PAL_$prop=$($pal.$prop)"|Add-Content -Encoding utf8 $log}catch{"PAL_$prop ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
              }
              foreach($name in @("Компьютер","Объект","Переменная","Значение","Computer","Object","Variable","Value")){
                try {
                  $o=$pal.GetObject($name)
                  "PAL_GET[$name]=$o" | Add-Content -Encoding utf8 $log
                  if($o){
                    "PAL_GET[$name]_TYPE=$($o.GetType().FullName)" | Add-Content -Encoding utf8 $log
                    $o | Get-Member -Force | Out-String -Width 320 | Add-Content -Encoding utf8 $log
                    foreach($pr in @("Name","clsid","CLSID","ObjectType","ItemType","DisplayName","ClassInfoObject")){
                      try{"PAL_GET[$name].$pr=$($o.$pr)"|Add-Content -Encoding utf8 $log}catch{}
                    }
                  }
                } catch {"PAL_GET[$name]_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
              }
            } catch {"PALETTE_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}

            "=== PROJECT FOLDER ===" | Add-Content -Encoding utf8 $log
            Get-ChildItem $folder -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {
              "$($_.FullName)`t$($_.Length)"
            } | Add-Content -Encoding utf8 $log

          } finally {
            if($app){
              try{$app.ExitScada()}catch{}
              try{[Runtime.InteropServices.Marshal]::FinalReleaseComObject($app)|Out-Null}catch{}
            }
          }
          Start-Sleep -Seconds 3
          if(Test-Path $target){
            try{"TARGET_SHA256_AFTER_CLOSE=$((Get-FileHash $target -Algorithm SHA256).Hash)" | Add-Content -Encoding utf8 $log}catch{"HASH_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $log}
          }
          $copy="$env:GITHUB_WORKSPACE\mstemp\7341268_Variant7"
          if(Test-Path $copy){Remove-Item $copy -Recurse -Force}
          try {
            Copy-Item $folder $copy -Recurse -Force
            "COPIED_TO_WORKSPACE=$copy" | Add-Content -Encoding utf8 $log
          } catch {
            "COPY_ERROR=$($_.Exception.Message)" | Add-Content -Encoding utf8 $log
          }

      - name: Validate native VAV opens in MasterSCADA
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $target="C:\MasterSCADA Projects\Projects\7341268_Variant7\7341268_Variant7.vav"
          if(!(Test-Path $target)){throw "VAV missing"}
          $exe="C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          $p=Start-Process $exe -ArgumentList @($target) -PassThru
          Start-Sleep -Seconds 10
          $proc=Get-Process -Id $p.Id -ErrorAction SilentlyContinue
          "OPEN_PROCESS_ALIVE=$($null -ne $proc)" | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\mstemp\open-check.txt"
          if($null -eq $proc){throw "MasterSCADA process exited while opening VAV"}
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada-7341268-stage2-temp
          path: mstemp/**
          if-no-files-found: warn
