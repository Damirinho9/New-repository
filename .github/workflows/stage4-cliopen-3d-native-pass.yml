name: KOMPAS Stage 4 CLI-open 3D native mutation and reopen

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-cliopen-3d-native-pass.yml'

permissions:
  actions: read
  contents: read

jobs:
  native3d:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download proven native blank 3D seeds
        uses: actions/download-artifact@v4
        with:
          name: 7335493-native-seed-alt
          path: seed
          run-id: 44489073157
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime

      - name: Verify seed and restore exact frozen licensed runtime
        shell: bash
        run: |
          set -euxo pipefail
          test -s seed/BlankPart.m3d
          test -s seed/BlankAssembly.a3d
          sha256sum seed/*
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          if [ -d "$RUNNER_TEMP/runtime/opt/ascon/common" ]; then sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common; fi
          SYSROOT="$RUNNER_TEMP/runtime/system-libs"
          SYS_LD=$(find "$SYSROOT" -type f -printf '%h\n' | sort -u | paste -sd: -)
          echo "KOMPAS_SYS_LD=$SYS_LD" >> "$GITHUB_ENV"

      - name: Install minimal build and X11 prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xvfb dbus g++ clang libxcb-res0 libxcb-dri2-0 libxcb-xkb1
          CXXV1=$(find /usr/include /usr/lib/llvm-* -path '*/c++/v1/memory' -print -quit 2>/dev/null || true)
          if [ -z "$CXXV1" ]; then
            for v in 22 21 20 19 18; do
              if apt-cache show "libc++-$v-dev" >/dev/null 2>&1 && apt-cache show "libc++abi-$v-dev" >/dev/null 2>&1; then
                sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "libc++-$v-dev" "libc++abi-$v-dev"
                break
              fi
            done
          fi

      - name: Compile CLI-open mutate and reopen verifiers
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          CXXV1=$(find /usr/include /usr/lib/llvm-* -path '*/c++/v1/memory' -print -quit 2>/dev/null)
          CXXV1=$(dirname "$CXXV1")
          cat >/tmp/cli3d_mutate.cpp <<'CPP'
          #include <KsAPI.h>
          #include <ksConstants.h>
          #include <filesystem>
          #include <fstream>
          #include <string>
          using namespace ksapi;
          namespace fs=std::filesystem;
          static std::ofstream lg("/tmp/cli3d_mutate.log",std::ios::out|std::ios::app);
          static void log(const std::string&s){lg<<s<<std::endl;lg.flush();}
          static bool done=false;
          static bool rect(const IFragmentDocumentPtr& frag){
            auto vm=frag->GetViewsAndLayersManager(); auto views=vm?vm->GetViews():IViewsPtr{};
            auto view=views?views->GetActiveView():IViewPtr{}; IDrawingContainerPtr dc=view;
            auto lines=dc?dc->GetLineSegments():ILineSegmentsPtr{}; if(!lines)return false;
            const double p[4][4]={{-10,-6,10,-6},{10,-6,10,6},{10,6,-10,6},{-10,6,-10,-6}};
            for(int i=0;i<4;i++){auto s=lines->Add();if(!s)return false;
              s->SetX1(p[i][0]);s->SetY1(p[i][1]);s->SetX2(p[i][2]);s->SetY2(p[i][3]);s->SetStyle(ksCSNormal);
              if(!s->Update())return false;}
            return true;
          }
          extern "C" int run_variant06_writer(){
            if(done)return 0;
            try{
              IApplication& app=GetKompasApplication(); app.SetHideMessage(ksHideMessageYes);
              auto lm=app.GetApplicationLicenseManager();
              bool l3=lm&&lm->IsKompasModuleActive(ksKompasModule3D);
              log(std::string("LICENSE_3D_ACTIVE=")+(l3?"1":"0")); if(!l3)return 2;
              auto base=app.GetActiveDocument();
              log(std::string("ACTIVE_DOCUMENT=")+(base?"1":"0")); if(!base)return 3;
              IKompasDocument3DPtr doc=base; if(!doc){log("FAIL_CAST_3D");return 2;}
              auto top=doc->GetTopPart(); log(std::string("TOP_PART=")+(top?"1":"0")); if(!top)return 2;
              auto mc=top->GetModelContainer(); log(std::string("MODEL_CONTAINER=")+(mc?"1":"0")); if(!mc)return 2;
              auto sketches=mc->GetSketchs(); if(!sketches){log("FAIL_SKETCHES");return 2;}
              auto sk=sketches->Add(); if(!sk){log("FAIL_SKETCH_ADD");return 2;}
              auto plane=top->GetDefaultObject(o3d_planeXOY); if(!plane){log("FAIL_XOY");return 2;}
              sk->SetPlane(plane);
              auto frag=sk->BeginEdit(false); if(!frag){log("FAIL_BEGIN_EDIT");return 2;}
              if(!rect(frag)){log("FAIL_RECT");return 2;}
              if(!sk->EndEdit()||!sk->Update()){log("FAIL_SKETCH_UPDATE");return 2;}
              auto exts=mc->GetExtrusions(); auto ext=exts?exts->Add(o3d_baseExtrusion):IExtrusionPtr{};
              if(!ext){log("FAIL_EXTRUSION_ADD");return 2;}
              ext->SetProfiles({IModelObjectPtr(sk)});
              if(!ext->SetSideParameters(true,etBlind,10.0,0.0,false,IModelObjectPtr{})){log("FAIL_SIDE_PARAMS");return 2;}
              if(!ext->Update()){log("FAIL_EXTRUSION_UPDATE");return 2;}
              if(!top->RebuildModel(false)||!doc->RebuildDocument()){log("FAIL_REBUILD");return 2;}
              double m=top->GetMass(); log("MASS_BEFORE_SAVE="+std::to_string(m)); if(!(m>0))return 2;
              fs::path out="/tmp/Stage4_CLI3D_Mutated.m3d";fs::remove(out);
              if(!base->SaveAs(out.wstring())){log("FAIL_SAVEAS");return 2;}
              log("SAVEAS_PASS bytes="+std::to_string(fs::file_size(out)));
              if(!base->Close(kdDoNotSaveChanges)){log("FAIL_CLOSE");return 2;}
              log("CLOSE_PASS");
              log("RESULT=PASS_CLI3D_LICENSED_MUTATION_SAVE_CLOSE");
              done=true;return 0;
            }catch(const std::exception&e){log(std::string("EXCEPTION=")+e.what());}
             catch(...){log("EXCEPTION=unknown");}
            return 2;
          }
          CPP

          cat >/tmp/cli3d_verify.cpp <<'CPP'
          #include <KsAPI.h>
          #include <ksConstants.h>
          #include <fstream>
          #include <string>
          using namespace ksapi;
          static std::ofstream lg("/tmp/cli3d_reopen.log",std::ios::out|std::ios::app);
          static void log(const std::string&s){lg<<s<<std::endl;lg.flush();}
          static bool done=false;
          extern "C" int run_variant06_writer(){
            if(done)return 0;
            try{
              IApplication& app=GetKompasApplication(); app.SetHideMessage(ksHideMessageYes);
              auto lm=app.GetApplicationLicenseManager(); bool l3=lm&&lm->IsKompasModuleActive(ksKompasModule3D);
              log(std::string("LICENSE_3D_ACTIVE=")+(l3?"1":"0")); if(!l3)return 2;
              auto base=app.GetActiveDocument(); log(std::string("REOPEN_ACTIVE_DOCUMENT=")+(base?"1":"0")); if(!base)return 3;
              IKompasDocument3DPtr doc=base; if(!doc){log("FAIL_REOPEN_CAST");return 2;}
              auto top=doc->GetTopPart(); if(!top){log("FAIL_REOPEN_TOP");return 2;}
              auto mc=top->GetModelContainer(); if(!mc){log("FAIL_REOPEN_MODEL");return 2;}
              if(!top->RebuildModel(false)||!doc->RebuildDocument()){log("FAIL_REOPEN_REBUILD");return 2;}
              double m=top->GetMass(); log("MASS_AFTER_REOPEN="+std::to_string(m)); if(!(m>0)){log("FAIL_REOPEN_MASS");return 2;}
              auto exts=mc->GetExtrusions(); int ec=exts?exts->GetCount():0; log("EXTRUSIONS_AFTER_REOPEN="+std::to_string(ec));
              if(ec<1){log("FAIL_REOPEN_EXTRUSION");return 2;}
              if(!base->Save()){log("FAIL_REOPEN_SAVE");return 2;}
              if(!base->Close(kdDoNotSaveChanges)){log("FAIL_REOPEN_CLOSE");return 2;}
              log("RESULT=PASS_CLI3D_LICENSED_REOPEN_REBUILD");
              done=true;return 0;
            }catch(const std::exception&e){log(std::string("EXCEPTION=")+e.what());}
             catch(...){log("EXCEPTION=unknown");}
            return 2;
          }
          CPP
          /usr/bin/clang++ -std=c++20 -stdlib=libc++ -nostdinc++ -I"$CXXV1" -O2 -fPIC -shared -pthread -I"$INC" /tmp/cli3d_mutate.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/cli3d_mutate.so
          /usr/bin/clang++ -std=c++20 -stdlib=libc++ -nostdinc++ -I"$CXXV1" -O2 -fPIC -shared -pthread -I"$INC" /tmp/cli3d_verify.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/cli3d_verify.so
          g++ -std=c++20 -O2 -fPIC -shared -pthread kompas-linux/bootstrap_variant06_poll.cpp -ldl -o /tmp/stage4_bootstrap.so

      - name: Mutate CLI-open seed in exact licensed invisible runtime
        shell: bash
        run: |
          set -uxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export HOME="$RUNNER_TEMP/cli3d-home" XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25" result/cli3d
          RES=$(find "$BIN" -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25/QtResources.bin"
          export DISPLAY=:121 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN:$KOMPAS_SYS_LD"
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          sudo mkdir -p /tmp/.X11-unix; sudo chmod 1777 /tmp/.X11-unix
          Xvfb :121 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb121.out 2>/tmp/xvfb121.err &
          XV=$!; trap 'kill "$XV" 2>/dev/null || true' EXIT
          sleep 2
          cp /tmp/cli3d_mutate.so /tmp/writer_variant06.so
          rm -f /tmp/cli3d_mutate.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock /tmp/Stage4_CLI3D_Mutated.m3d
          setsid dbus-run-session -- env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" DISPLAY=:121 QT_QPA_PLATFORM=xcb \
            LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$LD_LIBRARY_PATH" LD_PRELOAD=/tmp/stage4_bootstrap.so \
            "$BIN/ksinvisible" -automation "$GITHUB_WORKSPACE/seed/BlankPart.m3d" >result/cli3d/mutate.out 2>result/cli3d/mutate.err &
          KP=$!
          ok=0
          for i in $(seq 1 120); do sleep 1
            if grep -q '^RESULT=PASS_CLI3D_LICENSED_MUTATION_SAVE_CLOSE$' /tmp/cli3d_mutate.log 2>/dev/null; then ok=1;break;fi
            if grep -q '^FAIL_' /tmp/cli3d_mutate.log 2>/dev/null; then break;fi
            if grep -q 'POLL_BOOTSTRAP_RETRY_LIMIT' /tmp/work1_bootstrap.log 2>/dev/null; then break;fi
            kill -0 "$KP" 2>/dev/null || break
          done
          cp /tmp/cli3d_mutate.log result/cli3d/mutate.log 2>/dev/null || true
          cp /tmp/work1_bootstrap.log result/cli3d/bootstrap-mutate.log 2>/dev/null || true
          cat result/cli3d/mutate.log 2>/dev/null || true
          kill -TERM -- "-$KP" 2>/dev/null || true; wait "$KP" 2>/dev/null || true
          test "$ok" = 1
          test -s /tmp/Stage4_CLI3D_Mutated.m3d

      - name: Reopen saved M3D in second licensed process and rebuild
        shell: bash
        run: |
          set -uxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          cp /tmp/cli3d_verify.so /tmp/writer_variant06.so
          rm -f /tmp/cli3d_reopen.log /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
          setsid dbus-run-session -- env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" DISPLAY=:121 QT_QPA_PLATFORM=xcb \
            LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$LD_LIBRARY_PATH" LD_PRELOAD=/tmp/stage4_bootstrap.so \
            "$BIN/ksinvisible" -automation /tmp/Stage4_CLI3D_Mutated.m3d >result/cli3d/reopen.out 2>result/cli3d/reopen.err &
          KP=$!
          ok=0
          for i in $(seq 1 120); do sleep 1
            if grep -q '^RESULT=PASS_CLI3D_LICENSED_REOPEN_REBUILD$' /tmp/cli3d_reopen.log 2>/dev/null; then ok=1;break;fi
            if grep -q '^FAIL_' /tmp/cli3d_reopen.log 2>/dev/null; then break;fi
            if grep -q 'POLL_BOOTSTRAP_RETRY_LIMIT' /tmp/work1_bootstrap.log 2>/dev/null; then break;fi
            kill -0 "$KP" 2>/dev/null || break
          done
          cp /tmp/cli3d_reopen.log result/cli3d/reopen.log 2>/dev/null || true
          cp /tmp/work1_bootstrap.log result/cli3d/bootstrap-reopen.log 2>/dev/null || true
          cp /tmp/Stage4_CLI3D_Mutated.m3d result/cli3d/
          cat result/cli3d/reopen.log 2>/dev/null || true
          kill -TERM -- "-$KP" 2>/dev/null || true; wait "$KP" 2>/dev/null || true
          test "$ok" = 1
          sha256sum result/cli3d/Stage4_CLI3D_Mutated.m3d | tee result/cli3d/SHA256.txt
          printf '%s\n' \
            'LICENSED_CLI_OPEN_SEED_PASS' \
            'NATIVE_SKETCH_EXTRUSION_MUTATION_PASS' \
            'SAVE_CLOSE_PASS' \
            'SECOND_PROCESS_REOPEN_REBUILD_PASS' \
            'RESULT=PASS_NATIVE_3D_CLI_OPEN_PIPELINE' > result/cli3d/ACCEPTANCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-cliopen-3d-native-pass
          retention-days: 90
          if-no-files-found: ignore
          path: result/cli3d/**
