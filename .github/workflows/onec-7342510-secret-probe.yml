name: onec-7342510-secret-probe

on:
  push:
    branches:
      - onec-7342510-base
    paths:
      - '.github/workflows/onec-7342510-secret-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_ONEC_USERNAME: ${{ secrets.ONEC_USERNAME != '' }}
      HAS_ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD != '' }}
    steps:
      - name: Check 1C release credentials availability
        shell: bash
        run: |
          echo "HAS_ONEC_USERNAME=$HAS_ONEC_USERNAME"
          echo "HAS_ONEC_PASSWORD=$HAS_ONEC_PASSWORD"
          if [ "$HAS_ONEC_USERNAME" = "true" ] && [ "$HAS_ONEC_PASSWORD" = "true" ]; then
            echo "ONEC_RELEASE_CREDENTIALS_READY=true"
          else
            echo "ONEC_RELEASE_CREDENTIALS_READY=false"
          fi
