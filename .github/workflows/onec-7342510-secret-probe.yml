name: onec-7342510-secret-probe

on:
  push:
    branches:
      - onec-7342510-base
    paths:
      - '.github/workflows/onec-7342510-secret-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_ONEC_USERNAME: ${{ secrets.ONEC_USERNAME != '' }}
      HAS_ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD != '' }}
    steps:
      - name: Credentials present
        if: env.HAS_ONEC_USERNAME == 'true' && env.HAS_ONEC_PASSWORD == 'true'
        run: echo "ONEC_RELEASE_CREDENTIALS_READY=true"

      - name: Credentials missing
        if: env.HAS_ONEC_USERNAME != 'true' || env.HAS_ONEC_PASSWORD != 'true'
        run: echo "ONEC_RELEASE_CREDENTIALS_READY=false"
