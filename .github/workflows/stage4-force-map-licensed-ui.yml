name: KOMPAS Stage 4 force-map licensed native UI probe

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-force-map-licensed-ui.yml'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime
      - name: Restore exact frozen licensed runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          if [ -d "$RUNNER_TEMP/runtime/opt/ascon/common" ]; then sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common; fi
          SYSROOT="$RUNNER_TEMP/runtime/system-libs"
          SYS_LD=$(find "$SYSROOT" -type f -printf '%h\n' | sort -u | paste -sd: -)
          echo "KOMPAS_SYS_LD=$SYS_LD" >> "$GITHUB_ENV"
      - name: Install X11 mapping and capture prerequisites only
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb xauth dbus procps python3 x11-utils xdotool imagemagick \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxcb-cursor0 libxres1 \
            libxcb-ewmh2 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-util1 libxcb-xinerama0 libxkbcommon-x11-0
      - name: Force-map licensed invisible main window and capture native UI
        shell: bash
        run: |
          set -euxo pipefail
          cat >/tmp/map_ui_probe.py <<'PY'
          import os, pathlib, subprocess, sys, time, traceback
          import ksapi
          from constants import constants as c

          out=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"result/force-map-ui"
          out.mkdir(parents=True,exist_ok=True)
          logp=out/"gate.log"
          def log(s):
              s=str(s); print(s,flush=True)
              with logp.open("a",encoding="utf-8") as f:f.write(s+"\n")
          def run(cmd, name=None, check=False):
              p=subprocess.run(cmd,text=True,capture_output=True,timeout=15)
              if name:
                  (out/name).write_text(p.stdout+"\nSTDERR:\n"+p.stderr,encoding="utf-8")
              if check and p.returncode!=0: raise RuntimeError("command failed: "+" ".join(cmd)+" rc="+str(p.returncode)+" err="+p.stderr)
              return p
          def pump(app,n=30,delay=.1):
              for _ in range(n):
                  try: app.PumpWaitingMessages()
                  except BaseException: pass
                  time.sleep(delay)
          def capture(tag):
              run(["xwininfo","-root","-tree"],f"xwininfo-{tag}.txt")
              run(["xprop","-root"],f"xprop-root-{tag}.txt")
              # ImageMagick import reads directly from the same Xvfb display.
              p=subprocess.run(["import","-window","root",str(out/f"{tag}.png")],text=True,capture_output=True,timeout=20)
              (out/f"capture-{tag}.txt").write_text("rc="+str(p.returncode)+"\n"+p.stdout+"\n"+p.stderr,encoding="utf-8")
          app=None
          try:
              ksapi.SetKompasPath("/opt/ascon/kompas3d-v25/Bin")
              app=ksapi.OpenKompasInvisible()
              if not app: raise RuntimeError("OpenKompasInvisible returned null")
              lm=app.GetApplicationLicenseManager()
              l2=bool(lm and lm.IsKompasModuleActive(c.ksKompasModule2D))
              l3=bool(lm and lm.IsKompasModuleActive(c.ksKompasModule3D))
              log("LICENSE_2D="+str(int(l2)));log("LICENSE_3D="+str(int(l3)))
              if not(l2 and l3): raise RuntimeError("license inactive")
              docs=app.GetDocuments()
              if not docs: raise RuntimeError("documents null")
              wid=int(app.GetMainWindowHandle())
              log("MAIN_WINDOW="+str(wid))
              log("VISIBLE_API_BEFORE="+str(int(bool(app.IsVisible()))))
              run(["xwininfo","-id",str(wid),"-all"],"main-before.txt")
              capture("before-map")

              # Only X11 window mapping. No runtime/package/license change.
              run(["xdotool","windowmap",str(wid)],"xdotool-windowmap.txt",True)
              run(["xdotool","windowmove",str(wid),"0","0"],"xdotool-windowmove.txt")
              run(["xdotool","windowsize",str(wid),"1280","800"],"xdotool-windowsize.txt")
              run(["xdotool","windowraise",str(wid)],"xdotool-windowraise.txt")
              pump(app,30)
              run(["xwininfo","-id",str(wid),"-all"],"main-after-map.txt")
              log("VISIBLE_API_AFTER_MAP="+str(int(bool(app.IsVisible()))))
              capture("after-map")

              cmd=int(c.ksCMFileNew)
              enabled=bool(app.IsKompasCommandEnable(cmd))
              log("FILE_NEW_ENABLED="+str(int(enabled)))
              ret=bool(app.ExecuteKompasCommand(cmd,True)) if enabled else False
              log("FILE_NEW_EXECUTE="+str(int(ret)))
              pump(app,50)
              log("DOC_COUNT_AFTER_FILE_NEW="+str(docs.GetCount()))
              capture("after-file-new")

              # Capture window names and map states.
              ids=run(["xdotool","search","--name","."],"windows-ids.txt").stdout.split()
              rows=[]
              for x in ids[:200]:
                  nm=run(["xdotool","getwindowname",x]).stdout.strip()
                  info=run(["xwininfo","-id",x,"-all"]).stdout
                  ms=""
                  for line in info.splitlines():
                      if "Map State:" in line: ms=line.strip()
                  rows.append(x+"\t"+nm+"\t"+ms)
              (out/"window-states.txt").write_text("\n".join(rows),encoding="utf-8")
              log("RESULT=FORCE_MAP_NATIVE_UI_PROBED")
          except BaseException as e:
              log("EXCEPTION="+type(e).__name__+":"+repr(e))
              traceback.print_exc()
              log("RESULT=FAIL_FORCE_MAP_NATIVE_UI_PROBE")
              sys.exit(2)
          finally:
              try:
                  if app: app.Quit()
              except BaseException as e: log("QUIT_EXCEPTION="+repr(e))
          PY

          BIN=/opt/ascon/kompas3d-v25/Bin
          export PYTHONPATH="$BIN"
          export LD_LIBRARY_PATH="$BIN:$KOMPAS_SYS_LD"
          export HOME="$RUNNER_TEMP/force-map-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          export QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LC_ALL=C.UTF-8
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25" result/force-map-ui
          RES=$(find "$BIN" -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25/QtResources.bin"
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          timeout 120s xvfb-run -a --server-args="-screen 0 1366x900x24 -ac +extension GLX +render -noreset" \
            dbus-run-session -- python3 -u /tmp/map_ui_probe.py \
            >result/force-map-ui/stdout.txt 2>result/force-map-ui/stderr.txt
          cat result/force-map-ui/stdout.txt || true
          cat result/force-map-ui/gate.log || true
          cat result/force-map-ui/window-states.txt || true
          grep -qx 'RESULT=FORCE_MAP_NATIVE_UI_PROBED' result/force-map-ui/gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-force-map-licensed-native-ui
          retention-days: 90
          if-no-files-found: ignore
          path: result/force-map-ui/**
