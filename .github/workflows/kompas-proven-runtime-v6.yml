name: KOMPAS proven Debian Xvfb native smoke

on:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/kompas-proven-runtime-v6.yml'
      - 'kompas-input/v6.b64.part*'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kompas-7335493-native-work1

      - name: Install historical Debian KOMPAS runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb openbox net-tools iproute2 libxcb-res0 libxcb-dri2-0 libxcb-xkb1
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          dpkg -l 'ascon-kompas*' | tee installed.txt

      - name: Launch historical ksinvisible route and smoke API7
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export PYTHONPATH="$BIN"
          ln -sf "$BIN/ksinvisible" /tmp/kKompas

          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" /tmp/kKompas -automation >kompas-live.out 2>kompas-live.err &
          WRAPPER_PID=$!

          KP=""
          for i in $(seq 1 40); do
            sleep 1
            KP=$(pgrep -x kKompas | head -1 || true)
            [ -n "$KP" ] && break
          done
          echo "KPID=$KP" | tee kompas-pid.txt
          if [ -z "$KP" ]; then
            ps aux | grep -E 'kKompas|ksinvisible' || true
            cat kompas-live.err || true
            exit 2
          fi
          ps -o pid,comm,args -p "$KP" | tee process-ps.txt

          for i in $(seq 1 50); do
            sleep 1
            ss -ltnp > kompas-sockets.txt || true
            if grep -q "kKompas" kompas-sockets.txt; then break; fi
          done
          cat kompas-sockets.txt
          if ! grep -q "kKompas" kompas-sockets.txt; then
            cat kompas-live.err || true
            exit 3
          fi

          python3 - <<'PY' | tee api-result.txt
          import hashlib
          import pathlib
          import zipfile
          import ksapi
          from constants import constants as c

          app = ksapi.GetKompas()
          if app is None:
              raise SystemExit("GetKompas returned None")
          print("PROVEN_RUNTIME_GETKOMPAS_PASS")
          print("APP_NAME=", app.GetApplicationName(True))
          print("BUILD=", app.GetBuildNumber())

          doc = app.GetDocuments().Add(c.ksDocumentFragment, True)
          if doc is None:
              raise SystemExit("Could not create fragment")
          print("PROVEN_RUNTIME_DOC_ADD_PASS")

          d2 = ksapi.IKompasDocument2D(doc)
          view = d2.GetViewsAndLayersManager().GetViews().GetActiveView()
          dc = ksapi.IDrawingContainer(view)
          s = dc.GetLineSegments().Add()
          if s is None:
              raise SystemExit("LineSegments.Add returned None")
          print("PROVEN_RUNTIME_LINE_ADD_PASS")

          s.SetX1(0.0)
          s.SetY1(0.0)
          s.SetX2(15.0)
          s.SetY2(0.0)
          s.SetStyle(c.ksCSNormal)
          if not s.Update():
              raise SystemExit("Line Update failed")

          out = pathlib.Path("smoke_native.frw").resolve()
          if not doc.SaveAs(str(out)):
              raise SystemExit("SaveAs returned false")
          if not out.exists() or out.stat().st_size <= 1000:
              raise SystemExit("Native FRW missing or too small")
          if out.read_bytes()[:2] != b"PK":
              raise SystemExit("Not a native modern KOMPAS container")
          with zipfile.ZipFile(out) as z:
              names = z.namelist()
              if "Contents" not in names or "FileInfo" not in names:
                  raise SystemExit("Missing Contents/FileInfo")
          print("PROVEN_RUNTIME_SAVE_PASS")
          print("SMOKE_SIZE=", out.stat().st_size)
          print("SMOKE_SHA256=", hashlib.sha256(out.read_bytes()).hexdigest())
          print("SMOKE_ZIP_PASS")
          PY

          kill "$WRAPPER_PID" 2>/dev/null || true

      - name: Verify native smoke markers and SHA
        shell: bash
        run: |
          set -euxo pipefail
          test -s smoke_native.frw
          grep -q 'PROVEN_RUNTIME_GETKOMPAS_PASS' api-result.txt
          grep -q 'PROVEN_RUNTIME_DOC_ADD_PASS' api-result.txt
          grep -q 'PROVEN_RUNTIME_LINE_ADD_PASS' api-result.txt
          grep -q 'PROVEN_RUNTIME_SAVE_PASS' api-result.txt
          sha256sum smoke_native.frw | tee smoke-sha256.txt
          python3 - <<'PY'
          import pathlib, zipfile
          p=pathlib.Path("smoke_native.frw")
          assert p.stat().st_size > 1000
          with zipfile.ZipFile(p) as z:
              assert "Contents" in z.namelist()
              assert "FileInfo" in z.namelist()
          print("PROVEN_RUNTIME_VERIFY_PASS")
          PY

      - name: Upload proven runtime smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kompas-proven-runtime-v6-smoke
          path: |
            smoke_native.frw
            smoke-sha256.txt
            installed.txt
            kompas-live.out
            kompas-live.err
            kompas-sockets.txt
            kompas-pid.txt
            process-ps.txt
            api-result.txt
          if-no-files-found: ignore
