name: Resume Ubuntu native build from proven ALT seed

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/native-seed-resume-ubuntu.yml'

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download proven ALT native seed artifact
        uses: actions/download-artifact@v4
        with:
          name: 7335493-native-seed-alt
          path: result/native-seed
          run-id: 44476851857
          github-token: ${{ github.token }}

      - name: Verify seed before KOMPAS
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          expected={
            "BlankPart.m3d":"0898524f47f3659ed4767feccf3052820222ecb9da8d862670a5e4ce064513b6",
            "BlankAssembly.a3d":"407b7c0260034b49dabbffbbc5ae7d80b300316a6214716f6e67ef365df04265",
          }
          d=Path("result/native-seed")
          for name,h in expected.items():
              p=d/name
              assert p.stat().st_size>1024,name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==h,name
              assert zipfile.is_zipfile(p),name
              with zipfile.ZipFile(p) as z:
                  assert {"Contents","FileInfo"}.issubset(set(z.namelist())),name
          print("ALT_NATIVE_SEED_ARTIFACT_VERIFIED")
          PY

      - name: Install KOMPAS v25 directly on Ubuntu runner
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb xauth dbus fontconfig qt6-base-dev pkg-config libc++-dev libc++abi-dev             libxcb-xkb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-ewmh2 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          sudo rm -f /etc/apt/sources.list.d/ascon.list
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main" | sudo tee /etc/apt/sources.list.d/ascon.list
          test -s /etc/apt/trusted.gpg.d/ascon.gpg
          sudo apt-get update
          sudo apt-get install -y ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          BIN=/opt/ascon/kompas3d-v25/Bin
          ldd "$BIN/ksinvisible" | tee /tmp/ksinvisible-ldd.txt
          ! grep -q "not found" /tmp/ksinvisible-ldd.txt

      - name: Compile native Work 2 and Work 4 bridge writers
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          clang++ -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread -I"$INC"             kompas-linux/work2_variant19_native.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/work2.so
          clang++ -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread -I"$INC"             kompas-linux/work4_variant16_native.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/work4.so
          g++ -std=c++20 -O2 -fPIC -shared -pthread kompas-linux/bootstrap_variant06_qt.cpp             $(pkg-config --cflags --libs Qt6Core) -ldl -o /tmp/bootstrap.so

      - name: Run native seed bridge in licensed Ubuntu KOMPAS
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export HOME="$RUNNER_TEMP/kompas-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D/25" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25"
          if [ -d /etc/ascon/KOMPAS-3D/25 ]; then
            cp -a /etc/ascon/KOMPAS-3D/25/. "$XDG_CONFIG_HOME/ascon/KOMPAS-3D/25/" || true
            cp -a /etc/ascon/KOMPAS-3D/25/. "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25/" || true
          fi
          RES=$(find /opt/ascon/kompas3d-v25 -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25/QtResources.bin"

          sudo mkdir -p /tmp/.X11-unix
          sudo chmod 1777 /tmp/.X11-unix
          sudo rm -f /tmp/.X11-unix/X113
          Xvfb :113 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb.out 2>/tmp/xvfb.err &
          XV=$!
          trap 'kill "$XV" 2>/dev/null || true' EXIT
          sleep 2
          test -S /tmp/.X11-unix/X113

          export DISPLAY=:113 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN"
          export KOMPAS_NATIVE_SEED_DIR="$GITHUB_WORKSPACE/result/native-seed"
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          rm -rf result/bridge-native
          mkdir -p result/bridge-native/work2 result/bridge-native/work4

          run_work() {
            local so="$1" log="$2" pass="$3" fail="$4" outdir="$5" copyto="$6"
            cp "$so" /tmp/writer_variant06.so
            cp /tmp/bootstrap.so /tmp/bootstrap_variant06_qt.so
            rm -f /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
            rm -rf "$outdir" /tmp/work2_seed_work /tmp/work4_seed_work
            dbus-run-session -- env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" DISPLAY=:113               QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN"               KOMPAS_NATIVE_SEED_DIR="$KOMPAS_NATIVE_SEED_DIR" LD_PRELOAD=/tmp/bootstrap_variant06_qt.so               "$BIN/ksinvisible" -automation >/tmp/kompas.out 2>/tmp/kompas.err &
            KP=$!
            ok=0
            for i in $(seq 1 70); do
              sleep 2
              if grep -q "^$pass$" "$log" 2>/dev/null; then ok=1; break; fi
              if grep -q "^$fail$" "$log" 2>/dev/null; then break; fi
              if ! kill -0 "$KP" 2>/dev/null; then break; fi
            done
            cat "$log" 2>/dev/null || true
            cat /tmp/work1_bootstrap.log 2>/dev/null || true
            tail -160 /tmp/kompas.err 2>/dev/null || true
            kill "$KP" 2>/dev/null || true
            wait "$KP" 2>/dev/null || true
            mkdir -p "$copyto"
            [ ! -d "$outdir" ] || cp -a "$outdir"/. "$copyto"/
            [ "$ok" = 1 ]
          }

          run_work /tmp/work2.so /tmp/work2_v19_native/work2.log             RESULT=PASS_NATIVE_WORK2_VARIANT19 RESULT=FAIL_NATIVE_WORK2_VARIANT19             /tmp/work2_v19_native result/bridge-native/work2

          run_work /tmp/work4.so /tmp/work4_v16_native/work4.log             RESULT=PASS_NATIVE_WORK4_VARIANT16 RESULT=FAIL_NATIVE_WORK4_VARIANT16             /tmp/work4_v16_native result/bridge-native/work4

      - name: Strict native acceptance
        shell: bash
        run: |
          set -euxo pipefail
          W2=result/bridge-native/work2
          W4=result/bridge-native/work4
          grep -q '^RESULT=PASS_NATIVE_WORK2_VARIANT19_REOPEN_REBUILD_DEPENDENCY$' "$W2/work2.log"
          grep -q '^RESULT=PASS_NATIVE_WORK2_VARIANT19$' "$W2/work2.log"
          grep -q '^TOP_DOWN_DEPENDENCY_PHYSICAL_CHANGE_PASS$' "$W2/work2.log"
          grep -q '^FINAL_NOMINAL_REOPEN_PASS$' "$W2/work2.log"
          grep -q '^RESULT=PASS_NATIVE_WORK4_VARIANT16_REOPEN_REBUILD_PARAMETRIC$' "$W4/work4.log"
          grep -q '^RESULT=PASS_NATIVE_WORK4_VARIANT16$' "$W4/work4.log"
          grep -q '^PARAMETRIC_T_40_44_40_PASS$' "$W4/work4.log"
          grep -q '^FINAL_NOMINAL_REOPEN_PASS$' "$W4/work4.log"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          for root in [Path("result/bridge-native/work2"),Path("result/bridge-native/work4")]:
              files=sorted(list(root.glob("*.m3d"))+list(root.glob("*.a3d")))
              assert files,root
              out=[]
              for p in files:
                  assert p.stat().st_size>1024,p
                  assert zipfile.is_zipfile(p),p
                  with zipfile.ZipFile(p) as z:
                      assert {"Contents","FileInfo"}.issubset(set(z.namelist())),p
                  out.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
              (root/"SHA256.txt").write_text("\n".join(out)+"\n")
          print("RESULT=PASS_NATIVE_SEED_BRIDGE_WORK2_WORK4")
          PY
          printf '%s\n'             'ALT_NATIVE_SEED_PASS'             'UBUNTU_LICENSED_3D_BUILD_PASS'             'WORK2_NATIVE_REOPEN_DEPENDENCY_PASS'             'WORK4_NATIVE_PARAMETRIC_REOPEN_PASS'             'RESULT=PASS_NATIVE_SEED_BRIDGE_WORK2_WORK4' > result/bridge-native/ACCEPTANCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-native-seed-resume-ubuntu
          path: |
            result/bridge-native/**
            /tmp/ksinvisible-ldd.txt
          if-no-files-found: ignore
