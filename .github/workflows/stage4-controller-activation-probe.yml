name: KOMPAS Stage 4 controller activation surface probe

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-controller-activation-probe.yml'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime
      - name: Restore exact frozen runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          [ ! -d "$RUNNER_TEMP/runtime/opt/ascon/common" ] || sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common
      - name: Inspect controller activation symbols and bindings
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils
          BIN=/opt/ascon/kompas3d-v25/Bin
          SDK=/opt/ascon/kompas3d-v25/SDK
          mkdir -p result/controller-probe
          OUT=result/controller-probe/controller-surface.txt
          : > "$OUT"
          {
            echo '=== SDK / PYTHON TEXT ==='
            grep -Rni -C 5 -E 'ActivateControllerAPI|ControllerAPI|ActivateController|Document3D\(|ActiveDocument3D|GetKompasInvisible' "$SDK" "$BIN/ksapi.py" 2>/dev/null | head -4000 || true
            echo '=== DYNAMIC SYMBOLS ==='
            while IFS= read -r f; do
              h="$(nm -D -C --defined-only "$f" 2>/dev/null | grep -Ei 'ActivateControllerAPI|ActivateController|ControllerAPI|Document3D|ActiveDocument3D' | head -200 || true)"
              if [ -n "$h" ]; then echo "--- $f"; echo "$h"; fi
            done < <(find "$BIN" /opt/ascon/common -type f \( -name '*.so' -o -name '*.so.*' -o -perm -111 \) 2>/dev/null | sort -u)
            echo '=== RAW STRINGS ==='
            while IFS= read -r f; do
              h="$(strings -a "$f" 2>/dev/null | grep -Ei 'ActivateControllerAPI|ActivateController|ControllerAPI|ActiveDocument3D' | head -100 || true)"
              if [ -n "$h" ]; then echo "--- $f"; echo "$h"; fi
            done < <(find "$BIN" /opt/ascon/common -type f \( -name '*.so' -o -name '*.so.*' -o -perm -111 \) 2>/dev/null | sort -u)
            echo '=== KSAPI PYTHON TOP ==='
            sed -n '1,100p' "$BIN/ksapi.py" 2>/dev/null || true
          } | tee "$OUT"
          echo 'RESULT=CONTROLLER_SURFACE_PROBED' | tee result/controller-probe/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-controller-activation-probe
          retention-days: 90
          if-no-files-found: ignore
          path: result/controller-probe/**
