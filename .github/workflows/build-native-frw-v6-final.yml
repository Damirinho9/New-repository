name: Build native KOMPAS FRW variant06 final

on:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/build-native-frw-v6-final.yml'
      - 'kompas-linux/writer_variant06.cpp'
      - 'kompas-linux/bootstrap_variant06.c'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: alt:p11
    timeout-minutes: 20
    steps:
      - name: Install KOMPAS runtime and run injected writer
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/work1
          cd /tmp/work1

          echo "=== APT SOURCES ORIGINAL ==="
          grep -R -n 'ftp.altlinux.org\|ALTLinux\|p11/branch' /etc/apt 2>/dev/null || true

          # Switch ALT p11 from the very slow ftp.altlinux.org to Yandex mirror.
          # First replace the standard full base path, then any remaining host.
          find /etc/apt -type f -maxdepth 4 -print0 2>/dev/null | xargs -0 -r sed -i             -e 's#http://ftp.altlinux.org/pub/distributions/ALTLinux#http://mirror.yandex.ru/altlinux#g'             -e 's#https://ftp.altlinux.org/pub/distributions/ALTLinux#http://mirror.yandex.ru/altlinux#g'             -e 's#http://ftp.altlinux.org#http://mirror.yandex.ru/altlinux#g'             -e 's#https://ftp.altlinux.org#http://mirror.yandex.ru/altlinux#g'

          # KOMPAS is x86_64; the x86_64-i586 package index is not needed here.
          find /etc/apt -type f -maxdepth 4 -print0 2>/dev/null | xargs -0 -r sed -i             '/x86_64-i586/s/^[[:space:]]*rpm/# rpm/'

          echo "=== APT SOURCES MODIFIED ==="
          grep -R -n 'mirror.yandex.ru\|ftp.altlinux.org\|p11/branch' /etc/apt 2>/dev/null || true

          apt-get update
          apt-get install -y wget ca-certificates fontconfig dbus glibc-locales             libxcbutil-icccm libxcbutil-keysyms libxcbutil-image libxcb-render-util             libXv libXScrnSaver libxkbfile libfontenc || true

          echo "=== LOCALES BEFORE KOMPAS ==="
          locale -a | grep -Ei 'ru_RU.*1251|ru_RU.*utf' || true
          test -d /usr/share/i18n/charmaps || true

          bash -c "$(wget -O - https://repo.ascon.ru/scripts/ascon-stable-alt.sh)"

          # ASCON script can rewrite ALT sources. Force Yandex again before update.
          find /etc/apt -type f -maxdepth 4 -print0 2>/dev/null | xargs -0 -r sed -i             -e 's#http://ftp.altlinux.org/pub/distributions/ALTLinux#http://mirror.yandex.ru/altlinux#g'             -e 's#https://ftp.altlinux.org/pub/distributions/ALTLinux#http://mirror.yandex.ru/altlinux#g'             -e 's#http://ftp.altlinux.org#http://mirror.yandex.ru/altlinux#g'             -e 's#https://ftp.altlinux.org#http://mirror.yandex.ru/altlinux#g'
          find /etc/apt -type f -maxdepth 4 -print0 2>/dev/null | xargs -0 -r sed -i             '/x86_64-i586/s/^[[:space:]]*rpm/# rpm/'

          echo "=== SOURCES BEFORE KOMPAS INSTALL ==="
          grep -R -n 'mirror.yandex.ru\|ftp.altlinux.org\|repo.ascon.ru' /etc/apt 2>/dev/null || true

          apt-get update
          apt-get install -y ascon-kompas-graphic-v25 ascon-kompas-v25 ascon-kompas-sdk-v25 clang18.1 libcxx-devel libcxxabi-devel || true

          test -x /opt/ascon/kompas3d-v25/Bin/kKompas
          test -f /opt/ascon/kompas3d-v25/Bin/libksAPI.so

          wget -O /tmp/writer_variant06.cpp             'https://raw.githubusercontent.com/Damirinho9/New-repository/kompas-7335493-native-work1/kompas-linux/writer_variant06.cpp'
          wget -O /tmp/bootstrap_variant06.c             'https://raw.githubusercontent.com/Damirinho9/New-repository/kompas-7335493-native-work1/kompas-linux/bootstrap_variant06.c'
          test -s /tmp/writer_variant06.cpp
          test -s /tmp/bootstrap_variant06.c

          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          BIN=/opt/ascon/kompas3d-v25/Bin
          test -f "$INC/KsAPI.h"

          clang++-18 -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread             -I"$INC" /tmp/writer_variant06.cpp             -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi             -o /tmp/writer_variant06.so
          clang-18 -O2 -fPIC -shared -pthread /tmp/bootstrap_variant06.c -ldl             -o /tmp/bootstrap_variant06.so

          echo "=== WRITER LDD ==="
          ldd /tmp/writer_variant06.so || true
          echo "=== BOOTSTRAP LDD ==="
          ldd /tmp/bootstrap_variant06.so || true

          rm -f /tmp/work1_v6_inject.log /tmp/work1_bootstrap.log                 /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw /tmp/kompas_v6.log

          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          export QT_QPA_PLATFORM=offscreen
          export LD_LIBRARY_PATH=/opt/ascon/kompas3d-v25/Bin
          unset DISPLAY HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy

          cd /opt/ascon/kompas3d-v25/Bin
          dbus-run-session -- bash -c 'LD_PRELOAD=/tmp/bootstrap_variant06.so exec ./kKompas' >/tmp/kompas_v6.log 2>&1 &
          KP=$!
          echo "KOMPAS_PID=$KP"

          for i in $(seq 1 120); do
            echo "POLL=$i"
            tail -20 /tmp/work1_bootstrap.log 2>/dev/null || true
            tail -30 /tmp/work1_v6_inject.log 2>/dev/null || true
            if grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log 2>/dev/null; then
              echo "PASS_MARKER_FOUND"
              break
            fi
            if ! kill -0 "$KP" 2>/dev/null; then
              echo "KOMPAS_EXITED"
              break
            fi
            sleep 2
          done

          echo "=== BOOTSTRAP_LOG ==="
          cat /tmp/work1_bootstrap.log 2>/dev/null || true
          echo "=== INJECT_LOG ==="
          cat /tmp/work1_v6_inject.log 2>/dev/null || true
          echo "=== KOMPAS_LOG_TAIL ==="
          tail -200 /tmp/kompas_v6.log 2>/dev/null || true

          OUT=/tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
          test -s "$OUT"
          grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log

          echo "=== FRW_METADATA ==="
          ls -l "$OUT"
          sha256sum "$OUT"

          echo "=== FRW_BASE64_BEGIN ==="
          base64 -w 76 "$OUT"
          echo "=== FRW_BASE64_END ==="
          echo "RESULT=PASS_FINAL_NATIVE_FRW"

# retrigger-scope-fix

# retrigger-layer-fix
