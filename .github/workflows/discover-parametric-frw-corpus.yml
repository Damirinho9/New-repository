name: Discover public parametric KOMPAS FRW corpus

on:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/discover-parametric-frw-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover and download FRW from KOMPAS repositories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse, zipfile, zlib, base64, pathlib, time
          token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)
          queries=['kompas3d','KOMPAS-3D','КОМПАС-3D']
          repos={}
          for q in queries:
              data=get('https://api.github.com/search/repositories?'+urllib.parse.urlencode({'q':q,'per_page':100}))
              for it in data.get('items',[]):
                  repos[it['full_name']]=(it['default_branch'],it['size'])
          print('repos',len(repos))
          out=pathlib.Path('corpus'); out.mkdir()
          manifest=[]
          for idx,(repo,(branch,size)) in enumerate(repos.items()):
              if size>350000: # skip huge >~350MB indexed size
                  continue
              try:
                  tree=get(f'https://api.github.com/repos/{repo}/git/trees/{urllib.parse.quote(branch,safe="")}?recursive=1')
              except Exception as e:
                  print('TREE_FAIL',repo,e); continue
              frws=[x for x in tree.get('tree',[]) if x.get('type')=='blob' and x.get('path','').lower().endswith('.frw') and x.get('size',0)<=2_000_000]
              if not frws: continue
              print('REPO',repo,'FRW',len(frws))
              for x in frws[:100]:
                  path=x['path']
                  raw='https://raw.githubusercontent.com/'+repo+'/'+urllib.parse.quote(branch,safe='')+'/'+urllib.parse.quote(path,safe='/')
                  safe=re.sub(r'[^A-Za-z0-9_.-]+','_',repo+'__'+path)[-220:]
                  dst=out/safe
                  try:
                      req=urllib.request.Request(raw,headers={'Authorization':f'Bearer {token}'})
                      with urllib.request.urlopen(req,timeout=60) as r:
                          b=r.read()
                      dst.write_bytes(b)
                      info={'repo':repo,'branch':branch,'path':path,'file':safe,'bytes':len(b)}
                      # detect modern native KOMPAS zip + inspect strings
                      info['zip']=b[:2]==b'PK'
                      strings=[]
                      if info['zip']:
                          try:
                              with zipfile.ZipFile(dst) as z:
                                  if 'Contents' in z.namelist():
                                      c=z.read('Contents')
                                      pos=2 if c[:2]==b'KF' else 0
                                      blocks=[]
                                      while pos<len(c) and c[pos:pos+1]==b'x':
                                          o=zlib.decompressobj()
                                          d=o.decompress(c[pos:])
                                          used=len(c[pos:])-len(o.unused_data)
                                          if used<=0: break
                                          blocks.append(d); pos+=used
                                      dec=b''.join(blocks)
                                      # UTF-16LE and ASCII-ish identifiers / equations
                                      try:
                                          txt=dec.decode('utf-16le','ignore')
                                          strings += re.findall(r'[A-Za-zА-Яа-я_][A-Za-zА-Яа-я0-9_+*/()., =-]{1,80}',txt)
                                      except: pass
                                      strings += [s.decode('latin1','ignore') for s in re.findall(rb'[A-Za-z_][A-Za-z0-9_+*/()., =-]{2,80}',dec)]
                                      likely=[s.strip() for s in strings if re.search(r'(=|var|param|перемен|парамет|formula|constraint|fi|phi|alpha|beta|l1|l2|l3)',s,re.I)]
                                      info['likely_strings']=likely[:80]
                          except Exception as e:
                              info['inspect_error']=repr(e)
                      manifest.append(info)
                  except Exception as e:
                      print('DL_FAIL',repo,path,e)
          pathlib.Path('manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          candidates=[m for m in manifest if m.get('likely_strings')]
          pathlib.Path('candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FRW_TOTAL',len(manifest),'CANDIDATES',len(candidates))
          for m in candidates[:200]:
              print('CANDIDATE',m['repo'],m['path'],m.get('likely_strings')[:10])
          PY
      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: public-kompas-frw-corpus
          compression-level: 6
          path: |
            manifest.json
            candidates.json
            corpus/**
