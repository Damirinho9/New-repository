name: MasterSCADA 7341268 Stage 4 Tutorial Type Probe

on:
  push:
    branches:
      - masterscada-7341268-windows
    paths:
      - ".github/workflows/masterscada-7341268-stage4-tutorial-types.yml"
  workflow_dispatch:

jobs:
  tutorial-types:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install MasterSCADA 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\stage4-tutorial-types" | Out-Null
          New-Item -ItemType Directory -Force "C:\MasterSCADA_7341268\installer" | Out-Null
          $base = "https://download.mps-soft.ru/demo/Old%20Demo/3.11/"
          $dest = "C:\MasterSCADA_7341268\installer"
          foreach ($name in @("Data1.cab","data.msi","setup.bmp","setup.exe")) {
            & curl.exe -k -L --fail --silent --show-error ($base + $name) -o (Join-Path $dest $name)
            if ($LASTEXITCODE -ne 0) { throw "download failed: $name" }
          }
          $p = Start-Process msiexec.exe -ArgumentList @("/i",(Join-Path $dest "data.msi"),"/qn","/norestart") -Wait -PassThru
          "MSI_EXIT_CODE=$($p.ExitCode)" | Set-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage4-tutorial-types\install.txt"
          if ($p.ExitCode -notin @(0,3010,1641)) { throw "MSI failed: $($p.ExitCode)" }

      - name: Inventory tutorial VAV files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\MasterSCADA Projects\Projects\Tutorials"
          $all = @(Get-ChildItem $root -Recurse -Filter *.vav -File | Sort-Object Length -Descending)
          "TUTORIAL_VAV_COUNT=$($all.Count)" | Set-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage4-tutorial-types\tutorial-inventory.txt"
          $all | ForEach-Object { "$($_.Length)`t$($_.FullName)" } | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage4-tutorial-types\tutorial-inventory.txt"
          if ($all.Count -lt 1) { throw "No tutorial VAV files found" }

      - name: Probe tutorial trees through exact ROT instance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:GITHUB_WORKSPACE\stage4-tutorial-types\tutorial-tree-dump.txt"
          $root = "C:\MasterSCADA Projects\Projects\Tutorials"
          $exe = "C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"

          $src = @'
          using System;
          using System.Runtime.InteropServices;
          using System.Runtime.InteropServices.ComTypes;

          public static class RotAttach {
            [DllImport("ole32.dll")]
            static extern int GetRunningObjectTable(int reserved, out IRunningObjectTable prot);
            [DllImport("ole32.dll")]
            static extern int CreateBindCtx(int reserved, out IBindCtx ppbc);

            public static object FindProjectApplication() {
              IRunningObjectTable rot;
              if (GetRunningObjectTable(0, out rot) != 0 || rot == null) return null;
              rot.EnumRunning(out IEnumMoniker em);
              IMoniker[] mons = new IMoniker[1];
              while (em.Next(1, mons, IntPtr.Zero) == 0) {
                object obj = null;
                try {
                  rot.GetObject(mons[0], out obj);
                  if (obj != null) {
                    dynamic d = obj;
                    object p = null;
                    try { p = d.CurrentProject; } catch {}
                    if (p != null) return obj;
                  }
                } catch {}
                if (obj != null && Marshal.IsComObject(obj)) {
                  try { Marshal.FinalReleaseComObject(obj); } catch {}
                }
                try { Marshal.FinalReleaseComObject(mons[0]); } catch {}
              }
              return null;
            }
          }
          '@
          Add-Type -TypeDefinition $src -Language CSharp

          function Fix-Text([object]$value) {
            if ($null -eq $value) { return "" }
            $s = [string]$value
            try {
              $bytes = [Text.Encoding]::GetEncoding(1251).GetBytes($s)
              $fixed = [Text.Encoding]::UTF8.GetString($bytes)
              if ($fixed -match '[А-Яа-яЁё]') { return $fixed }
            } catch {}
            return $s
          }

          function Get-ClsId($item) {
            try {
              $ci = $item.ClassInfoObject
              if ($null -ne $ci) { return [string]$ci.clsid }
            } catch {}
            return ""
          }

          function Get-ChildCount($item) {
            foreach($mask in @([uint32]0xFFFFFFFF,[uint32]0,[uint32]1,[uint32]2,[uint32]4,[uint32]8,[uint32]16,[uint32]32,[uint32]64,[uint32]128,[uint32]256,[uint32]512,[uint32]1024)) {
              try {
                $n = $item.GetChildsCount($mask,1)
                if($n -gt 0){ return [int]$n }
              } catch {}
            }
            return 0
          }

          $script:seen = @{}
          function Dump-Item {
            param([object]$Item,[string]$TreeName,[int]$Depth,[string]$ProjectFile)
            if ($null -eq $Item -or $Depth -gt 16) { return }
            $id=""
            try{$id=[string]$Item.Id}catch{}
            $fullRaw=""
            try{$fullRaw=[string]$Item.FullName}catch{}
            $key="$ProjectFile|$TreeName|$id|$fullRaw"
            if($script:seen.ContainsKey($key)){return}
            $script:seen[$key]=$true

            $name="";$display="";$full="";$itemType="";$objectType="";$clsid="";$childCount=0
            try{$name=Fix-Text $Item.Name}catch{}
            try{$display=Fix-Text $Item.DisplayName}catch{}
            try{$full=Fix-Text $Item.FullName}catch{}
            try{$itemType=[string]$Item.ItemType}catch{}
            try{$objectType=[string]$Item.ObjectType}catch{}
            $clsid=Get-ClsId $Item
            $childCount=Get-ChildCount $Item
            $indent="  "*$Depth
            "$indent[$TreeName] Name=$name | DisplayName=$display | ItemType=$itemType | ObjectType=$objectType | CLSID=$clsid | ChildCount=$childCount | Id=$id | FullName=$full | Project=$ProjectFile" |
              Add-Content -Encoding utf8 $out

            $children=@()
            try {
              foreach($child in $Item){ if($null -ne $child){$children += $child} }
            } catch {}

            if($children.Count -eq 0) {
              foreach($mask in @([uint32]0xFFFFFFFF,[uint32]0,[uint32]1,[uint32]2,[uint32]4,[uint32]8,[uint32]16,[uint32]32,[uint32]64,[uint32]128,[uint32]256,[uint32]512,[uint32]1024)) {
                try {
                  $e=$Item.EnumChilds($mask)
                  if($null -ne $e){
                    if($e -is [Array]){$children += @($e)}
                    else { foreach($x in $e){if($null -ne $x){$children += $x}} }
                  }
                  if($children.Count -gt 0){break}
                } catch {}
              }
            }

            foreach($child in $children){
              Dump-Item -Item $child -TreeName $TreeName -Depth ($Depth+1) -ProjectFile $ProjectFile
            }
          }

          $all=@(Get-ChildItem $root -Recurse -Filter *.vav -File)
          $preferred=@(
            $all | Where-Object {$_.BaseName -eq "Demo_Бак"} | Select-Object -First 1,
            $all | Where-Object {$_.BaseName -eq "Demo"} | Select-Object -First 1,
            $all | Where-Object {$_.BaseName -match "Интеллектуальное"} | Select-Object -First 1,
            $all | Where-Object {$_.BaseName -match "ПИД"} | Select-Object -First 1,
            $all | Where-Object {$_.BaseName -match "задатчика"} | Select-Object -First 1,
            $all | Sort-Object Length -Descending | Select-Object -First 3
          ) | Where-Object {$null -ne $_} | Select-Object -Unique

          "SELECTED_PROJECTS=$($preferred.Count)" | Set-Content -Encoding utf8 $out
          $opened=0
          foreach($vav in $preferred){
            if($opened -ge 5){break}
            "================================================================================" | Add-Content -Encoding utf8 $out
            "TRY_PROJECT=$($vav.FullName) SIZE=$($vav.Length)" | Add-Content -Encoding utf8 $out

            $watcher=Start-Job -ScriptBlock {
              $ws=New-Object -ComObject WScript.Shell
              for($i=0;$i -lt 45;$i++){
                Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowTitle} | ForEach-Object {
                  if($ws.AppActivate($_.Id)){Start-Sleep -Milliseconds 250;$ws.SendKeys("{ENTER}")}
                }
                Start-Sleep -Milliseconds 750
              }
            }

            $proc=$null;$app=$null
            try {
              $proc=Start-Process $exe -ArgumentList @($vav.FullName) -PassThru
              Start-Sleep -Seconds 12
              $app=[RotAttach]::FindProjectApplication()
              if($null -eq $app){
                "ROT_PROJECT_APP_NOT_FOUND=True" | Add-Content -Encoding utf8 $out
                continue
              }
              $p=$app.CurrentProject
              if($null -eq $p){
                "CURRENT_PROJECT_NULL=True" | Add-Content -Encoding utf8 $out
                continue
              }
              $opened++
              "OPEN_OK_INDEX=$opened" | Add-Content -Encoding utf8 $out
              try{"PROJECT_NAME=$(Fix-Text $p.Name)"|Add-Content -Encoding utf8 $out}catch{}
              try{"PROJECT_PATH=$($p.Path)"|Add-Content -Encoding utf8 $out}catch{}
              $cc=0
              try{$cc=[int]$p.ComputerCount}catch{}
              "COMPUTER_COUNT=$cc" | Add-Content -Encoding utf8 $out

              for($i=0;$i -lt $cc;$i++){
                try{
                  $comp=$p.Computer($i)
                  $n=Fix-Text $comp.Name
                  $d=Fix-Text $comp.DisplayName
                  $f=Fix-Text $comp.FullName
                  $it="";$ot="";$id="";try{$it=[string]$comp.ItemType}catch{};try{$ot=[string]$comp.ObjectType}catch{};try{$id=[string]$comp.Id}catch{}
                  $cl=Get-ClsId $comp
                  "[ComputerDirect] Index=$i | Name=$n | DisplayName=$d | ItemType=$it | ObjectType=$ot | CLSID=$cl | Id=$id | FullName=$f | Project=$($vav.Name)" |
                    Add-Content -Encoding utf8 $out
                }catch{"COMPUTER_DIRECT_ERROR[$i]=$($_.Exception.Message)"|Add-Content -Encoding utf8 $out}
              }

              $script:seen=@{}
              try{Dump-Item -Item $p.SystemRoot -TreeName "System" -Depth 0 -ProjectFile $vav.Name}catch{"SYSTEM_DUMP_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $out}
              try{Dump-Item -Item $p.ObjTree.Root -TreeName "Object" -Depth 0 -ProjectFile $vav.Name}catch{"OBJECT_DUMP_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $out}
            } catch {
              "PROJECT_PROBE_ERROR=$($_.Exception.GetType().FullName): $($_.Exception.Message)" | Add-Content -Encoding utf8 $out
            } finally {
              try{Stop-Job $watcher -ErrorAction SilentlyContinue|Out-Null}catch{}
              try{Remove-Job $watcher -Force -ErrorAction SilentlyContinue}catch{}
              if($app){
                try{$app.ExitScada()}catch{}
                try{[Runtime.InteropServices.Marshal]::FinalReleaseComObject($app)|Out-Null}catch{}
              }
              if($proc){try{Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}catch{}}
              Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
          }
          "OPENED_PROJECTS=$opened" | Add-Content -Encoding utf8 $out
          if($opened -lt 2){throw "Fewer than two tutorial projects opened through ROT"}

      - name: Derive real CLSID catalog and verified reference types
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $dump="$env:GITHUB_WORKSPACE\stage4-tutorial-types\tutorial-tree-dump.txt"
          $catalog="$env:GITHUB_WORKSPACE\stage4-tutorial-types\tutorial-type-catalog.txt"
          $verified="$env:GITHUB_WORKSPACE\stage4-tutorial-types\verified-reference-types.txt"

          $rows=@()
          $computers=@()
          Get-Content $dump | ForEach-Object {
            if($_ -match '^\s*\[(System|Object)\]\s+Name=(.*?)\s+\|\s+DisplayName=(.*?)\s+\|\s+ItemType=(.*?)\s+\|\s+ObjectType=(.*?)\s+\|\s+CLSID=(.*?)\s+\|\s+ChildCount=(.*?)\s+\|\s+Id=(.*?)\s+\|\s+FullName=(.*?)\s+\|\s+Project=(.*)$'){
              $rows += [pscustomobject]@{Tree=$matches[1];Name=$matches[2];DisplayName=$matches[3];ItemType=$matches[4];ObjectType=$matches[5];CLSID=$matches[6];ChildCount=[int]$matches[7];Id=$matches[8];FullName=$matches[9];Project=$matches[10]}
            } elseif($_ -match '^\[ComputerDirect\]\s+Index=(.*?)\s+\|\s+Name=(.*?)\s+\|\s+DisplayName=(.*?)\s+\|\s+ItemType=(.*?)\s+\|\s+ObjectType=(.*?)\s+\|\s+CLSID=(.*?)\s+\|\s+Id=(.*?)\s+\|\s+FullName=(.*?)\s+\|\s+Project=(.*)$'){
              $computers += [pscustomobject]@{Index=$matches[1];Name=$matches[2];DisplayName=$matches[3];ItemType=$matches[4];ObjectType=$matches[5];CLSID=$matches[6];Id=$matches[7];FullName=$matches[8];Project=$matches[9]}
            }
          }

          "ACTUAL_TREE_NODES=$($rows.Count)" | Set-Content -Encoding utf8 $catalog
          "DIRECT_COMPUTER_NODES=$($computers.Count)" | Add-Content -Encoding utf8 $catalog
          "UNIQUE_REAL_TYPES:" | Add-Content -Encoding utf8 $catalog
          $rows | Where-Object {$_.CLSID} | Group-Object CLSID,ItemType,ObjectType | Sort-Object Count -Descending | ForEach-Object {
            $x=$_.Group[0]
            "COUNT=$($_.Count) | CLSID=$($x.CLSID) | ItemType=$($x.ItemType) | ObjectType=$($x.ObjectType) | ChildCountExample=$($x.ChildCount) | ExampleName=$($x.Name) | Tree=$($x.Tree) | Project=$($x.Project)" | Add-Content -Encoding utf8 $catalog
          }
          ""|Add-Content -Encoding utf8 $catalog
          "DIRECT_COMPUTERS:"|Add-Content -Encoding utf8 $catalog
          $computers|ForEach-Object{
            "Name=$($_.Name) | DisplayName=$($_.DisplayName) | ItemType=$($_.ItemType) | ObjectType=$($_.ObjectType) | CLSID=$($_.CLSID) | FullName=$($_.FullName) | Project=$($_.Project)"|Add-Content -Encoding utf8 $catalog
          }
          ""|Add-Content -Encoding utf8 $catalog
          "VARIABLE_NAME_CANDIDATES:"|Add-Content -Encoding utf8 $catalog
          $rows|Where-Object{
            $_.Tree -eq "Object" -and ($_.Name -match '(?i)темп|temperature|давл|pressure|уров|level|расход|flow|value|знач|analog|аналог|ток|current|напр|voltage|speed|скорост|задан|setpoint' -or $_.DisplayName -match '(?i)темп|temperature|давл|pressure|уров|level|расход|flow|value|знач|analog|аналог|ток|current|напр|voltage|speed|скорост|задан|setpoint')
          }|Select-Object -First 100|ForEach-Object{
            "Name=$($_.Name) | DisplayName=$($_.DisplayName) | ItemType=$($_.ItemType) | ObjectType=$($_.ObjectType) | CLSID=$($_.CLSID) | ChildCount=$($_.ChildCount) | FullName=$($_.FullName) | Project=$($_.Project)"|Add-Content -Encoding utf8 $catalog
          }

          $computer=$computers|Where-Object{$_.CLSID}|Select-Object -First 1
          $tech=$rows|Where-Object{
            $_.Tree -eq "Object" -and $_.CLSID -and $_.ChildCount -gt 0 -and $_.CLSID -ne '{B4AFE1A6-850A-4B07-A18B-1FE260E2FAB7}'
          }|Select-Object -First 1
          $analog=$rows|Where-Object{
            $_.Tree -eq "Object" -and $_.CLSID -and $_.ChildCount -eq 0 -and
            ($_.Name -match '(?i)темп|temperature|давл|pressure|уров|level|расход|flow|value|знач|analog|аналог|ток|current|напр|voltage|speed|скорост|задан|setpoint' -or $_.DisplayName -match '(?i)темп|temperature|давл|pressure|уров|level|расход|flow|value|знач|analog|аналог|ток|current|напр|voltage|speed|скорост|задан|setpoint')
          }|Select-Object -First 1

          "VERIFIED REFERENCE TYPES FROM REAL MASTERScada 3.11 TUTORIAL PROJECTS" | Set-Content -Encoding utf8 $verified
          function Emit($tag,$x){
            if($null -eq $x){"$tag.FOUND=False"|Add-Content -Encoding utf8 $verified;return}
            "$tag.FOUND=True"|Add-Content -Encoding utf8 $verified
            foreach($n in @("Name","DisplayName","ItemType","ObjectType","CLSID","ChildCount","FullName","Project")){
              if($x.PSObject.Properties.Name -contains $n){"$tag.$n=$($x.$n)"|Add-Content -Encoding utf8 $verified}
            }
          }
          Emit "COMPUTER" $computer
          Emit "TECH_OBJECT" $tech
          Emit "ANALOG_VALUE" $analog

          if($null -eq $computer){throw "No direct Computer[i] type found"}
          if($null -eq $tech){throw "No non-root object container found"}
          if($null -eq $analog){throw "No analog/value candidate found"}
          "REFERENCE_TYPE_VALIDATION=PASS"|Add-Content -Encoding utf8 $verified
          Get-Content $verified

      - name: Upload tutorial type evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada-7341268-stage4-tutorial-types
          path: stage4-tutorial-types/**
          if-no-files-found: error
          retention-days: 90
