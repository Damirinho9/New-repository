name: Hexlet 7344445 Packet Tracer donor audit

on:
  push:
    branches:
      - hexlet-7344445-packettracer
    paths:
      - "hexlet_7344445/**"
      - ".github/workflows/hexlet-7344445-donor-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4

      - name: Install ptlab and native PKT codec
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/fn-cafeina/lab-pkt.git /tmp/lab-pkt
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/lab-pkt

      - name: Clone donor Packet Tracer labs
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Jooiden/cisco-packet-tracer-labs.git /tmp/donor

      - name: Decode and classify native PKT files
        shell: bash
        env:
          DONOR_DIR: /tmp/donor
          OUT_DIR: hexlet_7344445/donor_audit
        run: |
          set -euxo pipefail
          python hexlet_7344445/inspect_donor.py
          ls -lah hexlet_7344445/donor_audit

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: hexlet-7344445-donor-audit
          path: hexlet_7344445/donor_audit/
          if-no-files-found: error
