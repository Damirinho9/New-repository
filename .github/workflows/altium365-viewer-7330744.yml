name: Altium 365 official viewer capture - order 7330744
on:
  push:
    branches:
      - altium365-viewer-7330744

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: altium365-viewer-7330744
          fetch-depth: 0

      - name: Fetch current verified Altium source artifact
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf current_altium
          mkdir -p current_altium viewer viewer_out
          gh run download 42601597689 -n 7330744-stage11-local-copper-fix -D current_altium
          find current_altium -type f -maxdepth 4 -printf '%p %s bytes\n' | sort
          project=$(find current_altium -type f -name '*.PrjPcb' | head -n1)
          sch=$(find current_altium -type f -name '*.SchDoc' | head -n1)
          pcb=$(find current_altium -type f -name '*.PcbDoc' | head -n1)
          test -n "$project" && test -n "$sch" && test -n "$pcb"
          sha256sum "$project" "$sch" "$pcb" | tee viewer_out/source_sha256.txt
          rm -f viewer/project.zip
          zip -j viewer/project.zip "$project" "$sch" "$pcb"
          unzip -l viewer/project.zip | tee viewer_out/project_zip_listing.txt
          sha256sum viewer/project.zip | tee viewer_out/project_zip_sha256.txt

      - name: Publish exact project ZIP for official Viewer
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f viewer/project.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish current Altium Viewer package [skip ci]"
            git push origin HEAD:altium365-viewer-7330744
          fi
          sleep 20
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/project.zip \
            "https://raw.githubusercontent.com/Damirinho9/New-repository/altium365-viewer-7330744/viewer/project.zip"
          sha256sum /tmp/project.zip viewer/project.zip | tee viewer_out/public_zip_check.txt
          cmp /tmp/project.zip viewer/project.zip

      - name: Install Playwright Chromium
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture official Altium 365 Viewer
        shell: bash
        run: |
          set -euxo pipefail
          python -m http.server 8000 > viewer_out/http_server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 3
          python viewer/capture.py 2>&1 | tee viewer_out/capture.log
          find viewer_out -type f -printf '%p %s bytes\n' | sort

      - name: Upload official Viewer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7330744-altium365-official-viewer
          path: viewer_out/
          if-no-files-found: warn
