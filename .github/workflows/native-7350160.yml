name: Native Microsoft Project 7350160
on:
  push:
    branches: [native-project-7350160]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download official signed ODT
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url='https://download.microsoft.com/download/6c1eeb25-cf8b-41d9-8d0d-cc1dbc032140/officedeploymenttool_20527-20150.exe'
          curl.exe -fL --retry 2 --max-time 120 $url -o odt.exe
          if ($LASTEXITCODE -ne 0) { throw 'ODT download failed' }
          $sig=Get-AuthenticodeSignature .\odt.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'ODT signature check failed' }
          New-Item -ItemType Directory -Force odt | Out-Null
          $p=Start-Process .\odt.exe -ArgumentList "/quiet /extract:$pwd\odt" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path odt/setup.exe)) { throw "ODT extraction failed: $($p.ExitCode)" }
      - name: Install Microsoft Project Professional 2024
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          <Configuration>
            <Add OfficeClientEdition="64" Channel="Current">
              <Product ID="ProjectPro2024Retail"><Language ID="ru-ru"/></Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE"/>
            <Updates Enabled="FALSE"/>
          </Configuration>
          '@ | Set-Content -Encoding UTF8 odt/configuration.xml
          $p=Start-Process .\odt\setup.exe -ArgumentList "/configure `"$pwd\odt\configuration.xml`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ODT configure failed: $($p.ExitCode)" }
          $exe=Join-Path $env:ProgramFiles 'Microsoft Office\root\Office16\WINPROJ.EXE'
          if (!(Test-Path $exe)) { throw 'WINPROJ.EXE not found' }
          (Get-Item $exe).VersionInfo | Format-List | Out-File project-version.txt
          Get-AuthenticodeSignature $exe | Format-List | Out-File project-signature.txt
      - name: Prepare sanitized model data
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force native-7350160 | Out-Null
          $b64=''
          $bytes=[Convert]::FromBase64String($b64)
          $ms=New-Object IO.MemoryStream(,$bytes)
          $gz=New-Object IO.Compression.GZipStream($ms,[IO.Compression.CompressionMode]::Decompress)
          $sr=New-Object IO.StreamReader($gz,[Text.Encoding]::UTF8)
          $json=$sr.ReadToEnd(); $sr.Dispose(); $gz.Dispose(); $ms.Dispose()
          [IO.File]::WriteAllText((Join-Path $pwd 'native-7350160\native_data.json'),$json,(New-Object Text.UTF8Encoding($false)))
      - name: Build and validate native MPP files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $DataPath=(Join-Path $pwd 'native-7350160\native_data.json')
          $OutDir=(Join-Path $pwd 'native-7350160\out')
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          $evidence=Join-Path $OutDir 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $progress=Join-Path $evidence 'progress.txt'
          function Mark([string]$m){$s="$(Get-Date -Format o) $m"; Write-Host $s; Add-Content -Encoding UTF8 $progress $s}
          function Close-Proj($app){try{if($app.Projects.Count -gt 0){$app.FileCloseEx(0)|Out-Null}}catch{}}
          function Num($x){if($null -eq $x -or $x -eq ''){0.0}else{[double]$x}}
          $data=Get-Content -Raw -Encoding UTF8 $DataPath | ConvertFrom-Json
          $app=New-Object -ComObject MSProject.Application
          $app.Visible=$false
          $app.DisplayAlerts=$false
          try{
            Mark 'TEST_A_START'
            $test=Join-Path $OutDir 'test_native.mpp'
            if(Test-Path $test){Remove-Item -Force $test}
            $app.FileNew()|Out-Null
            $p=$app.ActiveProject
            1..3|ForEach-Object{$t=$p.Tasks.Add("Native test $_");$t.Duration=480}
            $p.Tasks.Item(2).Predecessors='1';$p.Tasks.Item(3).Predecessors='2'
            $app.FileSaveAs($test)|Out-Null
            Close-Proj $app
            $app.FileOpenEx($test)|Out-Null
            if($app.ActiveProject.Tasks.Count -ne 3){throw 'TEST_A_ROUNDTRIP_FAILED'}
            Close-Proj $app
            Set-Content -Encoding UTF8 (Join-Path $evidence 'test_a.txt') 'PASS native MPP roundtrip'
            Mark 'TEST_A_PASS'

            Mark 'BASE_BUILD_START'
            $base=Join-Path $OutDir 'LR3_01_Baseline_V31.mpp'
            if(Test-Path $base){Remove-Item -Force $base}
            $app.FileNew()|Out-Null
            $p=$app.ActiveProject
            $p.ProjectStart=[datetime]'2026-01-12'
            Mark 'RESOURCES_START'
            foreach($pair in $data.resources){
              $r=$p.Resources.Add([string]$pair[0])
              $r.StandardRate=[double]$pair[1]
            }
            Mark 'RESOURCES_DONE'
            $n=0
            foreach($x in $data.base){
              $n++
              $t=$p.Tasks.Add([string]$x.name)
              $t.OutlineLevel=[int]$x.level
              if($x.kind -eq 'task'){
                $t.Duration=[int]([double]$x.duration*480)
                if($x.fixed -ne $null){$t.FixedCost=[double]$x.fixed}
              }elseif($x.kind -eq 'milestone'){$t.Duration=0}
              if($x.pred -and @($x.pred).Count -gt 0){$t.Predecessors=(@($x.pred)-join ',')}
              if(($n % 10)-eq 0){Mark "STRUCTURE_$n"}
            }
            Mark 'STRUCTURE_DONE'
            $stage=Join-Path $OutDir 'stage_structure.mpp'
            $app.FileSaveAs($stage)|Out-Null
            Mark 'STRUCTURE_SAVED'

            $n=0
            foreach($x in $data.base){
              if($x.kind -ne 'task'){continue}
              $n++
              $t=$p.Tasks.Item([int]$x.id)
              if([int]$x.res -gt 0){
                $rid=[int]$x.res
                [void]$t.Assignments.Add([Type]::Missing,$rid,1)
              }
              if(($n % 10)-eq 0){Mark "ASSIGN_$n"}
            }
            Mark 'ASSIGNMENTS_DONE'
            $stage2=Join-Path $OutDir 'stage_assigned.mpp'
            $app.FileSaveAs($stage2)|Out-Null
            Mark 'ASSIGNED_SAVED'

            [void]$app.BaselineSave($true)
            Mark 'BASELINE_DONE'
            $app.FileSaveAs($base)|Out-Null
            Mark 'BASELINE_FILE_SAVED'
            Close-Proj $app
            $app.FileOpenEx($base)|Out-Null
            $p=$app.ActiveProject
            $leaf=@($p.Tasks|Where-Object{$_ -ne $null -and -not $_.Summary -and -not $_.Milestone})
            $mile=@($p.Tasks|Where-Object{$_ -ne $null -and $_.Milestone})
            $res=@($p.Resources|Where-Object{$_ -ne $null -and $_.Name})
            $assign=0;foreach($t in $leaf){$assign+=@($t.Assignments|Where-Object{$_ -ne $null}).Count}
            $baselineCost=Num $p.ProjectSummaryTask.BaselineCost
            Mark "BASE_REOPEN leaf=$($leaf.Count) mile=$($mile.Count) res=$($res.Count) assign=$assign baseline=$baselineCost"
            if($leaf.Count -ne 40 -or $mile.Count -ne 8 -or $res.Count -lt 12 -or $assign -lt 40 -or $baselineCost -le 0){throw 'BASE_ACCEPTANCE_FAILED'}
            Close-Proj $app

            $copies=@(
              @{name='LR3_02_Tracking_V31.mpp';variant='track';status='2026-05-15';day=89;factor=.95},
              @{name='LR3_03_Risk_V31.mpp';variant='risk';status='';day=0;factor=1},
              @{name='LR4_01_Status_P1_V31.mpp';variant='track';status='2026-02-20';day=29;factor=.92},
              @{name='LR4_02_Status_P2_V31.mpp';variant='track';status='2026-04-03';day=59;factor=.90},
              @{name='LR4_03_Status_P3_V31.mpp';variant='track';status='2026-05-15';day=89;factor=.95}
            )
            $accept=@()
            $metrics=[ordered]@{}
            foreach($spec in $copies){
              $dest=Join-Path $OutDir $spec.name
              Copy-Item -Force $base $dest
              $app.FileOpenEx($dest)|Out-Null
              $p=$app.ActiveProject
              $variant=if($spec.variant -eq 'risk'){$data.risk}else{$data.track}
              foreach($x in $variant){
                if($x.kind -eq 'task'){
                  $t=$p.Tasks.Item([int]$x.id)
                  if($null -ne $t){$t.Duration=[int]([double]$x.duration*480);if($x.fixed -ne $null){$t.FixedCost=[double]$x.fixed}}
                }
              }
              if($spec.status){
                $p.StatusDate=[datetime]$spec.status
                $p.SpreadPercentCompleteToStatusDate=$true
                foreach($x in $variant){
                  if($x.kind -ne 'task'){continue}
                  $s=[double]$x.s;$e=[double]$x.e;$pct=0
                  if([double]$spec.day -ge $e){$pct=100}
                  elseif([double]$spec.day -gt $s -and $e -gt $s){$pct=[math]::Min(99,[math]::Round((([double]$spec.day-$s)/($e-$s))*100*[double]$spec.factor,0))}
                  $t=$p.Tasks.Item([int]$x.id);if($null -ne $t){$t.PercentComplete=[int]$pct}
                }
              }
              $app.CalculateProject()|Out-Null
              $app.FileSave()|Out-Null
              Close-Proj $app
              $app.FileOpenEx($dest)|Out-Null
              $p=$app.ActiveProject
              $s=$p.ProjectSummaryTask
              $m=[ordered]@{StatusDate=[string]$p.StatusDate;Cost=Num $s.Cost;BaselineCost=Num $s.BaselineCost;Work=Num $s.Work;BaselineWork=Num $s.BaselineWork;BCWS=Num $s.BCWS;BCWP=Num $s.BCWP;ACWP=Num $s.ACWP;CV=Num $s.CV;SV=Num $s.SV;CPI=Num $s.CPI;SPI=Num $s.SPI;EAC=Num $s.EAC;VAC=Num $s.VAC;Finish=[string]$s.Finish}
              $metrics[$spec.name]=$m
              $accept+=[pscustomobject]@{File=$spec.name;Bytes=(Get-Item $dest).Length;Tasks=$p.Tasks.Count;Resources=$p.Resources.Count;StatusDate=[string]$p.StatusDate;BaselineCost=$m.BaselineCost;SHA256=(Get-FileHash $dest -Algorithm SHA256).Hash;Pass=$true}
              Close-Proj $app
              Mark "COPY_DONE $($spec.name)"
            }
            $accept+=[pscustomobject]@{File='LR3_01_Baseline_V31.mpp';Bytes=(Get-Item $base).Length;Tasks=65;Resources=12;StatusDate='';BaselineCost=$baselineCost;SHA256=(Get-FileHash $base -Algorithm SHA256).Hash;Pass=$true}
            $accept|ConvertTo-Json -Depth 8|Set-Content -Encoding UTF8 (Join-Path $OutDir 'Acceptance_Report.json')
            $metrics|ConvertTo-Json -Depth 8|Set-Content -Encoding UTF8 (Join-Path $OutDir 'project_metrics.json')
            Mark 'ALL_DONE'
          }finally{
            Close-Proj $app
            try{$app.Quit()|Out-Null}catch{}
            try{[void][Runtime.InteropServices.Marshal]::ReleaseComObject($app)}catch{}
          }
      - name: Publish native artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-7350160
          path: |
            native-7350160/out/**
            project-version.txt
            project-signature.txt
          if-no-files-found: warn
