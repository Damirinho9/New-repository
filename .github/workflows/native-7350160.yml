name: Native Microsoft Project 7350160
on:
  push:
    branches: [native-project-7350160]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download official signed ODT
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url='https://download.microsoft.com/download/6c1eeb25-cf8b-41d9-8d0d-cc1dbc032140/officedeploymenttool_20527-20150.exe'
          curl.exe -fL --retry 2 --max-time 120 $url -o odt.exe
          if ($LASTEXITCODE -ne 0) { throw 'ODT download failed' }
          $sig=Get-AuthenticodeSignature .\odt.exe
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'ODT signature check failed' }
          New-Item -ItemType Directory -Force odt | Out-Null
          $p=Start-Process .\odt.exe -ArgumentList "/quiet /extract:$pwd\odt" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path odt/setup.exe)) { throw "ODT extraction failed: $($p.ExitCode)" }
      - name: Install Microsoft Project Professional 2024
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          <Configuration>
            <Add OfficeClientEdition="64" Channel="Current">
              <Product ID="ProjectPro2024Retail"><Language ID="ru-ru"/></Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE"/>
            <Updates Enabled="FALSE"/>
          </Configuration>
          '@ | Set-Content -Encoding UTF8 odt/configuration.xml
          $p=Start-Process .\odt\setup.exe -ArgumentList "/configure `"$pwd\odt\configuration.xml`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "ODT configure failed: $($p.ExitCode)" }
          $exe=Join-Path $env:ProgramFiles 'Microsoft Office\root\Office16\WINPROJ.EXE'
          if (!(Test-Path $exe)) { throw 'WINPROJ.EXE not found' }
          (Get-Item $exe).VersionInfo | Format-List | Out-File project-version.txt
          Get-AuthenticodeSignature $exe | Format-List | Out-File project-signature.txt
      - name: Prepare sanitized model data
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force native-7350160 | Out-Null
          $b64=''
          $bytes=[Convert]::FromBase64String($b64)
          $ms=New-Object IO.MemoryStream(,$bytes)
          $gz=New-Object IO.Compression.GZipStream($ms,[IO.Compression.CompressionMode]::Decompress)
          $sr=New-Object IO.StreamReader($gz,[Text.Encoding]::UTF8)
          $json=$sr.ReadToEnd(); $sr.Dispose(); $gz.Dispose(); $ms.Dispose()
          [IO.File]::WriteAllText((Join-Path $pwd 'native-7350160\native_data.json'),$json,(New-Object Text.UTF8Encoding($false)))
      - name: Build and validate native MPP files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $DataPath=(Join-Path $pwd 'native-7350160\native_data.json')
          $OutDir=(Join-Path $pwd 'native-7350160\out')
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          $evidence = Join-Path $OutDir 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $data = Get-Content -Raw -Encoding UTF8 $DataPath | ConvertFrom-Json
          $script:accept = @()
          $script:metrics = [ordered]@{}
          function Num($x){ if($null -eq $x -or $x -eq ''){ return 0.0 }; return [double]$x }
          function Save-Json($obj,[string]$path){ $obj | ConvertTo-Json -Depth 12 | Set-Content -Encoding UTF8 $path }
          function Close-Project($app){ try { if($app.Projects.Count -gt 0){ $app.FileCloseEx(0) | Out-Null } } catch {} }
          function Add-Resources($p,$resources){
            foreach($pair in $resources){
              $r=$p.Resources.Add([string]$pair[0])
              $r.StandardRate=[double]$pair[1]
            }
          }
          function Add-BaseStructure($p,$tasks,$resources){
            Add-Resources $p $resources
            foreach($x in $tasks){
              $t=$p.Tasks.Add([string]$x.name)
              $t.OutlineLevel=[int]$x.level
              if($x.kind -eq 'task'){
                $t.Duration=[int]([double]$x.duration*480)
                if($x.fixed -ne $null){ $t.FixedCost=[double]$x.fixed }
                if([int]$x.res -gt 0){
                  $resName=[string]$resources[[int]$x.res-1][0]
                  $t.ResourceNames=$resName
                }
              } elseif($x.kind -eq 'milestone'){
                $t.Duration=0
              }
              if($x.pred -and @($x.pred).Count -gt 0){
                $t.Predecessors=(@($x.pred) -join ',')
              }
            }
          }
          function Apply-VariantDurations($p,$variant){
            foreach($x in $variant){
              if($x.kind -eq 'task'){
                $t=$p.Tasks.Item([int]$x.id)
                if($null -ne $t){
                  $t.Duration=[int]([double]$x.duration*480)
                  if($x.fixed -ne $null){$t.FixedCost=[double]$x.fixed}
                }
              }
            }
          }
          function Apply-Progress($p,$variant,[double]$statusDay,[double]$factor){
            foreach($x in $variant){
              if($x.kind -ne 'task'){continue}
              $s=[double]$x.s; $e=[double]$x.e
              $pct=0.0
              if($statusDay -ge $e){$pct=100.0}
              elseif($statusDay -le $s){$pct=0.0}
              elseif($e -gt $s){$pct=(($statusDay-$s)/($e-$s))*100.0}
              if($pct -gt 0 -and $pct -lt 100){$pct=[math]::Min(99,[math]::Round($pct*$factor,0))}
              $t=$p.Tasks.Item([int]$x.id)
              if($null -ne $t){$t.PercentComplete=[int]$pct}
            }
          }
          function Extract-Metrics($p){
            $s=$p.ProjectSummaryTask
            $bcws=Num $s.BCWS; $bcwp=Num $s.BCWP; $acwp=Num $s.ACWP; $bac=Num $s.BaselineCost
            $cpi= if($acwp -ne 0){$bcwp/$acwp}else{0}
            $spi= if($bcws -ne 0){$bcwp/$bcws}else{0}
            $eac=Num $s.EAC; if($eac -eq 0 -and $cpi -ne 0){$eac=$acwp+(($bac-$bcwp)/$cpi)}
            $vac=$bac-$eac
            $tcpi= if(($bac-$acwp) -ne 0){($bac-$bcwp)/($bac-$acwp)}else{0}
            return [ordered]@{
              StatusDate=[string]$p.StatusDate; Cost=Num $s.Cost; BaselineCost=$bac; Work=Num $s.Work; BaselineWork=Num $s.BaselineWork;
              DurationDays=(Num $s.Duration)/480; BCWS=$bcws; BCWP=$bcwp; ACWP=$acwp; CV=Num $s.CV; SV=Num $s.SV;
              CPI=$cpi; SPI=$spi; EAC=$eac; VAC=$vac; TCPI=$tcpi; Finish=[string]$s.Finish
            }
          }
          function Validate-Open($app,[string]$path,[string]$name,[bool]$needBaseline,[bool]$needStatus){
            $app.FileOpenEx($path) | Out-Null
            $p=$app.ActiveProject
            $all=@($p.Tasks | Where-Object {$_ -ne $null})
            $leaf=@($all | Where-Object {-not $_.Summary -and -not $_.Milestone})
            $mile=@($all | Where-Object {$_.Milestone})
            $maxLevel=($all | Measure-Object -Property OutlineLevel -Maximum).Maximum
            $resCount=@($p.Resources | Where-Object {$_ -ne $null -and $_.Name}).Count
            $assignmentCount=0; foreach($t in $leaf){$assignmentCount += @($t.Assignments | Where-Object {$_ -ne $null}).Count}
            $m=Extract-Metrics $p
            $ok=($leaf.Count -eq 40 -and $mile.Count -eq 8 -and $maxLevel -ge 4 -and $resCount -ge 12 -and $assignmentCount -ge 40)
            if($needBaseline){$ok = $ok -and ([double]$m.BaselineCost -gt 0)}
            if($needStatus){$ok = $ok -and ([string]$p.StatusDate -ne 'NA')}
            $hash=(Get-FileHash $path -Algorithm SHA256).Hash
            $script:accept += [pscustomobject]@{File=$name;Bytes=(Get-Item $path).Length;Tasks=$all.Count;Leaf=$leaf.Count;Milestones=$mile.Count;MaxOutline=$maxLevel;Resources=$resCount;Assignments=$assignmentCount;BaselineCost=$m.BaselineCost;StatusDate=$m.StatusDate;SHA256=$hash;Pass=$ok}
            $script:metrics[$name]=$m
            Close-Project $app
            return $ok
          }
          $app=New-Object -ComObject MSProject.Application
          $app.Visible=$false
          try{
            $test=Join-Path $OutDir 'test_native.mpp'
            if(Test-Path $test){Remove-Item -Force $test}
            $app.FileNew() | Out-Null
            $p=$app.ActiveProject
            $p.ProjectStart=[datetime]'2026-01-12'
            1..3 | ForEach-Object { $t=$p.Tasks.Add("Native test $_"); $t.Duration=480 }
            $p.Tasks.Item(2).Predecessors='1'; $p.Tasks.Item(3).Predecessors='2'
            $app.FileSaveAs($test) | Out-Null
            if(!(Test-Path $test)){throw 'TEST A: MPP file was not written'}
            Close-Project $app
            $app.FileOpenEx($test) | Out-Null
            if($app.ActiveProject.Tasks.Count -ne 3){throw "TEST A: expected 3 tasks, got $($app.ActiveProject.Tasks.Count)"}
            Close-Project $app
            'PASS native MPP roundtrip' | Set-Content -Encoding UTF8 (Join-Path $evidence 'test_a.txt')
            $models=@(
              [pscustomobject]@{Name='LR3_01_Baseline_V31.mpp';Variant='base';Status='';Day=0;Factor=1.0},
              [pscustomobject]@{Name='LR3_02_Tracking_V31.mpp';Variant='track';Status='2026-05-15';Day=89;Factor=0.95},
              [pscustomobject]@{Name='LR3_03_Risk_V31.mpp';Variant='risk';Status='';Day=0;Factor=1.0},
              [pscustomobject]@{Name='LR4_01_Status_P1_V31.mpp';Variant='track';Status='2026-02-20';Day=29;Factor=0.92},
              [pscustomobject]@{Name='LR4_02_Status_P2_V31.mpp';Variant='track';Status='2026-04-03';Day=59;Factor=0.90},
              [pscustomobject]@{Name='LR4_03_Status_P3_V31.mpp';Variant='track';Status='2026-05-15';Day=89;Factor=0.95}
            )
            foreach($spec in $models){
              $dest=Join-Path $OutDir $spec.Name
              if(Test-Path $dest){Remove-Item -Force $dest}
              $app.FileNew() | Out-Null
              $p=$app.ActiveProject
              $p.ProjectStart=[datetime]'2026-01-12'
              Add-BaseStructure $p $data.base $data.resources
              $app.CalculateProject() | Out-Null
              $app.BaselineSave() | Out-Null
              if($spec.Variant -eq 'track'){Apply-VariantDurations $p $data.track}
              elseif($spec.Variant -eq 'risk'){Apply-VariantDurations $p $data.risk}
              if($spec.Status){
                $p.StatusDate=[datetime]$spec.Status
                $p.SpreadPercentCompleteToStatusDate=$true
                $variant = if($spec.Variant -eq 'risk'){$data.risk}elseif($spec.Variant -eq 'track'){$data.track}else{$data.base}
                Apply-Progress $p $variant ([double]$spec.Day) ([double]$spec.Factor)
              }
              $app.CalculateProject() | Out-Null
              $app.FileSaveAs($dest) | Out-Null
              Close-Project $app
              [void](Validate-Open $app $dest $spec.Name $true ([bool]$spec.Status))
            }
            Save-Json $script:accept (Join-Path $OutDir 'Acceptance_Report.json')
            Save-Json $script:metrics (Join-Path $OutDir 'project_metrics.json')
            if(@($script:accept | Where-Object {-not $_.Pass}).Count -gt 0){throw 'One or more MPP files failed acceptance checks'}
          }
          finally{
            Close-Project $app
            try{$app.Quit() | Out-Null}catch{}
            try{[void][Runtime.InteropServices.Marshal]::ReleaseComObject($app)}catch{}
          }
      - name: Publish native artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-7350160
          path: |
            native-7350160/out/**
            project-version.txt
            project-signature.txt
          if-no-files-found: warn
