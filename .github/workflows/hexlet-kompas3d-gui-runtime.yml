name: Hexlet KOMPAS-3D KsAPICLink Probe

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  link-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official KOMPAS v25 SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg desktop-file-utils unzip
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p link_probe/samples
      - name: Extract official KsAPICLink Python samples and README
        shell: bash
        run: |
          set -euxo pipefail
          SDK=/opt/ascon/kompas3d-v25/SDK/KsAPICLink
          cp "$SDK/ReadMe.txt" link_probe/ReadMe.txt
          unzip -q "$SDK/Python/Samples.zip" -d link_probe/samples
          find link_probe/samples -type f -printf '%P\n' | sort > link_probe/sample-files.txt
          grep -RniE 'Connect|Application|Documents|AddWithDefaultSettings|CreateDocument|GetDocuments|GetActiveDocument' \
            link_probe/samples > link_probe/sample-api-hits.txt || true
          for f in $(find link_probe/samples -type f \( -name '*.py' -o -name '*.txt' \)); do
            echo "===== $f ====="
            sed -n '1,260p' "$f"
          done > link_probe/sample-sources.txt
          test -s link_probe/sample-sources.txt
          echo RESULT=PASS_KSAPICLINK_SAMPLES_EXTRACTED > link_probe/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas-v25-ksapiclink-python-samples
          path: link_probe/
          if-no-files-found: error
