name: Hexlet KOMPAS-3D GUI Runtime

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
      - "hexlet_7344445/stage4_create_drawing.py"
  workflow_dispatch:

jobs:
  kompas3d-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official ASCON KOMPAS-3D v25 + SDK and GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y             wget ca-certificates gnupg xvfb openbox xdotool imagemagick desktop-file-utils             x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri             libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main'             | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p runtime_evidence
          command -v kompas-v25 | tee runtime_evidence/launcher.txt
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

          # Initialize the per-user KOMPAS profile from installed ASCON defaults.
          mkdir -p "$HOME/.config/ascon/KOMPAS-3D/25"
          find /opt/ascon /etc/ascon /usr/share -type f \
            \( -name 'UI_Shortcuts.config' -o -name 'UI_AppPaths.config' -o -name 'QtResources.bin' \) \
            -print | sort | tee runtime_evidence/config-candidates.txt || true
          for base in UI_Shortcuts.config UI_AppPaths.config QtResources.bin; do
            src=$(find /opt/ascon /etc/ascon /usr/share -type f -name "$base" 2>/dev/null | head -1 || true)
            if [ -n "$src" ]; then
              cp -f "$src" "$HOME/.config/ascon/KOMPAS-3D/25/$base"
              echo "$base <= $src" | tee -a runtime_evidence/config-copied.txt
            else
              echo "$base <= NOT_FOUND" | tee -a runtime_evidence/config-copied.txt
            fi
          done
          find "$HOME/.config/ascon/KOMPAS-3D/25" -maxdepth 1 -type f -printf '%f %s\n' \
            | sort | tee runtime_evidence/user-config-before-launch.txt

      - name: Accept EULA and open File-Create dialog in real GUI
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >runtime_evidence/xvfb.log 2>&1 &
          echo $! > runtime_evidence/xvfb.pid
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          echo $! > runtime_evidence/openbox.pid
          sleep 2

          kompas-v25 >runtime_evidence/kompas-first.out 2>runtime_evidence/kompas-first.err &
          FIRST_PID=$!
          echo "$FIRST_PID" > runtime_evidence/kompas-first.pid

          MAIN_WID=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN_WID" ] && break
          done
          test -n "$MAIN_WID"
          echo "MAIN_WINDOW_ID=$MAIN_WID" | tee runtime_evidence/main-window-first.txt
          sleep 25

          EULA_WID=""
          for i in $(seq 1 30); do
            EULA_WID=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA_WID" ] && break
            sleep 1
          done
          test -n "$EULA_WID"

          # Move modal aside so the native "Чертеж" tile is exposed.
          xdotool windowmove "$EULA_WID" 1320 260
          sleep 2
          import -display :99 -window root runtime_evidence/01_home_with_drawing_tile_exposed.png
          xdotool getwindowgeometry --shell "$EULA_WID" | tee runtime_evidence/eula-geometry-moved.txt

          # Click the actual "Принимаю" button in EULA client coordinates.
          # Measured button centre on the real 500x650 Qt dialog: x≈325, y≈630.
          xdotool windowfocus --sync "$EULA_WID"
          xdotool mousemove --window "$EULA_WID" --sync 325 630
          xdotool getmouselocation --shell | tee runtime_evidence/eula-accept-pointer.txt
          import -display :99 -window root runtime_evidence/02_eula_before_accept.png
          xdotool click 1
          sleep 4

          # Hard gate: the exact original EULA XID must no longer be viewable.
          if xwininfo -id "$EULA_WID" -all > runtime_evidence/eula-xid-after.txt 2>&1; then
            if grep -q 'Map State: IsViewable' runtime_evidence/eula-xid-after.txt; then
              import -display :99 -window root runtime_evidence/03_eula_FAILED_still_visible.png
              echo 'RESULT=FAIL_EULA_XID_STILL_VIEWABLE' | tee runtime_evidence/result.txt
              exit 41
            fi
          else
            echo 'EULA_XID_DESTROYED=1' | tee runtime_evidence/eula-xid-destroyed.txt
          fi

          EULA_STILL=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER_CLICK=$EULA_STILL" | tee runtime_evidence/eula-after-click.txt
          test -z "$EULA_STILL"

          import -display :99 -window root runtime_evidence/04_home_after_eula_confirmed_gone.png

          # Click the real "Чертеж" tile on the fully rendered KOMPAS start page.
          xdotool windowfocus --sync "$MAIN_WID"
          xdotool mousemove --sync 919 208
          xdotool getmouselocation --shell | tee runtime_evidence/drawing-tile-pointer.txt
          xdotool click 1
          sleep 15

          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null             | tee runtime_evidence/visible-windows-after-drawing-click.txt || true
          xwininfo -root -tree > runtime_evidence/xwin-tree-after-drawing.txt
          ps aux | grep -Ei 'kompas-v25|kKompas|kompas3d' | grep -v grep             | tee runtime_evidence/processes-after-drawing.txt

          DRAWING_WID=$(xdotool search --onlyvisible --name '.*Чертеж.*|.*КОМПАС-3D v25.*' 2>/dev/null | tail -1 || true)
          echo "DRAWING_WINDOW_ID=$DRAWING_WID" | tee runtime_evidence/drawing-window.txt
          [ -n "$DRAWING_WID" ]

          import -display :99 -window root runtime_evidence/05_after_drawing_click_root.png
          import -display :99 -window "$MAIN_WID" runtime_evidence/06_after_drawing_click_main.png

          echo 'RESULT=PASS_EULA_GONE_DRAWING_CLICK_EXECUTED' | tee runtime_evidence/result.txt

      - name: Strict drawing creation evidence gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s runtime_evidence/01_home_with_drawing_tile_exposed.png
          test -s runtime_evidence/04_home_after_eula_confirmed_gone.png
          test -s runtime_evidence/05_after_drawing_click_root.png
          test -s runtime_evidence/06_after_drawing_click_main.png
          grep -q '^EULA_AFTER_CLICK=$' runtime_evidence/eula-after-click.txt
          if [ -f runtime_evidence/eula-xid-after.txt ]; then
            ! grep -q 'Map State: IsViewable' runtime_evidence/eula-xid-after.txt
          fi
          grep -q '^RESULT=PASS_EULA_GONE_DRAWING_CLICK_EXECUTED$' runtime_evidence/result.txt
          sha256sum runtime_evidence/04_home_after_eula_confirmed_gone.png             runtime_evidence/05_after_drawing_click_root.png             runtime_evidence/06_after_drawing_click_main.png             | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-drawing-creation-evidence
          path: runtime_evidence/
          if-no-files-found: error
