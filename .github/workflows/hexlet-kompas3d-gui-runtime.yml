name: Hexlet KOMPAS-3D GUI Runtime

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  kompas3d-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official ASCON KOMPAS-3D v25 + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget ca-certificates gnupg xvfb openbox xdotool imagemagick desktop-file-utils \
            x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri wmctrl xclip \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p runtime_evidence
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

      - name: Accept EULA, relaunch clean GUI, open native New Document dialog
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >runtime_evidence/xvfb.log 2>&1 &
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          sleep 2

          kompas-v25 >runtime_evidence/kompas-first.out 2>runtime_evidence/kompas-first.err &
          FIRST_PID=$!

          MAIN_WID=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN_WID" ] && break
          done
          test -n "$MAIN_WID"
          sleep 25

          EULA_WID=""
          for i in $(seq 1 30); do
            EULA_WID=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA_WID" ] && break
            sleep 1
          done
          test -n "$EULA_WID"

          eval "$(xdotool getwindowgeometry --shell "$EULA_WID")"
          CLICK_X=$((X + WIDTH * 65 / 100))
          CLICK_Y=$((Y + HEIGHT - 42))
          xdotool windowfocus --sync "$EULA_WID"
          xdotool mousemove --sync "$CLICK_X" "$CLICK_Y"
          import -display :99 -window root runtime_evidence/01_eula_before_accept.png
          xdotool click 1
          sleep 3

          EULA_STILL=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER_CLICK=$EULA_STILL" | tee runtime_evidence/eula-after-click.txt
          test -z "$EULA_STILL"

          xdotool windowclose "$MAIN_WID" || true
          for i in $(seq 1 30); do
            sleep 1
            ! ps -p "$FIRST_PID" >/dev/null 2>&1 && break
          done
          kill "$FIRST_PID" 2>/dev/null || true
          sleep 3

          kompas-v25 >runtime_evidence/kompas-second.out 2>runtime_evidence/kompas-second.err &
          SECOND_PID=$!
          echo "$SECOND_PID" > runtime_evidence/kompas-second.pid

          SECOND_WID=""
          for i in $(seq 1 90); do
            sleep 1
            SECOND_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$SECOND_WID" ] && break
          done
          test -n "$SECOND_WID"
          sleep 20

          EULA_SECOND=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_ON_SECOND_LAUNCH=$EULA_SECOND" | tee runtime_evidence/eula-second-launch.txt
          test -z "$EULA_SECOND"

          xdotool windowfocus --sync "$SECOND_WID"
          import -display :99 -window root runtime_evidence/02_clean_second_launch.png

          # Official KOMPAS v25 method: double-click free space in the document tab row.
          # Main window is 1920x1080; the tab row is immediately below the main menu.
          xdotool mousemove --window "$SECOND_WID" --sync 900 48
          xdotool click --repeat 2 --delay 180 1
          sleep 5

          FOCUS_NEW=$(xdotool getwindowfocus)
          echo "MAIN_WID=$SECOND_WID" | tee runtime_evidence/new-document-focus.txt
          echo "FOCUS_NEW=$FOCUS_NEW" | tee -a runtime_evidence/new-document-focus.txt
          xdotool getwindowname "$FOCUS_NEW" | tee -a runtime_evidence/new-document-focus.txt || true
          xdotool getwindowgeometry --shell "$FOCUS_NEW" | tee runtime_evidence/new-document-geometry.txt || true
          wmctrl -l -G | tee runtime_evidence/windows-after-new-document.txt || true
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
            | tee runtime_evidence/visible-windows-after-new-document.txt || true
          import -display :99 -window root runtime_evidence/03_new_document_dialog.png

          if [ "$FOCUS_NEW" = "$SECOND_WID" ]; then
            echo 'RESULT=FAIL_NEW_DOCUMENT_DIALOG_NOT_OPENED' | tee runtime_evidence/result.txt
            exit 71
          fi

          echo 'RESULT=PASS_NATIVE_NEW_DOCUMENT_DIALOG_OPENED' | tee runtime_evidence/result.txt

      - name: Strict native New Document gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^EULA_AFTER_CLICK=$' runtime_evidence/eula-after-click.txt
          grep -q '^EULA_ON_SECOND_LAUNCH=$' runtime_evidence/eula-second-launch.txt
          grep -q '^RESULT=PASS_NATIVE_NEW_DOCUMENT_DIALOG_OPENED$' runtime_evidence/result.txt
          test -s runtime_evidence/03_new_document_dialog.png
          sha256sum runtime_evidence/02_clean_second_launch.png runtime_evidence/03_new_document_dialog.png \
            | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-new-document-dialog
          path: runtime_evidence/
          if-no-files-found: error
