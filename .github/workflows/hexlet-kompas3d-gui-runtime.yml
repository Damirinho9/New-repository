name: Hexlet KOMPAS-3D Native Drawing Same GUI

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  drawing-same-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 GUI + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget ca-certificates gnupg desktop-file-utils \
            xvfb openbox xdotool imagemagick x11-utils x11-xserver-utils \
            mesa-utils libgl1-mesa-dri xclip \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0

          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25

          mkdir -p runtime_evidence
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

      - name: Accept EULA and create a real Drawing in the same rendered GUI
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            >runtime_evidence/xvfb.log 2>&1 &
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          sleep 2

          kompas-v25 >runtime_evidence/kompas.out 2>runtime_evidence/kompas.err &
          KPID=$!
          echo "$KPID" > runtime_evidence/kompas.pid

          MAIN=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN" ] && break
          done
          test -n "$MAIN"
          echo "MAIN=$MAIN" | tee runtime_evidence/main.txt

          EULA=""
          for i in $(seq 1 90); do
            sleep 1
            EULA=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA" ] && break
          done
          test -n "$EULA"

          # By the time the EULA exists, the home screen behind it is already rendered.
          import -display :99 -window root runtime_evidence/01_home_with_eula.png

          eval "$(xdotool getwindowgeometry --shell "$EULA")"
          ACCEPT_X=$((X + WIDTH * 65 / 100))
          ACCEPT_Y=$((Y + HEIGHT - 42))
          printf 'EULA=%s\nX=%s\nY=%s\nWIDTH=%s\nHEIGHT=%s\nACCEPT_X=%s\nACCEPT_Y=%s\n' \
            "$EULA" "$X" "$Y" "$WIDTH" "$HEIGHT" "$ACCEPT_X" "$ACCEPT_Y" \
            | tee runtime_evidence/eula-geometry.txt

          xdotool windowfocus --sync "$EULA"
          xdotool mousemove --sync "$ACCEPT_X" "$ACCEPT_Y"
          xdotool click 1
          sleep 3

          EULA_AFTER=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER=$EULA_AFTER" | tee runtime_evidence/eula-after.txt
          test -z "$EULA_AFTER"

          # Force the already-rendered main window to repaint and receive input.
          xdotool windowactivate --sync "$MAIN"
          xdotool windowfocus --sync "$MAIN"
          xdotool key --window "$MAIN" F5 || true
          sleep 3
          import -display :99 -window root runtime_evidence/02_home_after_eula.png

          # Route A: exact Drawing tile from the native KOMPAS home page.
          # Coordinates are relative to the 1920x1080 main KOMPAS window.
          xdotool windowfocus --sync "$MAIN"
          xdotool mousemove --window "$MAIN" --sync 920 203
          xdotool getmouselocation --shell | tee runtime_evidence/drawing-tile-target.txt
          xdotool click --repeat 2 --delay 180 1

          DOC_SEEN=""
          for i in $(seq 1 60); do
            sleep 1
            TITLES=$(xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null || true)
            printf '%s\n' "$TITLES" > runtime_evidence/window-titles-current.txt
            if printf '%s\n' "$TITLES" | grep -Eiq 'Чертеж|Drawing|.cdw'; then
              DOC_SEEN="TITLE"
              break
            fi
          done

          import -display :99 -window root runtime_evidence/03_after_drawing_tile.png

          # Functional probe: Ctrl+S must create a save surface for an unsaved document.
          xdotool windowfocus --sync "$MAIN"
          xdotool key ctrl+s
          sleep 5

          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
            | tee runtime_evidence/window-titles-after-save.txt || true

          # A Qt native save dialog may keep focus in the KOMPAS top-level window,
          # so also look for QFileDialog evidence in the live stderr.
          SAVE_TITLE=$(xdotool search --onlyvisible --name 'Сохран|Save|Сохранение' 2>/dev/null | tail -1 || true)
          QFILE_COUNT=$(grep -c 'QFileDialog' runtime_evidence/kompas.err || true)
          printf 'DOC_SEEN=%s\nSAVE_TITLE=%s\nQFILE_COUNT=%s\n' "$DOC_SEEN" "$SAVE_TITLE" "$QFILE_COUNT" \
            | tee runtime_evidence/drawing-probe.txt
          import -display :99 -window root runtime_evidence/04_after_ctrl_s.png

          PASS_ROUTE=""
          if [ -n "$DOC_SEEN" ] || [ -n "$SAVE_TITLE" ] || [ "$QFILE_COUNT" -gt 0 ]; then
            PASS_ROUTE="DRAWING_TILE"
          fi

          # Route B: real File -> New shortcut, only if tile was not functionally confirmed.
          if [ -z "$PASS_ROUTE" ]; then
            xdotool key Escape Escape Escape || true
            xdotool windowfocus --sync "$MAIN"
            xdotool key ctrl+n
            sleep 4
            xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
              | tee runtime_evidence/window-titles-after-ctrl-n.txt || true
            import -display :99 -window root runtime_evidence/05_ctrl_n_create_dialog.png

            CREATE_WID=$(xdotool search --onlyvisible --name 'Создать|Новый|New' 2>/dev/null | tail -1 || true)
            echo "CREATE_WID=$CREATE_WID" | tee runtime_evidence/create-dialog.txt

            if [ -n "$CREATE_WID" ]; then
              xdotool windowfocus --sync "$CREATE_WID"
              # Select "Чертеж" by typing its first Cyrillic letter through clipboard search if supported.
              printf 'Чертеж' | xclip -selection clipboard
              xdotool key ctrl+f || true
              xdotool key ctrl+v || true
              xdotool key Return || true
              sleep 10
            else
              # Standard KOMPAS create dialog defaults to document type list.
              # Use keyboard navigation, not absolute coordinates.
              xdotool key Down Down Return || true
              sleep 10
            fi

            import -display :99 -window root runtime_evidence/06_after_ctrl_n_selection.png
            xdotool key ctrl+s
            sleep 5

            SAVE_TITLE2=$(xdotool search --onlyvisible --name 'Сохран|Save|Сохранение' 2>/dev/null | tail -1 || true)
            QFILE_COUNT2=$(grep -c 'QFileDialog' runtime_evidence/kompas.err || true)
            TITLES2=$(xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null || true)
            printf '%s\n' "$TITLES2" > runtime_evidence/window-titles-final.txt

            if printf '%s\n' "$TITLES2" | grep -Eiq 'Чертеж|Drawing|.cdw' || \
               [ -n "$SAVE_TITLE2" ] || [ "$QFILE_COUNT2" -gt "$QFILE_COUNT" ]; then
              PASS_ROUTE="CTRL_N"
            fi

            printf 'SAVE_TITLE2=%s\nQFILE_COUNT2=%s\n' "$SAVE_TITLE2" "$QFILE_COUNT2" \
              | tee -a runtime_evidence/drawing-probe.txt
            import -display :99 -window root runtime_evidence/07_after_ctrl_n_save.png
          fi

          echo "PASS_ROUTE=$PASS_ROUTE" | tee runtime_evidence/pass-route.txt
          if [ -z "$PASS_ROUTE" ]; then
            echo 'RESULT=FAIL_REAL_DRAWING_NOT_CONFIRMED' | tee runtime_evidence/result.txt
            exit 51
          fi

          echo 'RESULT=PASS_REAL_DRAWING_CREATED' | tee runtime_evidence/result.txt

      - name: Strict drawing gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^EULA_AFTER=$' runtime_evidence/eula-after.txt
          grep -Eq '^PASS_ROUTE=(DRAWING_TILE|CTRL_N)$' runtime_evidence/pass-route.txt
          grep -q '^RESULT=PASS_REAL_DRAWING_CREATED$' runtime_evidence/result.txt
          test -s runtime_evidence/02_home_after_eula.png
          test -s runtime_evidence/03_after_drawing_tile.png
          test -s runtime_evidence/04_after_ctrl_s.png
          sha256sum runtime_evidence/*.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-drawing-same-gui
          path: runtime_evidence/
          if-no-files-found: error
