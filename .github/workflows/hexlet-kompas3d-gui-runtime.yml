name: Hexlet KOMPAS-3D Native Drawing Fresh GUI

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  drawing-fresh-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 GUI + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget ca-certificates gnupg desktop-file-utils \
            xvfb openbox xdotool imagemagick x11-utils x11-xserver-utils \
            mesa-utils libgl1-mesa-dri xclip \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0

          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 \
            ascon-kompas-graphic-v25 \
            ascon-kompas3d-v25 \
            ascon-kompas-sdk-v25

          mkdir -p runtime_evidence
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

      - name: Accept EULA then relaunch clean GUI and create real Drawing
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            >runtime_evidence/xvfb.log 2>&1 &
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          sleep 2

          # First launch - only for deterministic EULA acceptance.
          kompas-v25 >runtime_evidence/kompas-first.out 2>runtime_evidence/kompas-first.err &
          KPID1=$!
          echo "$KPID1" > runtime_evidence/kompas-first.pid

          MAIN1=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN1=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN1" ] && break
          done
          test -n "$MAIN1"
          echo "MAIN1=$MAIN1" | tee runtime_evidence/main-first.txt

          sleep 25

          EULA=""
          for i in $(seq 1 30); do
            EULA=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA" ] && break
            sleep 1
          done
          test -n "$EULA"

          eval "$(xdotool getwindowgeometry --shell "$EULA")"
          ACCEPT_X=$((X + WIDTH * 65 / 100))
          ACCEPT_Y=$((Y + HEIGHT - 42))
          printf 'EULA=%s\nX=%s\nY=%s\nWIDTH=%s\nHEIGHT=%s\nACCEPT_X=%s\nACCEPT_Y=%s\n' \
            "$EULA" "$X" "$Y" "$WIDTH" "$HEIGHT" "$ACCEPT_X" "$ACCEPT_Y" \
            | tee runtime_evidence/eula-geometry.txt

          import -display :99 -window root runtime_evidence/01_eula.png
          xdotool windowfocus --sync "$EULA"
          xdotool mousemove --sync "$ACCEPT_X" "$ACCEPT_Y"
          xdotool click 1
          sleep 3

          EULA_AFTER=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER=$EULA_AFTER" | tee runtime_evidence/eula-after.txt
          test -z "$EULA_AFTER"

          # Close the modal-tainted first session completely.
          xdotool windowclose "$MAIN1" || true
          for i in $(seq 1 30); do
            sleep 1
            if ! ps -p "$KPID1" >/dev/null 2>&1; then break; fi
          done
          if ps -p "$KPID1" >/dev/null 2>&1; then
            kill "$KPID1" 2>/dev/null || true
            sleep 2
          fi

          # Fresh second launch - all drawing operations happen only here.
          kompas-v25 >runtime_evidence/kompas-second.out 2>runtime_evidence/kompas-second.err &
          KPID2=$!
          echo "$KPID2" > runtime_evidence/kompas-second.pid

          MAIN2=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN2=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN2" ] && break
          done
          test -n "$MAIN2"
          echo "MAIN2=$MAIN2" | tee runtime_evidence/main-second.txt

          sleep 20
          EULA_SECOND=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_SECOND=$EULA_SECOND" | tee runtime_evidence/eula-second.txt
          test -z "$EULA_SECOND"

          import -display :99 -window root runtime_evidence/02_fresh_second_launch.png
          xdotool windowfocus --sync "$MAIN2"

          # Route A - real File -> Create -> Drawing menu.
          xdotool mousemove --window "$MAIN2" --sync 18 6
          xdotool click 1
          sleep 2
          import -display :99 -window root runtime_evidence/03_file_menu.png

          xdotool key Home
          xdotool key Right
          sleep 2
          import -display :99 -window root runtime_evidence/04_create_submenu.png

          xdotool key Home
          xdotool key Return
          sleep 12
          import -display :99 -window root runtime_evidence/05_after_menu_create.png

          xdotool key ctrl+s
          sleep 5
          FOCUS_A=$(xdotool getwindowfocus)
          NAME_A=$(xdotool getwindowname "$FOCUS_A" 2>/dev/null || true)
          SAVE_A=$(xdotool search --onlyvisible --name 'Сохран|Save' 2>/dev/null | tail -1 || true)
          printf 'ROUTE_A_FOCUS=%s\nROUTE_A_NAME=%s\nROUTE_A_SAVE=%s\n' "$FOCUS_A" "$NAME_A" "$SAVE_A" \
            | tee runtime_evidence/save-probe.txt
          import -display :99 -window root runtime_evidence/06_save_route_a.png

          PASS_ROUTE=""
          if [ "$FOCUS_A" != "$MAIN2" ] || [ -n "$SAVE_A" ]; then
            PASS_ROUTE="FILE_MENU"
          fi

          # Route B fallback - real Start-page Drawing tile in the clean session.
          if [ -z "$PASS_ROUTE" ]; then
            xdotool key Escape Escape Escape || true
            xdotool windowfocus --sync "$MAIN2"
            xdotool mousemove --window "$MAIN2" --sync 919 189
            xdotool click 1
            sleep 12
            import -display :99 -window root runtime_evidence/07_after_tile_create.png

            xdotool key ctrl+s
            sleep 5
            FOCUS_B=$(xdotool getwindowfocus)
            NAME_B=$(xdotool getwindowname "$FOCUS_B" 2>/dev/null || true)
            SAVE_B=$(xdotool search --onlyvisible --name 'Сохран|Save' 2>/dev/null | tail -1 || true)
            printf 'ROUTE_B_FOCUS=%s\nROUTE_B_NAME=%s\nROUTE_B_SAVE=%s\n' "$FOCUS_B" "$NAME_B" "$SAVE_B" \
              | tee -a runtime_evidence/save-probe.txt
            import -display :99 -window root runtime_evidence/08_save_route_b.png

            if [ "$FOCUS_B" != "$MAIN2" ] || [ -n "$SAVE_B" ]; then
              PASS_ROUTE="START_TILE"
            fi
          fi

          echo "PASS_ROUTE=$PASS_ROUTE" | tee runtime_evidence/pass-route.txt
          if [ -z "$PASS_ROUTE" ]; then
            xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
              | tee runtime_evidence/windows-final.txt || true
            echo 'RESULT=FAIL_DRAWING_NOT_CONFIRMED_AFTER_FRESH_RELAUNCH' \
              | tee runtime_evidence/result.txt
            exit 51
          fi

          echo 'RESULT=PASS_REAL_DRAWING_CREATED_AFTER_FRESH_RELAUNCH' \
            | tee runtime_evidence/result.txt

      - name: Strict Drawing gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^EULA_AFTER=$' runtime_evidence/eula-after.txt
          grep -q '^EULA_SECOND=$' runtime_evidence/eula-second.txt
          grep -Eq '^PASS_ROUTE=(FILE_MENU|START_TILE)$' runtime_evidence/pass-route.txt
          grep -q '^RESULT=PASS_REAL_DRAWING_CREATED_AFTER_FRESH_RELAUNCH$' runtime_evidence/result.txt
          test -s runtime_evidence/save-probe.txt
          test -s runtime_evidence/02_fresh_second_launch.png
          sha256sum runtime_evidence/*.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-drawing-fresh-gui
          path: runtime_evidence/
          if-no-files-found: error
