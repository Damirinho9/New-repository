name: Hexlet KOMPAS-3D GUI Runtime

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
      - "hexlet_7344445/atspi_click_drawing.py"
  workflow_dispatch:

jobs:
  kompas3d-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official ASCON KOMPAS-3D v25 + accessibility stack
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget ca-certificates gnupg xvfb openbox xdotool imagemagick desktop-file-utils \
            x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri wmctrl \
            python3-pyatspi at-spi2-core dbus-x11 libatk-adaptor \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p runtime_evidence
          command -v kompas-v25 | tee runtime_evidence/launcher.txt
          python3 -c 'import pyatspi; print("PYATSPI_IMPORT=PASS")' | tee runtime_evidence/pyatspi-import.txt

      - name: Accept EULA and invoke Drawing semantically through AT-SPI
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software
          export QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
          export QT_ACCESSIBILITY=1

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >runtime_evidence/xvfb.log 2>&1 &
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          sleep 2

          eval "$(dbus-launch --sh-syntax)"
          printf 'DBUS_SESSION_BUS_ADDRESS=%s\nDBUS_SESSION_BUS_PID=%s\n' \
            "$DBUS_SESSION_BUS_ADDRESS" "$DBUS_SESSION_BUS_PID" \
            | tee runtime_evidence/dbus-session.txt

          kompas-v25 >runtime_evidence/kompas.out 2>runtime_evidence/kompas.err &
          KPID=$!
          echo "$KPID" > runtime_evidence/kompas.pid

          MAIN_WID=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN_WID" ] && break
          done
          test -n "$MAIN_WID"
          echo "MAIN_WINDOW_ID=$MAIN_WID" | tee runtime_evidence/main-window.txt
          sleep 25

          EULA_WID=""
          for i in $(seq 1 30); do
            EULA_WID=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA_WID" ] && break
            sleep 1
          done
          test -n "$EULA_WID"
          eval "$(xdotool getwindowgeometry --shell "$EULA_WID")"
          CLICK_X=$((X + WIDTH * 65 / 100))
          CLICK_Y=$((Y + HEIGHT - 42))
          xdotool windowfocus --sync "$EULA_WID"
          xdotool mousemove --sync "$CLICK_X" "$CLICK_Y"
          import -display :99 -window root runtime_evidence/01_eula_before_accept.png
          xdotool click 1
          sleep 4

          EULA_STILL=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER_CLICK=$EULA_STILL" | tee runtime_evidence/eula-after-click.txt
          test -z "$EULA_STILL"

          # Query the real Qt accessibility tree and invoke the exact "Чертеж" action.
          python3 hexlet_7344445/atspi_click_drawing.py runtime_evidence/atspi-tree-before.txt \
            | tee runtime_evidence/atspi-action.log

          grep -q '^RESULT=ATSPI_DRAWING_ACTION_EXECUTED$' runtime_evidence/atspi-action.log
          sleep 3
          wmctrl -l -G | tee runtime_evidence/windows-after-atspi.txt || true
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
            | tee runtime_evidence/visible-after-atspi.txt || true
          import -display :99 -window root runtime_evidence/02_after_atspi_drawing.png

          # Functional proof: a newly-created unsaved drawing must open Save dialog.
          xdotool windowfocus --sync "$MAIN_WID" || true
          xdotool key ctrl+s
          sleep 5
          SAVE_FOCUS=$(xdotool getwindowfocus)
          echo "SAVE_FOCUS=$SAVE_FOCUS" | tee runtime_evidence/save-focus.txt
          xdotool getwindowname "$SAVE_FOCUS" | tee -a runtime_evidence/save-focus.txt || true
          xdotool getwindowgeometry --shell "$SAVE_FOCUS" | tee runtime_evidence/save-focus-geometry.txt || true
          wmctrl -l -G | tee runtime_evidence/windows-after-save.txt || true
          import -display :99 -window root runtime_evidence/03_native_save_dialog.png

          if [ "$SAVE_FOCUS" = "$MAIN_WID" ]; then
            echo 'RESULT=FAIL_ATSPI_ACTION_NO_SAVE_DIALOG' | tee runtime_evidence/result.txt
            exit 61
          fi

          echo 'RESULT=PASS_REAL_DRAWING_CREATED_ATSPI' | tee runtime_evidence/result.txt

      - name: Strict real drawing gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s runtime_evidence/atspi-tree-before.txt
          test -s runtime_evidence/02_after_atspi_drawing.png
          test -s runtime_evidence/03_native_save_dialog.png
          grep -q '^EULA_AFTER_CLICK=$' runtime_evidence/eula-after-click.txt
          grep -q '^RESULT=ATSPI_DRAWING_ACTION_EXECUTED$' runtime_evidence/atspi-action.log
          grep -q '^RESULT=PASS_REAL_DRAWING_CREATED_ATSPI$' runtime_evidence/result.txt
          sha256sum runtime_evidence/02_after_atspi_drawing.png runtime_evidence/03_native_save_dialog.png \
            | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-atspi-real-drawing
          path: runtime_evidence/
          if-no-files-found: error
