name: Hexlet KOMPAS-3D GUI Runtime

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  kompas3d-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official ASCON KOMPAS-3D v25 + SDK and GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y             wget ca-certificates gnupg xvfb openbox xdotool imagemagick desktop-file-utils             x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri             libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main'             | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p runtime_evidence
          command -v kompas-v25 | tee runtime_evidence/launcher.txt
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

      - name: Accept EULA and open File-Create dialog in real GUI
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >runtime_evidence/xvfb.log 2>&1 &
          echo $! > runtime_evidence/xvfb.pid
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          echo $! > runtime_evidence/openbox.pid
          sleep 2

          kompas-v25 >runtime_evidence/kompas-first.out 2>runtime_evidence/kompas-first.err &
          FIRST_PID=$!
          echo "$FIRST_PID" > runtime_evidence/kompas-first.pid

          MAIN_WID=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN_WID" ] && break
          done
          test -n "$MAIN_WID"
          echo "MAIN_WINDOW_ID=$MAIN_WID" | tee runtime_evidence/main-window-first.txt
          sleep 25

          EULA_WID=""
          for i in $(seq 1 30); do
            EULA_WID=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA_WID" ] && break
            sleep 1
          done
          test -n "$EULA_WID"
          xdotool getwindowgeometry --shell "$EULA_WID" | tee runtime_evidence/eula-geometry.txt

          eval "$(xdotool getwindowgeometry --shell "$EULA_WID")"
          CLICK_X=$((X + WIDTH * 65 / 100))
          CLICK_Y=$((Y + HEIGHT - 42))
          xdotool windowfocus --sync "$EULA_WID"
          xdotool mousemove --sync "$CLICK_X" "$CLICK_Y"
          import -display :99 -window "$EULA_WID" runtime_evidence/01_eula_before_accept.png
          xdotool click 1
          sleep 3

          EULA_STILL=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER_CLICK=$EULA_STILL" | tee runtime_evidence/eula-after-click.txt
          test -z "$EULA_STILL"

          # Restart after accepted EULA to avoid stale modal framebuffer/input state.
          xdotool windowclose "$MAIN_WID" || true
          for i in $(seq 1 30); do
            sleep 1
            ! ps -p "$FIRST_PID" >/dev/null 2>&1 && break
          done
          if ps -p "$FIRST_PID" >/dev/null 2>&1; then kill "$FIRST_PID" 2>/dev/null || true; fi
          sleep 3

          kompas-v25 >runtime_evidence/kompas-second.out 2>runtime_evidence/kompas-second.err &
          SECOND_PID=$!
          echo "$SECOND_PID" > runtime_evidence/kompas-second.pid

          SECOND_WID=""
          for i in $(seq 1 90); do
            sleep 1
            SECOND_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$SECOND_WID" ] && break
          done
          test -n "$SECOND_WID"
          echo "SECOND_WINDOW_ID=$SECOND_WID" | tee runtime_evidence/main-window-second.txt
          sleep 15

          EULA_SECOND=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_ON_SECOND_LAUNCH=$EULA_SECOND" | tee runtime_evidence/eula-second-launch.txt
          test -z "$EULA_SECOND"

          # Literal route: File -> Create.
          xdotool windowfocus --sync "$SECOND_WID"
          eval "$(xdotool getwindowgeometry --shell "$SECOND_WID")"
          FILE_X=$((X + 20))
          FILE_Y=$((Y + 25))
          printf 'FILE_X=%s\nFILE_Y=%s\n' "$FILE_X" "$FILE_Y" | tee runtime_evidence/file-menu-click.txt
          xdotool mousemove --sync "$FILE_X" "$FILE_Y"
          xdotool click 1
          sleep 2
          import -display :99 -window root runtime_evidence/02_file_menu_open.png

          # "Создать" is the first command in File menu. Select it explicitly.
          xdotool key Home
          sleep 1
          xdotool key Return
          sleep 4

          CREATE_FOCUS=$(xdotool getwindowfocus)
          echo "CREATE_FOCUS=$CREATE_FOCUS" | tee runtime_evidence/create-focus.txt
          xdotool getwindowname "$CREATE_FOCUS" | tee -a runtime_evidence/create-focus.txt || true
          xdotool getwindowgeometry --shell "$CREATE_FOCUS" | tee runtime_evidence/create-focus-geometry.txt || true
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null             | tee runtime_evidence/visible-windows-create-dialog.txt || true

          if [ "$CREATE_FOCUS" = "$SECOND_WID" ]; then
            echo 'RESULT=FAIL_FILE_CREATE_DID_NOT_OPEN_DIALOG' | tee runtime_evidence/result.txt
            exit 51
          fi

          import -display :99 -window "$CREATE_FOCUS" runtime_evidence/03_new_document_dialog.png
          echo 'RESULT=PASS_FILE_CREATE_DIALOG_OPENED' | tee runtime_evidence/result.txt

      - name: Strict File-Create dialog gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s runtime_evidence/01_eula_before_accept.png
          test -s runtime_evidence/02_file_menu_open.png
          test -s runtime_evidence/03_new_document_dialog.png
          grep -q '^EULA_AFTER_CLICK=$' runtime_evidence/eula-after-click.txt
          grep -q '^EULA_ON_SECOND_LAUNCH=$' runtime_evidence/eula-second-launch.txt
          grep -q '^RESULT=PASS_FILE_CREATE_DIALOG_OPENED$' runtime_evidence/result.txt
          sha256sum runtime_evidence/03_new_document_dialog.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-file-create-dialog-evidence
          path: runtime_evidence/
          if-no-files-found: error
