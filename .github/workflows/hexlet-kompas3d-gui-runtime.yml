name: Hexlet KOMPAS-3D GUI Runtime

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  kompas3d-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install official ASCON KOMPAS-3D v25 + SDK and GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget ca-certificates gnupg \
            xvfb openbox xdotool imagemagick desktop-file-utils x11-utils \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0

          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true

          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 \
            ascon-kompas-graphic-v25 \
            ascon-kompas3d-v25 \
            ascon-kompas-sdk-v25

          command -v kompas-v25
          mkdir -p runtime_evidence
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt
          command -v kompas-v25 | tee runtime_evidence/launcher.txt

      - name: Launch full GUI and accept EULA by detected window geometry
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99

          Xvfb :99 -screen 0 1920x1080x24 -ac >runtime_evidence/xvfb.log 2>&1 &
          echo $! > runtime_evidence/xvfb.pid
          sleep 2

          openbox >runtime_evidence/openbox.log 2>&1 &
          echo $! > runtime_evidence/openbox.pid
          sleep 2

          kompas-v25 >runtime_evidence/kompas-gui.out 2>runtime_evidence/kompas-gui.err &
          echo $! > runtime_evidence/kompas-launch.pid

          MAIN_WID=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN_WID" ] && break
          done
          echo "MAIN_WINDOW_ID=$MAIN_WID" | tee runtime_evidence/main-window.txt
          test -n "$MAIN_WID"

          xdotool getwindowname "$MAIN_WID" | tee runtime_evidence/main-window-title.txt
          xdotool getwindowgeometry --shell "$MAIN_WID" | tee runtime_evidence/main-window-geometry.txt

          ps aux | grep -Ei 'kompas-v25|kKompas|kompas3d' | grep -v grep \
            | tee runtime_evidence/processes-before-eula.txt

          import -display :99 -window root runtime_evidence/01_startup.png
          sleep 25
          import -display :99 -window root runtime_evidence/02_full_gui_with_eula.png

          EULA_WID=""
          for i in $(seq 1 30); do
            EULA_WID=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA_WID" ] && break
            sleep 1
          done

          echo "EULA_WINDOW_ID=$EULA_WID" | tee runtime_evidence/eula-window.txt
          test -n "$EULA_WID"

          xdotool getwindowname "$EULA_WID" | tee runtime_evidence/eula-window-title.txt
          xdotool getwindowgeometry --shell "$EULA_WID" | tee runtime_evidence/eula-window-geometry.txt
          xwininfo -id "$EULA_WID" -all > runtime_evidence/eula-xwininfo-before.txt

          eval "$(xdotool getwindowgeometry --shell "$EULA_WID")"
          test "$WIDTH" -gt 300
          test "$HEIGHT" -gt 300

          # Measured on the real dialog: 500x650 at X=710,Y=234.
          # "Принимаю" center: ~65% across and 42 px above the bottom edge.
          CLICK_X=$((X + WIDTH * 65 / 100))
          CLICK_Y=$((Y + HEIGHT - 42))
          printf 'CLICK_X=%s\nCLICK_Y=%s\n' "$CLICK_X" "$CLICK_Y" \
            | tee runtime_evidence/eula-click-target.txt

          xdotool windowfocus --sync "$EULA_WID"
          xdotool mousemove --sync "$CLICK_X" "$CLICK_Y"
          xdotool getmouselocation --shell | tee runtime_evidence/eula-mouse-location.txt
          import -display :99 -window root runtime_evidence/03_eula_before_accept.png

          xdotool click 1
          sleep 2

          # First hard check: the original EULA XID must no longer be viewable.
          if xwininfo -id "$EULA_WID" -all > runtime_evidence/eula-xwininfo-after.txt 2>&1; then
            if grep -q 'Map State: IsViewable' runtime_evidence/eula-xwininfo-after.txt; then
              import -display :99 -window root runtime_evidence/04_eula_accept_FAILED.png || true
              echo 'RESULT=FAIL_EULA_XID_STILL_VIEWABLE' | tee runtime_evidence/result.txt
              exit 41
            fi
          else
            echo 'EULA_XID_DESTROYED=1' | tee runtime_evidence/eula-xid-destroyed.txt
          fi

          # Second hard check: no visible EULA-title window may exist.
          EULA_STILL=""
          for i in $(seq 1 10); do
            EULA_STILL=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -z "$EULA_STILL" ] && break
            sleep 1
          done
          echo "EULA_AFTER_CLICK=$EULA_STILL" | tee runtime_evidence/eula-after-click.txt
          if [ -n "$EULA_STILL" ]; then
            import -display :99 -window root runtime_evidence/04_eula_accept_FAILED.png || true
            echo 'RESULT=FAIL_EULA_STILL_VISIBLE' | tee runtime_evidence/result.txt
            exit 42
          fi

          MAIN_AFTER=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
          echo "MAIN_WINDOW_AFTER_EULA=$MAIN_AFTER" | tee runtime_evidence/main-after-eula.txt
          test -n "$MAIN_AFTER"

          # Force the main GUI to repaint after the modal dialog is unmapped.
          xdotool windowraise "$MAIN_AFTER"
          xdotool windowactivate --sync "$MAIN_AFTER"
          sleep 5

          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
            | tee runtime_evidence/visible-windows-after-eula.txt || true
          ps aux | grep -Ei 'kompas-v25|kKompas|kompas3d' | grep -v grep \
            | tee runtime_evidence/processes-after-eula.txt

          import -display :99 -window root runtime_evidence/04_after_eula_accept_root.png
          import -display :99 -window "$MAIN_AFTER" runtime_evidence/05_after_eula_accept_main.png

          echo 'RESULT=PASS_EULA_DISMISSED' | tee runtime_evidence/result.txt

      - name: Strict EULA gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s runtime_evidence/01_startup.png
          test -s runtime_evidence/02_full_gui_with_eula.png
          test -s runtime_evidence/03_eula_before_accept.png
          test -s runtime_evidence/04_after_eula_accept_root.png
          test -s runtime_evidence/05_after_eula_accept_main.png

          grep -q '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' runtime_evidence/eula-window-title.txt
          grep -q '^EULA_AFTER_CLICK=$' runtime_evidence/eula-after-click.txt
          grep -q 'RESULT=PASS_EULA_DISMISSED' runtime_evidence/result.txt
          grep -Ei 'kompas-v25|kKompas|kompas3d' runtime_evidence/processes-after-eula.txt

          if [ -f runtime_evidence/eula-xwininfo-after.txt ]; then
            ! grep -q 'Map State: IsViewable' runtime_evidence/eula-xwininfo-after.txt
          fi

          sha256sum \
            runtime_evidence/01_startup.png \
            runtime_evidence/02_full_gui_with_eula.png \
            runtime_evidence/03_eula_before_accept.png \
            runtime_evidence/04_after_eula_accept_root.png \
            runtime_evidence/05_after_eula_accept_main.png \
            | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-eula-gate-evidence
          path: runtime_evidence/
          if-no-files-found: error
