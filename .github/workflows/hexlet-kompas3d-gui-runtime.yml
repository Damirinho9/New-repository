name: Hexlet KOMPAS-3D Native Drawing GUI Menu

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  drawing-gui-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 GUI + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget ca-certificates gnupg desktop-file-utils \
            xvfb openbox xdotool imagemagick x11-utils x11-xserver-utils \
            mesa-utils libgl1-mesa-dri xclip \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p runtime_evidence
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

      - name: Accept EULA and create Drawing via File Create menu
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            >runtime_evidence/xvfb.log 2>&1 &
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          sleep 2

          kompas-v25 >runtime_evidence/kompas.out 2>runtime_evidence/kompas.err &
          KPID=$!
          echo "$KPID" > runtime_evidence/kompas.pid

          MAIN=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN" ] && break
          done
          test -n "$MAIN"
          echo "MAIN=$MAIN" | tee runtime_evidence/main.txt
          xdotool getwindowgeometry --shell "$MAIN" | tee runtime_evidence/main-geometry.txt

          sleep 25

          EULA=""
          for i in $(seq 1 30); do
            EULA=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA" ] && break
            sleep 1
          done
          test -n "$EULA"
          eval "$(xdotool getwindowgeometry --shell "$EULA")"
          AX=$((X + WIDTH * 65 / 100))
          AY=$((Y + HEIGHT - 42))
          echo "EULA=$EULA X=$X Y=$Y WIDTH=$WIDTH HEIGHT=$HEIGHT ACCEPT_X=$AX ACCEPT_Y=$AY" \
            | tee runtime_evidence/eula-geometry.txt
          import -display :99 -window root runtime_evidence/01_eula.png
          xdotool windowfocus --sync "$EULA"
          xdotool mousemove --sync "$AX" "$AY"
          xdotool click 1
          sleep 3
          EULA2=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER=$EULA2" | tee runtime_evidence/eula-after.txt
          test -z "$EULA2"

          # The first process has just exited the modal EULA loop. Close it
          # completely and relaunch KOMPAS so all further GUI input is handled
          # by a clean post-EULA session. Stage 3 proved the acceptance persists.
          xdotool windowclose "$MAIN" || true
          for i in $(seq 1 30); do
            sleep 1
            if ! ps -p "$KPID" >/dev/null 2>&1; then break; fi
          done
          if ps -p "$KPID" >/dev/null 2>&1; then
            kill "$KPID" 2>/dev/null || true
            sleep 2
          fi

          kompas-v25 >runtime_evidence/kompas-second.out 2>runtime_evidence/kompas-second.err &
          KPID2=$!
          echo "$KPID2" > runtime_evidence/kompas-second.pid

          MAIN2=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN2=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN2" ] && break
          done
          test -n "$MAIN2"
          echo "MAIN2=$MAIN2" | tee runtime_evidence/main-second.txt
          sleep 20

          EULA_SECOND=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_SECOND=$EULA_SECOND" | tee runtime_evidence/eula-second.txt
          test -z "$EULA_SECOND"

          xdotool windowfocus --sync "$MAIN2"

          # Route A: real File -> Create -> Drawing menu navigation.
          echo "MENU_METHOD=FRESH_SESSION_FILE_CREATE_DRAWING" | tee runtime_evidence/file-menu-target.txt
          xdotool mousemove --window "$MAIN2" --sync 18 6
          xdotool click 1
          sleep 2
          import -display :99 -window root runtime_evidence/02_file_menu.png
          xwininfo -root -tree > runtime_evidence/xwin-tree-file-menu.txt

          xdotool key Home
          xdotool key Right
          sleep 2
          import -display :99 -window root runtime_evidence/03_create_submenu.png
          xdotool key Home
          xdotool key Return
          sleep 12

          import -display :99 -window root runtime_evidence/04_after_create_drawing.png
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
            | tee runtime_evidence/windows-after-create.txt || true

          xdotool key ctrl+s
          sleep 5
          FOCUS1=$(xdotool getwindowfocus)
          NAME1=$(xdotool getwindowname "$FOCUS1" 2>/dev/null || true)
          SAVE1=$(xdotool search --onlyvisible --name 'Сохран|Save' 2>/dev/null | tail -1 || true)
          printf 'ROUTE_A_FOCUS=%s\nROUTE_A_NAME=%s\nROUTE_A_SAVE_NAMED=%s\n' "$FOCUS1" "$NAME1" "$SAVE1" \
            | tee runtime_evidence/save-probe.txt
          import -display :99 -window root runtime_evidence/05_save_dialog_route_a.png

          PASS_ROUTE=""
          if [ "$FOCUS1" != "$MAIN2" ] || [ -n "$SAVE1" ]; then
            PASS_ROUTE="FILE_MENU"
          else
            # Dismiss any residual menu state and use the actual Start-page
            # Drawing tile in the clean second process. Coordinates are relative
            # to the KOMPAS client; measured from the real 1920x1080 start page.
            xdotool key Escape Escape Escape || true
            xdotool windowfocus --sync "$MAIN2"
            xdotool mousemove --window "$MAIN2" --sync 919 189
            xdotool click 1
            sleep 12
            import -display :99 -window root runtime_evidence/06_after_drawing_tile_fallback.png
            xdotool key ctrl+s
            sleep 5
            FOCUS2=$(xdotool getwindowfocus)
            NAME2=$(xdotool getwindowname "$FOCUS2" 2>/dev/null || true)
            SAVE2=$(xdotool search --onlyvisible --name 'Сохран|Save' 2>/dev/null | tail -1 || true)
            printf 'ROUTE_B_FOCUS=%s\nROUTE_B_NAME=%s\nROUTE_B_SAVE_NAMED=%s\n' "$FOCUS2" "$NAME2" "$SAVE2" \
              | tee -a runtime_evidence/save-probe.txt
            import -display :99 -window root runtime_evidence/07_save_dialog_route_b.png
            if [ "$FOCUS2" != "$MAIN2" ] || [ -n "$SAVE2" ]; then
              PASS_ROUTE="START_TILE"
            fi
          fi

          echo "PASS_ROUTE=$PASS_ROUTE" | tee runtime_evidence/pass-route.txt
          if [ -z "$PASS_ROUTE" ]; then
            echo 'RESULT=FAIL_DRAWING_NOT_CONFIRMED_AFTER_FRESH_RELAUNCH' | tee runtime_evidence/result.txt
            exit 51
          fi

          echo 'RESULT=PASS_REAL_DRAWING_CREATED_AFTER_FRESH_RELAUNCH' | tee runtime_evidence/result.txt

      - name: Strict Drawing gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^EULA_AFTER=$' runtime_evidence/eula-after.txt
          grep -q '^RESULT=PASS_REAL_DRAWING_CREATED_AFTER_FRESH_RELAUNCH
          test -s runtime_evidence/02_file_menu.png
          test -s runtime_evidence/03_create_submenu.png
          test -s runtime_evidence/04_after_create_drawing.png
          test -s runtime_evidence/save-probe.txt\n          test -s runtime_evidence/pass-route.txt\n          grep -Eq '^PASS_ROUTE=(FILE_MENU|START_TILE)
          sha256sum runtime_evidence/*.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-drawing-gui-menu
          path: runtime_evidence/
          if-no-files-found: error
 runtime_evidence/result.txt
          test -s runtime_evidence/02_file_menu.png
          test -s runtime_evidence/03_create_submenu.png
          test -s runtime_evidence/04_after_create_drawing.png
          test -s runtime_evidence/05_save_dialog.png
          sha256sum runtime_evidence/*.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-drawing-gui-menu
          path: runtime_evidence/
          if-no-files-found: error
 runtime_evidence/pass-route.txt
          sha256sum runtime_evidence/*.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-drawing-gui-menu
          path: runtime_evidence/
          if-no-files-found: error
 runtime_evidence/result.txt
          test -s runtime_evidence/02_file_menu.png
          test -s runtime_evidence/03_create_submenu.png
          test -s runtime_evidence/04_after_create_drawing.png
          test -s runtime_evidence/05_save_dialog.png
          sha256sum runtime_evidence/*.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-drawing-gui-menu
          path: runtime_evidence/
          if-no-files-found: error
