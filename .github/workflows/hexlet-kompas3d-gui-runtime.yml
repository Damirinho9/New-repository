name: Hexlet KOMPAS-3D Native Drawing Fresh X Server

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
  workflow_dispatch:

jobs:
  drawing-fresh-x:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 GUI + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            wget ca-certificates gnupg desktop-file-utils \
            xvfb openbox xdotool imagemagick x11-utils x11-xserver-utils \
            mesa-utils libgl1-mesa-dri xclip \
            libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0

          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' \
            | sudo tee /etc/apt/sources.list.d/ascon.list

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25

          mkdir -p runtime_evidence
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

      - name: Accept EULA on first X server
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            >runtime_evidence/xvfb99.log 2>&1 &
          X99=$!
          echo "$X99" > runtime_evidence/xvfb99.pid
          sleep 2

          openbox >runtime_evidence/openbox99.log 2>&1 &
          OB99=$!
          echo "$OB99" > runtime_evidence/openbox99.pid
          sleep 2

          kompas-v25 >runtime_evidence/kompas-first.out 2>runtime_evidence/kompas-first.err &
          KP1=$!
          echo "$KP1" > runtime_evidence/kompas-first.pid

          MAIN1=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN1=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN1" ] && break
          done
          test -n "$MAIN1"

          sleep 25

          EULA=""
          for i in $(seq 1 30); do
            EULA=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA" ] && break
            sleep 1
          done
          test -n "$EULA"

          eval "$(xdotool getwindowgeometry --shell "$EULA")"
          ACCEPT_X=$((X + WIDTH * 65 / 100))
          ACCEPT_Y=$((Y + HEIGHT - 42))
          printf 'EULA=%s\nX=%s\nY=%s\nWIDTH=%s\nHEIGHT=%s\nACCEPT_X=%s\nACCEPT_Y=%s\n' \
            "$EULA" "$X" "$Y" "$WIDTH" "$HEIGHT" "$ACCEPT_X" "$ACCEPT_Y" \
            | tee runtime_evidence/eula-geometry.txt

          import -display :99 -window root runtime_evidence/01_eula_before_accept.png
          xdotool windowfocus --sync "$EULA"
          xdotool mousemove --sync "$ACCEPT_X" "$ACCEPT_Y"
          xdotool click 1
          sleep 3

          EULA_AFTER=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER=$EULA_AFTER" | tee runtime_evidence/eula-after.txt
          test -z "$EULA_AFTER"

          # Close KOMPAS, then fully destroy the first X server/window manager.
          xdotool windowclose "$MAIN1" || true
          for i in $(seq 1 30); do
            sleep 1
            if ! ps -p "$KP1" >/dev/null 2>&1; then break; fi
          done
          kill "$KP1" 2>/dev/null || true
          sleep 1
          kill "$OB99" 2>/dev/null || true
          kill "$X99" 2>/dev/null || true
          sleep 3

          test -d "$HOME/.config/ascon"
          find "$HOME/.config/ascon" -maxdepth 4 -type f -printf '%p %s\n' \
            | sort | tee runtime_evidence/ascon-config-after-eula.txt

      - name: Start brand-new X server and create real Drawing
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:100
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :100 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset \
            >runtime_evidence/xvfb100.log 2>&1 &
          X100=$!
          echo "$X100" > runtime_evidence/xvfb100.pid
          sleep 2

          openbox >runtime_evidence/openbox100.log 2>&1 &
          OB100=$!
          echo "$OB100" > runtime_evidence/openbox100.pid
          sleep 2

          kompas-v25 >runtime_evidence/kompas-second.out 2>runtime_evidence/kompas-second.err &
          KP2=$!
          echo "$KP2" > runtime_evidence/kompas-second.pid

          MAIN2=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN2=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN2" ] && break
          done
          test -n "$MAIN2"
          echo "MAIN2=$MAIN2" | tee runtime_evidence/main-second.txt

          sleep 20

          EULA_SECOND=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_SECOND=$EULA_SECOND" | tee runtime_evidence/eula-second.txt
          test -z "$EULA_SECOND"

          import -display :100 -window root runtime_evidence/02_fresh_x_server_start.png
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
            | tee runtime_evidence/windows-fresh-x.txt || true

          xdotool windowfocus --sync "$MAIN2"

          # First try the real Drawing start-page tile on the clean X server.
          xdotool mousemove --window "$MAIN2" --sync 919 189
          xdotool getmouselocation --shell | tee runtime_evidence/tile-mouse.txt
          xdotool click 1
          sleep 12

          import -display :100 -window root runtime_evidence/03_after_drawing_tile.png
          xdotool key ctrl+s
          sleep 5

          FOCUS_T=$(xdotool getwindowfocus)
          NAME_T=$(xdotool getwindowname "$FOCUS_T" 2>/dev/null || true)
          SAVE_T=$(xdotool search --onlyvisible --name 'Сохран|Save' 2>/dev/null | tail -1 || true)
          printf 'TILE_FOCUS=%s\nTILE_NAME=%s\nTILE_SAVE=%s\n' "$FOCUS_T" "$NAME_T" "$SAVE_T" \
            | tee runtime_evidence/save-probe.txt
          import -display :100 -window root runtime_evidence/04_save_after_tile.png

          PASS_ROUTE=""
          if [ "$FOCUS_T" != "$MAIN2" ] || [ -n "$SAVE_T" ]; then
            PASS_ROUTE="START_TILE"
          fi

          # Second route: command search, still on clean second X server.
          if [ -z "$PASS_ROUTE" ]; then
            xdotool key Escape Escape Escape || true
            xdotool windowfocus --sync "$MAIN2"
            xdotool key alt+slash
            sleep 2
            printf 'Создать чертеж' | xclip -selection clipboard
            xdotool key ctrl+v
            sleep 3
            import -display :100 -window root runtime_evidence/05_command_search_create_drawing.png
            xdotool key Return
            sleep 12

            import -display :100 -window root runtime_evidence/06_after_command_search_create.png
            xdotool key ctrl+s
            sleep 5

            FOCUS_C=$(xdotool getwindowfocus)
            NAME_C=$(xdotool getwindowname "$FOCUS_C" 2>/dev/null || true)
            SAVE_C=$(xdotool search --onlyvisible --name 'Сохран|Save' 2>/dev/null | tail -1 || true)
            printf 'CMD_FOCUS=%s\nCMD_NAME=%s\nCMD_SAVE=%s\n' "$FOCUS_C" "$NAME_C" "$SAVE_C" \
              | tee -a runtime_evidence/save-probe.txt
            import -display :100 -window root runtime_evidence/07_save_after_command_search.png

            if [ "$FOCUS_C" != "$MAIN2" ] || [ -n "$SAVE_C" ]; then
              PASS_ROUTE="COMMAND_SEARCH"
            fi
          fi

          echo "PASS_ROUTE=$PASS_ROUTE" | tee runtime_evidence/pass-route.txt
          if [ -z "$PASS_ROUTE" ]; then
            xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null \
              | tee runtime_evidence/windows-final.txt || true
            echo 'RESULT=FAIL_DRAWING_NOT_CONFIRMED_ON_FRESH_X_SERVER' \
              | tee runtime_evidence/result.txt
            exit 51
          fi

          echo 'RESULT=PASS_REAL_DRAWING_CREATED_ON_FRESH_X_SERVER' \
            | tee runtime_evidence/result.txt

      - name: Strict Drawing gate
        shell: bash
        run: |
          set -euxo pipefail
          grep -q '^EULA_AFTER=$' runtime_evidence/eula-after.txt
          grep -q '^EULA_SECOND=$' runtime_evidence/eula-second.txt
          grep -Eq '^PASS_ROUTE=(START_TILE|COMMAND_SEARCH)$' runtime_evidence/pass-route.txt
          grep -q '^RESULT=PASS_REAL_DRAWING_CREATED_ON_FRESH_X_SERVER$' runtime_evidence/result.txt
          test -s runtime_evidence/save-probe.txt
          test -s runtime_evidence/02_fresh_x_server_start.png
          sha256sum runtime_evidence/*.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-native-drawing-fresh-x
          path: runtime_evidence/
          if-no-files-found: error
