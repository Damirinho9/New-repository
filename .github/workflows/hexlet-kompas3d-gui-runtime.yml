name: Hexlet KOMPAS-3D GUI Runtime

on:
  push:
    branches:
      - hexlet-7344445-kompas3d-gui-clean
    paths:
      - ".github/workflows/hexlet-kompas3d-gui-runtime.yml"
      - "hexlet_7344445/stage4_create_drawing.py"
  workflow_dispatch:

jobs:
  kompas3d-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official ASCON KOMPAS-3D v25 + SDK and GUI dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y             wget ca-certificates gnupg xvfb openbox xdotool imagemagick desktop-file-utils             x11-utils x11-xserver-utils mesa-utils libgl1-mesa-dri             libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main'             | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          mkdir -p runtime_evidence
          command -v kompas-v25 | tee runtime_evidence/launcher.txt
          dpkg -l 'ascon-kompas*' | tee runtime_evidence/installed-packages.txt

      - name: Accept EULA and open File-Create dialog in real GUI
        shell: bash
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software

          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >runtime_evidence/xvfb.log 2>&1 &
          echo $! > runtime_evidence/xvfb.pid
          sleep 2
          openbox >runtime_evidence/openbox.log 2>&1 &
          echo $! > runtime_evidence/openbox.pid
          sleep 2

          kompas-v25 >runtime_evidence/kompas-first.out 2>runtime_evidence/kompas-first.err &
          FIRST_PID=$!
          echo "$FIRST_PID" > runtime_evidence/kompas-first.pid

          MAIN_WID=""
          for i in $(seq 1 90); do
            sleep 1
            MAIN_WID=$(xdotool search --onlyvisible --name '^КОМПАС-3D v25$' 2>/dev/null | tail -1 || true)
            [ -n "$MAIN_WID" ] && break
          done
          test -n "$MAIN_WID"
          echo "MAIN_WINDOW_ID=$MAIN_WID" | tee runtime_evidence/main-window-first.txt
          sleep 25

          EULA_WID=""
          for i in $(seq 1 30); do
            EULA_WID=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
            [ -n "$EULA_WID" ] && break
            sleep 1
          done
          test -n "$EULA_WID"
          xdotool getwindowgeometry --shell "$EULA_WID" | tee runtime_evidence/eula-geometry.txt

          eval "$(xdotool getwindowgeometry --shell "$EULA_WID")"
          CLICK_X=$((X + WIDTH * 65 / 100))
          CLICK_Y=$((Y + HEIGHT - 42))
          xdotool windowfocus --sync "$EULA_WID"
          xdotool mousemove --sync "$CLICK_X" "$CLICK_Y"
          import -display :99 -window "$EULA_WID" runtime_evidence/01_eula_before_accept.png
          xdotool click 1
          sleep 3

          EULA_STILL=$(xdotool search --onlyvisible --name '^ЛИЦЕНЗИОННОЕ СОГЛАШЕНИЕ$' 2>/dev/null | tail -1 || true)
          echo "EULA_AFTER_CLICK=$EULA_STILL" | tee runtime_evidence/eula-after-click.txt
          test -z "$EULA_STILL"

          # Stay in the first already-rendered GUI. After EULA dismissal,
          # invoke the native File -> Create command (Ctrl+N) in the same process.
          sleep 5
          xdotool windowfocus --sync "$MAIN_WID"
          xdotool mousemove --sync 500 500
          xdotool click 1
          sleep 1
          xdotool key --clearmodifiers ctrl+n
          sleep 5

          CREATE_WID=$(xdotool getwindowfocus)
          echo "CREATE_WINDOW_ID=$CREATE_WID" | tee runtime_evidence/create-window.txt
          xdotool getwindowname "$CREATE_WID" | tee runtime_evidence/create-window-title.txt || true
          xdotool getwindowgeometry --shell "$CREATE_WID" | tee runtime_evidence/create-window-geometry.txt || true
          xdotool search --onlyvisible --name '.*' getwindowname %@ 2>/dev/null             | tee runtime_evidence/visible-windows-after-ctrl-n.txt || true

          if [ "$CREATE_WID" = "$MAIN_WID" ]; then
            echo 'RESULT=FAIL_CTRL_N_NO_NEW_DOCUMENT_DIALOG' | tee runtime_evidence/result.txt
            exit 51
          fi

          import -display :99 -window "$CREATE_WID" runtime_evidence/02_new_document_dialog.png
          test -s runtime_evidence/02_new_document_dialog.png
          echo 'RESULT=PASS_NEW_DOCUMENT_DIALOG_OPENED' | tee runtime_evidence/result.txt

      - name: Strict new-document dialog gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s runtime_evidence/01_eula_before_accept.png
          test -s runtime_evidence/02_new_document_dialog.png
          grep -q '^EULA_AFTER_CLICK=$' runtime_evidence/eula-after-click.txt
          grep -q '^RESULT=PASS_NEW_DOCUMENT_DIALOG_OPENED$' runtime_evidence/result.txt
          sha256sum runtime_evidence/02_new_document_dialog.png | tee runtime_evidence/sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kompas3d-new-document-dialog-evidence
          path: runtime_evidence/
          if-no-files-found: error
