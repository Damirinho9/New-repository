name: Lab2 Uxx Ikz native Multisim screenshots - order 7330669

on:
  push:
    branches:
      - multisim-7330669-native-gui
    paths:
      - ".github/workflows/multisim-7330669-lab2-states.yml"
      - "final7330669/lab2_states.py"
      - "final7330669/run-lab2-states.ps1"
  workflow_dispatch:

jobs:
  lab2states:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Build real Multisim Lab2 Uxx and Ikz screenshots
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\final7330669\run-lab2-states.ps1 -Workspace "$env:GITHUB_WORKSPACE"
      - name: Inventory
        if: always()
        shell: powershell
        run: |
          $p=".\final7330669-lab2states-artifacts"
          if(Test-Path $p){
            Get-ChildItem $p -Recurse |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize
          }
      - name: Upload Lab2 states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multisim-7330669-lab2-uxx-ikz
          path: final7330669-lab2states-artifacts/
          if-no-files-found: warn
          retention-days: 7
