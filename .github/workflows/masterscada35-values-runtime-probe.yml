name: MasterSCADA 3.5 values and runtime probe 7341100
on:
  push:
    branches: [tmp-masterscada-7341100]
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Restore installer cache
        id: mscache
        uses: actions/cache/restore@v4
        with:
          path: C:\Temp\MasterSCADA35
          key: masterscada-demo-3.5.0-msi-v2
      - name: Install MasterSCADA 3.5
        shell: pwsh
        run: |
          if (!(Test-Path C:\Temp\MasterSCADA35\data.msi)) { throw "Installer cache missing" }
          Copy-Item C:\Temp\MasterSCADA35\data.msi . -Force
          Copy-Item C:\Temp\MasterSCADA35\Data1.cab . -Force
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress') -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "MSI failed $($p.ExitCode)" }

      - name: Restore last successful native project artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{
            Authorization="Bearer $env:GH_TOKEN"
            Accept="application/vnd.github+json"
            "X-GitHub-Api-Version"="2022-11-28"
          }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/Damirinho9/New-repository/actions/artifacts/15220312813/zip" -OutFile previous.zip
          Expand-Archive previous.zip -DestinationPath previous -Force
          $vav=Get-ChildItem previous -Recurse -Filter "7341100_MasterSCADA_Lab7.vav" | Select-Object -First 1
          if(!$vav){ throw "Previous VAV missing" }
          $dest="C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item $vav.FullName (Join-Path $dest $vav.Name) -Force
          $bak=Get-ChildItem previous -Recurse -Filter "*.vav_bak" | Select-Object -First 1
          if($bak){ Copy-Item $bak.FullName (Join-Path $dest $bak.Name) -Force }
          Get-ChildItem $dest | Format-Table Name,Length | Out-File restored_project.txt

      - name: Add native values and probe runtime controls
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto pillow psutil pyautogui
          @'
          from pathlib import Path
          from pywinauto import Desktop, Application
          import time,json,traceback,psutil,shutil,os
          EXE=r"C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          VAV=r"C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7\7341100_MasterSCADA_Lab7.vav"
          NAMES=["Level","Setpoint","F1","F2","ValveOpen"]
          log=[]
          def demoji(s):
              try:return s.encode("cp1252").decode("cp1251")
              except:return s
          def kill_all():
              for p in psutil.process_iter(["name"]):
                  try:
                      if p.info["name"] and "masterscada" in p.info["name"].lower(): p.kill()
                  except:pass
          def mainwin(pid=None):
              ws=Desktop(backend="win32").windows(process=pid) if pid else Desktop(backend="win32").windows()
              for w in ws:
                  try:
                      if w.is_visible() and w.window_text().startswith("MasterSCADA"): return w
                  except:pass
              raise RuntimeError("main missing")
          def dialogs(pid):
              return [w for w in Desktop(backend="win32").windows(process=pid) if w.class_name()=="#32770" and w.is_visible()]
          def snap(w,p):
              try:w.capture_as_image().save(p);log.append("SHOT "+p)
              except Exception as e:log.append("SHOTERR "+repr(e))
          def open_project():
              app=Application(backend="win32").start(EXE);pid=app.process;time.sleep(8)
              m=mainwin(pid)
              ds=dialogs(pid)
              # Official MasterSCADA 3 workflow: startup dialog -> Existing project tab.
              if not ds:
                  m.set_focus();m.type_keys("^o");time.sleep(2);ds=dialogs(pid)
              if not ds: raise RuntimeError("MasterSCADA project dialog missing")
              d=ds[0]
              log.append("PROJECT_DIALOG="+repr(d.window_text()))
              # Select the "Existing" tab. Legacy MFC recreates child handles,
              # so use a native mouse click relative to the current dialog rectangle.
              import pyautogui
              rr=d.rectangle()
              log.append("PROJECT_DIALOG_RECT="+str(rr))
              try: pyautogui.screenshot("00_project_dialog_new.png")
              except: pass
              # Header layout is New | Previous | Existing | Samples.
              pyautogui.click(rr.left+200, rr.top+48)
              time.sleep(2)
              # Re-acquire the dialog because the old MFC child handles may be destroyed.
              ds=dialogs(pid)
              if not ds: raise RuntimeError("Project dialog vanished after Existing-tab click")
              d=ds[0]
              try: pyautogui.screenshot("00_project_dialog_existing.png")
              except: pass
              buttons=[c for c in d.descendants() if c.class_name()=="Button" and c.is_visible()]
              btn_info=[(demoji(b.window_text()).strip(),str(b.rectangle()),b.is_enabled()) for b in buttons]
              log.append("EXISTING_BUTTONS="+repr(btn_info))
              # The copied project is already listed in the default project folder.
              # Select the first project row and press the native OK button.
              pyautogui.click(rr.left+180, rr.top+90)
              time.sleep(.8)
              ok=None
              # Re-acquire after row selection.
              ds=dialogs(pid); d=ds[0]
              for b in d.descendants():
                  try:
                      if b.class_name()=="Button" and b.is_visible() and b.window_text().strip().upper()=="OK" and b.is_enabled():
                          ok=b;break
                  except: pass
              if ok is None: raise RuntimeError("Existing-project OK button missing")
              ok.click_input();time.sleep(2)
              # Wait through optional project access dialog and complete editor load.
              deadline=time.time()+45;last_title="";handled=set()
              while time.time()<deadline:
                  time.sleep(1)
                  for dd in dialogs(pid):
                      try:
                          h=dd.handle
                          if h in handled: continue
                          # Access dialog defaults are intentionally blank for this project.
                          dd.type_keys("{ENTER}");handled.add(h);time.sleep(.8)
                      except: pass
                  try:
                      m=mainwin(pid);last_title=m.window_text()
                      if "7341100_MasterSCADA_Lab7" in last_title:
                          return pid,m
                  except: pass
              raise RuntimeError("project title mismatch after Existing-tab open "+last_title)
          def uiamain(m):return Desktop(backend="uia").window(handle=m.handle)
          def trees(m):
              return uiamain(m).descendants(control_type="TreeItem")
          def find_item(m,name):
              for it in trees(m):
                  try:
                      raw=it.window_text(); dec=demoji(raw).strip()
                      if dec==name or raw.strip()==name:return it
                  except:pass
              return None
          def visible_menu_items():
              out=[]
              for w in Desktop(backend="uia").windows():
                  try:
                      for x in w.descendants(control_type="MenuItem"):
                          if x.is_visible():out.append(x)
                  except:pass
              return out
          def top_add(m,label):
              uu=uiamain(m);top=None
              for x in uu.descendants(control_type="MenuItem"):
                  try:
                      if demoji(x.window_text()).strip()=="Добавить":top=x;break
                  except:pass
              if top is None:raise RuntimeError("Add top menu missing")
              top.click_input();time.sleep(.5)
              labels=[];target=None
              for x in visible_menu_items():
                  try:
                      d=demoji(x.window_text()).strip()
                      if d:labels.append(d)
                      if d==label:target=x
                  except:pass
              log.append("ADD_POPUP="+repr(labels))
              if target is None:
                  m.type_keys("{ESC}");raise RuntimeError("Add target missing "+label)
              target.click_input();time.sleep(1)
          def rename_item(m,item,newname):
              item.click_input();time.sleep(.2);m.type_keys("{F2}");time.sleep(.5)
              # Prefer an in-place Edit created by the tree.
              edits=[]
              for w in Desktop(backend="win32").windows(process=m.process_id()):
                  try:
                      edits += [c for c in w.descendants() if c.class_name()=="Edit" and c.is_visible()]
                  except:pass
              if edits:
                  cand=edits[-1]
                  try:
                      cand.set_edit_text(newname);cand.type_keys("{ENTER}");time.sleep(.8)
                      return
                  except:pass
              m.type_keys("^a");m.type_keys(newname,with_spaces=True);m.type_keys("{ENTER}");time.sleep(.8)
          def dump(m,path):
              rows=[]
              for i,c in enumerate(uiamain(m).descendants()):
                  try:rows.append({"i":i,"type":c.element_info.control_type,"raw":c.window_text(),"dec":demoji(c.window_text()),"autoid":c.element_info.automation_id,"rect":str(c.rectangle())})
                  except:pass
              Path(path).write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
              return rows
          def dump_mode_menu(m):
              uu=uiamain(m);mode=None
              for x in uu.descendants(control_type="MenuItem"):
                  try:
                      if demoji(x.window_text()).strip()=="Режим":mode=x;break
                  except:pass
              if mode is None:return []
              mode.click_input();time.sleep(.6)
              vals=[]
              for x in visible_menu_items():
                  try:
                      s=demoji(x.window_text()).strip()
                      if s: vals.append(s)
                  except:pass
              m.type_keys("{ESC}")
              return vals
          try:
              pid,m=open_project();snap(m,"01_restored.png")
              obj=find_item(m,"Объект 1")
              if obj is None:raise RuntimeError("Object 1 missing")
              existing=[demoji(x.window_text()).strip() for x in trees(m)]
              log.append("TREE_BEFORE="+repr(existing))
              for idx,name in enumerate(NAMES,1):
                  obj=find_item(m,"Объект 1") or obj
                  obj.click_input();top_add(m,"Значение");time.sleep(.7)
                  # Find newest default value entry.
                  candidates=[]
                  for it in trees(m):
                      try:
                          d=demoji(it.window_text()).strip()
                          if d.startswith("Значение"):candidates.append(it)
                      except:pass
                  if not candidates:raise RuntimeError("No native Value created for "+name)
                  target=candidates[-1]
                  rename_item(m,target,name)
                  log.append("RENAMED_TO="+name)
              m.set_focus();m.type_keys("^s");time.sleep(4)
              rows=dump(m,"uia_values.json")
              names_after=[demoji(x.window_text()).strip() for x in trees(m)]
              Path("tree_after_values.json").write_text(json.dumps(names_after,ensure_ascii=False,indent=2),encoding="utf-8")
              missing=[n for n in NAMES if n not in names_after]
              Path("values_result.txt").write_text("VALUES="+("PASS" if not missing else "FAIL")+"\nMISSING="+repr(missing)+"\n",encoding="utf-8")
              snap(m,"02_values_added.png")
              mode=dump_mode_menu(m)
              Path("mode_menu.json").write_text(json.dumps(mode,ensure_ascii=False,indent=2),encoding="utf-8")
              log.append("MODE_MENU="+repr(mode))

              # Probe the first calculation editor/property view.
              calc=find_item(m,"Расчет 1")
              if calc:
                  calc.double_click_input();time.sleep(2)
                  dump(m,"uia_calc_open.json")
                  snap(m,"03_calc_probe.png")
              m.set_focus();m.type_keys("^s");time.sleep(3)
              kill_all();time.sleep(2)

              # Reopen and verify native persistence.
              pid,m=open_project();time.sleep(2)
              persisted=[demoji(x.window_text()).strip() for x in trees(m)]
              miss2=[n for n in NAMES if n not in persisted]
              Path("values_reopen_result.txt").write_text("VALUES_REOPEN="+("PASS" if not miss2 else "FAIL")+"\nMISSING="+repr(miss2)+"\n",encoding="utf-8")
              snap(m,"04_values_reopened.png")
              dump(m,"uia_reopened_values.json")
              # Copy the resulting native project.
              src=Path(VAV).parent
              dst=Path("native_project_snapshot")/src.name
              if dst.exists():shutil.rmtree(dst)
              shutil.copytree(src,dst)
              kill_all()
          except Exception:
              log.append("FATAL\n"+traceback.format_exc())
              raise
          finally:
              Path("probe_log.txt").write_text("\n".join(log),encoding="utf-8")
              kill_all()
          '@ | Set-Content probe.py -Encoding UTF8
          python probe.py

      - name: Upload values/runtime probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada35-values-runtime-probe-7341100
          path: |
            restored_project.txt
            values_result.txt
            values_reopen_result.txt
            mode_menu.json
            tree_after_values.json
            uia_values.json
            uia_calc_open.json
            uia_reopened_values.json
            probe_log.txt
            00_project_dialog_new.png
            00_project_dialog_existing.png
            00_file_dialog.png
            01_restored.png
            02_values_added.png
            03_calc_probe.png
            04_values_reopened.png
            native_project_snapshot/**
          if-no-files-found: warn
