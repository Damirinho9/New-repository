name: KOMPAS Ubuntu Work 1 variant 06 native parametric FRW

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/work1-variant06-ubuntu-native.yml'
      - 'kompas-linux/work1_variant06_native.cpp'
      - 'kompas-linux/bootstrap_variant06_qt.cpp'

jobs:
  native-work1:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kompas-7335493-native-work1

      - name: Build and run Work 1 in clean Ubuntu KOMPAS v25
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf result/work1-ubuntu-native
          mkdir -p result/work1-ubuntu-native

          docker run --rm --name work1-kompas \
            -v "$PWD:/work" \
            ubuntu:24.04 bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                wget curl ca-certificates gnupg lsb-release xvfb xauth dbus procps \
                locales fontconfig qt6-base-dev pkg-config clang g++ libc++-dev libc++abi-dev \
                libxcb-res0 libxcb-dri2-0 libxcb-cursor0 libxres1 libxcb-ewmh2 libxcb-icccm4 \
                libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libunwind8 libxcb-xkb1 libxkbcommon-x11-0 \
                libxcb-util1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render0 libxcb-shm0 \
                libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxcb-present0 libxcb-dri3-0

              wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
              bash /tmp/ascon.sh || true
              rm -f /etc/apt/sources.list.d/ascon.list
              echo "deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main" > /etc/apt/sources.list.d/ascon.list
              test -s /etc/apt/trusted.gpg.d/ascon.gpg
              apt-get update
              apt-get install -y ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25

              BIN=/opt/ascon/kompas3d-v25/Bin
              INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
              test -x "$BIN/ksinvisible"
              ldd "$BIN/ksinvisible" | tee /tmp/ksinvisible-ldd.txt
              ! grep -q "not found" /tmp/ksinvisible-ldd.txt

              clang++ -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread \
                -I"$INC" /work/kompas-linux/work1_variant06_native.cpp \
                -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi \
                -o /tmp/writer_variant06.so

              g++ -std=c++20 -O2 -fPIC -shared -pthread \
                /work/kompas-linux/bootstrap_variant06_qt.cpp \
                $(pkg-config --cflags --libs Qt6Core) -ldl \
                -o /tmp/bootstrap_variant06_qt.so

              export HOME=/root XDG_CONFIG_HOME=/root/.config
              mkdir -p /root/.config/ascon/KOMPAS-3D/25 /root/.config/ascon/"KOMPAS-3D Invisible"/25
              if [ -d /etc/ascon/KOMPAS-3D/25 ]; then
                cp -a /etc/ascon/KOMPAS-3D/25/. /root/.config/ascon/KOMPAS-3D/25/ || true
                cp -a /etc/ascon/KOMPAS-3D/25/. /root/.config/ascon/"KOMPAS-3D Invisible"/25/ || true
              fi
              RES=$(find /opt/ascon/kompas3d-v25 -type f -name QtResources.bin -print -quit || true)
              [ -z "$RES" ] || cp -f "$RES" /root/.config/ascon/"KOMPAS-3D Invisible"/25/QtResources.bin

              rm -rf /tmp/work1_v06_native
              rm -f /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
              mkdir -p /tmp/.X11-unix
              chmod 1777 /tmp/.X11-unix
              rm -f /tmp/.X11-unix/X108
              Xvfb :108 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb.out 2>/tmp/xvfb.err &
              XV=$!
              trap "kill $XV 2>/dev/null || true" EXIT
              sleep 2
              test -S /tmp/.X11-unix/X108

              export DISPLAY=:108 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN"
              unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
              dbus-run-session -- env HOME=/root XDG_CONFIG_HOME=/root/.config \
                DISPLAY=:108 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN" \
                LD_PRELOAD=/tmp/bootstrap_variant06_qt.so \
                "$BIN/ksinvisible" -automation >/tmp/kompas-work1.out 2>/tmp/kompas-work1.err &
              KP=$!

              PASS=0
              for i in $(seq 1 150); do
                sleep 2
                if grep -q "^RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06$" /tmp/work1_v06_native/work1.log 2>/dev/null; then
                  PASS=1
                  break
                fi
                if ! kill -0 "$KP" 2>/dev/null; then break; fi
              done

              cat /tmp/work1_bootstrap.log 2>/dev/null || true
              cat /tmp/work1_v06_native/work1.log 2>/dev/null || true
              tail -200 /tmp/kompas-work1.err 2>/dev/null || true

              mkdir -p /work/result/work1-ubuntu-native
              if [ "$PASS" != "1" ]; then
                mkdir -p /work/result/work1-ubuntu-native/diagnostics
                cp /tmp/work1_bootstrap.log /work/result/work1-ubuntu-native/diagnostics/ 2>/dev/null || true
                cp /tmp/work1_v06_native/work1.log /work/result/work1-ubuntu-native/diagnostics/ 2>/dev/null || true
                cp /tmp/kompas-work1.err /work/result/work1-ubuntu-native/diagnostics/ 2>/dev/null || true
                cp /tmp/ksinvisible-ldd.txt /work/result/work1-ubuntu-native/diagnostics/ 2>/dev/null || true
                exit 30
              fi

              test -s /tmp/work1_v06_native/Work1_V06_ParametricMechanism.frw
              grep -q "^PRE_SAVE_FI_45_135_90_PHYSICAL_MOVEMENT_PASS$" /tmp/work1_v06_native/work1.log
              grep -q "^POST_REOPEN_FI_45_135_90_PHYSICAL_MOVEMENT_PASS$" /tmp/work1_v06_native/work1.log
              grep -q "^FINAL_SAVE_CLOSE_REOPEN_REBUILD_PASS$" /tmp/work1_v06_native/work1.log
              cp -a /tmp/work1_v06_native/. /work/result/work1-ubuntu-native/
              cp /tmp/work1_bootstrap.log /work/result/work1-ubuntu-native/
              cp /tmp/ksinvisible-ldd.txt /work/result/work1-ubuntu-native/
            '

      - name: Strict native FRW and SHA gate
        shell: bash
        run: |
          set -euxo pipefail
          D=result/work1-ubuntu-native
          F="$D/Work1_V06_ParametricMechanism.frw"
          test -s "$F"
          grep -q '^RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06$' "$D/work1.log"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          d=Path("result/work1-ubuntu-native")
          p=d/"Work1_V06_ParametricMechanism.frw"
          assert p.stat().st_size>1024
          assert zipfile.is_zipfile(p)
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert "Contents" in names and "FileInfo" in names
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          (d/"SHA256.txt").write_text(f"{h}  {p.name}\n")
          (d/"ACCEPTANCE.txt").write_text(
              "VARIABLES_l1_l2_l3_L_fi_PASS\n"
              "FI_45_135_90_PRE_SAVE_PASS\n"
              "FI_45_135_90_POST_REOPEN_PASS\n"
              "RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06\n"
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-work1-variant06-ubuntu-native-frw
          if-no-files-found: error
          path: result/work1-ubuntu-native/**
