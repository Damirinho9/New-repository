name: MasterSCADA 7341268 Stage 2

on:
  push:
    branches:
      - masterscada-7341268-windows
    paths:
      - ".github/workflows/masterscada-7341268-stage2.yml"
      - "masterscada-7341268-stage2/**"
  workflow_dispatch:

jobs:
  stage2:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\masterscada-7341268-stage2" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\MasterSCADA_7341268\installer" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\MasterSCADA Projects\7341268_Variant7" | Out-Null

      - name: Install official MasterSCADA 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "https://download.mps-soft.ru/demo/Old%20Demo/3.11/"
          $dest = "C:\MasterSCADA_7341268\installer"
          foreach ($name in @("Data1.cab","data.msi","setup.bmp","setup.exe")) {
            & curl.exe -k -L --fail --silent --show-error ($base + $name) -o (Join-Path $dest $name)
            if ($LASTEXITCODE -ne 0) { throw "download failed: $name" }
          }
          $log = "$env:GITHUB_WORKSPACE\masterscada-7341268-stage2\msi-install.log"
          $p = Start-Process msiexec.exe -ArgumentList @("/i",(Join-Path $dest "data.msi"),"/qn","/norestart","/L*v",$log) -Wait -PassThru
          "MSI_EXIT=$($p.ExitCode)" | Out-File -Encoding utf8 "$env:GITHUB_WORKSPACE\masterscada-7341268-stage2\install.txt"
          if ($p.ExitCode -notin @(0,3010,1641)) { throw "MSI failed: $($p.ExitCode)" }

      - name: Inspect MasterSCADA COM automation model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "$env:GITHUB_WORKSPACE\masterscada-7341268-stage2\com-model.txt"
          "=== Registry ===" | Out-File -Encoding utf8 $out
          cmd /c 'reg query "HKCR\MasterSCADA.Application" /s' 2>&1 | Add-Content -Encoding utf8 $out
          cmd /c 'reg query "HKCR\MasterSCADA.Application.1" /s' 2>&1 | Add-Content -Encoding utf8 $out

          "=== COM Get-Member ===" | Add-Content -Encoding utf8 $out
          try {
            $app = New-Object -ComObject MasterSCADA.Application
            "COM_CREATED=true" | Add-Content -Encoding utf8 $out
            $app | Get-Member -Force | Out-String -Width 300 | Add-Content -Encoding utf8 $out
            "=== Selected property probes ===" | Add-Content -Encoding utf8 $out
            foreach ($p in @("Visible","Project","Projects","ActiveProject","Documents","TreeItemHlp","Name","Version")) {
              try {
                $v = $app.$p
                "$p = $v" | Add-Content -Encoding utf8 $out
                if ($null -ne $v) {
                  "TYPE[$p]=$($v.GetType().FullName)" | Add-Content -Encoding utf8 $out
                  $v | Get-Member -Force | Out-String -Width 300 | Add-Content -Encoding utf8 $out
                }
              } catch {
                "$p ERROR: $($_.Exception.Message)" | Add-Content -Encoding utf8 $out
              }
            }
            try { $app.Quit() } catch {}
            [Runtime.InteropServices.Marshal]::FinalReleaseComObject($app) | Out-Null
          } catch {
            "COM_CREATED=false" | Add-Content -Encoding utf8 $out
            $_.Exception.ToString() | Add-Content -Encoding utf8 $out
          }

      - name: Create native empty project and inspect project object model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:GITHUB_WORKSPACE\masterscada-7341268-stage2\project-model.txt"
          $projectsFolder = "C:\MasterSCADA Projects\Projects"
          $projectID = "7341268_Variant7"
          $projectFolder = Join-Path $projectsFolder $projectID
          if (Test-Path $projectFolder) { Remove-Item $projectFolder -Recurse -Force -ErrorAction SilentlyContinue }
          $app = $null
          try {
            $app = New-Object -ComObject MasterSCADA.Application
            "COM_CREATED=true" | Out-File -Encoding utf8 $out
            "CALL CreateProject location=1 folder=$projectsFolder id=$projectID" | Add-Content -Encoding utf8 $out
            $app.CreateProject(1, $projectsFolder, $projectID, "Система водяного отопления - вариант 7", "")
            "CREATE_SUCCESS=true" | Add-Content -Encoding utf8 $out
            Start-Sleep -Seconds 3
            $p = $app.CurrentProject
            if ($null -eq $p) { throw "CurrentProject is null after CreateProject" }
            "PROJECT_NAME=$($p.Name)" | Add-Content -Encoding utf8 $out
            "PROJECT_PATH=$($p.Path)" | Add-Content -Encoding utf8 $out
            "PROJECT_GUID=$($p.ProjectGUID)" | Add-Content -Encoding utf8 $out
            "COMPUTER_COUNT=$($p.ComputerCount)" | Add-Content -Encoding utf8 $out
            "=== CurrentProject ===" | Add-Content -Encoding utf8 $out
            $p | Get-Member -Force | Out-String -Width 320 | Add-Content -Encoding utf8 $out

            foreach ($pair in @(@("SystemRoot",$p.SystemRoot), @("SysTree",$p.SysTree), @("ObjTree",$p.ObjTree), @("ObjRoot",$p.ObjTree.Root))) {
              $name=$pair[0]; $v=$pair[1]
              "=== $name ===" | Add-Content -Encoding utf8 $out
              try {
                "NAME=$($v.Name) COUNT=$($v.Count) ITEMTYPE=$($v.ItemType) OBJECTTYPE=$($v.ObjectType) FULL=$($v.FullName)" | Add-Content -Encoding utf8 $out
              } catch {}
              $v | Get-Member -Force | Out-String -Width 320 | Add-Content -Encoding utf8 $out
            }

            $p.Save()
            "SAVE_SUCCESS=true" | Add-Content -Encoding utf8 $out
            "=== Files ===" | Add-Content -Encoding utf8 $out
            Get-ChildItem $projectFolder -Recurse -Force -ErrorAction SilentlyContinue |
              ForEach-Object { "$($_.FullName)`t$($_.Length)" } |
              Add-Content -Encoding utf8 $out
            Get-ChildItem $projectsFolder -Recurse -Filter "$projectID.vav" -File -ErrorAction SilentlyContinue |
              ForEach-Object { "FOUND_VAV=$($_.FullName)`t$($_.Length)`tSHA256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } |
              Add-Content -Encoding utf8 $out
          } finally {
            if ($app) {
              try { $app.ExitScada() } catch {}
              try { [Runtime.InteropServices.Marshal]::FinalReleaseComObject($app) | Out-Null } catch {}
            }
          }

      - name: Inspect registered type libraries and native VAV header
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = "$env:GITHUB_WORKSPACE\masterscada-7341268-stage2\typelib-and-vav.txt"
          "=== CLSID ===" | Out-File -Encoding utf8 $out
          Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\MasterSCADA.Application\CLSID" |
            Format-List * | Out-String -Width 300 | Add-Content -Encoding utf8 $out
          $clsid = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\MasterSCADA.Application\CLSID").'(default)'
          "CLSID=$clsid" | Add-Content -Encoding utf8 $out
          if ($clsid) {
            Get-ChildItem "Registry::HKEY_CLASSES_ROOT\CLSID\$clsid" -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object {
                "KEY=$($_.Name)" | Add-Content -Encoding utf8 $out
                try { Get-ItemProperty $_.PSPath | Format-List * | Out-String -Width 300 | Add-Content -Encoding utf8 $out } catch {}
              }
          }
          "=== Created VAV candidates ===" | Add-Content -Encoding utf8 $out
          Get-ChildItem "C:\MasterSCADA Projects" -Recurse -Filter "*7341268*.vav" -File -ErrorAction SilentlyContinue |
            ForEach-Object {
              "$($_.FullName)`t$($_.Length)`t$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" | Add-Content -Encoding utf8 $out
            }

      - name: Upload stage 2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada-7341268-stage2-diagnostics
          path: |
            masterscada-7341268-stage2/**
            C:/MasterSCADA Projects/Projects/7341268_Variant7/**
          if-no-files-found: warn
