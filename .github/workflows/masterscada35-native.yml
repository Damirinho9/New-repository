name: MasterSCADA 3.5 direct MSI native 7341100
on:
  push:
    branches: [tmp-masterscada-7341100]
jobs:
  native35:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Download package
        shell: pwsh
        run: |
          $b="https://download.mps-soft.ru/demo/Old%20Demo/3.5"
          curl.exe -k -L --fail "$b/version.txt" -o version35.txt
          curl.exe -k -L --fail "$b/data.msi" -o data.msi
          curl.exe -k -L --fail "$b/Data1.cab" -o Data1.cab
          Get-Content version35.txt | Out-File version35_out.txt
          Get-FileHash data.msi -Algorithm SHA256 | Format-List | Out-File data_msi_hash.txt
          $wi=New-Object -ComObject WindowsInstaller.Installer
          $db=$wi.OpenDatabase((Resolve-Path data.msi),0)
          $v=$db.OpenView("SELECT Property,Value FROM Property")
          $v.Execute()
          $rows=@()
          while($r=$v.Fetch()){ if($r.StringData(1) -match 'Product|Manufacturer|Install|ALLUSERS|ARPNOREMOVE|ARPNOMODIFY'){ $rows += "$($r.StringData(1))=$($r.StringData(2))" } }
          $rows | Out-File msi_properties.txt
      - name: Install MSI
        shell: pwsh
        run: |
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress','/L*V',('"' + (Join-Path $PWD 'install35.log') + '"')) -PassThru -Wait
          "ExitCode=$($p.ExitCode)" | Out-File install35_result.txt
          Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall" -ErrorAction SilentlyContinue |
            Get-ItemProperty -ErrorAction SilentlyContinue |
            Where-Object {$_.DisplayName -match 'MasterSCADA|Master SCADA'} |
            Select DisplayName,DisplayVersion,InstallLocation,UninstallString | Format-List | Out-File registry35.txt
          Get-ChildItem "C:\Program Files","C:\Program Files (x86)" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match 'MasterSCADA|Master.*SCADA|MStudio|Designer'} |
            Select FullName,Length,LastWriteTime | Format-Table -AutoSize | Out-File exes35.txt -Width 400
          exit 0
      - name: Probe UI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto pillow pyautogui
          @'
          from pathlib import Path
          from pywinauto import Desktop,Application
          import time, traceback, os, glob
          out=[]
          candidates=[]
          for root in [r"C:\Program Files",r"C:\Program Files (x86)"]:
              for dp,ds,fs in os.walk(root):
                  for f in fs:
                      if f.lower().endswith(".exe") and ("masterscada" in f.lower() or "master scada" in f.lower()):
                          candidates.append(os.path.join(dp,f))
          out.append("CANDIDATES="+repr(candidates))
          for exe in candidates:
              try:
                  app=Application(backend="win32").start(exe)
                  time.sleep(12)
                  out.append("STARTED "+exe)
                  for w in Desktop(backend="uia").windows():
                      try:
                          t=w.window_text()
                          if t:
                              out.append("WINDOW "+repr(t)+" class="+repr(w.element_info.class_name))
                              if "Master" in t or "SCADA" in t:
                                  try: w.capture_as_image().save("master35.png")
                                  except Exception as e: out.append("CAPERR "+repr(e))
                      except: pass
                  break
              except Exception as e:
                  out.append("ERR "+exe+" "+repr(e))
          Path("ui35.txt").write_text("\n".join(out),encoding="utf-8")
          '@ | Set-Content probe35.py -Encoding UTF8
          python probe35.py
          Get-Process | Where-Object {$_.ProcessName -match 'Master|SCADA'} | Select ProcessName,Id,MainWindowTitle,Path | Format-List | Out-File process35.txt
          Get-Process | Where-Object {$_.ProcessName -match 'Master|SCADA'} | Stop-Process -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: masterscada35-native-probe
          path: |
            version35_out.txt
            data_msi_hash.txt
            msi_properties.txt
            install35_result.txt
            install35.log
            registry35.txt
            exes35.txt
            ui35.txt
            process35.txt
            master35.png
          if-no-files-found: warn
