name: Inspect standalone KOMPAS 2D serialization libs

on:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/inspect-kompas-2d-libs.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: sudo apt-get update && sudo apt-get install -y rpm2cpio cpio binutils
      - name: Download official KOMPAS v25 graphic RPM
        run: |
          curl -fL --retry 5 --retry-delay 2 -o graphic.rpm \
            'https://repo.ascon.ru/stable/alt/p11/x86_64/RPMS.main/ascon-kompas-graphic-v25-25.0.5.2780-0.x86_64.rpm'
      - name: Extract selected libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir root out
          (cd root && rpm2cpio ../graphic.rpm | cpio -idm --quiet)
          B=root/opt/ascon/kompas3d-v25/Bin
          for f in \
            libksAPI.so libksAPIC.so libksAPICLink.so \
            libkDocument.so libkDocument2D.so libkOpenSave.so \
            libk2DDoc.so libk2DObj.so libkAPI2DCore.so; do
            cp "$B/$f" out/
          done
          for f in out/*.so; do
            echo "===== $f =====" | tee -a out/exports-summary.txt
            file "$f" | tee -a out/exports-summary.txt
            ldd "$f" | tee -a out/exports-summary.txt || true
            echo "--- exported names matching document/open/save/api/fragment/constraint/variable ---" | tee -a out/exports-summary.txt
            nm -D --defined-only "$f" 2>/dev/null | c++filt | \
              grep -Eai 'document|open|save|fragment|constraint|variable|parametric|serialize|create|ksapi|init|application' | \
              head -1500 | tee -a out/exports-summary.txt || true
          done
          sed -n '1,8000p' out/exports-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kompas-v25-2d-serialization-libs
          compression-level: 9
          path: out/**

