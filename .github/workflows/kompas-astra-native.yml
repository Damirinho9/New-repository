name: KOMPAS Astra native install
on:
  push:
    branches:
      - kompas-linux-probe-run
jobs:
  astra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install KOMPAS in official Astra 1.8 container
        run: bash kompas-linux/probe-astra.sh
