name: Hexlet 7344445 Build VLAN and ACL Labs

on:
  push:
    branches:
      - hexlet-7344445-switch-acl
    paths:
      - "hexlet_7344445/switch_acl/**"
      - ".github/workflows/hexlet-7344445-switch-acl.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native Packet Tracer tooling
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/fn-cafeina/lab-pkt.git /tmp/lab-pkt
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/lab-pkt

      - name: Build VLAN and ACL labs
        shell: bash
        run: |
          set -euxo pipefail
          python hexlet_7344445/switch_acl/build_switch_acl.py
          find hexlet_7344445/switch_acl/out -type f -printf '%P %s bytes\n' | sort
          sha256sum hexlet_7344445/switch_acl/out/*.pkt
          test -f hexlet_7344445/switch_acl/7344445_Cisco_PacketTracer_Коммутация_ACL.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 7344445-Cisco-PacketTracer-Switch-ACL
          path: |
            hexlet_7344445/switch_acl/out/
            hexlet_7344445/switch_acl/7344445_Cisco_PacketTracer_Коммутация_ACL.zip
          if-no-files-found: error
