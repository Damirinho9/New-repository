name: MasterSCADA 3.5 formula and runtime direct probe 7341100
on:
  push:
    branches: [tmp-masterscada-7341100]
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Install MasterSCADA 3.5
        shell: pwsh
        run: |
          if (!(Test-Path C:\Temp\MasterSCADA35\data.msi)) {
            New-Item -ItemType Directory -Path C:\Temp\MasterSCADA35 -Force | Out-Null
            $b="https://download.mps-soft.ru/demo/Old%20Demo/3.5"
            curl.exe -k -L --fail "$b/data.msi" -o C:\Temp\MasterSCADA35\data.msi
            curl.exe -k -L --fail "$b/Data1.cab" -o C:\Temp\MasterSCADA35\Data1.cab
          }
          Copy-Item C:\Temp\MasterSCADA35\data.msi . -Force
          Copy-Item C:\Temp\MasterSCADA35\Data1.cab . -Force
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress') -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "MSI failed $($p.ExitCode)" }
      - name: Restore persisted values project
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept="application/vnd.github+json";"X-GitHub-Api-Version"="2022-11-28"}
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/Damirinho9/New-repository/actions/artifacts/15227142597/zip" -OutFile prev.zip
          Expand-Archive prev.zip -DestinationPath prev -Force
          $v=Get-ChildItem prev -Recurse -Filter "7341100_MasterSCADA_Lab7.vav" | Select-Object -First 1
          if(!$v){throw "VAV not found"}
          $dest="C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7"
          New-Item -ItemType Directory $dest -Force|Out-Null
          Copy-Item $v.FullName "$dest\7341100_MasterSCADA_Lab7.vav" -Force
          Get-Item "$dest\7341100_MasterSCADA_Lab7.vav"|Format-List FullName,Length,LastWriteTime|Out-File restored.txt
      - name: Formula UI and direct Runtime probe
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto pillow psutil pyautogui
          @'
          from pathlib import Path
          from pywinauto import Desktop,Application
          import pyautogui,time,json,traceback,psutil,subprocess,os
          EXE=r"C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          VAV=r"C:\MasterSCADA Projects\Projects\7341100_MasterSCADA_Lab7\7341100_MasterSCADA_Lab7.vav"
          log=[]
          def dec(s):
              try:return s.encode("cp1252").decode("cp1251")
              except:return s
          def kill():
              for p in psutil.process_iter(["name"]):
                  try:
                      if p.info["name"] and "masterscada" in p.info["name"].lower(): p.kill()
                  except: pass
          def wins(pid=None):
              return Desktop(backend="win32").windows(process=pid) if pid else Desktop(backend="win32").windows()
          def main(pid):
              for w in wins(pid):
                  try:
                      if w.is_visible() and w.window_text().startswith("MasterSCADA"): return w
                  except: pass
              return None
          def dialogs(pid):
              return [w for w in wins(pid) if w.class_name()=="#32770" and w.is_visible()]
          def dump_uia(handle,path):
              w=Desktop(backend="uia").window(handle=handle);rows=[]
              for i,x in enumerate(w.descendants()):
                  try: rows.append({"i":i,"type":x.element_info.control_type,"raw":x.window_text(),"dec":dec(x.window_text()),"autoid":x.element_info.automation_id,"class":x.element_info.class_name,"rect":str(x.rectangle())})
                  except: pass
              Path(path).write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
              return rows
          def open_editor():
              app=Application(backend="win32").start(EXE);pid=app.process;time.sleep(8)
              ds=dialogs(pid)
              if not ds: raise RuntimeError("startup project dialog missing")
              d=ds[0]; rr=d.rectangle()
              pyautogui.click(rr.left+200,rr.top+48);time.sleep(2)
              d=dialogs(pid)[0]; pyautogui.click(rr.left+180,rr.top+90);time.sleep(.6)
              ok=None
              for b in d.descendants():
                  try:
                      if b.class_name()=="Button" and b.window_text().strip().upper()=="OK" and b.is_enabled(): ok=b;break
                  except: pass
              if not ok: raise RuntimeError("OK missing")
              ok.click_input()
              deadline=time.time()+40
              while time.time()<deadline:
                  time.sleep(1)
                  for dd in dialogs(pid):
                      try: dd.type_keys("{ENTER}")
                      except: pass
                  m=main(pid)
                  if m and "7341100_MasterSCADA_Lab7" in m.window_text(): return pid,m
              raise RuntimeError("editor open timeout")
          try:
              pid,m=open_editor()
              m.capture_as_image().save("01_editor_restored.png")
              uu=Desktop(backend="uia").window(handle=m.handle)
              def items():
                  return uu.descendants(control_type="TreeItem")
              def find(n):
                  for x in items():
                      try:
                          if dec(x.window_text()).strip()==n:return x
                      except:pass
              r=find("Объект")
              if r:
                  try:r.expand()
                  except: r.double_click_input()
                  time.sleep(.8)
              o=find("Объект 1")
              if o:
                  try:o.expand()
                  except:o.double_click_input()
                  time.sleep(.8)
              names=[dec(x.window_text()).strip() for x in items()]
              Path("tree_verified.json").write_text(json.dumps(names,ensure_ascii=False,indent=2),encoding="utf-8")
              expected=["Level","Setpoint","F1","F2","ValveOpen"]
              Path("values_persistence.txt").write_text("VALUES_REOPEN="+("PASS" if all(x in names for x in expected) else "FAIL")+"\n"+repr(names),encoding="utf-8")
              calc=find("Расчет 1")
              if not calc: raise RuntimeError("Calculation 1 missing")
              calc.click_input();time.sleep(1)
              # Formula tab is the fourth property tab, immediately before Archive.
              pyautogui.click(595,89);time.sleep(2)
              m.capture_as_image().save("02_formula_tab.png")
              rows=dump_uia(m.handle,"formula_uia.json")
              # Win32 controls give exact edit/button IDs.
              wrows=[]
              for i,x in enumerate(m.descendants()):
                  try:wrows.append({"i":i,"class":x.class_name(),"text":x.window_text(),"dec":dec(x.window_text()),"id":x.control_id(),"rect":str(x.rectangle()),"visible":x.is_visible(),"enabled":x.is_enabled()})
                  except:pass
              Path("formula_win32.json").write_text(json.dumps(wrows,ensure_ascii=False,indent=2),encoding="utf-8")
              m.type_keys("^s");time.sleep(2)
              kill();time.sleep(2)

              # Official standalone Runtime launch: MasterSCADA.exe <project.vav>.
              p=subprocess.Popen([EXE,VAV])
              log.append("RT_PID="+str(p.pid));time.sleep(18)
              plist=[]
              for pr in psutil.process_iter(["pid","name","exe"]):
                  try:
                      if pr.info["name"] and "masterscada" in pr.info["name"].lower(): plist.append(pr.info)
                  except:pass
              Path("runtime_processes.json").write_text(json.dumps(plist,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
              rwins=[]
              for w in Desktop(backend="win32").windows():
                  try:
                      if w.is_visible() and ("MasterSCADA" in w.window_text() or w.process_id()==p.pid):
                          rwins.append({"title":w.window_text(),"class":w.class_name(),"pid":w.process_id(),"rect":str(w.rectangle())})
                          try:w.capture_as_image().save(f"runtime_window_{len(rwins)}.png")
                          except:pass
                          try:dump_uia(w.handle,f"runtime_window_{len(rwins)}_uia.json")
                          except:pass
                  except:pass
              Path("runtime_windows.json").write_text(json.dumps(rwins,ensure_ascii=False,indent=2),encoding="utf-8")
              rt_ok=bool(rwins) and any("7341100_MasterSCADA_Lab7" in x["title"] or x["pid"]==p.pid for x in rwins)
              Path("runtime_result.txt").write_text("RUNTIME="+("PASS" if rt_ok else "FAIL")+"\n"+json.dumps(rwins,ensure_ascii=False,indent=2),encoding="utf-8")
          except Exception:
              log.append("FATAL\n"+traceback.format_exc())
              raise
          finally:
              Path("probe_log.txt").write_text("\n".join(log),encoding="utf-8");kill()
          '@ | Set-Content direct_probe.py -Encoding UTF8
          python direct_probe.py
      - name: Upload direct probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada35-formula-runtime-direct-7341100
          path: |
            restored.txt
            values_persistence.txt
            tree_verified.json
            formula_uia.json
            formula_win32.json
            runtime_result.txt
            runtime_processes.json
            runtime_windows.json
            runtime_window_*.png
            runtime_window_*_uia.json
            01_editor_restored.png
            02_formula_tab.png
            probe_log.txt
          if-no-files-found: warn
