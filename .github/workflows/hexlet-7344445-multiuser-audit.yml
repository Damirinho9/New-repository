name: Hexlet 7344445 Audit Multiuser Donors

on:
  push:
    branches:
      - hexlet-7344445-multiuser
    paths:
      - "hexlet_7344445/audit_multiuser_donor.py"
      - ".github/workflows/hexlet-7344445-multiuser-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tooling
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/fn-cafeina/lab-pkt.git /tmp/lab-pkt
          python -m pip install -e /tmp/lab-pkt
      - name: Clone donor corpus
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/abderaoufsec/CCNA-PacketTracerlabs.git /tmp/ccna
      - name: Audit multiuser structures
        env:
          DONOR_DIR: /tmp/ccna
        shell: bash
        run: |
          set -euxo pipefail
          python hexlet_7344445/audit_multiuser_donor.py
      - uses: actions/upload-artifact@v4
        with:
          name: 7344445-multiuser-donor-audit
          path: hexlet_7344445/multiuser_audit/
          if-no-files-found: error

# rerun tolerant parser
