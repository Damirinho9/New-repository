name: 7330744 full V6 - component discovery

on:
  push:
    branches:
      - multisim-7330744-full-v6
    paths:
      - ".github/workflows/7330744-full-v6.yml"
  workflow_dispatch:

concurrency:
  group: 7330744-full-v6
  cancel-in-progress: true

jobs:
  discover:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install NI Multisim 14.3
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          New-Item -ItemType Directory -Force fullv6-out | Out-Null
          $installer=Join-Path $env:RUNNER_TEMP 'ni-cds-educational_14.3_online.exe'
          Invoke-WebRequest 'https://download.ni.com/support/nipkg/products/ni-c/ni-cds-educational/14.3/online/ni-cds-educational_14.3_online.exe' -OutFile $installer -UseBasicParsing
          $sig=Get-AuthenticodeSignature $installer
          "installer_signature=$($sig.Status)" | Tee-Object -FilePath fullv6-out\install.txt
          if($sig.Status -ne 'Valid'){ throw 'Invalid official NI installer signature' }
          $p=Start-Process $installer -ArgumentList @('--quiet','--accept-eulas','--prevent-reboot') -PassThru
          if(-not $p.WaitForExit(480000)){ try{Stop-Process -Id $p.Id -Force}catch{} }
          $ms=Get-ChildItem 'C:\Program Files (x86)\National Instruments','C:\Program Files\National Instruments' -Filter Multisim.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $ms){ throw 'Multisim executable absent after installation' }
          "multisim=$($ms.FullName)" | Tee-Object -FilePath fullv6-out\install.txt -Append
          "samples=$env:PUBLIC\Documents\National Instruments\Circuit Design Suite 14.3\samples" | Add-Content fullv6-out\install.txt
          "database=$env:PROGRAMDATA\National Instruments\Circuit Design Suite\14.3\database\MSCOMP_S.PRD" | Add-Content fullv6-out\install.txt

      - name: Install 32-bit Python and pywin32
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $pyInstaller=Join-Path $env:RUNNER_TEMP 'python-3.11.9-x86.exe'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.11.9/python-3.11.9.exe' -OutFile $pyInstaller -UseBasicParsing
          $sig=Get-AuthenticodeSignature $pyInstaller
          "python32_installer_signature=$($sig.Status)" | Add-Content fullv6-out\install.txt
          if($sig.Status -ne 'Valid'){ throw 'Invalid official Python x86 installer signature' }
          $p=Start-Process $pyInstaller -ArgumentList @('/quiet','InstallAllUsers=1','TargetDir=C:\Python311-32','PrependPath=0','Include_launcher=0','Include_test=0','Include_pip=1') -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "Python x86 installer exit=$($p.ExitCode)" }
          if(-not (Test-Path 'C:\Python311-32\python.exe')){ throw '32-bit Python executable absent' }
          & 'C:\Python311-32\python.exe' -c "import struct,sys; print(sys.version); print(struct.calcsize('P')*8)"
          & 'C:\Python311-32\python.exe' -m pip install --disable-pip-version-check --quiet pywin32
          & 'C:\Python311-32\python.exe' -c "import win32com.client,struct; print('win32com ok',struct.calcsize('P')*8)" | Add-Content fullv6-out\install.txt

      - name: Install MultisimForge
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git clone --depth 1 https://github.com/AmaneSuzuha000/MultisimForge.git "$env:RUNNER_TEMP\MultisimForge"
          Set-Location "$env:RUNNER_TEMP\MultisimForge"
          python -m pip install --disable-pip-version-check -e ".[capture]"
          $env:MULTISIMFORGE_PYTHON32='C:\Python311-32\python.exe'
          python -c "from multisimforge.config import CONFIG; import json; print(json.dumps(CONFIG,indent=2))" | Out-File "$env:GITHUB_WORKSPACE\fullv6-out\forge-config.txt"
          python -m multisimforge --help | Out-File "$env:GITHUB_WORKSPACE\fullv6-out\forge-help.txt"

      - name: Build local Multisim part library
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:RUNNER_TEMP\MultisimForge"
          $env:MULTISIMFORGE_PYTHON32='C:\Python311-32\python.exe'
          python -m multisimforge --debug parts init 2>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\fullv6-out\parts-init.txt"
          if($LASTEXITCODE -ne 0){ throw "parts init failed exit=$LASTEXITCODE" }

      - name: Query harvested Multisim sample library
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-Location "$env:RUNNER_TEMP\MultisimForge"
          $env:MULTISIMFORGE_PYTHON32='C:\Python311-32\python.exe'
          $out="$env:GITHUB_WORKSPACE\fullv6-out"
          python -m multisimforge parts list 2>&1 | Out-File -Encoding utf8 "$out\all-parts.txt"
          $terms=@('resistor','capacitor','diode','photo','photodiode','2N7000','mosfet','fet','scr','thyristor','triac','varistor','mov','bridge','rectifier','fuse','led','connector','header','terminal','1N4007','1N4742','C106','2N3904','2N3906')
          foreach($t in $terms){
            "===== $t =====" | Add-Content "$out\parts-report.txt"
            python -m multisimforge parts list $t 2>&1 | Add-Content "$out\parts-report.txt"
          }
          Copy-Item "$env:LOCALAPPDATA\MultisimForge\parts\index.json" "$out\parts-index.json" -Force
          Compress-Archive -Path "$env:LOCALAPPDATA\MultisimForge\parts\*" -DestinationPath "$out\parts-library.zip" -Force

      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7330744-full-v6-discovery
          path: fullv6-out/
          if-no-files-found: warn
          retention-days: 7
