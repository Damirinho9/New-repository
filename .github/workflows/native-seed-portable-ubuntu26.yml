name: Portable KOMPAS native seed bridge on Ubuntu 26

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/native-seed-portable-ubuntu26.yml'
      - 'kompas-linux/bootstrap_variant06_poll.cpp'
      - 'kompas-linux/work2_variant19_native.cpp'
      - 'kompas-linux/work4_variant16_native.cpp'

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download proven ALT native seed
        uses: actions/download-artifact@v4
        with:
          name: 7335493-native-seed-alt
          path: result/native-seed
          run-id: 44476851857
          github-token: ${{ github.token }}

      - name: Download portable KOMPAS runtime parts
        uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-part*
          path: runtime-parts
          merge-multiple: true
          run-id: 44290433663
          github-token: ${{ github.token }}

      - name: Restore portable KOMPAS runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd runtime-parts
          sha256sum kompas-runtime.part-00 kompas-runtime.part-01 kompas-runtime.part-02 kompas-runtime.part-03
          test "$(sha256sum kompas-runtime.part-00 | cut -d' ' -f1)" = "965285771caff99fddb1306485dd9c062fc16a49c258451ee70badab1ecc14f4"
          test "$(sha256sum kompas-runtime.part-01 | cut -d' ' -f1)" = "424b833def76283914c2db926e2feedae2c3c570c59af05ab237768cf084d9bd"
          test "$(sha256sum kompas-runtime.part-02 | cut -d' ' -f1)" = "a0e997d9dd5eba32b70fa4cdd3a20d948ecdb02637372ff80928fa538d10daed"
          test "$(sha256sum kompas-runtime.part-03 | cut -d' ' -f1)" = "93643b93b97dc58d6097251cf0ed74ecc474a9aa474e5b622f928c9a264228e7"
          cat kompas-runtime.part-* > "$RUNNER_TEMP/kompas-v25-portable-runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/kompas-v25-portable-runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/kompas-runtime"
          tar --zstd -xf "$RUNNER_TEMP/kompas-v25-portable-runtime.tar.zst" -C "$RUNNER_TEMP/kompas-runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25
          sudo ln -s "$RUNNER_TEMP/kompas-runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          if [ -d "$RUNNER_TEMP/kompas-runtime/opt/ascon/common" ]; then
            sudo rm -rf /opt/ascon/common
            sudo ln -s "$RUNNER_TEMP/kompas-runtime/opt/ascon/common" /opt/ascon/common
          fi
          BIN=/opt/ascon/kompas3d-v25/Bin
          test -x "$BIN/ksinvisible"
          file "$BIN/ksinvisible"
          SYSROOT="$RUNNER_TEMP/kompas-runtime/system-libs"
          SYS_LD=$(find "$SYSROOT" -type f -printf '%h\n' | sort -u | paste -sd: -)
          echo "KOMPAS_SYS_LD=$SYS_LD" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$BIN:$SYS_LD" ldd "$BIN/ksinvisible" | tee /tmp/ksinvisible-ldd-pre.txt || true

      - name: Install only minimal compiler prerequisites if missing
        shell: bash
        run: |
          set -euxo pipefail
          need=()
          command -v Xvfb >/dev/null || need+=(xvfb)
          command -v dbus-run-session >/dev/null || need+=(dbus)
          test -e /usr/include/c++/v1/memory || need+=(libc++-dev libc++abi-dev)
          command -v clang++ >/dev/null || need+=(clang)
          command -v g++ >/dev/null || need+=(g++)
          dpkg -s libxcb-res0 >/dev/null 2>&1 || need+=(libxcb-res0)
          dpkg -s libxcb-dri2-0 >/dev/null 2>&1 || need+=(libxcb-dri2-0)
          dpkg -s libxcb-xkb1 >/dev/null 2>&1 || need+=(libxcb-xkb1)
          if [ "${#need[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${need[@]}"
          fi
          clang++ --version | head -1
          BIN=/opt/ascon/kompas3d-v25/Bin
          LD_LIBRARY_PATH="$BIN:$KOMPAS_SYS_LD" ldd "$BIN/ksinvisible" | tee /tmp/ksinvisible-ldd.txt
          if grep -q "not found" /tmp/ksinvisible-ldd.txt; then
            echo "UNRESOLVED_RUNTIME_LIBS"
            grep "not found" /tmp/ksinvisible-ldd.txt
            exit 42
          fi

      - name: Compile Work 2 and Work 4 native writers
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export LD_LIBRARY_PATH="$BIN:$KOMPAS_SYS_LD"
          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          test -d "$INC"
          clang++ -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread -I"$INC"             kompas-linux/work2_variant19_native.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/work2.so
          clang++ -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread -I"$INC"             kompas-linux/work4_variant16_native.cpp -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi -o /tmp/work4.so
          g++ -std=c++20 -O2 -fPIC -shared -pthread kompas-linux/bootstrap_variant06_poll.cpp -ldl -o /tmp/bootstrap.so

      - name: Run Work 2 and Work 4 from ALT seeds
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export HOME="$RUNNER_TEMP/kompas-home"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/ascon/KOMPAS-3D/25" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25"
          RES=$(find /opt/ascon/kompas3d-v25 -type f -name QtResources.bin -print -quit || true)
          [ -z "$RES" ] || cp -f "$RES" "$XDG_CONFIG_HOME/ascon/KOMPAS-3D Invisible/25/QtResources.bin"

          sudo mkdir -p /tmp/.X11-unix
          sudo chmod 1777 /tmp/.X11-unix
          sudo rm -f /tmp/.X11-unix/X114
          Xvfb :114 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb.out 2>/tmp/xvfb.err &
          XV=$!
          trap 'kill "$XV" 2>/dev/null || true' EXIT
          sleep 2
          test -S /tmp/.X11-unix/X114

          export DISPLAY=:114 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN:$KOMPAS_SYS_LD"
          export KOMPAS_NATIVE_SEED_DIR="$GITHUB_WORKSPACE/result/native-seed"
          unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy
          rm -rf result/portable-native
          mkdir -p result/portable-native/work2 result/portable-native/work4

          run_work() {
            local so="$1" log="$2" pass="$3" fail="$4" outdir="$5" copyto="$6"
            cp "$so" /tmp/writer_variant06.so
            cp /tmp/bootstrap.so /tmp/bootstrap_variant06_qt.so
            rm -f /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
            rm -rf "$outdir" /tmp/work2_seed_work /tmp/work4_seed_work
            dbus-run-session -- env HOME="$HOME" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" DISPLAY=:114               QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$LD_LIBRARY_PATH"               KOMPAS_NATIVE_SEED_DIR="$KOMPAS_NATIVE_SEED_DIR" LD_PRELOAD=/tmp/bootstrap_variant06_qt.so               "$BIN/ksinvisible" -automation >/tmp/kompas.out 2>/tmp/kompas.err &
            KP=$!
            ok=0
            for i in $(seq 1 70); do
              sleep 2
              if grep -q "^$pass$" "$log" 2>/dev/null; then ok=1; break; fi
              if grep -q "^$fail$" "$log" 2>/dev/null; then break; fi
              if ! kill -0 "$KP" 2>/dev/null; then break; fi
            done
            cat "$log" 2>/dev/null || true
            cat /tmp/work1_bootstrap.log 2>/dev/null || true
            tail -160 /tmp/kompas.err 2>/dev/null || true
            kill "$KP" 2>/dev/null || true
            wait "$KP" 2>/dev/null || true
            mkdir -p "$copyto"
            [ ! -d "$outdir" ] || cp -a "$outdir"/. "$copyto"/
            [ "$ok" = 1 ]
          }

          run_work /tmp/work2.so /tmp/work2_v19_native/work2.log             RESULT=PASS_NATIVE_WORK2_VARIANT19 RESULT=FAIL_NATIVE_WORK2_VARIANT19             /tmp/work2_v19_native result/portable-native/work2

          run_work /tmp/work4.so /tmp/work4_v16_native/work4.log             RESULT=PASS_NATIVE_WORK4_VARIANT16 RESULT=FAIL_NATIVE_WORK4_VARIANT16             /tmp/work4_v16_native result/portable-native/work4

      - name: Strict portable native acceptance
        shell: bash
        run: |
          set -euxo pipefail
          W2=result/portable-native/work2
          W4=result/portable-native/work4
          grep -q '^RESULT=PASS_NATIVE_WORK2_VARIANT19_REOPEN_REBUILD_DEPENDENCY$' "$W2/work2.log"
          grep -q '^RESULT=PASS_NATIVE_WORK2_VARIANT19$' "$W2/work2.log"
          grep -q '^TOP_DOWN_DEPENDENCY_PHYSICAL_CHANGE_PASS$' "$W2/work2.log"
          grep -q '^FINAL_NOMINAL_REOPEN_PASS$' "$W2/work2.log"
          grep -q '^RESULT=PASS_NATIVE_WORK4_VARIANT16_REOPEN_REBUILD_PARAMETRIC$' "$W4/work4.log"
          grep -q '^RESULT=PASS_NATIVE_WORK4_VARIANT16$' "$W4/work4.log"
          grep -q '^PARAMETRIC_T_40_44_40_PASS$' "$W4/work4.log"
          grep -q '^FINAL_NOMINAL_REOPEN_PASS$' "$W4/work4.log"
          echo RESULT=PASS_NATIVE_PORTABLE_SEED_BRIDGE_WORK2_WORK4 | tee result/portable-native/ACCEPTANCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-portable-native-work2-work4
          path: result/portable-native/**
          if-no-files-found: ignore
