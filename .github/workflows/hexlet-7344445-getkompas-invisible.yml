name: Hexlet 7344445 Direct GetKompasInvisible Recovery

on:
  push:
    branches:
      - hexlet-7344445-native-recovery
    paths:
      - "hexlet_7344445/native_recovery/recover_kompas_getinvisible.py"
      - ".github/workflows/hexlet-7344445-getkompas-invisible.yml"
  workflow_dispatch:

jobs:
  getinvisible:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install official KOMPAS v25 Linux + SDK
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg xvfb net-tools iproute2 libxcb-res0 libxcb-dri2-0 libxcb-xkb1 libxkbcommon-x11-0
          wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
          sudo bash /tmp/ascon.sh || true
          echo 'deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main' | sudo tee /etc/apt/sources.list.d/ascon.list
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25
          apt-cache search kompas | tee hexlet_7344445/native_recovery/ascon-apt-search-kompas.txt

      - name: Prelaunch real ksinvisible and connect with GetKompasInvisible
        shell: bash
        run: |
          set -euxo pipefail
          BIN=/opt/ascon/kompas3d-v25/Bin
          export PYTHONPATH="$BIN"
          ln -sf "$BIN/ksinvisible" /tmp/kKompas
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac" /tmp/kKompas -automation >hexlet_7344445/native_recovery/getinv-live.out 2>hexlet_7344445/native_recovery/getinv-live.err &
          WRAPPER_PID=$!
          KP=""
          for i in $(seq 1 45); do
            sleep 1
            KP=$(pgrep -x kKompas | head -1 || true)
            [ -n "$KP" ] && break
          done
          test -n "$KP"
          echo "KPID=$KP" | tee hexlet_7344445/native_recovery/getinv-pid.txt
          for i in $(seq 1 50); do
            sleep 1
            ss -ltnp > hexlet_7344445/native_recovery/getinv-sockets.txt || true
            grep -q "kKompas" hexlet_7344445/native_recovery/getinv-sockets.txt && break || true
          done
          grep -q "kKompas" hexlet_7344445/native_recovery/getinv-sockets.txt
          timeout 120 python3 hexlet_7344445/native_recovery/recover_kompas_getinvisible.py | tee hexlet_7344445/native_recovery/getinv-validation.log
          kill "$WRAPPER_PID" 2>/dev/null || true

      - name: Strict checks
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'RESULT=PASS_NATIVE_KOMPAS3D_GETINVISIBLE_SAVE_CLOSE_REOPEN' hexlet_7344445/native_recovery/getinv-validation.log
          test -s "hexlet_7344445/native_recovery/kompas_getinvisible/Hexlet_KOMPAS3D_Привет_Хекслет.cdw"
          test -s "hexlet_7344445/native_recovery/kompas_getinvisible/Hexlet_KOMPAS3D_Привет_Хекслет_REOPENED.cdw"
          sha256sum hexlet_7344445/native_recovery/kompas_getinvisible/*.cdw

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7344445-getkompas-invisible-native-cdw
          path: |
            hexlet_7344445/native_recovery/kompas_getinvisible/
            hexlet_7344445/native_recovery/getinv-*
            hexlet_7344445/native_recovery/ascon-apt-search-kompas.txt
          if-no-files-found: warn
