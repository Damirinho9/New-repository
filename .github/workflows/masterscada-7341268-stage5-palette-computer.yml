name: MasterSCADA 7341268 Stage 5 Palette Computer

on:
  push:
    branches: [masterscada-7341268-windows]
    paths:
      - ".github/workflows/masterscada-7341268-stage5-palette-computer.yml"
  workflow_dispatch:

jobs:
  producer:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: Install MasterSCADA 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\stage5-palette"|Out-Null
          New-Item -ItemType Directory -Force "C:\MasterSCADA_7341268\installer"|Out-Null
          $base="https://download.mps-soft.ru/demo/Old%20Demo/3.11/";$dest="C:\MasterSCADA_7341268\installer"
          foreach($n in @("Data1.cab","data.msi","setup.bmp","setup.exe")){
            & curl.exe -k -L --fail --silent --show-error ($base+$n) -o (Join-Path $dest $n)
            if($LASTEXITCODE -ne 0){throw "download $n failed"}
          }
          $p=Start-Process msiexec.exe -ArgumentList @("/i",(Join-Path $dest "data.msi"),"/qn","/norestart") -Wait -PassThru
          if($p.ExitCode -notin @(0,3010,1641)){throw "MSI $($p.ExitCode)"}

      - name: Create project, obtain Computer from ObjPalette, insert and save
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $out="$env:GITHUB_WORKSPACE\stage5-palette\producer.txt"
          $base="C:\MasterSCADA Projects\Projects";$id="7341268_Variant7"
          $folder=Join-Path $base $id
          $clsid="{33A04CE5-4692-11D4-B153-87EB14408E58}"
          $name="АРМ оператора"

          Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          if(Test-Path $folder){Remove-Item $folder -Recurse -Force}
          New-Item -ItemType Directory -Force $base|Out-Null

          $watcher=Start-Job -ScriptBlock{
            $ws=New-Object -ComObject WScript.Shell
            for($i=0;$i -lt 180;$i++){
              Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue|Where-Object{$_.MainWindowTitle}|ForEach-Object{
                if($ws.AppActivate($_.Id)){Start-Sleep -Milliseconds 200;$ws.SendKeys("{ENTER}")}
              }
              Start-Sleep -Milliseconds 500
            }
          }

          $app=$null;$paletteObject=$null
          try{
            $app=New-Object -ComObject MasterSCADA.Application
            "APP_CREATED=True"|Set-Content -Encoding utf8 $out
            $app.CreateProject(1,$base,$id,"Система водяного отопления - вариант 7","")
            "CREATE_PROJECT=True"|Add-Content -Encoding utf8 $out
            Start-Sleep -Seconds 3
            $p=$app.CurrentProject
            "CURRENT_PROJECT_PRESENT=$($null -ne $p)"|Add-Content -Encoding utf8 $out
            if($null -eq $p){throw "CurrentProject null"}
            "PROJECT_PATH=$($p.Path)"|Add-Content -Encoding utf8 $out
            "COMPUTER_COUNT_BEFORE=$($p.ComputerCount)"|Add-Content -Encoding utf8 $out

            $palette=$app.ObjPalette
            "OBJPALETTE_PRESENT=$($null -ne $palette)"|Add-Content -Encoding utf8 $out
            if($null -eq $palette){throw "ObjPalette null"}
            try{"PALETTE_CURRENT_CATEGORY=$($palette.CurrentCategory)"|Add-Content -Encoding utf8 $out}catch{}
            try{"PALETTE_SELECTED_OBJECT=$($palette.SelectedObject)"|Add-Content -Encoding utf8 $out}catch{}
            try{"PALETTE_LIBRARY_COUNT=$($palette.LibraryCount)"|Add-Content -Encoding utf8 $out}catch{}

            foreach($candidate in @("Компьютер","Vavobj.Computer.1",$clsid)){
              if($null -ne $paletteObject){break}
              try{
                $x=$palette.GetObject($candidate)
                "PALETTE_GETOBJECT[$candidate].RETURNED=$($null -ne $x)"|Add-Content -Encoding utf8 $out
                if($null -ne $x){
                  $paletteObject=$x
                  "PALETTE_OBJECT_SOURCE=$candidate"|Add-Content -Encoding utf8 $out
                  "PALETTE_OBJECT_TYPE=$($x.GetType().FullName)"|Add-Content -Encoding utf8 $out
                }
              }catch{
                "PALETTE_GETOBJECT[$candidate].ERROR=$($_.Exception.GetType().FullName): $($_.Exception.Message)"|Add-Content -Encoding utf8 $out
              }
            }
            if($null -eq $paletteObject){throw "ObjPalette.GetObject did not return Computer"}

            try{$p.CurrentItem=$p.SystemRoot;"PROJECT_CURRENT_SET=True"|Add-Content -Encoding utf8 $out}catch{
              "PROJECT_CURRENT_SET_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $out
            }
            try{$p.SysTree.CurrentItem=$p.SystemRoot;"SYSTREE_CURRENT_SET=True"|Add-Content -Encoding utf8 $out}catch{
              "SYSTREE_CURRENT_SET_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $out
            }

            $node=$null
            try{
              $node=$p.SystemRoot.InsertExistingObjectEx($paletteObject,$clsid,$name,$null,$true)
              "INSERT_EXISTING_EX_RETURNED=$($null -ne $node)"|Add-Content -Encoding utf8 $out
            }catch{
              "INSERT_EXISTING_EX_ERROR=$($_.Exception.GetType().FullName): $($_.Exception.Message)"|Add-Content -Encoding utf8 $out
            }
            if($null -eq $node){
              try{
                $node=$p.SystemRoot.InsertExistingObject($paletteObject,$clsid,$name,$null)
                "INSERT_EXISTING_RETURNED=$($null -ne $node)"|Add-Content -Encoding utf8 $out
              }catch{
                "INSERT_EXISTING_ERROR=$($_.Exception.GetType().FullName): $($_.Exception.Message)"|Add-Content -Encoding utf8 $out
              }
            }
            if($null -eq $node){throw "palette Computer insertion returned null"}

            try{$node.Rename($name,1)}catch{}
            try{"NODE.Name=$($node.Name)"|Add-Content -Encoding utf8 $out}catch{}
            try{"NODE.DisplayName=$($node.DisplayName)"|Add-Content -Encoding utf8 $out}catch{}
            try{"NODE.ItemType=$($node.ItemType)"|Add-Content -Encoding utf8 $out}catch{}
            try{"NODE.ObjectType=$($node.ObjectType)"|Add-Content -Encoding utf8 $out}catch{}
            try{"NODE.CLSID=$($node.ClassInfoObject.clsid)"|Add-Content -Encoding utf8 $out}catch{}
            try{"NODE.FullName=$($node.FullName)"|Add-Content -Encoding utf8 $out}catch{}

            $count=[int]$p.ComputerCount
            "COMPUTER_COUNT_AFTER_INSERT=$count"|Add-Content -Encoding utf8 $out
            if($count -lt 1){throw "ComputerCount < 1 after insert"}
            $found=$false
            for($i=0;$i -lt $count;$i++){
              $c=$p.Computer($i);$cc="";try{$cc=[string]$c.ClassInfoObject.clsid}catch{}
              "COMPUTER[$i].Name=$($c.Name)"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].ItemType=$($c.ItemType)"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].ObjectType=$($c.ObjectType)"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].CLSID=$cc"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].FullName=$($c.FullName)"|Add-Content -Encoding utf8 $out
              if($cc -ieq $clsid){$found=$true}
            }
            "EXPECTED_CLSID_FOUND=$found"|Add-Content -Encoding utf8 $out
            if(!$found){throw "expected Computer CLSID missing"}

            try{$palette.InsertionMade();"PALETTE_INSERTION_MADE=True"|Add-Content -Encoding utf8 $out}catch{
              "PALETTE_INSERTION_MADE_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $out
            }
            try{$p.SysTree.IsDirty();"SYSTREE_ISDIRTY_CALLED=True"|Add-Content -Encoding utf8 $out}catch{
              "SYSTREE_ISDIRTY_ERROR=$($_.Exception.Message)"|Add-Content -Encoding utf8 $out
            }
            $p.Save()
            "PROJECT_SAVE=True"|Add-Content -Encoding utf8 $out
            Start-Sleep -Seconds 4
            $vav=Join-Path $folder "$id.vav"
            "VAV_EXISTS=$(Test-Path $vav)"|Add-Content -Encoding utf8 $out
            if(!(Test-Path $vav)){throw "VAV missing"}
            "VAV_SIZE=$((Get-Item $vav).Length)"|Add-Content -Encoding utf8 $out
            "VAV_SHA256=$((Get-FileHash $vav -Algorithm SHA256).Hash)"|Add-Content -Encoding utf8 $out
            "PALETTE_MUTATION=PASS"|Add-Content -Encoding utf8 $out
          }catch{
            "FATAL=$($_.Exception.GetType().FullName): $($_.Exception.Message)"|Add-Content -Encoding utf8 $out
            throw
          }finally{
            try{Stop-Job $watcher -ErrorAction SilentlyContinue|Out-Null}catch{}
            try{Remove-Job $watcher -Force -ErrorAction SilentlyContinue}catch{}
            if($app){try{$app.ExitScada()}catch{};try{[Runtime.InteropServices.Marshal]::FinalReleaseComObject($app)|Out-Null}catch{}}
            Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Get-Content $out

      - name: Copy saved project
        if: always()
        shell: pwsh
        run: |
          $src="C:\MasterSCADA Projects\Projects\7341268_Variant7"
          $dst="$env:GITHUB_WORKSPACE\stage5-palette\project\7341268_Variant7"
          if(Test-Path "$src\7341268_Variant7.vav"){
            New-Item -ItemType Directory -Force (Split-Path $dst -Parent)|Out-Null
            Copy-Item $src $dst -Recurse -Force
          }

      - name: Verify native CFB persistence
        if: always()
        shell: python
        run: |
          import struct,pathlib,hashlib
          root=pathlib.Path(r"${{ github.workspace }}")/"stage5-palette"
          p=root/"project"/"7341268_Variant7"/"7341268_Variant7.vav"
          if not p.exists():
              (root/"native-cfb.txt").write_text("VAV_EXISTS=False\n",encoding="utf-8")
              raise SystemExit("VAV missing")
          d=p.read_bytes();ss=1<<struct.unpack_from("<H",d,30)[0];mini=1<<struct.unpack_from("<H",d,32)[0]
          nfat=struct.unpack_from("<I",d,44)[0];firstdir=struct.unpack_from("<I",d,48)[0];cutoff=struct.unpack_from("<I",d,56)[0];firstmini=struct.unpack_from("<I",d,60)[0]
          FREE=0xffffffff;END=0xfffffffe;NO=0xffffffff
          def sec(n):return d[(n+1)*ss:(n+2)*ss]
          dif=[x for x in struct.unpack_from("<109I",d,76) if x!=FREE][:nfat];fat=[]
          for x in dif:fat+=list(struct.unpack("<%dI"%(ss//4),sec(x)))
          def chain(st,tab):
              o=[];seen=set();x=st
              while x not in (END,FREE) and x<len(tab) and x not in seen:o.append(x);seen.add(x);x=tab[x]
              return o
          db=b"".join(sec(x) for x in chain(firstdir,fat));E=[]
          for o in range(0,len(db),128):
              q=db[o:o+128]
              if len(q)<128:break
              nl=struct.unpack_from("<H",q,64)[0];name=q[:max(0,nl-2)].decode("utf-16le","replace") if nl>=2 else ""
              typ=q[66];left,right,child=struct.unpack_from("<III",q,68);start=struct.unpack_from("<I",q,116)[0];size=struct.unpack_from("<Q",q,120)[0]
              E.append(dict(name=name,typ=typ,left=left,right=right,child=child,start=start,size=size))
          r=E[0];mfb=b"".join(sec(x) for x in chain(firstmini,fat));minifat=list(struct.unpack("<%dI"%(len(mfb)//4),mfb)) if mfb else []
          ministream=b"".join(sec(x) for x in chain(r["start"],fat))[:r["size"]]
          def read(e):
              if e["size"]<cutoff and e["typ"]==2:return b"".join(ministream[x*mini:(x+1)*mini] for x in chain(e["start"],minifat))[:e["size"]]
              return b"".join(sec(x) for x in chain(e["start"],fat))[:e["size"]]
          def rb(i):
              out=[];seen=set()
              def rec(x):
                  if x==NO or x>=len(E) or x in seen:return
                  seen.add(x);rec(E[x]["left"]);out.append(x);rec(E[x]["right"])
              rec(i);return out
          def kids(i):return rb(E[i]["child"]) if E[i]["child"]!=NO else []
          sid=next(i for i in kids(0) if E[i]["name"]=="SysTree");cid=next(i for i in kids(sid) if E[i]["name"]=="ItemCount")
          count=struct.unpack("<I",read(E[cid]))[0];sha=hashlib.sha256(d).hexdigest().upper()
          txt=f"VAV_EXISTS=True\nSYSTREE_ITEM_COUNT={count}\nVAV_SIZE={len(d)}\nVAV_SHA256={sha}\nPERSISTED_COMPUTER_NODE={'True' if count>=2 else 'False'}\n"
          (root/"native-cfb.txt").write_text(txt,encoding="utf-8");print(txt)
          if count<2:raise SystemExit("SysTree ItemCount < 2")

      - name: Upload producer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada-7341268-stage5-palette-producer
          path: stage5-palette/**
          if-no-files-found: error
          retention-days: 90

  fresh-reopen:
    needs: producer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MasterSCADA 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\fresh"|Out-Null
          New-Item -ItemType Directory -Force "C:\MasterSCADA_7341268\installer"|Out-Null
          $base="https://download.mps-soft.ru/demo/Old%20Demo/3.11/";$dest="C:\MasterSCADA_7341268\installer"
          foreach($n in @("Data1.cab","data.msi","setup.bmp","setup.exe")){
            & curl.exe -k -L --fail --silent --show-error ($base+$n) -o (Join-Path $dest $n)
            if($LASTEXITCODE -ne 0){throw $n}
          }
          $p=Start-Process msiexec.exe -ArgumentList @("/i",(Join-Path $dest "data.msi"),"/qn","/norestart") -Wait -PassThru
          if($p.ExitCode -notin @(0,3010,1641)){throw "MSI $($p.ExitCode)"}
      - uses: actions/download-artifact@v4
        with:
          name: masterscada-7341268-stage5-palette-producer
          path: producer
      - name: Programmatic fresh reopen via OpenProjectTemp return object
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $src=Get-ChildItem "$env:GITHUB_WORKSPACE\producer" -Recurse -Filter "7341268_Variant7.vav" -File|Select-Object -First 1
          if($null -eq $src){throw "producer VAV missing"}
          $dst="C:\MasterSCADA Projects\Projects\7341268_Variant7"
          if(Test-Path $dst){Remove-Item $dst -Recurse -Force}
          Copy-Item $src.Directory.FullName $dst -Recurse -Force
          $out="$env:GITHUB_WORKSPACE\fresh\fresh-reopen.txt"
          $app=$null
          try{
            $app=New-Object -ComObject MasterSCADA.Application
            $p=$null
            try{
              $p=$app.OpenProjectTemp(1,"C:\MasterSCADA Projects\Projects","7341268_Variant7",$false,"","",$false)
              "OPENPROJECTTEMP_RETURNED=$($null -ne $p)"|Set-Content -Encoding utf8 $out
            }catch{
              "OPENPROJECTTEMP_EXCEPTION=$($_.Exception.GetType().FullName): $($_.Exception.Message)"|Set-Content -Encoding utf8 $out
            }
            if($null -eq $p){try{$p=$app.CurrentProject}catch{}}
            "PROJECT_PRESENT=$($null -ne $p)"|Add-Content -Encoding utf8 $out
            if($null -eq $p){throw "project object unavailable"}
            $count=[int]$p.ComputerCount
            "COMPUTER_COUNT=$count"|Add-Content -Encoding utf8 $out
            if($count -lt 1){throw "ComputerCount < 1"}
            $expected="{33A04CE5-4692-11D4-B153-87EB14408E58}";$found=$false;$named=$false
            for($i=0;$i -lt $count;$i++){
              $c=$p.Computer($i);$cc="";try{$cc=[string]$c.ClassInfoObject.clsid}catch{}
              "COMPUTER[$i].Name=$($c.Name)"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].ItemType=$($c.ItemType)"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].ObjectType=$($c.ObjectType)"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].CLSID=$cc"|Add-Content -Encoding utf8 $out
              "COMPUTER[$i].FullName=$($c.FullName)"|Add-Content -Encoding utf8 $out
              if($cc -ieq $expected){$found=$true}
              if([string]$c.Name -eq "АРМ оператора" -or [string]$c.Name -eq "Компьютер"){$named=$true}
            }
            "EXPECTED_CLSID_FOUND=$found"|Add-Content -Encoding utf8 $out
            "EXPECTED_NAME_FOUND=$named"|Add-Content -Encoding utf8 $out
            if(!$found -or !$named){throw "saved Computer identity mismatch"}
            "FRESH_REOPEN_VALIDATION=PASS"|Add-Content -Encoding utf8 $out
          }finally{
            if($app){try{$app.ExitScada()}catch{};try{[Runtime.InteropServices.Marshal]::FinalReleaseComObject($app)|Out-Null}catch{}}
          }
          Get-Content $out
      - name: Upload fresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada-7341268-stage5-palette-fresh
          path: fresh/**
          if-no-files-found: error
          retention-days: 90
