name: Compile-check hosted KOMPAS native 3D proof

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/compile-check-kompas-linux-native3d.yml'
      - 'kompas-linux/prove_native_3d_linux.cpp'

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kompas-7335493-native-work1
      - uses: actions/download-artifact@v4
        with:
          name: kompas-v25-full-ksapi
          path: sdk-artifact
          repository: ${{ github.repository }}
          run-id: 43801985021
          github-token: ${{ github.token }}
      - name: Find include root and syntax-check
        shell: bash
        run: |
          set -euxo pipefail
          INC=$(dirname "$(find sdk-artifact -type f -name KsAPI.h -print -quit)")
          test -n "$INC"
          echo "INC=$INC"
          g++ -std=c++20 -fsyntax-only -I"$INC" kompas-linux/prove_native_3d_linux.cpp
          echo RESULT=LINUX_NATIVE3D_COMPILE_PASS
