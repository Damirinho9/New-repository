name: Build native KOMPAS FRW variant06 same ABI

on:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/build-native-frw-v6-sameabi.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: alt:p11
    timeout-minutes: 20
    steps:
      - name: Install KOMPAS SDK, compile injector in ALT, run natively
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/work1
          cd /tmp/work1

          # Fast ALT mirror, x86_64 only.
          sed -i             -e 's#http://ftp.altlinux.org/pub/distributions/ALTLinux#http://mirror.yandex.ru/altlinux#g'             -e '/x86_64-i586/s/^[[:space:]]*rpm/# rpm/'             /etc/apt/sources.list.d/alt.list

          apt-get update
          apt-get install -y wget ca-certificates fontconfig dbus glibc-locales             libxcbutil-icccm libxcbutil-keysyms libxcbutil-image libxcb-render-util             libXv libXScrnSaver libxkbfile libfontenc || true

          bash -c "$(wget -O - https://repo.ascon.ru/scripts/ascon-stable-alt.sh)"
          sed -i             -e 's#http://ftp.altlinux.org/pub/distributions/ALTLinux#http://mirror.yandex.ru/altlinux#g'             -e '/x86_64-i586/s/^[[:space:]]*rpm/# rpm/'             /etc/apt/sources.list.d/alt.list
          apt-get update

          apt-get install -y ascon-kompas-graphic-v25 ascon-kompas-v25             ascon-kompas-sdk-v25 clang18.1 libcxx-devel libcxxabi-devel || true

          test -x /opt/ascon/kompas3d-v25/Bin/kKompas
          test -f /opt/ascon/kompas3d-v25/Bin/libksAPI.so
          test -f /opt/ascon/kompas3d-v25/SDK/KsAPI/Include/KsAPI.h
          command -v clang++-18

          wget -O /tmp/inject_variant06_lazy.cpp             'https://raw.githubusercontent.com/Damirinho9/New-repository/kompas-7335493-native-work1/kompas-linux/inject_variant06_lazy.cpp'

          INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
          BIN=/opt/ascon/kompas3d-v25/Bin
          clang++-18 -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread             -I"$INC" /tmp/inject_variant06.cpp             -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi             -o /tmp/inject_variant06.so

          echo "=== INJECTOR ABI ==="
          ldd /tmp/inject_variant06.so || true
          sha256sum /tmp/inject_variant06.so

          rm -f /tmp/work1_v6_inject.log /tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw /tmp/kompas_v6.log

          export LANG=ru_RU.UTF-8
          export LC_ALL=ru_RU.UTF-8
          export QT_QPA_PLATFORM=offscreen
          export LD_LIBRARY_PATH=/opt/ascon/kompas3d-v25/Bin
          unset DISPLAY HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy

          cd /opt/ascon/kompas3d-v25/Bin

          # Baseline: prove KOMPAS starts without preload.
          dbus-run-session -- ./kKompas >/tmp/kompas_baseline.log 2>&1 &
          BP=$!
          sleep 5
          if ! kill -0 "$BP" 2>/dev/null; then
            echo "FAIL_BASELINE_KOMPAS_EXITED"
            cat /tmp/kompas_baseline.log || true
            exit 30
          fi
          kill "$BP" 2>/dev/null || true
          sleep 2
          echo "BASELINE_KOMPAS_PASS"

          # Now inject same-ABI writer only into KOMPAS.
          dbus-run-session -- bash -c 'LD_PRELOAD=/tmp/inject_variant06.so exec ./kKompas' >/tmp/kompas_v6.log 2>&1 &
          KP=$!
          echo "KOMPAS_PID=$KP"

          for i in $(seq 1 120); do
            echo "POLL=$i"
            tail -30 /tmp/work1_v6_inject.log 2>/dev/null || true
            if grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log 2>/dev/null; then
              echo "PASS_MARKER_FOUND"
              break
            fi
            if ! kill -0 "$KP" 2>/dev/null; then
              echo "KOMPAS_EXITED"
              break
            fi
            sleep 2
          done

          echo "=== INJECT_LOG ==="
          cat /tmp/work1_v6_inject.log 2>/dev/null || true
          echo "=== KOMPAS_LOG_TAIL ==="
          tail -200 /tmp/kompas_v6.log 2>/dev/null || true

          OUT=/tmp/01_Mekhanizm_Variant_06_PARAMETRIC.frw
          test -s "$OUT"
          grep -q 'RESULT=PASS_NATIVE_PARAMETRIC_VARIANT06' /tmp/work1_v6_inject.log

          echo "=== FRW_METADATA ==="
          ls -l "$OUT"
          sha256sum "$OUT"
          echo "=== FRW_BASE64_BEGIN ==="
          base64 -w 76 "$OUT"
          echo "=== FRW_BASE64_END ==="
          echo "RESULT=PASS_FINAL_NATIVE_FRW"
