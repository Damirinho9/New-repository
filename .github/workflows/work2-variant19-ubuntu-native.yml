name: KOMPAS Ubuntu Work 2 variant 19 native top-down

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/work2-variant19-ubuntu-native.yml'
      - 'kompas-linux/work2_variant19_native.cpp'
      - 'kompas-linux/bootstrap_variant06_qt.cpp'
      - 'work2-variant19/calculation.csv'
      - 'work2-variant19/calculation.md'

jobs:
  native-work2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kompas-7335493-native-work1

      - name: Build and run Work 2 in clean Ubuntu KOMPAS v25
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf result/work2-ubuntu-native
          mkdir -p result/work2-ubuntu-native

          docker run --rm --name work2-kompas \
            -v "$PWD:/work" \
            ubuntu:24.04 bash -lc '
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                wget curl ca-certificates gnupg lsb-release xvfb xauth dbus procps \
                locales fontconfig qt6-base-dev pkg-config clang g++ libc++-dev libc++abi-dev \
                libxcb-res0 libxcb-dri2-0 libxcb-cursor0 libxres1 libxcb-ewmh2 libxcb-icccm4 \
                libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libunwind8 libxcb-xkb1 libxkbcommon-x11-0 \
                libxcb-util1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render0 libxcb-shm0 \
                libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxcb-present0 libxcb-dri3-0

              wget -qO /tmp/ascon.sh https://repo.ascon.ru/scripts/ascon-stable-deb.sh
              bash /tmp/ascon.sh || true
              rm -f /etc/apt/sources.list.d/ascon.list
              echo "deb [signed-by=/etc/apt/trusted.gpg.d/ascon.gpg] https://repo.ascon.ru/stable/deb 1.8_x86-64 main" > /etc/apt/sources.list.d/ascon.list
              test -s /etc/apt/trusted.gpg.d/ascon.gpg
              apt-get update
              apt-get install -y ascon-kompas-v25 ascon-kompas-graphic-v25 ascon-kompas3d-v25 ascon-kompas-sdk-v25

              BIN=/opt/ascon/kompas3d-v25/Bin
              INC=/opt/ascon/kompas3d-v25/SDK/KsAPI/Include
              test -x "$BIN/ksinvisible"
              ldd "$BIN/ksinvisible" | tee /tmp/ksinvisible-ldd.txt
              ! grep -q "not found" /tmp/ksinvisible-ldd.txt

              clang++ -std=c++20 -stdlib=libc++ -O2 -fPIC -shared -pthread \
                -I"$INC" /work/kompas-linux/work2_variant19_native.cpp \
                -L"$BIN" -Wl,-rpath,"$BIN" -lksAPI -lc++abi \
                -o /tmp/writer_variant06.so

              g++ -std=c++20 -O2 -fPIC -shared -pthread \
                /work/kompas-linux/bootstrap_variant06_qt.cpp \
                $(pkg-config --cflags --libs Qt6Core) -ldl \
                -o /tmp/bootstrap_variant06_qt.so

              export HOME=/root XDG_CONFIG_HOME=/root/.config
              mkdir -p /root/.config/ascon/KOMPAS-3D/25 /root/.config/ascon/"KOMPAS-3D Invisible"/25
              if [ -d /etc/ascon/KOMPAS-3D/25 ]; then
                cp -a /etc/ascon/KOMPAS-3D/25/. /root/.config/ascon/KOMPAS-3D/25/ || true
                cp -a /etc/ascon/KOMPAS-3D/25/. /root/.config/ascon/"KOMPAS-3D Invisible"/25/ || true
              fi
              RES=$(find /opt/ascon/kompas3d-v25 -type f -name QtResources.bin -print -quit || true)
              [ -z "$RES" ] || cp -f "$RES" /root/.config/ascon/"KOMPAS-3D Invisible"/25/QtResources.bin

              rm -rf /tmp/work2_v19_native
              rm -f /tmp/work1_bootstrap.log /tmp/work1_bootstrap_once.lock
              mkdir -p /tmp/.X11-unix
              chmod 1777 /tmp/.X11-unix
              rm -f /tmp/.X11-unix/X107
              Xvfb :107 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset >/tmp/xvfb.out 2>/tmp/xvfb.err &
              XV=$!
              trap "kill $XV 2>/dev/null || true" EXIT
              sleep 2
              test -S /tmp/.X11-unix/X107

              export DISPLAY=:107 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN"
              unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy ALL_PROXY all_proxy

              if command -v kompas-v25 >/dev/null 2>&1; then
                KEXEC="$(command -v kompas-v25)"
                echo "KOMPAS_LAUNCHER=$(readlink -f "$KEXEC" 2>/dev/null || echo "$KEXEC")"
              else
                KEXEC="$BIN/kKompas"
                if [ ! -x "$KEXEC" ] && [ -x "$BIN/ksinvisible" ]; then
                  ln -sf "$BIN/ksinvisible" /tmp/kKompas
                  KEXEC=/tmp/kKompas
                fi
              fi
              test -x "$KEXEC"
              echo "KEXEC=$KEXEC"

              timeout 25s dbus-run-session -- env HOME=/root XDG_CONFIG_HOME=/root/.config \
                DISPLAY=:107 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN" \
                "$KEXEC" -automation >/tmp/kompas-init.out 2>/tmp/kompas-init.err || true
              pkill -x kKompas 2>/dev/null || true
              pkill -x ksinvisible 2>/dev/null || true
              rm -f /tmp/work1_bootstrap_once.lock

              dbus-run-session -- env HOME=/root XDG_CONFIG_HOME=/root/.config \
                DISPLAY=:107 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 LD_LIBRARY_PATH="$BIN" \
                LD_PRELOAD=/tmp/bootstrap_variant06_qt.so \
                "$KEXEC" -automation >/tmp/kompas-work2.out 2>/tmp/kompas-work2.err &
              KP=$!

              PASS=0
              for i in $(seq 1 150); do
                sleep 2
                if grep -q "^RESULT=PASS_NATIVE_WORK2_VARIANT19$" /tmp/work2_v19_native/work2.log 2>/dev/null; then
                  PASS=1
                  break
                fi
                if grep -q "^RESULT=FAIL_NATIVE_WORK2_VARIANT19$" /tmp/work2_v19_native/work2.log 2>/dev/null; then
                  break
                fi
                if ! kill -0 "$KP" 2>/dev/null; then break; fi
              done

              cat /tmp/work1_bootstrap.log 2>/dev/null || true
              cat /tmp/work2_v19_native/work2.log 2>/dev/null || true
              tail -200 /tmp/kompas-work2.err 2>/dev/null || true

              mkdir -p /work/result/work2-ubuntu-native
              if [ "$PASS" != "1" ]; then
                mkdir -p /work/result/work2-ubuntu-native/diagnostics
                cp /tmp/work1_bootstrap.log /work/result/work2-ubuntu-native/diagnostics/ 2>/dev/null || true
                cp /tmp/work2_v19_native/work2.log /work/result/work2-ubuntu-native/diagnostics/ 2>/dev/null || true
                cp /tmp/kompas-work2.err /work/result/work2-ubuntu-native/diagnostics/ 2>/dev/null || true
                cp /tmp/ksinvisible-ldd.txt /work/result/work2-ubuntu-native/diagnostics/ 2>/dev/null || true
                exit 30
              fi

              test -s /tmp/work2_v19_native/Work2_V19_Workpiece.m3d
              test -s /tmp/work2_v19_native/Work2_V19_FormCutter.m3d
              test -s /tmp/work2_v19_native/Work2_V19_TopDown.a3d
              grep -q "^RESULT=PASS_NATIVE_WORK2_VARIANT19_REOPEN_REBUILD_DEPENDENCY$" /tmp/work2_v19_native/work2.log
              grep -q "^TOP_DOWN_DEPENDENCY_PHYSICAL_CHANGE_PASS$" /tmp/work2_v19_native/work2.log
              grep -q "^FINAL_NOMINAL_REOPEN_PASS$" /tmp/work2_v19_native/work2.log
              cp -a /tmp/work2_v19_native/. /work/result/work2-ubuntu-native/
              cp /tmp/work1_bootstrap.log /work/result/work2-ubuntu-native/
              cp /tmp/ksinvisible-ldd.txt /work/result/work2-ubuntu-native/
            '

      - name: Strict native container and SHA gate
        shell: bash
        run: |
          set -euxo pipefail
          D=result/work2-ubuntu-native
          grep -q '^RESULT=PASS_NATIVE_WORK2_VARIANT19_REOPEN_REBUILD_DEPENDENCY$' "$D/work2.log"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,json
          d=Path("result/work2-ubuntu-native")
          names=["Work2_V19_Workpiece.m3d","Work2_V19_FormCutter.m3d","Work2_V19_TopDown.a3d"]
          lines=[]
          for name in names:
              p=d/name
              assert p.stat().st_size>1024,name
              assert zipfile.is_zipfile(p),name
              with zipfile.ZipFile(p) as z:
                  assert {"Contents","FileInfo"}.issubset(set(z.namelist())),name
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {name}")
          (d/"SHA256.txt").write_text("\n".join(lines)+"\n")
          m=json.loads((d/"native-manifest.json").read_text())
          assert m["variant"]==19 and m["architecture"]=="top-down"
          assert m["dependency"].startswith("MoldCavity")
          (d/"ACCEPTANCE.txt").write_text(
              "ASSEMBLY_FIRST_PASS\n"
              "MOLD_CAVITY_PHYSICAL_DEPENDENCY_PASS\n"
              "OPEN_REBUILD_SAVE_CLOSE_REOPEN_REBUILD_PASS\n"
              "RESULT=PASS_NATIVE_WORK2_VARIANT19\n"
          )
          PY
          cp work2-variant19/calculation.csv "$D/"
          cp work2-variant19/calculation.md "$D/"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-work2-variant19-ubuntu-native-topdown
          if-no-files-found: error
          path: result/work2-ubuntu-native/**
