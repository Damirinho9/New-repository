name: Hexlet 7344445 Build Multiuser Lab

on:
  push:
    branches:
      - hexlet-7344445-multiuser
    paths:
      - "hexlet_7344445/multiuser/**"
      - ".github/workflows/hexlet-7344445-multiuser-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native Packet Tracer tooling
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recurse-submodules https://github.com/fn-cafeina/lab-pkt.git /tmp/lab-pkt
          python -m pip install -e /tmp/lab-pkt

      - name: Build and validate two native Multiuser sessions
        shell: bash
        run: |
          set -euxo pipefail
          python hexlet_7344445/multiuser/build_multiuser.py
          find hexlet_7344445/multiuser/out -type f -printf '%P %s bytes\n' | sort
          sha256sum hexlet_7344445/multiuser/out/*.pkt
          test -f hexlet_7344445/multiuser/7344445_Cisco_PacketTracer_Multiuser.zip

      - uses: actions/upload-artifact@v4
        with:
          name: 7344445-Cisco-PacketTracer-Multiuser
          path: |
            hexlet_7344445/multiuser/out/
            hexlet_7344445/multiuser/7344445_Cisco_PacketTracer_Multiuser.zip
          if-no-files-found: error
