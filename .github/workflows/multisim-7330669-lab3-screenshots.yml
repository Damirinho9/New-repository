name: Lab3 native Multisim screenshots - order 7330669

on:
  push:
    branches:
      - multisim-7330669-native-gui
    paths:
      - ".github/workflows/multisim-7330669-lab3-screenshots.yml"
      - "final7330669/lab3_screenshots.py"
      - "final7330669/run-lab3-screenshots.ps1"
  workflow_dispatch:

jobs:
  lab3screens:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Build real Multisim Lab3 screenshots
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\final7330669\run-lab3-screenshots.ps1 -Workspace "$env:GITHUB_WORKSPACE"

      - name: Inventory
        if: always()
        shell: powershell
        run: |
          $p=".\final7330669-lab3shots-artifacts"
          if(Test-Path $p){
            Get-ChildItem $p -Recurse |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize
          }

      - name: Upload Lab3 native Multisim screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multisim-7330669-lab3-real-screenshots
          path: final7330669-lab3shots-artifacts/
          if-no-files-found: warn
          retention-days: 7
