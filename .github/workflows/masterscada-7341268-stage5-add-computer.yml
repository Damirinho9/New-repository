name: MasterSCADA 7341268 Stage 5 Add Computer

on:
  push:
    branches: [masterscada-7341268-windows]
    paths:
      - ".github/workflows/masterscada-7341268-stage5-add-computer.yml"
  workflow_dispatch:

jobs:
  add-computer:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: Prepare evidence folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\stage5-computer" | Out-Null
          New-Item -ItemType Directory -Force "C:\MasterSCADA_7341268\installer" | Out-Null

      - name: Install official MasterSCADA 3.11
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $base="https://download.mps-soft.ru/demo/Old%20Demo/3.11/"
          $dest="C:\MasterSCADA_7341268\installer"
          foreach($n in @("Data1.cab","data.msi","setup.bmp","setup.exe")){
            & curl.exe -k -L --fail --silent --show-error ($base+$n) -o (Join-Path $dest $n)
            if($LASTEXITCODE -ne 0){throw "download $n failed"}
          }
          $p=Start-Process msiexec.exe -ArgumentList @("/i",(Join-Path $dest "data.msi"),"/qn","/norestart") -Wait -PassThru
          "MSI_EXIT_CODE=$($p.ExitCode)" | Set-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage5-computer\install.txt"
          if($p.ExitCode -notin @(0,3010,1641)){throw "MSI failed $($p.ExitCode)"}

      - name: Download validated native project from Stage 2
        uses: actions/download-artifact@v4
        with:
          name: masterscada-7341268-native-project
          path: input-project
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Damirinho9/New-repository
          run-id: 44094325226

      - name: Copy project to isolated Stage 5 workspace
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $srcVav=Get-ChildItem "$env:GITHUB_WORKSPACE\input-project" -Recurse -Filter "7341268_Variant7.vav" -File | Select-Object -First 1
          if($null -eq $srcVav){throw "7341268_Variant7.vav not found in source artifact"}
          $srcDir=$srcVav.Directory.FullName
          $dstParent="$env:GITHUB_WORKSPACE\stage5-computer\project"
          New-Item -ItemType Directory -Force $dstParent | Out-Null
          $dstDir=Join-Path $dstParent "7341268_Variant7"
          Copy-Item $srcDir $dstDir -Recurse -Force
          $vav=Join-Path $dstDir "7341268_Variant7.vav"
          if(!(Test-Path $vav)){throw "copied VAV missing"}
          "SOURCE_VAV=$($srcVav.FullName)" | Set-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage5-computer\source.txt"
          "SOURCE_SHA256=$((Get-FileHash $srcVav.FullName -Algorithm SHA256).Hash)" | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage5-computer\source.txt"
          "WORK_VAV=$vav" | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage5-computer\source.txt"
          "WORK_SHA256_BEFORE=$((Get-FileHash $vav -Algorithm SHA256).Hash)" | Add-Content -Encoding utf8 "$env:GITHUB_WORKSPACE\stage5-computer\source.txt"

      - name: Add real Computer node through COM tree API and save
        shell: C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference="Stop"
          $out="$env:GITHUB_WORKSPACE\stage5-computer\mutation.txt"
          $vav="$env:GITHUB_WORKSPACE\stage5-computer\project\7341268_Variant7\7341268_Variant7.vav"
          $exe="C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          $computerClsid="{33A04CE5-4692-11D4-B153-87EB14408E58}"
          $computerProgId="Vavobj.Computer.1"
          $computerName="АРМ оператора"

          function Start-Watcher([string]$logPath){
            return Start-Job -ScriptBlock {
              param($logPath)
              $ws=New-Object -ComObject WScript.Shell
              for($i=0;$i -lt 180;$i++){
                Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowTitle} | ForEach-Object {
                  "$(Get-Date -Format o) PID=$($_.Id) TITLE=$($_.MainWindowTitle)" | Add-Content -Encoding utf8 $logPath
                  if($ws.AppActivate($_.Id)){
                    Start-Sleep -Milliseconds 200
                    $ws.SendKeys("{ENTER}")
                  }
                }
                Start-Sleep -Milliseconds 500
              }
            } -ArgumentList $logPath
          }

          $watcher=Start-Watcher "$env:GITHUB_WORKSPACE\stage5-computer\mutation-modal.txt"
          $proc=$null;$app=$null;$computerObject=$null
          try{
            $proc=Start-Process $exe -ArgumentList @($vav) -PassThru
            Start-Sleep -Seconds 12
            $alive=$null -ne (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)
            "PROCESS_ALIVE=$alive" | Set-Content -Encoding utf8 $out
            if(!$alive){throw "MasterSCADA process exited before mutation"}

            $app=New-Object -ComObject MasterSCADA.Application
            $project=$app.CurrentProject
            "CURRENT_PROJECT_PRESENT=$($null -ne $project)" | Add-Content -Encoding utf8 $out
            if($null -eq $project){throw "CurrentProject null"}

            "PROJECT_NAME=$($project.Name)" | Add-Content -Encoding utf8 $out
            "PROJECT_PATH=$($project.Path)" | Add-Content -Encoding utf8 $out
            "COMPUTER_COUNT_BEFORE=$($project.ComputerCount)" | Add-Content -Encoding utf8 $out

            $existing=$null
            for($i=0;$i -lt $project.ComputerCount;$i++){
              try{
                $c=$project.Computer($i)
                $cls=""
                try{$cls=[string]$c.ClassInfoObject.clsid}catch{}
                "BEFORE_COMPUTER[$i].Name=$($c.Name) CLSID=$cls ObjectType=$($c.ObjectType) ItemType=$($c.ItemType)" | Add-Content -Encoding utf8 $out
                if($cls -ieq $computerClsid -or $c.Name -eq $computerName){$existing=$c}
              }catch{
                "BEFORE_COMPUTER[$i].ERROR=$($_.Exception.Message)" | Add-Content -Encoding utf8 $out
              }
            }

            if($null -eq $existing){
              $computerObject=New-Object -ComObject $computerProgId
              "COMPUTER_COM_OBJECT_CREATED=True" | Add-Content -Encoding utf8 $out
              "COMPUTER_COM_OBJECT_TYPE=$($computerObject.GetType().FullName)" | Add-Content -Encoding utf8 $out

              $node=$null
              try{
                $node=$project.SystemRoot.InsertExistingObject($computerObject,$computerClsid,$computerName,$null)
                "INSERT_METHOD=InsertExistingObject" | Add-Content -Encoding utf8 $out
              }catch{
                "INSERT_EXISTING_ERROR=$($_.Exception.GetType().FullName): $($_.Exception.Message)" | Add-Content -Encoding utf8 $out
              }

              if($null -eq $node){
                try{
                  $node=$project.SystemRoot.InsertExistingObjectEx($computerObject,$computerClsid,$computerName,$null,$true)
                  "INSERT_METHOD=InsertExistingObjectEx" | Add-Content -Encoding utf8 $out
                }catch{
                  "INSERT_EXISTING_EX_ERROR=$($_.Exception.GetType().FullName): $($_.Exception.Message)" | Add-Content -Encoding utf8 $out
                }
              }

              "INSERT_RETURNED=$($null -ne $node)" | Add-Content -Encoding utf8 $out
              if($null -eq $node){throw "Computer insertion returned null"}

              try{$node.Rename($computerName,1)}catch{}
              try{"INSERTED.Name=$($node.Name)"|Add-Content -Encoding utf8 $out}catch{}
              try{"INSERTED.DisplayName=$($node.DisplayName)"|Add-Content -Encoding utf8 $out}catch{}
              try{"INSERTED.ItemType=$($node.ItemType)"|Add-Content -Encoding utf8 $out}catch{}
              try{"INSERTED.ObjectType=$($node.ObjectType)"|Add-Content -Encoding utf8 $out}catch{}
              try{"INSERTED.CLSID=$($node.ClassInfoObject.clsid)"|Add-Content -Encoding utf8 $out}catch{}
              try{"INSERTED.FullName=$($node.FullName)"|Add-Content -Encoding utf8 $out}catch{}
            } else {
              "EXISTING_VALID_COMPUTER_REUSED=True" | Add-Content -Encoding utf8 $out
              try{$existing.Rename($computerName,1)}catch{}
            }

            "COMPUTER_COUNT_AFTER_INSERT=$($project.ComputerCount)" | Add-Content -Encoding utf8 $out
            if([int]$project.ComputerCount -lt 1){throw "ComputerCount still zero after insertion"}

            $found=$false
            for($i=0;$i -lt $project.ComputerCount;$i++){
              $c=$project.Computer($i)
              $cls=""
              try{$cls=[string]$c.ClassInfoObject.clsid}catch{}
              "AFTER_COMPUTER[$i].Name=$($c.Name) CLSID=$cls ObjectType=$($c.ObjectType) ItemType=$($c.ItemType) FullName=$($c.FullName)" | Add-Content -Encoding utf8 $out
              if($cls -ieq $computerClsid){$found=$true}
            }
            "EXPECTED_CLSID_FOUND_BEFORE_SAVE=$found" | Add-Content -Encoding utf8 $out
            if(!$found){throw "Inserted computer CLSID not found before save"}

            $project.Save()
            "PROJECT_SAVE=True" | Add-Content -Encoding utf8 $out
            Start-Sleep -Seconds 3
            "VAV_SIZE_AFTER_SAVE=$((Get-Item $vav).Length)" | Add-Content -Encoding utf8 $out
            "VAV_SHA256_AFTER_SAVE=$((Get-FileHash $vav -Algorithm SHA256).Hash)" | Add-Content -Encoding utf8 $out
            "MUTATION=PASS" | Add-Content -Encoding utf8 $out
          } finally {
            try{Stop-Job $watcher -ErrorAction SilentlyContinue|Out-Null}catch{}
            try{Receive-Job $watcher -ErrorAction SilentlyContinue|Out-Null}catch{}
            try{Remove-Job $watcher -Force -ErrorAction SilentlyContinue}catch{}
            if($app){
              try{$app.ExitScada()}catch{}
              try{[Runtime.InteropServices.Marshal]::FinalReleaseComObject($app)|Out-Null}catch{}
            }
            if($computerObject -and [Runtime.InteropServices.Marshal]::IsComObject($computerObject)){
              try{[Runtime.InteropServices.Marshal]::FinalReleaseComObject($computerObject)|Out-Null}catch{}
            }
            if($proc){try{Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}catch{}}
            Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Get-Content $out
          if(!(Select-String -Path $out -Pattern "^MUTATION=PASS$" -Quiet)){throw "mutation did not pass"}

      - name: Fresh reopen and verify saved Computer
        shell: C:\\Windows\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference="Stop"
          $out="$env:GITHUB_WORKSPACE\stage5-computer\fresh-reopen.txt"
          $vav="$env:GITHUB_WORKSPACE\stage5-computer\project\7341268_Variant7\7341268_Variant7.vav"
          $exe="C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          $computerClsid="{33A04CE5-4692-11D4-B153-87EB14408E58}"

          Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $watcher=Start-Job -ScriptBlock {
            param($logPath)
            $ws=New-Object -ComObject WScript.Shell
            for($i=0;$i -lt 160;$i++){
              Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowTitle} | ForEach-Object {
                "$(Get-Date -Format o) PID=$($_.Id) TITLE=$($_.MainWindowTitle)" | Add-Content -Encoding utf8 $logPath
                if($ws.AppActivate($_.Id)){Start-Sleep -Milliseconds 200;$ws.SendKeys("{ENTER}")}
              }
              Start-Sleep -Milliseconds 500
            }
          } -ArgumentList "$env:GITHUB_WORKSPACE\stage5-computer\reopen-modal.txt"

          $proc=$null;$app=$null
          try{
            $proc=Start-Process $exe -ArgumentList @($vav) -PassThru
            Start-Sleep -Seconds 12
            $alive=$null -ne (Get-Process -Id $proc.Id -ErrorAction SilentlyContinue)
            "REOPEN_PROCESS_ALIVE=$alive" | Set-Content -Encoding utf8 $out
            if(!$alive){throw "MasterSCADA exited on fresh reopen"}

            $app=New-Object -ComObject MasterSCADA.Application
            $p=$app.CurrentProject
            "REOPEN_CURRENT_PROJECT=$($null -ne $p)" | Add-Content -Encoding utf8 $out
            if($null -eq $p){throw "CurrentProject null after fresh reopen"}

            $count=[int]$p.ComputerCount
            "COMPUTER_COUNT=$count" | Add-Content -Encoding utf8 $out
            if($count -lt 1){throw "ComputerCount < 1 after fresh reopen"}

            $found=$false
            $named=$false
            for($i=0;$i -lt $count;$i++){
              $c=$p.Computer($i)
              $cls=""
              try{$cls=[string]$c.ClassInfoObject.clsid}catch{}
              $name=[string]$c.Name
              "COMPUTER[$i].Name=$name" | Add-Content -Encoding utf8 $out
              "COMPUTER[$i].DisplayName=$($c.DisplayName)" | Add-Content -Encoding utf8 $out
              "COMPUTER[$i].ItemType=$($c.ItemType)" | Add-Content -Encoding utf8 $out
              "COMPUTER[$i].ObjectType=$($c.ObjectType)" | Add-Content -Encoding utf8 $out
              "COMPUTER[$i].CLSID=$cls" | Add-Content -Encoding utf8 $out
              "COMPUTER[$i].FullName=$($c.FullName)" | Add-Content -Encoding utf8 $out
              if($cls -ieq $computerClsid){$found=$true}
              if($name -eq "АРМ оператора" -or $name -eq "Компьютер"){$named=$true}
            }

            "EXPECTED_COMPUTER_CLSID_FOUND=$found" | Add-Content -Encoding utf8 $out
            "EXPECTED_COMPUTER_NAME_FOUND=$named" | Add-Content -Encoding utf8 $out
            "VAV_SIZE=$((Get-Item $vav).Length)" | Add-Content -Encoding utf8 $out
            "VAV_SHA256=$((Get-FileHash $vav -Algorithm SHA256).Hash)" | Add-Content -Encoding utf8 $out

            if(!$found){throw "Expected computer CLSID missing after fresh reopen"}
            if(!$named){throw "Expected computer name missing after fresh reopen"}
            "FRESH_REOPEN_VALIDATION=PASS" | Add-Content -Encoding utf8 $out
          } finally {
            try{Stop-Job $watcher -ErrorAction SilentlyContinue|Out-Null}catch{}
            try{Receive-Job $watcher -ErrorAction SilentlyContinue|Out-Null}catch{}
            try{Remove-Job $watcher -Force -ErrorAction SilentlyContinue}catch{}
            if($app){
              try{$app.ExitScada()}catch{}
              try{[Runtime.InteropServices.Marshal]::FinalReleaseComObject($app)|Out-Null}catch{}
            }
            if($proc){try{Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}catch{}}
            Get-Process -Name MasterSCADA -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

          Get-Content $out
          if(!(Select-String -Path $out -Pattern "^FRESH_REOPEN_VALIDATION=PASS$" -Quiet)){throw "fresh reopen validation failed"}

      - name: Final Stage 5 status
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $mutation="$env:GITHUB_WORKSPACE\stage5-computer\mutation.txt"
          $reopen="$env:GITHUB_WORKSPACE\stage5-computer\fresh-reopen.txt"
          $status="$env:GITHUB_WORKSPACE\stage5-computer\STAGE5_STATUS.txt"
          $vav="$env:GITHUB_WORKSPACE\stage5-computer\project\7341268_Variant7\7341268_Variant7.vav"
          "STAGE5_ADD_COMPUTER=PASS" | Set-Content -Encoding utf8 $status
          "COMPUTER_CLSID={33A04CE5-4692-11D4-B153-87EB14408E58}" | Add-Content -Encoding utf8 $status
          "COMPUTER_NAME=АРМ оператора" | Add-Content -Encoding utf8 $status
          "COMPUTER_COUNT=$((Select-String $reopen '^COMPUTER_COUNT=').Line.Split('=')[1])" | Add-Content -Encoding utf8 $status
          "VAV_SIZE=$((Get-Item $vav).Length)" | Add-Content -Encoding utf8 $status
          "VAV_SHA256=$((Get-FileHash $vav -Algorithm SHA256).Hash)" | Add-Content -Encoding utf8 $status
          "SAVE_CONFIRMED=True" | Add-Content -Encoding utf8 $status
          "FRESH_REOPEN_CONFIRMED=True" | Add-Content -Encoding utf8 $status
          Get-Content $status

      - name: Upload Stage 5 native project and evidence
        uses: actions/upload-artifact@v4
        with:
          name: masterscada-7341268-stage5-computer
          path: stage5-computer/**
          if-no-files-found: error
          retention-days: 90
