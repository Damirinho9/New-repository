name: Finalize all native Multisim labs - order 7330669

on:
  push:
    branches:
      - multisim-7330669-native-gui
    paths:
      - ".github/workflows/multisim-7330669-finalize-all.yml"
      - "final7330669/**"
  workflow_dispatch:

concurrency:
  group: multisim-7330669-finalize-all
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4

      - name: Install Multisim once and finalize Lab2 Lab3 Lab4
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\final7330669\run-final-all.ps1 -Workspace "$env:GITHUB_WORKSPACE"

      - name: Inventory outputs
        if: always()
        shell: powershell
        run: |
          if(Test-Path .\final7330669-artifacts){
            Get-ChildItem .\final7330669-artifacts -Recurse |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize
          }

      - name: Upload finalization outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multisim-7330669-final-three-labs
          path: final7330669-artifacts/
          if-no-files-found: warn
          retention-days: 7
