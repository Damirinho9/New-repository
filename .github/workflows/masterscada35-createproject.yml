name: MasterSCADA 3.5 create project 7341100
on:
  push:
    branches: [tmp-masterscada-7341100]
jobs:
  create-project:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Install MasterSCADA 3.5
        shell: pwsh
        run: |
          $b="https://download.mps-soft.ru/demo/Old%20Demo/3.5"
          curl.exe -k -L --fail "$b/data.msi" -o data.msi
          curl.exe -k -L --fail "$b/Data1.cab" -o Data1.cab
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress') -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "MSI failed $($p.ExitCode)" }

      - name: Create save and reopen project
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto pillow psutil
          @'
          from pathlib import Path
          from pywinauto import Desktop, Application
          import time, json, traceback, psutil, shutil, subprocess, os

          EXE=r"C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          NAME="7341100_MasterSCADA_Lab7"
          PROJECT_DIR=Path(r"C:\MasterSCADA Projects\Projects")/NAME
          log=[]

          def snap(w,p):
              try:
                  w.capture_as_image().save(p); log.append("SCREENSHOT "+p)
              except Exception as e: log.append("SCREENSHOT_ERROR "+p+" "+repr(e))
          def visible_dialogs(pid):
              return [w for w in Desktop(backend="win32").windows(process=pid)
                      if w.class_name()=="#32770" and w.is_visible()]
          def ctrl_dump(w,p):
              a=[]
              for i,c in enumerate(w.children()):
                  try:a.append({"i":i,"text":c.window_text(),"class":c.class_name(),"enabled":c.is_enabled(),"rect":str(c.rectangle())})
                  except Exception as e:a.append({"i":i,"error":repr(e)})
              Path(p).write_text(json.dumps(a,ensure_ascii=False,indent=2),encoding="utf-8")
          def find_main(pid=None):
              wins=Desktop(backend="win32").windows(process=pid) if pid else Desktop(backend="win32").windows()
              for w in wins:
                  try:
                      if w.is_visible() and w.window_text().startswith("MasterSCADA"):
                          return w
                  except: pass
              raise RuntimeError("MasterSCADA main window not found")
          def kill_all():
              for p in psutil.process_iter(["name"]):
                  try:
                      if p.info["name"] and "masterscada" in p.info["name"].lower(): p.kill()
                  except: pass

          try:
              app=Application(backend="win32").start(EXE)
              pid=app.process
              time.sleep(10)
              main=find_main(pid); snap(main,"01_started.png")

              ds=visible_dialogs(pid)
              if not ds:
                  main.set_focus(); main.type_keys("^n"); time.sleep(2); ds=visible_dialogs(pid)
              if not ds: raise RuntimeError("New project dialog missing")
              dlg=ds[0]; ctrl_dump(dlg,"01_new_controls.json"); snap(dlg,"02_new_dialog.png")
              edits=[c for c in dlg.children() if c.class_name()=="Edit" and c.is_visible()]
              edits[0].set_edit_text(NAME); time.sleep(1)
              oks=[c for c in dlg.children() if c.class_name()=="Button" and c.is_visible() and c.window_text().strip().upper()=="OK"]
              if not oks or not oks[0].is_enabled(): raise RuntimeError("New project OK unavailable")
              oks[0].click(); time.sleep(4)

              ds=visible_dialogs(pid)
              if ds:
                  access=ds[0]; ctrl_dump(access,"02_access_controls.json"); snap(access,"03_access_dialog.png")
                  oks=[c for c in access.children() if c.class_name()=="Button" and c.is_visible() and c.window_text().strip().upper()=="OK"]
                  if not oks: raise RuntimeError("Access dialog OK missing")
                  oks[0].click()
              time.sleep(15)

              main=find_main(pid)
              title=main.window_text()
              log.append("CREATED_TITLE="+title)
              if NAME not in title: raise RuntimeError("Project name absent from main title: "+title)
              snap(main,"04_project_created.png")

              main.set_focus(); main.type_keys("^s"); time.sleep(6)
              log.append("SAVE_SENT")

              if not PROJECT_DIR.exists():
                  raise RuntimeError("Expected project directory missing: "+str(PROJECT_DIR))
              files=[]
              for p in PROJECT_DIR.rglob("*"):
                  if p.is_file(): files.append({"path":str(p),"relative":str(p.relative_to(PROJECT_DIR)),"size":p.stat().st_size})
              Path("project_files.json").write_text(json.dumps(files,ensure_ascii=False,indent=2),encoding="utf-8")
              vavs=[p for p in PROJECT_DIR.rglob("*.vav") if p.is_file()]
              log.append("VAVS="+repr([str(p) for p in vavs]))
              if not vavs: raise RuntimeError("Native .vav not found")
              vav=vavs[0]
              Path("native_vav_path.txt").write_text(str(vav),encoding="utf-8")
              shutil.copytree(PROJECT_DIR,Path("native_project_snapshot")/NAME,dirs_exist_ok=True)
              snap(main,"05_project_saved.png")
              Path("create_save_result.txt").write_text("CREATE=PASS\nSAVE=PASS\nVAV="+str(vav)+"\n",encoding="utf-8")

              # Dump editor UIA controls and Win32 menu labels for the next authoring step.
              try:
                  u=Desktop(backend="uia").window(process=pid,title_re="MasterSCADA.*")
                  rows=[]
                  for i,c in enumerate(u.descendants()):
                      try: rows.append(f"{i}\t{c.element_info.control_type}\t{c.window_text()!r}\t{c.element_info.automation_id!r}")
                      except: pass
                  Path("editor_uia_tree.txt").write_text("\n".join(rows),encoding="utf-8")
              except Exception as e: log.append("UIA_ERR="+repr(e))
              try:
                  m=main.menu()
                  Path("editor_menu_dump.txt").write_text(str(m.get_menu_path("**")),encoding="utf-8")
              except Exception as e: log.append("MENU_ERR="+repr(e))

              # Terminate after a confirmed save, then reopen the exact native .vav.
              kill_all(); time.sleep(3)
              proc=subprocess.Popen([EXE,str(vav)])
              time.sleep(15)
              pid2=proc.pid
              ms=[p for p in psutil.process_iter(["pid","name"]) if p.info["name"] and "masterscada" in p.info["name"].lower()]
              if ms: pid2=ms[-1].pid
              main2=find_main(pid2)
              title2=main2.window_text()
              log.append("REOPEN_TITLE="+title2)
              snap(main2,"06_project_reopened.png")
              if NAME not in title2:
                  raise RuntimeError("Reopened title does not contain project name: "+title2)
              Path("reopen_result.txt").write_text("REOPEN=PASS\nTITLE="+title2+"\n",encoding="utf-8")
              kill_all()
          except Exception:
              log.append("FATAL\n"+traceback.format_exc())
              raise
          finally:
              Path("run_log.txt").write_text("\n".join(log),encoding="utf-8")
              kill_all()
          '@ | Set-Content native_cycle.py -Encoding UTF8
          python native_cycle.py

      - name: Collect MasterSCADA API examples
        if: always()
        shell: pwsh
        run: |
          $api="C:\Program Files (x86)\InSAT\MasterSCADA\API\MasterSCADA"
          if(Test-Path $api){
            Get-ChildItem $api -Recurse -File | Select FullName,Length | ConvertTo-Json -Depth 3 | Out-File api_file_list.json
            New-Item api_extract -Type Directory -Force | Out-Null
            Get-ChildItem $api -Recurse -File -Include *.cs,*.vb,*.txt,*.xml,*.doc,*.chm | ForEach-Object {
              $rel=$_.FullName.Substring($api.Length).TrimStart('\')
              $dst=Join-Path "api_extract" $rel
              New-Item (Split-Path $dst) -ItemType Directory -Force | Out-Null
              Copy-Item $_.FullName $dst -Force
            }
          }

      - name: Upload evidence and native project
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada35-native-cycle-7341100
          path: |
            create_save_result.txt
            reopen_result.txt
            native_vav_path.txt
            project_files.json
            run_log.txt
            editor_uia_tree.txt
            editor_menu_dump.txt
            01_new_controls.json
            02_access_controls.json
            01_started.png
            02_new_dialog.png
            03_access_dialog.png
            04_project_created.png
            05_project_saved.png
            06_project_reopened.png
            native_project_snapshot/**
            api_file_list.json
            api_extract/**
          if-no-files-found: warn
