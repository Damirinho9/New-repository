name: MasterSCADA 3.5 authoring 7341100
on:
  push:
    branches: [tmp-masterscada-7341100]
jobs:
  author:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - name: Restore MasterSCADA installer cache
        id: mscache
        uses: actions/cache/restore@v4
        with:
          path: C:\Temp\MasterSCADA35
          key: masterscada-demo-3.5.0-msi-v2

      - name: Download MasterSCADA installer if needed
        if: steps.mscache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path C:\Temp\MasterSCADA35 -Force | Out-Null
          $b="https://download.mps-soft.ru/demo/Old%20Demo/3.5"
          function Get-WithRetry([string]$url,[string]$out) {
            for($i=1;$i -le 7;$i++) {
              Write-Host "Download attempt $i : $url"
              curl.exe -k -L --fail --connect-timeout 30 --max-time 180 "$url" -o "$out"
              if($LASTEXITCODE -eq 0 -and (Test-Path $out) -and ((Get-Item $out).Length -gt 100000)) { return }
              Start-Sleep -Seconds (3*$i)
            }
            throw "Failed to download $url after retries"
          }
          Get-WithRetry "$b/data.msi" "C:\Temp\MasterSCADA35\data.msi"
          Get-WithRetry "$b/Data1.cab" "C:\Temp\MasterSCADA35\Data1.cab"
          Get-FileHash C:\Temp\MasterSCADA35\data.msi,C:\Temp\MasterSCADA35\Data1.cab -Algorithm SHA256 | Format-List | Out-File installer_hashes.txt

      - name: Save MasterSCADA installer cache immediately
        if: steps.mscache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Temp\MasterSCADA35
          key: masterscada-demo-3.5.0-msi-v2

      - name: Install MasterSCADA 3.5
        shell: pwsh
        run: |
          Copy-Item C:\Temp\MasterSCADA35\data.msi . -Force
          Copy-Item C:\Temp\MasterSCADA35\Data1.cab . -Force
          $p=Start-Process msiexec.exe -ArgumentList @('/i',('"' + (Resolve-Path data.msi) + '"'),'/qn','REBOOT=ReallySuppress') -PassThru -Wait
          if($p.ExitCode -ne 0){ throw "MSI failed $($p.ExitCode)" }

      - name: Native create save reopen and add tank object
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pywinauto pillow psutil
          @'
          from pathlib import Path
          from pywinauto import Desktop, Application
          import time, json, traceback, psutil, shutil, subprocess

          EXE=r"C:\Program Files (x86)\InSAT\MasterSCADA\MasterSCADA.exe"
          NAME="7341100_MasterSCADA_Lab7"
          ROOT=Path(r"C:\MasterSCADA Projects\Projects")
          PROJECT_DIR=ROOT/NAME
          log=[]

          def moji(s):
              try: return s.encode("cp1251").decode("cp1252")
              except Exception: return s
          def demoji(s):
              try: return s.encode("cp1252").decode("cp1251")
              except Exception: return s
          def snap(w,p):
              try: w.capture_as_image().save(p); log.append("SCREENSHOT "+p)
              except Exception as e: log.append("SCREENSHOT_ERROR "+p+" "+repr(e))
          def kill_all():
              for p in psutil.process_iter(["name"]):
                  try:
                      if p.info["name"] and "masterscada" in p.info["name"].lower(): p.kill()
                  except: pass
          def proc_pid():
              ps=[p for p in psutil.process_iter(["pid","name"]) if p.info["name"] and "masterscada" in p.info["name"].lower()]
              return ps[-1].pid if ps else None
          def find_main(pid=None):
              wins=Desktop(backend="win32").windows(process=pid) if pid else Desktop(backend="win32").windows()
              for w in wins:
                  try:
                      if w.is_visible() and w.window_text().startswith("MasterSCADA"): return w
                  except: pass
              raise RuntimeError("MasterSCADA main window not found")
          def dialogs(pid=None):
              wins=Desktop(backend="win32").windows(process=pid) if pid else Desktop(backend="win32").windows()
              return [w for w in wins if w.class_name()=="#32770" and w.is_visible()]
          def click_ok(d):
              bs=[c for c in d.children() if c.class_name()=="Button" and c.is_visible() and c.window_text().strip().upper()=="OK"]
              if not bs: raise RuntimeError("OK button missing in dialog")
              for _ in range(10):
                  if bs[0].is_enabled(): break
                  time.sleep(.3)
              bs[0].click()
          def dump_uia(main,path):
              u=Desktop(backend="uia").window(handle=main.handle)
              rows=[]
              for i,c in enumerate(u.descendants()):
                  try:
                      raw=c.window_text()
                      rows.append({"i":i,"type":c.element_info.control_type,"raw":raw,"decoded":demoji(raw),"autoid":c.element_info.automation_id,"rect":str(c.rectangle())})
                  except: pass
              Path(path).write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
              return u,rows
          def save_snapshot(tag):
              if PROJECT_DIR.exists():
                  out=Path("native_project_snapshot")/NAME
                  if out.exists(): shutil.rmtree(out)
                  shutil.copytree(PROJECT_DIR,out)
                  Path(f"{tag}_files.json").write_text(json.dumps([
                      {"relative":str(p.relative_to(PROJECT_DIR)),"size":p.stat().st_size}
                      for p in PROJECT_DIR.rglob("*") if p.is_file()
                  ],ensure_ascii=False,indent=2),encoding="utf-8")

          try:
              # CREATE
              app=Application(backend="win32").start(EXE)
              pid=app.process; time.sleep(9)
              main=find_main(pid); snap(main,"01_started.png")
              ds=dialogs(pid)
              if not ds:
                  main.set_focus(); main.type_keys("^n"); time.sleep(2); ds=dialogs(pid)
              if not ds: raise RuntimeError("New project dialog missing")
              d=ds[0]
              edits=[c for c in d.children() if c.class_name()=="Edit" and c.is_visible()]
              edits[0].set_edit_text(NAME); time.sleep(1); click_ok(d); time.sleep(4)
              ds=dialogs(pid)
              if ds: click_ok(ds[0])
              time.sleep(14)
              main=find_main(pid)
              if NAME not in main.window_text(): raise RuntimeError("CREATE title mismatch "+main.window_text())
              snap(main,"02_created.png")
              main.set_focus(); main.type_keys("^s"); time.sleep(5)
              vavs=list(PROJECT_DIR.glob("*.vav"))
              if not vavs: raise RuntimeError("Native VAV missing")
              vav=vavs[0]
              Path("create_save.txt").write_text("CREATE=PASS\nSAVE=PASS\nVAV="+str(vav),encoding="utf-8")
              save_snapshot("after_create")
              snap(main,"03_saved.png")
              kill_all(); time.sleep(3)

              # REOPEN THROUGH EDITOR CTRL+O, not runtime command line.
              app2=Application(backend="win32").start(EXE)
              pid=app2.process; time.sleep(8)
              main=find_main(pid)
              ds=dialogs(pid)
              if ds:
                  canc=[c for c in ds[0].children() if c.class_name()=="Button" and c.is_visible() and c.window_text().strip().lower()=="cancel"]
                  if canc: canc[0].click()
                  else: ds[0].type_keys("{ESC}")
                  time.sleep(2)
              main=find_main(pid)
              main.set_focus(); main.type_keys("^o"); time.sleep(3)
              ds=dialogs(pid)
              if not ds: raise RuntimeError("Open project dialog missing")
              od=ds[0]
              # English Windows common file dialog: Alt+N focuses File name.
              od.set_focus(); od.type_keys("%n"); time.sleep(.5)
              od.type_keys(str(vav),with_spaces=True); time.sleep(.5); od.type_keys("{ENTER}")
              time.sleep(8)
              # Project access dialog can follow open.
              ds=dialogs(pid)
              if ds:
                  log.append("REOPEN_FOLLOWUP_DIALOG="+repr(ds[0].window_text()))
                  try: click_ok(ds[0])
                  except: ds[0].type_keys("{ENTER}")
                  time.sleep(10)
              main=find_main(pid)
              title=main.window_text()
              log.append("REOPEN_TITLE="+title)
              if NAME not in title: raise RuntimeError("REOPEN title mismatch "+title)
              Path("reopen_result.txt").write_text("REOPEN=PASS\nTITLE="+title,encoding="utf-8")
              snap(main,"04_reopened.png")

              # Identify object tree and context/top Add menu.
              u,rows=dump_uia(main,"uia_after_reopen.json")
              trees=u.descendants(control_type="Tree")
              tree_report=[]
              object_tree=None
              object_root=None
              for ti,t in enumerate(trees):
                  items=t.descendants(control_type="TreeItem")
                  names=[]
                  for it in items[:30]:
                      raw=it.window_text(); names.append({"raw":raw,"decoded":demoji(raw)})
                  tree_report.append({"tree":ti,"items":names})
                  if items and demoji(items[0].window_text()).strip().lower().startswith("объект"):
                      object_tree=t; object_root=items[0]
              Path("tree_report.json").write_text(json.dumps(tree_report,ensure_ascii=False,indent=2),encoding="utf-8")
              if object_root is None: raise RuntimeError("Object tree root not found")
              object_root.click_input(); time.sleep(1)

              # Use the top menu "Добавить" by UIA. Decode fallback handles ANSI mojibake.
              menuitems=u.descendants(control_type="MenuItem")
              addtop=None
              for m in menuitems:
                  txt=demoji(m.window_text()).strip()
                  if txt=="Добавить": addtop=m; break
              if addtop is None: raise RuntimeError("Top Add menu not found")
              addtop.click_input(); time.sleep(1)
              # Inspect visible popup menu items and click an entry decoded as "Объект".
              popitems=[]
              for m in Desktop(backend="uia").descendants(control_type="MenuItem"):
                  try:
                      if m.is_visible():
                          raw=m.window_text(); dec=demoji(raw).strip()
                          if dec: popitems.append({"raw":raw,"decoded":dec,"rect":str(m.rectangle())})
                  except: pass
              Path("add_menu_items.json").write_text(json.dumps(popitems,ensure_ascii=False,indent=2),encoding="utf-8")
              target=None
              for m in Desktop(backend="uia").descendants(control_type="MenuItem"):
                  try:
                      dec=demoji(m.window_text()).strip()
                      if m.is_visible() and dec=="Объект": target=m; break
                  except: pass
              if target is None:
                  main.type_keys("{ESC}")
                  raise RuntimeError("Add->Object menu item not found")
              target.click_input(); time.sleep(3)

              # Either a naming dialog appears or a new tree item is in inline rename.
              ds=dialogs(pid)
              if ds:
                  nd=ds[0]
                  ed=[c for c in nd.children() if c.class_name()=="Edit" and c.is_visible()]
                  if ed:
                      ed[0].set_edit_text(moji("Емкость")); time.sleep(.5); click_ok(nd); time.sleep(6)
              else:
                  # Check tree, use F2 on newest child if needed.
                  u=Desktop(backend="uia").window(handle=main.handle)
                  trees=u.descendants(control_type="Tree")
                  object_tree=None
                  for t in trees:
                      items=t.descendants(control_type="TreeItem")
                      if items and demoji(items[0].window_text()).strip().lower().startswith("объект"):
                          object_tree=t; break
                  items=object_tree.descendants(control_type="TreeItem") if object_tree else []
                  if len(items)>1:
                      newitem=items[-1]; newitem.click_input(); newitem.type_keys("{F2}"); time.sleep(.5)
                      newitem.type_keys(moji("Емкость"),with_spaces=True); newitem.type_keys("{ENTER}"); time.sleep(5)

              # Verify object exists semantically after decoding.
              u,rows=dump_uia(main,"uia_after_add_object.json")
              decoded=[r["decoded"] for r in rows]
              found=any("Емкость" in x for x in decoded)
              Path("add_object_result.txt").write_text("ADD_OBJECT="+("PASS" if found else "FAIL"),encoding="utf-8")
              if not found: raise RuntimeError("Tank object not found after add")
              main.set_focus(); main.type_keys("^s"); time.sleep(5)
              snap(main,"05_tank_object_added.png")
              save_snapshot("after_add_object")
              Path("native_cycle_result.txt").write_text("CREATE=PASS\nSAVE=PASS\nREOPEN=PASS\nADD_OBJECT=PASS\n",encoding="utf-8")
              kill_all()
          except Exception:
              log.append("FATAL\n"+traceback.format_exc())
              raise
          finally:
              Path("run_log.txt").write_text("\n".join(log),encoding="utf-8")
              kill_all()
          '@ | Set-Content author.py -Encoding UTF8
          python author.py

      - name: Upload native authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masterscada35-authoring-7341100
          path: |
            create_save.txt
            reopen_result.txt
            native_cycle_result.txt
            add_object_result.txt
            run_log.txt
            tree_report.json
            add_menu_items.json
            uia_after_reopen.json
            uia_after_add_object.json
            after_create_files.json
            after_add_object_files.json
            01_started.png
            02_created.png
            03_saved.png
            04_reopened.png
            05_tank_object_added.png
            native_project_snapshot/**
          if-no-files-found: warn
