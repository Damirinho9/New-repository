name: DipTrace build FINAL fixed 7313294
on:
  push:
    branches: [diptrace-native-7313294]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified fixed KiCad board
        shell: pwsh
        run: |
          $s=''
          $raw=[Convert]::FromBase64String($s)
          $ms=[IO.MemoryStream]::new($raw)
          $gz=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
          $fs=[IO.File]::Create("$PWD\7313294_variant12_DipTrace_FIXED.kicad_pcb")
          $gz.CopyTo($fs); $fs.Dispose(); $gz.Dispose(); $ms.Dispose()
          $sha=(Get-FileHash "$PWD\7313294_variant12_DipTrace_FIXED.kicad_pcb" -Algorithm SHA256).Hash.ToLowerInvariant()
          $len=(Get-Item "$PWD\7313294_variant12_DipTrace_FIXED.kicad_pcb").Length
          Write-Host "fixed board size=$len sha=$sha"
          if ($len -ne 46668 -or $sha -ne "511d7f0b9ab43f4b9cb871d233f3732bd888f19b9c77f91a516cd480b682f744") { throw "fixed PCB payload mismatch" }
      - name: Install official DipTrace Freeware 5.3.5.1
        shell: pwsh
        run: |
          $installer="$env:RUNNER_TEMP\dipfree.exe"
          curl.exe --fail --location --retry 3 --max-time 180 https://diptrace.com/downloads/dipfree_en64.exe --output $installer
          if ($LASTEXITCODE -ne 0) { throw "DipTrace download failed" }
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "8845d6e6e72f9671ea270ac462bd25c0c7794f68a7f4015b88aece980bfb848c") { throw "installer hash mismatch $hash" }
          $p=Start-Process $installer -ArgumentList "/silent","/hide" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "install timeout" }
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          if (-not (Test-Path "C:\Program Files\DipTrace\Pcb.exe")) { throw "Pcb.exe missing" }
      - name: Install UI automation
        shell: pwsh
        run: py -m pip install pywinauto pillow
      - name: Native KiCad import, Save As DIP, close and reopen
        shell: pwsh
        env:
          BOARD_PATH: ${{ github.workspace }}\7313294_variant12_DipTrace_FIXED.kicad_pcb
          OUTDIR: ${{ github.workspace }}\native-final
        run: |
          New-Item -ItemType Directory -Force "$PWD\native-final" | Out-Null
          py "$PWD\.github\scripts\import_fixed_to_native.py"
          $dip="$PWD\native-final\7313294_PhotoGas_MQ4_V12.dip"
          if (-not (Test-Path $dip)) { throw "native DIP missing after import" }
          $b=[IO.File]::ReadAllBytes($dip)
          $sig=[Text.Encoding]::ASCII.GetString($b,0,[Math]::Min(16,$b.Length))
          Write-Host "imported native size=$($b.Length) signature=$sig"
          if ($b.Length -lt 10000 -or $sig -notmatch "DTBOARD") { throw "native DIP blank or invalid" }
      - name: Apply rules, save, reopen, native DRC and connectivity
        shell: pwsh
        run: |
          $dip="$PWD\native-final\7313294_PhotoGas_MQ4_V12.dip"
          New-Item -ItemType Directory -Force "$PWD\native-final\checks" | Out-Null
          py "$PWD\.github\scripts\finalize_native_dip.py" $dip "$PWD\native-final\checks"
      - name: Final inventory
        if: always()
        shell: pwsh
        run: |
          $dip="$PWD\native-final\7313294_PhotoGas_MQ4_V12.dip"
          if (Test-Path $dip) {
            $b=[IO.File]::ReadAllBytes($dip)
            $sig=[Text.Encoding]::ASCII.GetString($b,0,[Math]::Min(16,$b.Length))
            $sha=(Get-FileHash $dip -Algorithm SHA256).Hash.ToLowerInvariant()
            "size=$($b.Length)" | Tee-Object "$PWD\native-final\FINAL_SIGNATURE.txt"
            "signature=$sig" | Tee-Object -Append "$PWD\native-final\FINAL_SIGNATURE.txt"
            "sha256=$sha" | Tee-Object -Append "$PWD\native-final\FINAL_SIGNATURE.txt"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7313294-DipTrace-FINAL-FIXED
          path: |
            native-final
            7313294_variant12_DipTrace_FIXED.kicad_pcb
          if-no-files-found: error
          retention-days: 10
