name: Multisim native Lab 3 - order 7330669

on:
  push:
    branches:
      - multisim-7330669-native-gui
    paths:
      - ".github/workflows/multisim-7330669-lab3.yml"
      - "lab7330669/lab3_native.py"
      - "lab7330669/run-lab3-native.ps1"
  workflow_dispatch:

concurrency:
  group: multisim-7330669-lab3
  cancel-in-progress: true

jobs:
  lab3:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build native Multisim Lab 3 and sweep capacitance
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\lab7330669\run-lab3-native.ps1 -Workspace "$env:GITHUB_WORKSPACE"

      - name: Inventory outputs
        if: always()
        shell: powershell
        run: |
          if(Test-Path .\lab7330669-lab3-artifacts){
            Get-ChildItem .\lab7330669-lab3-artifacts -Recurse |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize
          }

      - name: Upload Lab 3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multisim-7330669-lab3-native
          path: lab7330669-lab3-artifacts/
          if-no-files-found: warn
          retention-days: 7
