name: DipTrace native 7313294
on:
  push:
    branches: [diptrace-native-7313294]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recreate source and automation
        shell: pwsh
        run: |
          $pcb=''
          $py=''
          [IO.File]::WriteAllBytes("$PWD\board.kicad_pcb", [IO.Compression.GZipStream]::new([IO.MemoryStream]::new([Convert]::FromBase64String($pcb)), [IO.Compression.CompressionMode]::Decompress) | ForEach-Object { })
          function Expand-GzipB64([string]$s,[string]$out) {
            $raw=[Convert]::FromBase64String($s)
            $ms=[IO.MemoryStream]::new($raw)
            $gz=[IO.Compression.GZipStream]::new($ms,[IO.Compression.CompressionMode]::Decompress)
            $fs=[IO.File]::Create($out)
            $gz.CopyTo($fs); $fs.Dispose(); $gz.Dispose(); $ms.Dispose()
          }
          Expand-GzipB64 $pcb "$PWD\board.kicad_pcb"
          Expand-GzipB64 $py "$PWD\import_kicad_to_dip.py"
      - name: Install DipTrace Freeware 5.3.5.1
        shell: pwsh
        run: |
          $installer="$env:RUNNER_TEMP\dipfree.exe"
          curl.exe --fail --location --retry 3 --max-time 180 https://diptrace.com/downloads/dipfree_en64.exe --output $installer
          if ($LASTEXITCODE -ne 0) { throw 'DipTrace download failed' }
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '8845d6e6e72f9671ea270ac462bd25c0c7794f68a7f4015b88aece980bfb848c') { throw "Unexpected installer hash $hash" }
          $p=Start-Process $installer -ArgumentList '/silent','/hide' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Install timeout' }
          if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          if (-not (Test-Path 'C:\Program Files\DipTrace\Pcb.exe')) { throw 'Pcb.exe missing' }
      - name: Install UI automation
        shell: pwsh
        run: py -m pip install pywinauto pillow
      - name: Import KiCad save native DIP reopen DRC connectivity
        shell: pwsh
        run: |
          py import_kicad_to_dip.py "$PWD\board.kicad_pcb" "$PWD\7313294_PhotoGas_MQ4_V12.dip" "$PWD\native_evidence.json"
      - name: Verify native signature
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "$PWD\7313294_PhotoGas_MQ4_V12.dip") {
            $b=[IO.File]::ReadAllBytes("$PWD\7313294_PhotoGas_MQ4_V12.dip")
            $ascii=[Text.Encoding]::ASCII.GetString($b,0,[Math]::Min(16,$b.Length))
            "size=$($b.Length) signature=$ascii" | Tee-Object "$PWD\native_signature.txt"
          }
          if (Test-Path "$PWD\native_evidence.json") { Get-Content "$PWD\native_evidence.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7313294-diptrace-native
          path: |
            7313294_PhotoGas_MQ4_V12.dip
            native_evidence.json
            native_evidence.png
            native_signature.txt
            board.kicad_pcb
          if-no-files-found: warn
          retention-days: 10
