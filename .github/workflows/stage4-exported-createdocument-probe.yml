name: KOMPAS Stage 4 exported CreateDocument SDK probe

on:
  workflow_dispatch:
  push:
    branches: [kompas-7335493-native-work1]
    paths:
      - '.github/workflows/stage4-exported-createdocument-probe.yml'

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: kompas-v25-runtime-*
          run-id: 44521459604
          github-token: ${{ github.token }}
          merge-multiple: true
          path: frozen/runtime

      - name: Restore exact frozen licensed runtime
        shell: bash
        run: |
          set -euxo pipefail
          cd frozen/runtime
          sha256sum -c runtime-parts-SHA256.txt
          cat kompas-runtime.part-* > "$RUNNER_TEMP/runtime.tar.zst"
          test "$(sha256sum "$RUNNER_TEMP/runtime.tar.zst" | cut -d' ' -f1)" = "9c5252e4f3f53edf17ee74eacbc3c76369411380122b898de4efe7e347d729b2"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar --zstd -xf "$RUNNER_TEMP/runtime.tar.zst" -C "$RUNNER_TEMP/runtime"
          sudo mkdir -p /opt/ascon
          sudo rm -rf /opt/ascon/kompas3d-v25 /opt/ascon/common
          sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/kompas3d-v25" /opt/ascon/kompas3d-v25
          if [ -d "$RUNNER_TEMP/runtime/opt/ascon/common" ]; then
            sudo ln -s "$RUNNER_TEMP/runtime/opt/ascon/common" /opt/ascon/common
          fi

      - name: Inspect exported-document API surface
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils file
          BIN=/opt/ascon/kompas3d-v25/Bin
          SDK=/opt/ascon/kompas3d-v25/SDK
          mkdir -p result/stage4-exported-createdocument

          OUT=result/stage4-exported-createdocument/export-surface.txt
          : > "$OUT"
          {
            echo "=== RUNTIME ==="
            readlink -f /opt/ascon/kompas3d-v25
            sha256sum "$BIN/ksinvisible" "$BIN/libksAPI.so"

            echo
            echo "=== SDK LITERAL MATCHES ==="
            grep -Rni -C 6 -F 'CreateDocument' "$SDK" 2>/dev/null | head -2500 || true
            grep -Rni -C 6 -F 'DocumentParam' "$SDK" 2>/dev/null | head -2500 || true
            grep -Rni -C 6 -F 'TransferReference' "$SDK" 2>/dev/null | head -1200 || true

            echo
            echo "=== DYNAMIC SYMBOLS SIMPLE ==="
            while IFS= read -r f; do
              hits="$(nm -D -C --defined-only "$f" 2>/dev/null | grep -E 'CreateDocument|TransferReference|OpenDocument|SaveDocument|CloseDocument' || true)"
              if [ -n "$hits" ]; then
                echo "--- $f"
                echo "$hits"
              fi
            done < <(find "$BIN" /opt/ascon/common -type f \( -name '*.so' -o -name '*.so.*' -o -perm -111 \) 2>/dev/null | sort -u)

            echo
            echo "=== RAW STRINGS SIMPLE ==="
            while IFS= read -r f; do
              hits="$(strings -a "$f" 2>/dev/null | grep -E 'CreateDocument|TransferReference' | head -50 || true)"
              if [ -n "$hits" ]; then
                echo "--- $f"
                echo "$hits"
              fi
            done < <(find "$BIN" /opt/ascon/common -type f \( -name '*.so' -o -name '*.so.*' -o -perm -111 \) 2>/dev/null | sort -u)
          } | tee -a "$OUT"

          if grep -qE '^--- .*|CreateDocument|TransferReference' "$OUT"; then
            echo "RESULT=PROBE_COMPLETE" | tee result/stage4-exported-createdocument/result.txt
          else
            echo "RESULT=NO_EXPORTED_DOCUMENT_SURFACE" | tee result/stage4-exported-createdocument/result.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 7335493-stage4-exported-createdocument-probe
          retention-days: 90
          if-no-files-found: ignore
          path: result/stage4-exported-createdocument/**
