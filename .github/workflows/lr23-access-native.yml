name: LR23 7342835 Native Microsoft Access DB
on:
  push:
    branches: [lr23-7342835-access-native]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft Access Database Engine
        shell: powershell
        run: |
          choco install made-2016 -y --no-progress
          if($LASTEXITCODE -notin 0,3010){exit $LASTEXITCODE}
      - name: Build ACCDB and native Access objects
        shell: pwsh
        run: .\build_access_lr23.ps1
      - name: Verify
        shell: pwsh
        run: |
          Get-ChildItem .\access_out | Format-Table Name,Length,LastWriteTime
          Get-Content .\access_out\VALIDATION.txt
          Get-Content .\access_out\QUERY_SAMPLES.txt -TotalCount 100
      - name: Upload Access deliverable
        uses: actions/upload-artifact@v4
        with:
          name: LR23_7342835_ACCESS_NATIVE
          path: access_out
          if-no-files-found: error
          retention-days: 7
